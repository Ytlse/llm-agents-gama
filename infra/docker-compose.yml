x-gateway-env: &gateway-env
  # Réglages du gateway (préfixe LLM_GATEWAY_, `__` sépare les niveaux — ticket 037, itération 2).
  # Les anciens noms (REDIS_URL, CELERY_*, APP_WORKDIR, SERVICE_NAME) restent lus une version avec
  # un avertissement ; PROVIDER_KEYS__<nom> reste le nom canonique des clés (partagé avec .env).
  LLM_GATEWAY_REDIS__URL: redis://redis:6379/0
  LLM_GATEWAY_EXECUTOR__CELERY_BROKER_URL: redis://redis:6379/1
  LLM_GATEWAY_EXECUTOR__CELERY_RESULT_BACKEND: redis://redis:6379/2
  # Fichier des fournisseurs. Indirection ajoutée au ticket 075 : le défaut ne change pas, mais
  # un run peut désigner un fichier RESTREINT le temps de son exécution — par exemple
  # providers.gemini31.yaml, qui ne déclare que gemini-3.1-flash-lite :
  #   LLM_GATEWAY_PROVIDERS_FILE=/app/config/llm_gateway/providers.gemini31.yaml make run OFFLINE=1
  LLM_GATEWAY_PROVIDERS_FILE: ${LLM_GATEWAY_PROVIDERS_FILE:-/app/config/llm_gateway/providers.yaml}
  # Les sources montées sous /app/<paquet> doivent PRÉCÉDER les copies installées dans
  # site-packages. WORKDIR ne suffit pas : `celery` et `uvicorn` sont des scripts console,
  # sys.path[0] est /usr/local/bin, pas le répertoire courant. Sans cette ligne, api et
  # worker servaient le code et le prompts.yaml figés à la construction de l'image
  # (constaté le 2026-09-08 : variante ajoutée invisible après `make passerelle-recharger`).
  PYTHONPATH: /app
  LLM_GATEWAY_TELEMETRY__WORKDIR: /app/experiments/current
  # Journal des échanges : désactivé par défaut dans le gateway (données personnelles potentielles) ;
  # la simulation l'active parce que make report et le tableau de bord le lisent.
  LLM_GATEWAY_TELEMETRY__EXCHANGES_ENABLED: "true"
  # Le contrôleur (hypercorn, Grafana Infinity côté serveur) n'a pas besoin de CORS ; ["*"]
  # reproduit l'ancien comportement pour les outils qui interrogent l'API depuis un navigateur.
  LLM_GATEWAY_API__CORS_ORIGINS: '["*"]'

x-shared-env: &shared-env
  REDIS_URL: redis://redis:6379/0
  OTP_ENDPOINTS: http://otp1:8080/otp/transmodel/v3,http://otp2:8080/otp/transmodel/v3,http://otp3:8080/otp/transmodel/v3
  # Un seul réplica : `osmnx_direct` dimensionne sa concurrence à `nb_endpoints × 3`.
  # En lister davantage suppose d'avoir activé osmnx2/osmnx3 — voir l'avertissement
  # mesuré à leur définition avant de le faire.
  OSMNX_ENDPOINTS: http://osmnx1:8090/route
  APP_CONFIG_PATH: /app/config/${CONFIG_FILE:-config.yaml}
  # Répertoire des expériences, explicite plutôt que déduit : le code vit dans
  # /app et les runs dans /app/experiments (montage de ./experiments), alors que
  # sur l'hôte ils sont un niveau au-dessus du paquet (<dépôt>/experiments).
  APP_EXPERIMENTS_DIR: /app/experiments
  # Reprise à chaud (`make run CONT=1`) : le contrôleur réutilise le workdir
  # pointé par experiments/current au lieu d'en créer un nouveau (settings.py).
  CONTINUE_RUN: ${CONTINUE_RUN:-}
  # Ticket 091 — nom du run repris. Vide = aucune réutilisation de mémoire ni de décisions.
  REPRISE_RUN: ${REPRISE_RUN:-}
  # Ticket 095, lot D — RUN ENFANT. Nom (ou chemin) du run PARENT dont ce bras hérite le socle
  # commun : il démarre sur le dernier point de reprise du parent au lieu de rejouer — et de
  # repayer — les quatorze premiers jours. Vide = run ordinaire.
  RUN_PARENT: ${RUN_PARENT:-}
  # Les champs d'identité que cet enfant DÉCLARE faire varier par rapport à son parent, séparés
  # par des virgules (p. ex. `choc,mode_fenetre_changements`). Tout autre écart fait refuser le
  # démarrage : un enfant hérite de la MÉMOIRE de son parent, et une mémoire produite sous
  # d'autres réglages décrit une autre expérience que celle qu'il va jouer.
  CHAMPS_LIBRES: ${CHAMPS_LIBRES:-}
  TZ: Europe/Paris
  # ── Clés Google de la SIMULATION (ticket 008) ──────────────────────────────
  # Les quotas free tier Gemini se comptent par projet ET par modèle : chaque clé
  # dispose de ses propres 500 requêtes/jour et par modèle. La simulation tourne sur
  # la CLÉ 2, ce qui laisse intactes les 500 requêtes/jour de la clé 1 pour les
  # mesures du lot C (`common-set-eval`, `heldout-eval`), qui interrogent
  # `google_gemini31_key1` — c'est-à-dire la clé 1.
  #
  # Un provider sans clé est simplement exclu de la rotation
  # (`filter_providers_without_api_key`) : blanchir la clé 1 retire donc
  # `google_gemini31_key1` et `google_gemini35_key1` de la cascade, sans toucher à mistral,
  # groq ni cerebras — la cascade multi-providers reste en place (décision D4).
  #
  # Décision du 2026-09-07 : la clé 1 REJOINT la rotation. Elle était retenue par défaut
  # (lue dans SIM_PROVIDER_KEYS__google, donc vide sauf export explicite), ce qui laissait
  # `gemini-3.5-flash-lite` sur une seule instance à 15 requêtes/minute — la moitié des
  # sollicitations d'une expérience repartait en « Providers saturés ».
  # Pour la retirer le temps d'un run (la réserver à la simulation, par exemple) :
  #   PROVIDER_KEYS__google="" make run
  # Routage entre fournisseurs (décision du 2026-09-07). `cascade` épuise le premier
  # fournisseur avant de toucher au suivant : il n'est dépassé que s'il REFUSE — quota du
  # jour, cooldown, débit par minute saturé — et le basculement est journalisé. `swrr`
  # étalerait la charge et entamerait les deux seaux de 500 requêtes en parallèle.
  # Le fichier des fournisseurs n'accepte QUE des fournisseurs : la politique passe donc par
  # l'environnement, comme les autres réglages du gateway.
  LLM_GATEWAY_ROUTING__POLICY: ${LLM_GATEWAY_ROUTING__POLICY:-cascade}
  # ── Une clé par instance (convention <modèle>_key<N>, 2026-09-08) ──────────
  # Le gateway résout la clé d'une instance par PROVIDER_KEYS__<nom d'instance>.
  # Une instance suffixée _keyN n'a PLUS de repli sur la clé de son adapter : sans
  # sa ligne ci-dessous elle est refusée au démarrage, au lieu de taper en silence
  # la clé d'un autre projet (incident google2_36, cf. providers.yaml).
  # Ce qui s'édite dans .env reste les SOURCES, en fin de bloc ; ici, le mapping.
  #
  # Clé 1 Google — 9 instances, un seau de quota par modèle.
  PROVIDER_KEYS__google_gemini31_key1: ${PROVIDER_KEYS__google:-}
  PROVIDER_KEYS__google_gemini35_key1: ${PROVIDER_KEYS__google:-}
  PROVIDER_KEYS__google_gemma42_key1: ${PROVIDER_KEYS__google:-}
  PROVIDER_KEYS__google_gemma43_key1: ${PROVIDER_KEYS__google:-}
  PROVIDER_KEYS__google_gemini_3_flash_preview_key1: ${PROVIDER_KEYS__google:-}
  PROVIDER_KEYS__google_gemini_3_5_flash_key1: ${PROVIDER_KEYS__google:-}
  PROVIDER_KEYS__google_gemini_3_6_flash_key1: ${PROVIDER_KEYS__google:-}
  PROVIDER_KEYS__google_gemini_3_7_flash_key1: ${PROVIDER_KEYS__google:-}
  PROVIDER_KEYS__google_gemini_3_8_flash_key1: ${PROVIDER_KEYS__google:-}
  # Clé 2 Google — le secret n'est pas dupliqué dans .env, il est dérivé de la
  # source. `make run NO_GOOGLE=1` exporte PROVIDER_KEYS__google2="" et blanchit
  # ces deux instances (filter_providers_without_api_key les sort de la cascade).
  PROVIDER_KEYS__google_gemini31_key2: ${PROVIDER_KEYS__google2:-}
  PROVIDER_KEYS__google_gemini35_key2: ${PROVIDER_KEYS__google2:-}
  # Mistral / Groq / Cerebras — une clé chacun, blanchissable de la même façon
  # quand leurs crédits sont épuisés (HTTP 402). Un fournisseur mort laissé en
  # rotation coûte des décisions dégradées : le balancer le re-sonde à
  # l'expiration du retrait et des tâches y épuisent leurs relances (155 replis
  # « Default index » sur le run 2026-08-19_11_01). Usage :
  #   PROVIDER_KEYS__mistral="" PROVIDER_KEYS__cerebras="" make run
  PROVIDER_KEYS__mistral_key1: ${PROVIDER_KEYS__mistral:-}
  # Même clé : les deux instances Mistral se distinguent par leur modèle, pas par leur clé.
  PROVIDER_KEYS__mistral_large3_key1: ${PROVIDER_KEYS__mistral:-}
  PROVIDER_KEYS__groq_openai_120_key1: ${PROVIDER_KEYS__groq:-}
  PROVIDER_KEYS__groq_openai_20_key1: ${PROVIDER_KEYS__groq:-}
  PROVIDER_KEYS__groq_qwen_qwen3_6_27b_key1: ${PROVIDER_KEYS__groq:-}
  PROVIDER_KEYS__groq_qwen_qwen3_8_27b_key1: ${PROVIDER_KEYS__groq:-}
  PROVIDER_KEYS__cerebras_gptoss120b_key1: ${PROVIDER_KEYS__cerebras:-}
  PROVIDER_KEYS__cerebras_gemma_4_31b_key1: ${PROVIDER_KEYS__cerebras:-}
  # OpenAI — 1 instance
  PROVIDER_KEYS__openai_gpt56_luna_key1: ${PROVIDER_KEYS__openai:-}
  PROVIDER_KEYS__openai_key1: ${PROVIDER_KEYS__openai:-}
  # ── LM Studio (modèles locaux servis par l'hôte, port 1234 ; weight 0 = épinglage seul) ──
  # Un seul interrupteur : PROVIDER_KEYS__lmstudio dans .env (valeur libre, LM Studio ne
  # vérifie pas la clé). Vide ou absent, toutes les instances lmstudio_* sont exclues au démarrage.
  PROVIDER_KEYS__lmstudio_mistral_small_3_2_key1: ${PROVIDER_KEYS__lmstudio:-}
  PROVIDER_KEYS__lmstudio_mistral_nemo_12b_key1: ${PROVIDER_KEYS__lmstudio:-}
  PROVIDER_KEYS__lmstudio_mistral_7b_v0_3_key1: ${PROVIDER_KEYS__lmstudio:-}
  PROVIDER_KEYS__lmstudio_gemma_4_e4b_key1: ${PROVIDER_KEYS__lmstudio:-}
  PROVIDER_KEYS__lmstudio_qwen3_vl_8b_key1: ${PROVIDER_KEYS__lmstudio:-}
  PROVIDER_KEYS__lmstudio_qwen3_vl_32b_key1: ${PROVIDER_KEYS__lmstudio:-}
  PROVIDER_KEYS__lmstudio_qwen3_8_27b_key1: ${PROVIDER_KEYS__lmstudio:-}
  PROVIDER_KEYS__lmstudio_muse_glimmer_28b_key1: ${PROVIDER_KEYS__lmstudio:-}
  # Sources — les seules à renseigner dans .env. Conservées dans l'environnement
  # du conteneur pour les outils hors gateway (scripts/synthesis/*) qui résolvent
  # leurs clés eux-mêmes, et pour rester surchargeables depuis le shell.
  PROVIDER_KEYS__google: ${PROVIDER_KEYS__google:-}
  PROVIDER_KEYS__google2: ${PROVIDER_KEYS__google2:-}
  PROVIDER_KEYS__mistral: ${PROVIDER_KEYS__mistral:-}
  PROVIDER_KEYS__groq: ${PROVIDER_KEYS__groq:-}
  PROVIDER_KEYS__cerebras: ${PROVIDER_KEYS__cerebras:-}
  PROVIDER_KEYS__openai: ${PROVIDER_KEYS__openai:-}
  PROVIDER_KEYS__lmstudio: ${PROVIDER_KEYS__lmstudio:-}

x-osmnx-service: &osmnx-service
  build:
    context: ./services/llm-agents
    dockerfile: Dockerfile
  command: uvicorn osmnx_server:app --host 0.0.0.0 --port 8090 --log-level warning
  restart: "no"
  stop_grace_period: 5s
  volumes:
    - ./data/cache/osmnx:/app/osmnx_cache
    - ./services/llm-agents/config:/app/config:ro
    # Ticket 031 (décision 4) : la congestion s'applique par zone du nœud (ville / agglomération /
    # extérieur) ; la géométrie de l'agglomération vient des couronnes de l'enquête. Sans ce
    # fichier, un graphe sans zones ne se charge pas (erreur explicite, pas de repli).
    - ./packages/mobility_core/src/mobility_core/data/couronne_perimetre.geojson:/app/mobility_core/data/couronne_perimetre.geojson:ro
  environment:
    APP_CONFIG_PATH: /app/config/${CONFIG_FILE:-config.yaml}
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\""]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 300s
  mem_limit: 8g   # relevé de 4g → 8g : le warmup charge foot+bike+car simultanément (OOM 137 à 4g)

x-otp-service: &otp-service
  image: eclipse-temurin:21-jre-jammy
  ports:
    - "8080:8080"
  mem_limit: 6g
  volumes:
    - ./services/otp-toulouse/bin:/otp/bin:ro
    - ./data/gtfs/:/var/otp/toulouse:ro
  command: ["sh", "-c", "java -Xmx4G -jar /otp/bin/*.jar --load /var/otp/toulouse --port 8080"]
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 300s 


# ── EQUASIM env vars (override from .env or shell) ───────────────────────────
# EQASIM_POPULATION_SIZE: if unset, read from APP_CONFIG_PATH
# EQASIM_GENERATE_PERSONALITY: "true" to populate Big Five scores
# EQASIM_RANDOM_SEED: reproducibility seed (default 1234)
x-eqasim-env: &eqasim-env
  APP_CONFIG_PATH: /app/config/${CONFIG_FILE:-config.yaml}
  EQASIM_POPULATION_SIZE: ${EQASIM_POPULATION_SIZE:-}
  EQASIM_GENERATE_PERSONALITY: ${EQASIM_GENERATE_PERSONALITY:-false}
  EQASIM_RANDOM_SEED: ${EQASIM_RANDOM_SEED:-1234}
  # Cadre de tirage = le périmètre d'enquête EMC² (liste de communes), et non un
  # rectangle (ticket 026). `EQASIM_DEPARTMENTS` le restreint ; depuis le 2026-09-03 (ticket
  # 031, porte 1 levée : BD TOPO 2025-03-15 et BAN des six départements présentes) le défaut
  # est le périmètre entier — 453 communes. `31` seul redonne la répétition Haute-Garonne
  # (346 communes, limite n°6 de docs/arch/perimetre-population.md). Le service refuse de
  # générer si un département demandé n'a pas ses données. Mettre EQASIM_PERIMETER=false pour
  # revenir au comportement d'avant (département entier ou filtrage par bbox).
  EQASIM_PERIMETER: ${EQASIM_PERIMETER:-true}
  EQASIM_DEPARTMENTS: ${EQASIM_DEPARTMENTS:-31,32,81,82,09,11}
  OTP_ENDPOINT: http://otp1:8080

services:

  # ─────────────────────────────────────────────
  # EQUASIM Toulouse — génération de la population synthétique
  #
  # Service one-shot : se termine une fois le JSON de population produit.
  # Le controller attend sa complétion via service_completed_successfully.
  #
  # Volumes requis sur l'hôte (monter les données INSEE/OSM/GTFS/BAN/BDTOPO) :
  #   ./data/eqasim/data   → données d'entrée brutes (lecture seule)
  #   ./data/eqasim/cache  → cache pipeline intermédiaire (accélère les re-runs)
  # Volume partagé avec le controller :
  #   eqasim_output        → JSON de population consommé par EqasimJSONPopulationLoader
  # ─────────────────────────────────────────────

  eqasim:
    build:
      context: ./services/eqasim-toulouse
      dockerfile: Dockerfile
    entrypoint: ["uv", "run", "python", "/eqasim/server.py"]
    ports:
      - "8003:8003"
    mem_limit: 10g
    environment:
      <<: *eqasim-env
      EQASIM_PROCESSES: ${EQASIM_PROCESSES:-2}
    volumes:
      - ./services/eqasim-toulouse/generate_population.py:/eqasim/generate_population.py:ro
      - ./services/eqasim-toulouse/server.py:/eqasim/server.py:ro
      # Ticket 031 : la config synpp du service part de config_toulouse.yml — seule source des
      # réglages d'appariement HTS (filter_hts, matching_attributes, seuil) et des journées
      # donneuses. Sans ce montage, le wrapper refuse de générer (code 5) : avant, il retombait
      # en silence sur les défauts de synpp (308 donneurs ENTD résidents de Haute-Garonne).
      - ./services/eqasim-toulouse/config_toulouse.yml:/eqasim/config_toulouse.yml:ro
      - ./services/llm-agents/config:/app/config:ro
      - ./services/eqasim-toulouse/data:/eqasim-data:rw
      - ./services/eqasim-toulouse/data/bpe:/eqasim/data/bpe:ro
      - ./services/eqasim-toulouse/data/census:/eqasim/data/census:ro
      # Ticket 031 § 1.2 : le nettoyage de l'ENTD (journées donneuses = jours de classe) vit dans
      # data/hts ; monté comme les autres stages pour que le code du fork soit celui qui tourne,
      # sans reconstruire l'image.
      - ./services/eqasim-toulouse/data/hts:/eqasim/data/hts:ro
      # Ticket 031 : lecture de BATI/BATIMENT.shp dans les archives .7z « TOUSTHEMES_SHP » de l'IGN.
      - ./services/eqasim-toulouse/data/bdtopo:/eqasim/data/bdtopo:ro
      - ./services/eqasim-toulouse/data/spatial:/eqasim/data/spatial:ro
      - ./services/eqasim-toulouse/data/sirene:/eqasim/data/sirene:ro
      - ./services/eqasim-toulouse/synthesis:/eqasim/synthesis:ro
      # Ticket 015, lot 4 : `synthesis/population/enriched.py` apprend l'équipement
      # vélo avec `mobility_core.bike_ownership` (et `zone_resolver` pour la zone
      # fine du domicile), au lieu de recopier le nombre de vélos d'un ménage ENTD.
      # WORKDIR est /eqasim, donc le paquet est importable tel quel ; le montage
      # apporte aussi ses ressources `mobility_core/data/` (bike_ownership.json,
      # zf_zones.gpkg), que le module résout relativement à son propre fichier.
      # geopandas/shapely/pandas sont déjà des dépendances de l'image.
      - ./packages/mobility_core/src/mobility_core:/eqasim/mobility_core:ro
      - ./data/cache/eqasim:/eqasim-cache:rw
      - ./data/population:/eqasim-output:rw
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Infrastructure
  # 
  # - Redis est une base de données en mémoire, open source, utilisée comme cache, 
  #   broker de messages et base de données clé-valeur.
  #   Il va permettre de broker les prompts et les résultats entre l'API Gateway et les Workers LLM
  # ─────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # OpenTripPlanner — routage multimodal Toulouse
  # ─────────────────────────────────────────────

  otp1:
    <<: *otp-service
    ports:
      - "8080:8080"

  otp2:
    <<: *otp-service
    ports:
      - "8081:8080"
  
  otp3:
    <<: *otp-service
    ports:
      - "8082:8080"


  # ─────────────────────────────────────────────
  # OSMnx routing microservice — 3 réplicas (walk / bike / drive)
  # ─────────────────────────────────────────────

  osmnx1:
    <<: *osmnx-service
    ports:
      - "8090:8090"

  # ⚠ 2026-08-17 — activés puis REDÉSACTIVÉS le même jour, mesures à l'appui. À lire
  # avant de retenter, parce que le raisonnement naturel est le mauvais ici.
  #
  # Le symptôme invite à scaler : sur la génération d'une base de prompts (ticket 013),
  # `osmnx1` seul saturait à 343 % de CPU — un worker par mode, trois modes — pendant
  # que les trois OTP tournaient à 1 %. La VM a 10 CPU : de la place, en apparence.
  #
  # Mesuré après passage à 3 réplicas : le débit est TOMBÉ de 0,5 à 0,2 trajet/s. La
  # contrainte n'était pas le CPU mais la MÉMOIRE DE L'HÔTE — ~12 Mo libres avant le
  # changement, swap à 12,5 Go sur 13,3, 95 millions de swapins. Ajouter 4,8 Go de
  # conteneurs a acheté du parallélisme contre de la pagination.
  #
  # Tentative suivante, également mesurée : libérer la mémoire d'OTP (3 JVM × 1,5 Go
  # pour 0,4 % de CPU) au profit des routeurs, en n'en gardant qu'une. Le débit est
  # resté à 0,2 trajet/s. Sur cette machine, un seul réplica OSMnx est l'optimum.
  #
  # Donc : ne pas décommenter sans avoir vérifié la mémoire libre de l'hôte, et sans
  # mesurer le débit AVANT/APRÈS sur la même tranche de travail. Le CPU seul induit en
  # erreur.
  # osmnx2:
  #   <<: *osmnx-service
  #   ports:
  #     - "8091:8090"

  # osmnx3:
  #   <<: *osmnx-service
  #   ports:
  #     - "8092:8090"

  # ─────────────────────────────────────────────
  # LLM Agents — Architecture API Gateway + Worker Celery + Monitoring
  #
  # Description :
  #   - API Gateway (FastAPI) :
  #       Interface entre GAMA et les modèles de langage (LLM).
  #       Reçoit les requêtes de GAMA, les transforme en prompts adaptés,
  #       et envoie les tâches asynchrones au worker Celery.
  #       Retourne les résultats finaux à GAMA après traitement.
  #
  #   - Worker Celery :
  #       Exécute les tâches de génération de prompts envoyées par l'API.
  #       Interagit avec les LLM et d'autres services (OTP).
  #       Retourne les résultats à l'API via Redis.
  #
  #   - Flower (Monitoring) :
  #       Interface web pour visualiser l'état des tâches Celery,
  #       surveiller les workers, les files d'attente et les résultats.
  # ─────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: packages/llm_gateway/Dockerfile
    command: uvicorn llm_gateway.main:app --host 0.0.0.0 --port 8000 --reload --log-level warning
    ports:
      - "8000:8000"
    env_file: ./.env
    environment:
      <<: [*shared-env, *gateway-env]
      LLM_GATEWAY_TELEMETRY__SERVICE_NAME: api
      # ws://gama:3001 en mode offline (make run OFFLINE=1), IHM sur l'hôte sinon
      GAMA_WS_URL: ${GAMA_WS_URL:-ws://host.docker.internal:3001}
    volumes:
      - ./packages/llm_gateway/src/llm_gateway:/app/llm_gateway
      - ./config/llm_gateway:/app/config/llm_gateway:ro
      - ./packages/mobility_core/src/mobility_core:/app/mobility_core
      - ./packages/mobility_llm/src/mobility_llm:/app/mobility_llm
      # Les TROIS réseaux en service, pas le seul Tisséo : la porte de proximité
      # d'OTP (`trip_helper/otp.py`, feeds_en_service) énumère les feeds du premier
      # niveau de ce répertoire. Montée sur le seul tisseo_gtfs, elle refusait
      # l'appel à OTP pour 397 des 2 580 points de la population scellée v4 — ceux
      # qui n'ont à portée qu'un arrêt liO ou une gare TER (ticket 031, q. 16).
      - ./data/gtfs:/data/gtfs
      - ./experiments:/app/experiments
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      otp1:
        condition: service_healthy
      otp2:
        condition: service_healthy
      otp3:
        condition: service_healthy

  controller:
    build:
      context: ./services/llm-agents
      dockerfile: Dockerfile
    # `exec` est indispensable : sans lui, PID1 reste `sh`, qui ne relaie pas SIGTERM à
    # hypercorn. Tout `docker stop`/`compose restart` dégénérait alors en SIGKILL après le
    # délai de grâce (exit 137), emportant sans préavis le runner d'expérience lancé en
    # `docker compose exec` dans ce conteneur. Avec `exec`, hypercorn EST PID1 et s'arrête
    # proprement. Les jobs d'arrière-plan sont forkés avant le `exec` : ils sont préservés.
    command: sh -c "python /app/archive_log.py && python /app/vizpop.py 5050 & exec hypercorn handle.application:app --bind 0.0.0.0:8002"
    ports:
      - "8002:8002"
      - "5050:5050"
    env_file: ./.env
    environment:
      <<: *shared-env
      LLM_API_URL: http://api:8000
      EQASIM_SERVICE_URL: http://eqasim:8003
      #APP_WORKDIR: /app/workdir
      # ws://gama:3001 en mode offline (make run OFFLINE=1), IHM sur l'hôte sinon
      GAMA_WS_URL: ${GAMA_WS_URL:-ws://host.docker.internal:3001}
      PYTHONPATH: /app:/opt
      # Le contrôleur lit la liste des fournisseurs pour dimensionner les expériences (ressources.py).
      LLM_GATEWAY_PROVIDERS_FILE: ${LLM_GATEWAY_PROVIDERS_FILE:-/app/config/llm_gateway/providers.yaml}
      # ── Réglages d'EXPÉRIENCE (ticket 077, lot L) ─────────────────────────────
      # Passe-plat, sur le modèle de CONTINUE_RUN : compose ne transmet au conteneur que ce
      # qu'il déclare. Sans ces lignes, un `VEHICLE_CHAIN_ENABLED=false` posé sur l'hôte
      # n'atteint rien, et le run tourne aux valeurs par défaut sans que rien ne le dise —
      # c'est exactement ce qui est arrivé le 2026-09-19 à 16:44.
      #
      # ⚠ NOM NU, sans préfixe `AGENT__` : les sous-configurations sont des `BaseSettings`
      # sans préfixe (`settings.py`). `AGENT__VEHICLE_CHAIN_ENABLED` n'est lu par personne, et
      # l'orchestrateur de cohorte l'a posé pendant des semaines sans le moindre effet.
      #
      # ⚠ Les défauts ci-dessous DOIVENT rester ceux de `settings.py` — deux valeurs par défaut
      # écrites à deux endroits divergent. `test_077_lotL_passage_reglages.py` les tient ensemble.
      #
      # ⚠ Une clé présente dans `config/config.yaml` l'emporte sur ces variables : le YAML est
      # passé à l'initialisation, qui prime sur l'environnement. C'est pourquoi le lot K les a
      # retirées du fichier.
      VEHICLE_CHAIN_ENABLED: ${VEHICLE_CHAIN_ENABLED:-true}
      VEHICLE_RETURN_HOME_LOCK: ${VEHICLE_RETURN_HOME_LOCK:-true}
      MODE_CHOICE_TRUNCATION_THRESHOLD: ${MODE_CHOICE_TRUNCATION_THRESHOLD:-0.0}
      STM_REFLECTION_MIN_ENTRIES: ${STM_REFLECTION_MIN_ENTRIES:-10}
      WEATHER_PER_AGENT_DATES: ${WEATHER_PER_AGENT_DATES:-false}
      # Ticket 084/085/095 — instances de passerelle admises à servir les appels de CE run.
      # Accepte une liste plate JSON, ou une TABLE `catégorie → instances` (lot C du 095).
      #
      # ⚠ Le nom est le nom NU du champ : `INSTANCES_ADMISES`, PAS `LLM__INSTANCES_ADMISES`.
      # L'orchestrateur de campagne a posé le second du 2026-09-08 au 2026-09-21 : mauvais nom,
      # non déclaré ici, et de toute façon `config.yaml` primait. Il n'a jamais rien fait.
      # Le défaut reproduit ce que `config.yaml` posait jusqu'au 2026-09-21.
      INSTANCES_ADMISES: '${INSTANCES_ADMISES:-["google_gemini31_key1","google_gemini31_key2"]}'
      MEMOIRE__IMPORTANCE_CHOC: ${MEMOIRE__IMPORTANCE_CHOC:-0.7}
      # Ticket 095 — ce que devient la composante de retard AU-DELÀ du retard de référence.
      # `asymptote` : elle monte encore, en décélérant. `palier` : le comportement d'avant le
      # 2026-09-21, où 30, 45 et 60 minutes valaient rigoureusement la même gravité. À déclarer
      # `palier` pour reproduire un run antérieur.
      MEMOIRE__RETARD_SATURATION: ${MEMOIRE__RETARD_SATURATION:-asymptote}
      MEMOIRE__RETARD_GRAVITE_MAX: ${MEMOIRE__RETARD_GRAVITE_MAX:-0.7}
      MEMOIRE__RETARD_REF_S: ${MEMOIRE__RETARD_REF_S:-1800}
      MEMOIRE__FENETRE_CHANGEMENTS_JOURS: ${MEMOIRE__FENETRE_CHANGEMENTS_JOURS:-14}
      MEMOIRE__CHANGEMENTS_MAX: ${MEMOIRE__CHANGEMENTS_MAX:-3}
      # Ticket 095, lot A — la durée d'un souvenir de choc se DÉRIVE de sa gravité. `derivee`
      # est le défaut ; `fixe` reproduit le comportement d'avant le ticket et lit alors
      # MEMOIRE__FENETRE_CHANGEMENTS_JOURS ci-dessus. Le mode entre dans identite_run.json.
      MEMOIRE__MODE_FENETRE_CHANGEMENTS: ${MEMOIRE__MODE_FENETRE_CHANGEMENTS:-derivee}
      MEMOIRE__SEUIL_SERVICE_CHANGEMENT: ${MEMOIRE__SEUIL_SERVICE_CHANGEMENT:-0.35}
      MEMOIRE__PLANCHER_CHANGEMENT_JOURS: ${MEMOIRE__PLANCHER_CHANGEMENT_JOURS:-2.0}
      MEMOIRE__PLAFOND_CHANGEMENT_JOURS: ${MEMOIRE__PLAFOND_CHANGEMENT_JOURS:-50.0}
      # ── Partage au sein du foyer (ticket 100, lot 4) et garde de la décision D7 ──────────
      # Une règle de mémoire se fait varier par l'ENVIRONNEMENT, jamais par config.yaml : elle
      # appartient au run et se retrouve dans son identité. Sans ces lignes, `MEMOIRE__…` posé
      # sur l'hôte n'atteindrait pas le conteneur — c'est exactement ce que L1.1 du 077 vérifie.
      MEMOIRE__PARTAGE_FOYER_ENABLED: ${MEMOIRE__PARTAGE_FOYER_ENABLED:-false}
      MEMOIRE__PARTAGE_FOYER_OBSERVATIONS_MIN: ${MEMOIRE__PARTAGE_FOYER_OBSERVATIONS_MIN:-1}
      MEMOIRE__PARTAGE_FOYER_MAX_BLOC: ${MEMOIRE__PARTAGE_FOYER_MAX_BLOC:-12}
      MEMOIRE__RECIT_SOIR_MAX: ${MEMOIRE__RECIT_SOIR_MAX:-8}
      MEMOIRE__ECART_JUGEMENT_ALARME: ${MEMOIRE__ECART_JUGEMENT_ALARME:-0.3}
      # ── Dispositifs d'expérience (ticket 077) ─────────────────────────────────
      # Même oubli que les réglages ci-dessus, trouvé le 2026-09-21 : l'orchestrateur les
      # posait sur l'hôte, compose ne les déclarait pas, et les deux dispositifs n'ont JAMAIS
      # tourné — ni l'enquête d'affinité modale, ni la mise en veille sur quota. Zéro ligne
      # `[enquete]` dans les journaux des trois bras de la campagne.
      EXPERIMENT_SURVEY_ENABLED: ${EXPERIMENT_SURVEY_ENABLED:-0}
      EXPERIMENT_SURVEY_DAYS: ${EXPERIMENT_SURVEY_DAYS:-}
      # Ticket 095, lot B — modes interrogés par l'enquête du soir. Vide : les quatre d'Adam &
      # Gaudou (voiture, transports_collectifs, velo, marche). À étendre à `train` ou
      # `deux_roues` quand le choc du run les vise (C4, C5), sans quoi l'instrument interroge
      # quatre modes dont aucun n'est celui que le choc a frappé.
      EXPERIMENT_SURVEY_MODES: ${EXPERIMENT_SURVEY_MODES:-}
      EXPERIMENT_TARGET_PERSONAS: ${EXPERIMENT_TARGET_PERSONAS:-}
      EXPERIMENT_HIBERNATE_ON_QUOTA: ${EXPERIMENT_HIBERNATE_ON_QUOTA:-0}
      # Ticket 035 — plateforme d'expériences : où vivent jeux, expériences et le référentiel d'enquête
      EXPERIENCES_DIR: /app/data/experiences
      JEUX_DIR: /app/data/jeux
      REFERENTIEL_ENQUETE: /app/scripts/data/population/cerema_values.yaml
      # Interruptions d'exécution : délai de grâce laissé aux sollicitations en vol avant de les
      # abandonner, et inactivité au-delà de laquelle l'exécution se met en pause seule (0 = jamais).
      EXP_PAUSE_GRACE_S: ${EXP_PAUSE_GRACE_S:-15}
      EXP_INACTIVITE_PAUSE_S: ${EXP_INACTIVITE_PAUSE_S:-420}
    volumes:
      - ./services/llm-agents:/app
      - ./packages/llm_gateway/src/llm_gateway:/opt/llm_gateway
      - ./config/llm_gateway:/app/config/llm_gateway:ro
      - ./packages/mobility_core/src/mobility_core:/opt/mobility_core
      - ./packages/mobility_llm/src/mobility_llm:/opt/mobility_llm
      - ./scripts:/app/scripts
      # Dépôt autonome prompt_calibration (endpoint POST /calibrate → CALIBRATION_DIR)
      - ./prompt_calibration:/app/prompt_calibration
      # Plan d'expériences, en LECTURE SEULE : `ratios_du_plan()` y lit les jetons par
      # sollicitation, dernier repli de l'estimation de coût. Sans ce montage, l'estimation
      # d'un bras payant annonce « aucune mesure disponible » depuis que la base d'expériences
      # est vide — le repli précédent, la médiane des exécutions archivées, n'a plus de quoi
      # répondre (ticket 045). Montage étroit : le conteneur n'a pas besoin du reste de `docs/`.
      - ./docs/paper/methode/experience_plan:/app/docs/paper/methode/experience_plan:ro
      # Corpus de presse du ticket 059, en LECTURE SEULE (ticket 100, lot 2). Le canal `lu`
      # CITE ces textes : leur empreinte est vérifiée au chargement contre la déclaration ET
      # contre le manifeste du corpus. Sans ce montage, un run à article refuse de démarrer en
      # disant « texte introuvable » et en listant les chemins essayés. Montage étroit, sur le
      # modèle du plan d'expériences ci-dessus : le conteneur n'a pas besoin du reste de `docs/`.
      # ⚠ Lecture seule non négociable — un corpus que le conteneur pourrait réécrire ne
      # prouverait plus rien.
      - ./docs/paper/sources/actualites/articles_txt:/app/docs/paper/sources/actualites/articles_txt:ro
      # Les TROIS réseaux en service, pas le seul Tisséo : la porte de proximité
      # d'OTP (`trip_helper/otp.py`, feeds_en_service) énumère les feeds du premier
      # niveau de ce répertoire. Montée sur le seul tisseo_gtfs, elle refusait
      # l'appel à OTP pour 397 des 2 580 points de la population scellée v4 — ceux
      # qui n'ont à portée qu'un arrêt liO ou une gare TER (ticket 031, q. 16).
      - ./data/gtfs:/data/gtfs
      - ./experiments:/app/experiments
      - ./data/population:/data/eqasim-output:rw
      # Pickles des GRAPHES (`graphs_<clé>.pkl`) — chemin partagé avec les réplicas `osmnx`,
      # dont l'image a ce chemin cuit (`gtfs.osmnx_cache_dir`).
      - ./data/cache/osmnx:/app/osmnx_cache
      # Cache de ROUTES SQLite (`<population>/osmnx_cache.db`) — MÊME répertoire hôte, monté
      # une seconde fois sur le chemin qu'attend `gtfs.osmnx_persistent_cache_dir`. Ce montage
      # est ce qui fait que le peupleur en masse et le runtime écrivent le MÊME fichier ; sans
      # lui, le runtime repart de zéro dans `services/llm-agents/data/osmnx_cache/` (cf. 2026-09-04).
      - ./data/cache/osmnx:/app/data/cache/osmnx
      - ./data/cache/llm:/app/data/llm_cache
      - ./data/cache/otp:/app/data/cache/otp
      - ./data/weather:/app/data/weather
      - ./data/weather:/data/weather
      # Ticket 035 — jeux de déplacements enregistrés et expériences (plateforme)
      - ./data/jeux:/app/data/jeux
      - ./data/experiences:/app/data/experiences
      - ./services/GAMA:/services/GAMA
    depends_on:
      api:
        condition: service_healthy
      otp1:
        condition: service_healthy
      otp2:
        condition: service_healthy
      otp3:
        condition: service_healthy
      eqasim:
        condition: service_healthy
      osmnx1:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: packages/llm_gateway/Dockerfile
    command: celery -A llm_gateway.worker.task_worker.celery_app worker --loglevel=info --concurrency=25 -P threads
    env_file: ./.env
    environment:
      <<: [*shared-env, *gateway-env]
      LLM_GATEWAY_TELEMETRY__SERVICE_NAME: worker
    volumes:
      - ./packages/llm_gateway/src/llm_gateway:/app/llm_gateway
      - ./config/llm_gateway:/app/config/llm_gateway:ro
      - ./packages/mobility_core/src/mobility_core:/app/mobility_core
      - ./packages/mobility_llm/src/mobility_llm:/app/mobility_llm
      # Les TROIS réseaux en service, pas le seul Tisséo : la porte de proximité
      # d'OTP (`trip_helper/otp.py`, feeds_en_service) énumère les feeds du premier
      # niveau de ce répertoire. Montée sur le seul tisseo_gtfs, elle refusait
      # l'appel à OTP pour 397 des 2 580 points de la population scellée v4 — ceux
      # qui n'ont à portée qu'un arrêt liO ou une gare TER (ticket 031, q. 16).
      - ./data/gtfs:/data/gtfs
      - ./experiments:/app/experiments
    depends_on:
      redis:
        condition: service_healthy
      otp1:
        condition: service_healthy
      otp2:
        condition: service_healthy
      otp3:
        condition: service_healthy


  flower:
    build:
      context: .
      dockerfile: packages/llm_gateway/Dockerfile
    command: celery -A llm_gateway.worker.task_worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: ./.env
    environment:
      <<: *gateway-env
    volumes:
      # Mêmes sources montées que api/worker : flower importe l'application Celery du worker.
      - ./packages/llm_gateway/src/llm_gateway:/app/llm_gateway
      - ./packages/mobility_core/src/mobility_core:/app/mobility_core
      - ./packages/mobility_llm/src/mobility_llm:/app/mobility_llm
      - ./config/llm_gateway:/app/config/llm_gateway:ro
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  # ─────────────────────────────────────────────
  # Monitoring: Prometheus & Grafana
  # ─────────────────────────────────────────────

  node_exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # CPU/RAM/réseau PAR CONTENEUR (api, worker, otp, redis, qdrant…) — node_exporter
  # ne voit que le total de la VM Docker Desktop. Alimente le dashboard 08_systeme.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8888:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_LOG_LEVEL=warn
      # Plugin datasource JSON pour le panneau "Dernières erreurs LLM" du cockpit
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # GAMA Server — simulation multi-agents headless (profil "offline")
  #
  # Image officielle alignée sur la version installée en local (2025-06-4) : les
  # modèles GAML ne sont pas portables entre versions, ne pas changer le tag sans
  # revalider les modèles.
  #
  # GAMA démarre en mode serveur (protocole WebSocket JSON sur 6868) et attend
  # les commandes load/play du launcher `scripts/gama/launch_headless.py`, lancé
  # par `make run OFFLINE=1` dans le conteneur controller. Le modèle ouvre
  # ensuite son propre websocket_server sur 3001 (canal de données existant,
  # LLMAgent.gaml) auquel le controller se connecte via GAMA_WS_URL=ws://gama:3001.
  #
  # En mode IHM (défaut, sans profil), ce service ne démarre pas et
  # GAMA_WS_URL retombe sur ws://host.docker.internal:3001.
  # ─────────────────────────────────────────────

  gama:
    image: gamaplatform/gama:2025.06.4
    profiles: ["offline"]
    command: ["-socket", "6868"]
    ports:
      - "6868:6868"
    environment:
      TZ: Europe/Paris
    volumes:
      # rw : le modèle écrit ../results/*.csv et ../config/sim_params.yaml
      - ./services/GAMA:/services/GAMA
      # Le symlink services/GAMA/CityTransport/results → ../../../experiments/archive/<run>/
      # gama_results (repointé par le controller, settings.py) doit se résoudre
      # dans ce conteneur comme sur l'hôte. C'est pourquoi GAMA est monté sur
      # /services/GAMA et non /GAMA (ticket 039) : la cible du lien remonte trois
      # niveaux des deux côtés — /services/GAMA/CityTransport + ../../../ = /,
      # <racine>/services/GAMA/CityTransport + ../../../ = <racine>.
      - ./experiments:/experiments
    # 12g : l'OOM du 2026-08-19_11_01 a montré que 8g ne suffisent pas à un jour
    # simulé de 1 000 agents en headless (VM Docker portée à 24 Go en regard).
    mem_limit: 12g
    depends_on:
      controller:
        condition: service_started

volumes:
  redis_data:
  grafana_data:
  prometheus_data: