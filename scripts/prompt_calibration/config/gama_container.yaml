# RunConfig utilisée quand la calibration est lancée depuis l'IHM GAMA,
# via le endpoint POST /calibrate du contrôleur (conteneur `controller`).
#
# Le conteneur ne partage PAS la disposition des dossiers de l'hôte :
#   - le code de calibration est monté sous /app/scripts/prompt_calibration
#   - llm_module est monté sous /opt/llm_module (et non /app/llm_module)
# Ces chemins absolus remplacent donc les défauts relatifs de RunConfig,
# qui, eux, supposent la disposition de l'hôte (dev local).
#
# Les paramètres de la boucle (nb de cycles) restent surchargés à l'exécution
# par l'argument --iterations passé par le contrôleur.

prompts_path: /opt/llm_module/prompts/prompts.yaml
schemas_path: /opt/llm_module/prompts/schemas.json
cerema_path: /app/scripts/data/population/cerema_values.yaml

# dataset_dir et store_path restent relatifs au cwd
# (/app/scripts/prompt_calibration) : calibration_datasets/ et calibration_results/.
