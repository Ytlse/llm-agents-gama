# RunConfig pour un lancement CLOUD (VM Google e2-micro « Always Free »).
#
# Après `git clone` du dépôt sur la VM, la disposition des dossiers est IDENTIQUE
# à celle de l'hôte de dev — les chemins relatifs par défaut fonctionnent donc tels
# quels (contrairement au conteneur GAMA, qui remappe llm_module sous /opt).
#
# Lancement (depuis scripts/prompt_calibration/, avec le venv du cloud) :
#   python -m calibration.cli run --config config/cloud.yaml
#
# La campagne est REPRENABLE : relancer la même commande repart au point d'arrêt
# (évals servies par le cache, mutations rejouées, zéro appel LLM redondant). Quand
# le quota Gemini du jour (500 requêtes) est épuisé, le run s'arrête de lui-même ;
# le cron le relance le lendemain et il continue. Voir cloud/README_CLOUD.md.

branch: cloud                  # branche isolée dans le store (une campagne = une branche)
seed_prompt: expert            # clé sous prompts.<seed_prompt> dans prompts.yaml
loss: emd_jsd                  # métrique : l1_composite ou emd_jsd

# Modèles (un seul modèle d'éval épinglé ; même modèle pour la mutation → un seul quota)
eval_provider: google_gemini31
eval_model: gemini-3.1-flash-lite-preview
eval_temp: 0.0                 # décodage ~greedy (variance minimale)
eval_samples: 3                # tirages par lot, mis en commun
eval_rpm: 15                   # free tier Gemini (15 requêtes/minute)
eval_workers: 2
eval_batch_max: 0              # 0 → capacité réelle du provider (llm_config)

mutation_model: gemini-3.1-flash-lite-preview
mutation_temp: 0.8

# Boucle (recuit simulé). max_iterations = CIBLE TOTALE de la campagne, pas par jour :
# la boucle s'étale sur plusieurs jours au gré du quota, la reprise recolle les morceaux.
max_iterations: 50
sa_t0: 10.0
sa_alpha: 0.92
collateral_tol: 15.0
global_ablation_every: 10
val_every: 5
early_stop_patience: 3
length_penalty_per_word: 0.05

# Acceptation statistique (bootstrap apparié sur les agents)
accept_test: bootstrap
bootstrap_b: 1000
bootstrap_conf_max: 0.90
bootstrap_conf_min: 0.55

# Phase 4 — Rendement de la boucle (tabu, entonnoir, bandit, compaction)
tabu_enabled: true
tabu_threshold: 0.9
tabu_tenure: 10
n_candidates: 1                # un seul essai par itération (économe en quota)
screen_dataset: screen
bandit_enabled: true
bandit_c: 1.4
compact_every: 10
compact_margin: 1.0
compact_abl_tol: 2.0
racing_enabled: true
racing_rungs: [0.25, 0.50, 0.75]
racing_keep_frac: 0.5
racing_target_gate: true
racing_target_every: 2
racing_min_gap: 1.0
racing_min_n: 8

# Phase 5 — Attribution de crédit Shapley
shapley_enabled: true
shapley_every: 5
shapley_permutations: 25
shapley_truncation_tol: 0.5
shapley_addon_per_accept: 5    # permutations fraîches par acceptation (0 = historique : ré-échantillonnage complet)
shapley_max_permutations: 50   # plafond du cumul — modifiable en cours de campagne (relu à la reprise)

# Phase 6 — Îlots parallèles (1 = mono-branche ; surchargeable par --islands)
n_islands: 1
island_prefix: isl
migrate_every: 10
crossover_every: 0
pareto_dims: [global, age, occupation, genre, motif, distance]
snippets_enabled: true
snippet_min_gain: 2.0
snippet_topk: 3

# Phase 7 — Consolidation / publication
test_dataset: test
publish_prefix: calibrated

# Jeux gelés + store (relatifs à scripts/prompt_calibration/)
dataset_dir: calibration_datasets
dataset_version: v1
store_path: calibration_results/calibration.db

# Ressources partagées (présentes dans le dépôt après git clone)
cerema_path: ../data/population/cerema_values.yaml
prompts_path: ../../llm_module/prompts/prompts.yaml
schemas_path: ../../llm_module/prompts/schemas.json
category: itinary_multi_agent
