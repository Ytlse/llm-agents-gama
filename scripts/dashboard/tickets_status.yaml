  ticket_096_jev_typesafe_troisieme_famille_de_decideur:
    status: en cours
    category: Expériences & Cognition
    note: >-
      Ouvert le 2026-09-21 ; LOTS 0, 1 ET 2 LIVRÉS LE MÊME JOUR. Jev (TypeSafe) est un
      CLASSIFIEUR ZÉRO-SHOT À SORTIE TYPÉE : on envoie un `state` et une question `Choice`, il
      rend la distribution complète sur les options et une confiance, sans générer une ligne de
      texte. Troisième famille du § 6.1, ni modèle de langage génératif ni tabulaire entraîné sur
      l'enquête.
      RÉSULTAT PRINCIPAL (lot 2, jeu `population_1000_AAMAS_v6_20260316_EN_c`, 3 154 décisions
      comptées sur 3 161, zéro erreur, scoreur et formule inchangés) : sous `prompt_expert_05` —
      celle du § 6.1 — Jev fait 4,19 de composite EMD-JSD, DANS LA BANDE TABULAIRE (3,60-4,09,
      écart inférieur à la variation de cohorte de ±1,3) et DEVANT LE MEILLEUR BRAS LLM (4,86) ;
      L1 12,59 contre 13,85 à gemini-3.5 expert. Sous `prompt_minimal_02`, 13,75. ESTIMATION
      APPARIÉE (bootstrap du 2026-09-21, même script et même méthode que la trace du 2026-09-17,
      2 000 réplicats, graine 2026, 868 personnes communes ; les quatorze paires d'origine
      ressortent au centième près, contrôle passé) : Jev expert N'EST SÉPARABLE D'AUCUNE des
      quatre méthodes tabulaires (+0,66 [−0,63 ; +2,07] face au gradient boosté, +0,69, +0,27,
      +0,25), là où gemini-3.5 expert EST séparable des deux meilleures. Gain de consigne
      +9,71 [+7,80 ; +11,66], zéro exclu sur les trois lectures. LA QUESTION DU
      § 1 EST DONC TRANCHÉE PAR LA BRANCHE FAVORABLE : un décideur sans mémoire, sans texte, sans
      rôle et qui n'a jamais vu Toulouse atteint le niveau des méthodes entraînées sur l'enquête
      locale — ce n'est pas l'incarnation qui achète la performance, c'est la connaissance du
      monde mise en forme probabiliste.
      SECOND RÉSULTAT : la consigne pèse PLUS sur lui que sur les modèles de langue (9,56 points
      de gain minimal → expert, contre 2,16 à 7,12 aux trois LLM), mais seulement une consigne
      faite de PRINCIPES D'ARBITRAGE CONCRETS ; une PROCÉDURE de raisonnement en quatre étapes ne
      lui fait rien — masse TC par option 0,050 sous `prompt_expert_05` contre 0,132 sous
      `prompt_expert_16`. Ce que Jev ne fait toujours pas : ÉCARTER. Jamais zéro sur l'option
      voiture (0 fois sur 1 685), proba max médiane 0,65, saturation 6 % — quand un LLM met zéro
      une fois sur huit.
      LE LOT 0 S'ÉTAIT TROMPÉ, et sa section du ticket porte ses passages barrés plutôt que
      réécrits : la sonde jouait `prompt_expert_16` (la variante ACTIVE du dépôt) et concluait
      « région des planchers, la consigne ne déplace rien » à partir de DEUX consignes qui
      échouaient toutes deux. Ce qui tient du lot 0 : déterminisme quasi (bruit 0,013 par option,
      bascule d'index seulement sur 5,5 % de quasi-égalités), ordre d'insertion pesant 5,5× le
      bruit MAIS SANS BIAIS DE POSITION, exploitabilité 100 % (les sommes à 0,99/1,01 sont un
      arrondi à deux décimales), coûts vérifiés.
      LOT 1 : `decideur_typesafe.py` au contrat commun, type `typesafe` dans `DecideurSpec` avec
      REFUS DE L'ALIAS à la validation, nommage par version (`exp_jev-1130_proexp05_…`) sans
      segment de température, empreinte portant `instructions_sha256` (le sha du texte AMPUTÉ de
      son bloc de sortie, l'empreinte de gabarit hachant la variante entière), `typesafe-sdk`
      épinglé, type exposé au dashboard. Contrat de 31 règles écrit avant le code
      (`specs/ticket_096/tests.md`), 48 tests. ÉPROUVÉ PAR MUTATION : une altération sur quatre
      n'était pas attrapée (confondre `graine_tirage` et `graine_ordre`, invisible car les deux
      valent 42 par défaut) — test vacueux corrigé. DÉFAUT TROUVÉ AU LOT 2 : `choisir` appelait le
      client SYNCHRONE du SDK dans une coroutine, bloquant la boucle du runner et annulant
      `regroupement.parallelisme` — 40 décisions/minute au lieu de ~550 ; corrigé en
      `AsyncTypeSafeClient`, trois règles ajoutées (A1-A3). Un bras se rejoue en SIX MINUTES pour
      0,12 $.
      JEU `enquete_058_test` d'abord écarté puis ROUVERT par l'auteur le 2026-09-21, devant
      l'absence de Jev sur les planches 6.5 et 6.6 : deux bras joués, 12 562 décisions chacun,
      aucune erreur, audit unitaire relancé sur les onze décideurs. LE RÉSULTAT VA CONTRE CELUI
      DU JEU DE RÉFÉRENCE : Jev expert est NEUVIÈME DES ONZE à 64,3 % d'exactitude pondérée,
      SOUS LE PLANCHER TOUT-VOITURE (66,7 %), et son entropie croisée de 0,655 est la PLUS
      MAUVAISE de tous ceux qui rendent une distribution (0,356 au bras LLM, 0,419 au gradient
      boosté) — prédiction inverse de la mienne, étaler la masse ne suffit pas si elle ne tombe
      pas sur le mode déclaré (rappel TC 35,0 % contre 55,2 %, rappel marche 63,1 %). Accord par
      paire : Jev/gradient boosté 72,2 % et 71,7 % contre 69,7 % et 61,4 % au bras LLM — il
      décide comme les tabulaires plus souvent que le LLM et se trompe pourtant davantage. Un bras
      `prompt_expert_16` lancé avant cette décision est passé `archivee`, données conservées.
      RESTE : lot 3 (décomposition en questions atomiques) toujours NON PLANIFIÉ, et l'alignement
      de l'article — treize décideurs deviennent quinze, figure 6.1, son tableau, figure 6.2 et
      annexe H — qui passe par la skill `article-verrou` et l'accord de l'auteur. Figure
      regénérable : `scripts/analysis/plot_ticket096_jev.py` →
      `docs/traces/2026-09-21_ticket096_lot2/` ; `plot_chapitre6.py` n'est PAS touché.
    triage:
      faisabilite: 4
      surete: 5
      jeux_de_test: true
      motif: >-
        Faisabilité 4 : le point d'insertion existe et est éprouvé (sept décideurs au même
        contrat, `runner.py` rejoue un jeu gelé sans simulateur), le décideur est un calque de
        `decideur_modele.py`, et le coût machine est négligeable. Ce qui retient un point :
        deux propriétés dont dépend tout le bras — déterminisme et biais de position — ne sont
        pas documentées, donc le lot 0 peut rendre un no-go, et les faiblesses déclarées de Jev
        (nombres, durées, multi-sauts) visent exactement notre matière. Sûreté 5 : aucun
        décideur existant n'est touché, ni `llm_gateway`, ni `providers.yaml`, ni le contrat des
        21 variables, ni les jeux gelés, ni le scoreur, ni la formule ; le lot 0 n'écrit pas une
        ligne dans `services/`, et tout le ticket est additif.
        AAMAS ⭐⭐⭐⭐ (4/5) — remplit une case vide du plan d'expériences avec un substrat qu'aucun
        des treize décideurs n'occupe, et dont les deux issues possibles répondent toutes les
        deux à H0. Pas 5/5 : le bras est sans mémoire, donc il n'éclaire pas la contribution
        mémoire, et son résultat ne vaut que si le lot 0 établit d'abord qu'il décide de façon
        reproductible.
      date: '2026-09-21'
      aamas: 4

  ticket_095_duree_d_un_souvenir_et_enquete_du_soir:
    status: en cours
    category: Expériences & Cognition
    note: >-
      LES CINQ LOTS DE CODE SONT LIVRÉS le 2026-09-21 ; RESTENT LES CINQ EXPÉRIENCES, qui
