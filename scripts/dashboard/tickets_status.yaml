    note: >-
      MIS EN VEILLE le 2026-08-24. Phases 0 à 7 livrées, 57 des 60 cases cochées ;
      le module vit dans son dépôt autonome `prompt_calibration/`. Rien ne bloque —
      décision de priorité : le gain de la calibration de prompt (3,67 de composite)
      est du même ordre que celui d'un seul paramètre de POPULATION en amont (2,17
      pour le calibre du temps terminal, ticket 013 — chiffre révisé le 2026-08-24,
      cf. 013), et calibrer un prompt sur une base biaisée revient à calibrer
      l'instrument sur le biais. Reprend après les tickets 016/017 et le
      nouveau jeu de test. Le dépôt reste opérationnel, la calibration tourne en
      TÂCHE DE FOND (cf. 009).

  ticket_005_choix_modal_probabiliste:
    status: terminé
    note: >-
      Bascule du 2026-07-29 : le LLM rend une distribution, le tirage est seedé, et
