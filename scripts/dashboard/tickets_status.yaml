  ticket_013_temps_terminal_itineraires:
    status: en cours
    note: >-
      Le correctif est livré : accès et diffusion portés par des jambes nommées,
      temps terminal exogène et spatialisé par couronne, trois caches versionnés,
      rendu décomposé, tests. Reste T6 — la grille de sensibilité est appelable et
      testée, mais aucun script ne la parcourt : la mesure n'existe pas.
      2026-08-24 — le CALIBRE est corrigé et livré (tt3). L'enquête mesure le temps
      terminal voiture (T2/T6/T11 du fichier trajets) à 0,55 min quand tt2 en
      appliquait 2 à 10 selon la couronne — 8× à 24× trop, et c'était la cause de la
      régression du run du 21 août (vélo +4 pts, voiture −9,5 pts). La config tire
      désormais dans la loi d'enquête (voiture ET vélo, tous deux `sourced`),
      `routing_version` inchangée. 56 tests, dont un garde-fou qui refuse un retour
      aux valeurs tt2.
      MESURE CORRIGÉE le 2026-08-24 : le premier A/B annonçait −5,28, mais il ne
      réécrivait que la VOITURE dans le jeu de test alors que la livraison alignait
      aussi le VÉLO — périmètre mesuré plus étroit que le périmètre livré. Un
      troisième bras (`v7`, les deux modes) donne le chiffre opposable : **−2,17** de
      composite. Aligner la voiture seule vaut −4,52 ; l'alignement du vélo rend
      +2,35, soit la moitié, parce qu'un vélo plus rapide est plus attractif. Les
      dimensions `distance` (+2,59) et `motif` (+1,29) se dégradent. Le correctif
      d'outillage : `--modes` sur `rewrite_terminal_time.py` (+8 tests de périmètre),
      rapport de dérivation par mode, page de mesure sans chiffre en dur. Traces :
      `docs/traces/2026-08-24_temps_terminal/`. RESTE : un run de simulation neuf
      (les mesures portent sur des jeux gelés, sans rejeu des chaînes de véhicule) et
      T6, la grille de sensibilité, toujours non parcourue.

  ticket_014_anticipation_chaine_journee:
    status: en cours
    note: >-
      Option 1 livrée et mesurée (météo du jour + agenda glissant dans le prompt,
      derrière `agenda_anticipation_enabled`, signature dans la clé de cache,
      colonne « Anticipation »). La ligne de position des véhicules a été retirée
