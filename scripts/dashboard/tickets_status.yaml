  ticket_039_organisation_du_depot:
    status: terminé
    category: Ingénierie & Système
    note: >-
      TERMINÉ le 2026-09-15 (pas 4, 5 et 6 livrés ; pas 1 à 3 le 2026-09-12). PAS 4 — le
      Makefile délègue : 1 419 lignes ramenées à 109, les 120 cibles réparties en sept modules
      de make/ (docker 27, choix-modal 37, experiences 30, synthese 13, tests 8, gama 3,
      pilotage 2). Aucune recette modifiée. Trois pièges, qui étaient le travail : PROJECT_ROOT
      se calculait par $(lastword $(MAKEFILE_LIST)) — vrai tant qu'aucun include ne le précède,
      faux ensuite, et toute la résolution de chemins bascule EN SILENCE → passé à $(firstword) ;
      `make help` lisait $(firstword …) et n'aurait plus listé aucune cible → passé à
      $(MAKEFILE_LIST) ; le tableau de bord lisait le Makefile COMME UN FICHIER
      (scripts/dashboard/makefiles.py) et ses 120 boutons tombaient à zéro sans exception ni
      test rouge → parse_makefile développe les include, chaque cible porte son module,
      test_makefiles_includes.py (5 tests) garde le point. .DEFAULT_GOAL := up posé
      explicitement, sinon l'ordre alphabétique des .mk décide de ce que fait un `make` nu.
      Vérifié : `make help` rend les mêmes 104 lignes au mot près (seul l'ordre change), base de
      règles de `make -pn` identique (195 cibles, 104 .PHONY, mêmes recettes, seule la
      provenance bouge), aucun « overriding recipe », dashboard à 120 cibles avec la même doc.
      PAS 5 — prompt_calibration devient un SOUS-MODULE (et non une dépendance packagée) : la
      mesure a tranché, le parent IMPORTE le code du dépôt imbriqué (scripts/synthesis importe
      calibration.metrics par sys.path) et model_compare.py inscrit metrics.py au manifeste
      d'une page de score SANS enregistrer aucun commit — un score republié n'était pas
      rattachable à la loss qui l'a produit. Exclusion retirée du .gitignore, .gitmodules
      déclaré, commit 8be8f26 épinglé, dépôt imbriqué intact, quatre couplages vérifiés (import
      du moteur, Makefile lu par le dashboard 25 cibles, make -C pull-db, montage compose).
      À TRANCHER : l'épingle porte sur 8be8f26 (branche feat/diag-plan-arbitre, état du disque)
      alors qu'origin/main est en avance à f8d55d8 qui fusionne cette branche.
      PAS 6 — docs/paper : PAS de migration LFS. Mesuré : chaque binaire suivi sous docs/paper a
      exactement UNE version dans l'historique ; 34 Mo écrits une fois coûtent 34 Mo dans le
      pack, le régime que git gère le mieux. LFS coûterait une dépendance par clone pour ne rien
      économiser. Le risque est la croissance À VENIR, déjà amorcée : plot_experiences.py et
      plot_familles.py écrivent PAR DÉFAUT dans docs/paper/figures/, versionné. Règle écrite
      dans docs/paper/README.md (on ne committe une figure que citée par un chapitre gelé, sinon
      --sortie docs/synthesis/<nom>) et les deux générateurs avertissent en chiffrant le poids
