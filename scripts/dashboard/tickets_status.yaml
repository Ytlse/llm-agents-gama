  ticket_087_attribution_du_nombre_de_voitures_par_menage:
    status: abandonné
    category: Modélisation Statistique
    note: >-
      ABANDONNÉ le 2026-09-21 sur décision de l'auteur : la vérification de filière n'a plus
      d'objet. CONTRÔLE FAIT LE JOUR MÊME, avant de fermer. Dans toute la chaîne d'exécution
      `number_of_cars` n'est lu qu'en booléen — `vehicle_chain.py:184`, `population_utils.py:44` et
      `handle/application.py:465` font tous `> 0` — donc l'agent ne voit JAMAIS le nombre. Les deux
      seuls consommateurs de la valeur fine sont en amont, comme covariable continue :
      `bike_ownership.py:320` et `equipment_propensity.py:217`. Y confondre 3 et 4 décale d'une unité
      une covariable sur 1,5 % des ménages, très au-dessous de la résolution de l'instrument (1,3
      point par décideur), et l'usage aval était déjà clos au 057. LE POINT 2.3 EST TRANCHÉ ET
      IL N'Y A RIEN À CORRIGER. `CONTROLE.md` publie `motorisation_personne` et `motorisation_menage`
      avec les mêmes effectifs 136 / 377 / 487 et `n = 1000`, ce qui a d'abord fait soupçonner un IC95
      calculé sur le mauvais effectif. Faux : la base ménage est le fichier personnes pondéré à
      1/taille, et `control_population.py:508` calcule l'IC par Clopper-Pearson sur l'EFFECTIF EFFICACE
      DE KISH. Recalculé depuis `population.json` le 2026-09-21, somme des poids 491,8 et n_eff 749,1 :
      les trois intervalles publiés tombent au dixième — [16,4 · 22,2], [41,8 · 49,0] et [32,0 · 38,9]
      contre [32,0 · 39,0]. Reste un libellé qui se lit mal (colonne `n` en effectif brut personnes,
      en-tête « Base menage, n = 1000 », sous des pourcentages de ménages) : lisibilité, pas
      statistique, et aucun chiffre de l'article n'en dépend. Pas de ticket ouvert là-dessus.
      Le renvoi au 087 dans les tickets associés du chapitre 8 est retiré le 2026-09-21, en FR et en
      EN, sous accord de l'auteur ; aucune prose ni aucun chiffre touché. ── HISTORIQUE ──
      Ouvert le 2026-09-16 à la demande de l'auteur, passé en amélioration le 2026-09-17. Piste d'audit
      future non bloquante sur la filière `number_of_cars` (vérification de filière eqasim vs enquête et
      écart sur 3 vs 4+ VP). Ne bloque aucune publication ni run. Vérification de FILIÈRE : d'où vient `number_of_cars`, par quel
      chemin il arrive au persona, et sur quoi il est ajusté. TROIS FAITS À L'OUVERTURE. (1) La
      valeur fine existe et vient de l'enquête — `build_mode_choice_dataset.py:278` lit `M6`
      (« Nombre de véhicule (VP) du ménage ») sans recodage, et le persona porte aussi
      `household.id`. (2) Le contrôle de marges, lui, n'en voit que trois classes :
      `reference_marges.py:211` fait `MOTORISATION[min(n, 2)]`, donc les trois marges conformes du
      sceau portent sur 0 / 1 / 2+ et la distinction entre deux, trois et quatre voitures n'est
      contrôlée par rien. (3) Sous cette agrégation, un écart apparaît : 0 et 1 voiture collent au
      dixième (19,0 contre 19,4 % ; 45,1 contre 45,3 %), mais « 3 voitures » vaut 6,8 % dans la
      cohorte contre 5,3 % dans EMC² pondéré, et « 4 et plus » vaut 0,0 % contre 1,5 % — le surplus
      sur 3 égale EXACTEMENT le déficit sur 4+, ce qui ressemble à un plafond dans la filière.
      À VÉRIFIER, pas à supposer : la cohorte vient du vivier eqasim, pas du fichier ménages, et
      rien ne dit encore qu'elle suit le même chemin que le jeu d'apprentissage des tabulaires.
      AUSSI : `car_availability` vient-il de la même source ; la descente par échanges de
      `seal_population.py` peut-elle dégrader la distribution fine en améliorant la marge agrégée ;
      et `CONTROLE.md` publie `motorisation_menage` en « base menage, n = 1000 » avec les effectifs
      de la base personne (136/377/487) alors que ses pourcentages sont bien des pourcentages de
      ménages — libellé trompeur ou effectif erroné. NE TOUCHE PAS à `vehicle_chain.py` : l'usage
      du nombre de voitures par la règle de chaîne est CLOS au 057 (0,07 point de composite,
      dix-huit fois sous la résolution de l'instrument, aucun run à rejouer) ; une valeur fausse ne
      rouvrirait pas ce point, la règle n'en lit que le signe. Coût nul : aucun appel LLM, aucune
      exécution relancée, lecture seule.

  ticket_092_la_restriction_ne_couvrait_que_les_decisions_et_gama_mourait_sur_une_pause:
    status: terminé
    category: Ingénierie & Système
    note: >-
      Ouvert et LIVRÉ le 2026-09-16, 11 tests dédiés, contrat `specs/ticket_087/tests.md` écrit
      avant le code. Deux défauts trouvés en tentant de lancer le bras choqué C6, chacun capable
      d'invalider le run — l'un silencieusement, l'autre bruyamment. LOT A : `llm_agent.py`
      appelle la passerelle à TROIS endroits (décision d'itinéraire, réflexion STM,
      auto-réflexion LTM) et le ticket 084 n'avait posé `instances_admises` que sur le PREMIER.
      Mesuré dans `llm_exchanges.jsonl` du run 2026-09-16_12_48 : 5 `itinary_multi_agent`
      servies par `google_gemini31_key1`, 1 `stm_reflection` servie par `mistral_key1` — sur une
      expérience dont l'objet d'étude EST la mémoire, les souvenirs étaient donc rédigés par un
      modèle non déclaré et aucun journal ne le disait. La restriction devient une propriété du
      CLIENT, appliquée dans `LLMGatewayClient.execute`, seuil unique par lequel sortent les
      trois appels ; le service la donne une fois à la construction. PAS de recopie sur les deux
      payloads manquants : c'est précisément ce qui a produit le défaut, et un quatrième site
      d'appel le reproduirait en silence. Le client ne fait que COMBLER — un appelant qui porte
      sa propre restriction n'est jamais écrasé — et sans restriction déclarée aucune clé n'est
      ajoutée, donc comportement rigoureusement identique à avant. LOT B : le lanceur headless
      ouvrait sa connexion à GAMA Server avec les défauts de `websockets` (`ping_timeout=20 s`)
      alors que GAMA se bloque en attendant les décisions du LLM — en CACHE=0 c'est le régime
      NOMINAL, et davantage encore en pénurie de jetons, la règle du dépôt étant d'attendre le
      renouvellement plutôt que de dégrader. Mesuré : 23 pauses, médiane 9,0 s, maximum 40,9 s,
      trois au-dessus de 20 s ; le run est mort au jour 1 à la troisième, GAMA Server arrêtant
      l'expériment dont le client s'est déconnecté. Porté à 20 minutes (`GAMA_PING_TIMEOUT_S`),
      ping toujours ÉMIS pour que la mort réelle d'une connexion reste détectée, et pauses
      toujours journalisées — on desserre un seuil, on ne masque pas le symptôme. ATTRIBUTION
      CORRIGÉE : le premier arrêt du bras avait été imputé à une collision avec la campagne
      `bascule_anglaise_v6` ; le second porte la même signature SANS aucun processus concurrent,
      donc la collision allongeait la pause mais n'en était pas la cause.

  ticket_089_make_run_arrete_le_run_precedent:
    status: terminé
    category: Ingénierie & Système
    note: >-
      Ouvert et LIVRÉ le 2026-09-16, 4 tests dédiés. Le conteneur GAMA n'était pas redémarré
      entre deux lancements : chaque `make run` demandait un `load` au processus GAMA DÉJÀ EN
      PLACE, et le journal du conteneur montre `City.gaml model is being compiled` DEUX FOIS sur
      le dernier segment. Deux City.gaml résidents — 453 communes, réseau de transport complet,
      graphes OSM — dans une JVM plafonnée à 12 Go : conteneur tué par sa propre limite
      (`OOMKilled=true`) au jour 1 du bras choqué C6. CE QUI PÈSE EST LE TERRITOIRE, PAS LES
      AGENTS : la limite de 12 Go avait été calée en août pour UNE journée de 1 000 agents, et
      deux réseaux complets la dépassent même avec cinq agents — ce qui rendait l'OOM
      incompréhensible sur une population de test. CORRECTIF : `stop-run` devient la PREMIÈRE
      étape de `run`, avant tout geste sur la pile, et pour TOUS les lancements — la reprise à
      chaud `CONT=1` charge elle aussi un modèle. CONTREPARTIE ASSUMÉE : la garde « un launcher
      tourne déjà, lancement ignoré » ne se déclenche plus, donc un `make run` tapé pendant un
      run en cours l'ARRÊTE au lieu d'être refusé ; le message d'arrêt est le seul
      avertissement. Si la protection redevient souhaitable, elle devra être un refus explicite
      avec échappatoire (FORCE=1), pas un retour au silence. DÉFAUT SIGNALÉ NON CORRIGÉ :
      `make stop-run` annonce « ✅ Run arrêté » même quand son `pkill` en conteneur échoue
      (`pkill` absent de l'image du contrôleur, erreur avalée par `|| true`) ; l'arrêt réel passe
      par les deux gestes côté hôte, mais ce message mérite d'être repris maintenant que
      `stop-run` est sur le chemin critique de chaque lancement.

  ticket_088_jeu_corrige_et_rejeu_complet:
    status: terminé
    category: Ingénierie & Système
    note: >-
      TERMINÉ le 2026-09-17 : les 27 expériences v6 sont sur le jeu corrigé, les chapitres 4 et 6 repris. Ouvert le 2026-09-16 sur décision de l'auteur, à la suite du ticket 057. REPRISE DE
      SUBSTRAT : le correctif de code est fait, ce ticket porte ce qu'il entraîne. CE QUI ÉTAIT
      FAUX : `jeu.py:deplacements_attendus()` résolvait l'heure de départ contre le `start_time`
      de l'activité d'origine, qui pour la première paire de la journée est un « home » enjambant
      minuit (72 449 s, soit 20:07, chez la personne 609) ; la cible du matin lui étant antérieure,
      le départ basculait au LENDEMAIN pour 797 des 894 personas mobiles, soit 866 déplacements
      sur 3 299. DEUX CONSÉQUENCES, pas une. (1) Le périmètre de score écartait ces décisions —
      traité et CLOS au 057, coupe conditionnelle et 25 exécutions rescorées. (2) Le SUBSTRAT
      lui-même, objet de ce ticket, qu'aucun rescoring ne corrige : `jeu.py:preparer()` calcule
      l'offre avec `get_itineraries(departure_time=dep.depart_ts)`, donc les 797 premiers
      déplacements du jeu portent une offre calculée pour le 17 mars, lue par TOUS les décideurs ;
      et `_build_anticipation` sert la météo du 17 (afternoon 15°C) au lieu du 16 (12°C) aux seuls
      bras LLM, le décideur `modele` ne lisant jamais `ctx.anticipation`. CORRECTIF APPLIQUÉ : une
      activité qui enjambe minuit se reconnaît à son `start_time` postérieur à son `end_time`, le
      curseur recule alors d'un jour ; la règle de report continue de jouer quand la cible précède
      réellement l'arrivée. Vérifié : 3 299 déplacements tous dans le jour simulé, 3 tests neufs,
      1 408 tests de la suite au vert. CE QUE LE TICKET DEMANDE : re-préparer le jeu (nouvelle
      empreinte, donc nouveau nom d'expérience) ; MESURER D'ABORD l'écart d'offre entre les deux
      jeux — le 16 et le 17 mars sont deux jours ouvrés consécutifs, les horaires TC peuvent être
      identiques, et cette mesure gratuite dit si le rejeu des témoins déterministes s'impose ;
      rejouer tabulaires et planchers (coût nul) puis les huit bras LLM (~2 500 sollicitations
      chacun, cache désactivé, ≈ 20 000 appels) ; rescorer et reprendre les chapitres 4 et 6.
      CAMPAGNES : les trois campagnes v6 sont arrêtées et portent l'ancien jeu dans le nom de leurs
      expériences restantes ; elles ne doivent pas reprendre en l'état, une campagne neuve sur le
      jeu corrigé les remplace. Les anciennes restent sur disque, ce sont elles qui ont produit les
      mesures publiées. Aucune exécution n'est postérieure au correctif : les quatre bras `noret`
      du 2026-09-16 ont été joués le matin, avant, et sont à reprendre comme les autres.
      AVANCE DU 2026-09-16, relevée hors du ticket. LE SUBSTRAT EST REFAIT ET SCELLÉ :
      `population_1000_AAMAS_v6_20260316_EN_c` porte les 3 299 déplacements dans le jour simulé,
      offre et météo calculées pour le 16 mars, là où l'ancien jeu datait du 17 le premier départ
      de 797 personas sur 894. L'écart mesuré justifie le rejeu sans le surestimer : 95
      déplacements sur 3 299 (2,9 %) changent de signature d'offre, et la météo change pour les
      866 redatés (13 °C contre 16 °C en soirée) — un décideur tabulaire ne lit que le premier
      canal, un décideur LLM les deux. LES 18 TÉMOINS ET PLANCHERS SONT REJOUÉS, et le socle bouge
      : `durmin` ne varie pas d'un millième, `majvoiture` varie le plus (+0,71), et surtout `klr`
      et `lgbm` ÉCHANGENT LEUR RANG (0,0624 d'avance devient 0,0017 de retard) — l'ordre entre ces
      deux-là n'était pas une propriété du socle. RESTE : les neuf bras à décideur LLM, soit
      environ 22 500 sollicitations, portés par la campagne `rejeu_jeu_corrige_v6`. Les trois
      campagnes de l'ancien substrat sont archivées puis supprimées
      (docs/traces/2026-09-16_14-24_avant_rejeu_jeu_corrige/). DÉCISION DE L'AUTEUR du 16/09 :
      plus aucun run Antigravity, les cinq bras `agy-*` sortent du protocole — aucun n'avait
      jamais produit de mesure. TERMINÉ le 2026-09-17. Les 27 expériences de la cohorte v6 sont sur le jeu corrigé `population_1000_AAMAS_v6_20260316_EN_c` : 18 témoins et planchers rejoués le 16/09, 9 bras à décideur LLM rejoués du 16/09 19:05 au 17/09 09:34, tous `terminee` à 3 299 décisions archivées et 3 154 scorées. ÉCART D'OFFRE mesuré avant rejeu (§ 3.2) : 95 déplacements sur 3 299 changent d'offre (2,9 %), la météo change pour les 866 redatés — la porte de sortie « écart nul, rejeu inutile » du critère de clôture était donc fermée. § 3.3 FAIT autrement que prévu : la famille `rf` est déclarée dans `FAMILLES` et `POLICY_FORMATS`, l'expérience est rejouable par la CLI, équivalence vérifiée à écart NUL sur les cinq grandeurs et 3 299 décisions identiques (1 449 tests au vert). Le chemin de population n'est PAS normalisé et ne le sera pas : il supposerait d'exécuter la forêt dans le conteneur, sous scikit-learn 1.9.1 quand elle est estimée sous 1.8.0 et se réajuste au chargement. Le § 4.4 affirme une parité d'ESTIMATION, vraie quel que soit le lieu d'exécution : la clause « chemin normalisé » du critère visait une parité d'exécution que le chapitre ne revendique pas. CHAPITRES : le 4 est repris (FR, EN, Overleaf), le 6 l'est aux § 6.1 et § 6.2, différences appariées recalculées et recoupées par deux mesures indépendantes (docs/traces/2026-09-17_09-40_ch6_jeu_corrige_complet/ et docs/traces/2026-09-17_12-04_ticket088_apparies_jeu_corrige/, valeurs identiques). Le § 6.3 est repris le 2026-09-17 : erreur L1 pondérée sur la dimension distance, 14,19 pour gemini-3.5 sous prompt expert contre 16,79 à la forêt aléatoire et 17,79 au gradient boosté, figure régénérée sur prompt_expert_05 et jeu corrigé. Aucun résidu. Les deux [xx] du § 6.4 relèvent du ticket 058, pas de celui-ci.

  ticket_090_trace_de_rejeu_des_decisions:
    status: terminé
    category: Ingénierie & Système
    note: >-
      Ouvert et LIVRÉ le 2026-09-16, 13 tests dédiés, contrat `specs/ticket_090/tests.md` écrit
      avant le code. À la reprise à chaud, GAMA repart de son `starting_date` et REJOUE les jours
      déjà vécus pour reconstruire son état (positions, et surtout où est garée la voiture de
      chacun). La mémoire est gelée depuis le ticket 075, mais les décisions étaient REFAITES et,
      cache sémantique coupé — condition d'un run journalisé sur son périmètre complet —,
      repayées au modèle. Mesuré le 2026-09-16 après une coupure réseau volontaire au 8e jour :
      huit jours à rejouer, une centaine de décisions, trois quarts d'heure d'attente réseau pour
      retrouver un état déjà connu. CORRECTIF : chaque décision vivante est consignée sous
      `(personne, activité, instant)` dans `<workdir>/decisions_rejeu.jsonl`, et resservie
      pendant la fenêtre de gel sans appel au modèle. CE N'EST PAS LE CACHE, et c'est ce qui rend
      le lot acceptable là où le cache ne l'est pas : la source est le workdir de CE run et non un
      répertoire partagé, la clé n'est pas une empreinte d'état non indexée par modèle, la portée
      s'arrête avec `gel_actif()` — sans cette condition la trace deviendrait un cache permanent —
      et une clé manquée est comptée puis ALARMÉE au-delà de 20 %, au lieu d'un recalcul
      silencieux. Une manquée ne fait pas échouer le run : on appelle le modèle, mais un rejeu qui
      ne retrouve pas ses propres choix ne reconstruit pas l'état qu'on croit reprendre.
      PIÈGE QUI A ORIENTÉ LE DESSIN : `llm_exchanges.jsonl` ne peut PAS servir de source — écrit
      côté worker, son `sim_ts` vaut `min(departure_timestamp)` du LOT (cinq agents y partagent un
      horodatage), donc le contrôleur ne peut pas prédire la clé sous laquelle sa réponse sera
      consignée. NE FAIT PAS : supprimer le rejeu (il faudrait transmettre à GAMA l'état de la
      chaîne des véhicules, `starting_date` étant en dur dans Settings.gaml et l'horizon compté en
      secondes depuis cette date) ; ni rattraper le run du 2026-09-16, dont les journées déjà
      vécues n'ont pas de trace.

  ticket_091_identite_du_run_et_reprise_nommee:
    status: terminé
    category: Ingénierie & Système
    note: >-
      Ouvert et LIVRÉ le 2026-09-16, 16 tests dédiés, contrat `specs/ticket_091/tests.md`. Un
      point de reprise ne portait NI modèle, NI prompt, NI population, NI choc : rien ne reliait
      une mémoire stockée au run qui l'avait produite. Et la reprise suivait le lien
      `experiments/current`, qui a pointé DEUX FOIS dans la même journée sur un run autre que
      celui qu'on croyait — un `make run CONT=1` pouvait donc restaurer la mémoire d'une AUTRE
      expérience sans qu'une ligne ne le dise. PRINCIPE : par défaut on ne réutilise rien, ni
      point de mémoire ni trace de décisions ; la reprise se demande en NOMMANT le run
      (`make run … REPRISE=<nom>`), le workdir est résolu par ce nom et non par le lien, et
      `CONT=1` seul est refusé. ONZE CHAMPS comparés : modèles admis (DÉRIVÉS des instances via
      leur default_model — la première rédaction lisait `settings.llm.model`, un réglage
      inexistant, donc un champ toujours vide qui ne faisait jamais refuser), instances admises,
      variante de prompt, population, mémoire longue, auto-réflexion, empreinte du choc, trois
      graines, état du cache. L'heure d'écriture et les compteurs en sont EXCLUS : ils diffèrent
      toujours. TROIS REFUS FERMES : identité différente (tous les écarts nommés d'un coup),
      identité absente (supposer l'égalité faute de preuve est le défaut corrigé), identité
      illisible. Une reprise ne réécrit JAMAIS l'identité du run repris. AUCUNE ÉCHAPPATOIRE,
      décision de l'auteur : un contournement livré dans le produit finirait par servir en mesure.
      Conséquence assumée et testée : la manœuvre de mise au point du jour même — choc déplacé des
      jours 6-7 aux jours 9-10 puis reprise — serait désormais refusée. COUVRE le cas « Docker
      recréé par une autre session » : l'identité voyage avec chaque point, écrit atomiquement,
      et la vérification a lieu au démarrage du contrôleur, avant toute décision.

  ticket_093_personas_mesurables_et_suivi_des_habitudes:
    status: terminé
    category: Expériences & Cognition
    note: >-
      TERMINÉ le 2026-09-21. Ouvert le 2026-09-16, après l'analyse du run 2026-09-16_15_58
      (dix jours, cinq personas).
      TROIS PERSONAS SUR CINQ N'APPORTENT RIEN : 609 et 41275 n'ont qu'UN SEUL itinéraire proposé
      une fois sur deux — la moitié de leurs « décisions » n'en sont pas — et prennent la voiture
      à 100 % quand on leur en propose deux ou trois ; 11195 ne vit que 19 trajets contre 34-35
      aux autres. On observe donc la mémoire de DEUX agents en en payant cinq. CRITÈRE DE
      SÉLECTION mesurable avant le run, donc reproductible : sur une journée de référence,
      ≥ 4 trajets, TOUJOURS plus d'un itinéraire, ≥ 2 modes réellement choisis — 234 candidats
      trouvés sur un run de 1 000 agents. Dix personas retenus, Corinne (sujet du choc) et 616478
      conservés. MESURES : part modale par agent et par jour simulé, nombre de trajets, et PART
      DES TRAJETS RÉELLEMENT DÉCIDÉS (sans elle, « voiture 100 % » ne distingue pas un choix d'une
      absence d'alternative) ; taux de reprise de la veille ET conformité à l'habitude des cinq
      derniers jours, PAR ACTIVITÉ et pas seulement par agent (domicile-travail et loisir n'ont
      aucune raison de basculer ensemble) ; taille du vivier de rappel (11 candidats au jour 1,
      26 au jour 10, sans jamais décroître), durée de vie médiane par type de souvenir, et
      OPÉRATIONS DE CONCEPT PAR JOUR — mesuré 38 créés / 61 confirmés / 1 SEUL CONTREDIT en dix
      jours et cinq agents, l'unique contradiction étant celle de Corinne le jour du choc ;
      exposés et minutes injectées, et si le souvenir du choc est SERVI à la décision (un souvenir
      écrit mais jamais rappelé ne change rien). DEUX SUPPORTS : Prometheus/Grafana pour
      surveiller PENDANT le run, CSV par jour simulé comme source de l'analyse — Grafana trace en
      temps RÉEL et non en temps simulé, donc le CSV fait foi. RECETTE : deux jours simulés, un
      arrêt, une reprise nommée, et vérification que les courbes sont CONTINUES de part et
      d'autre de la coupure — une métrique qui saute ou se dédouble à la reprise est fausse et ne
      se verrait plus sur vingt jours. NE FAIT PAS : le double comptage des journées rejouées dans
      moves.csv, ni le défaut de planification du soir de 11195 — signalés pour leurs propres
      tickets.
      AVANCE DU 2026-09-16 : contrat de tests écrit AVANT le code dans `specs/ticket_093/tests.md`
      — 8 familles, 59 cas (A sélection, B choix modal, C habitude par activité, D mémoire,
      E choc, F continuité à la reprise, G séries et tableau de bord, H activation et sûreté) ;
      hypothèses et questions ouvertes dans `specs/ticket_093/questions.md`. RUN DE RÉFÉRENCE DE
      LA SÉLECTION IDENTIFIÉ ET VÉRIFIÉ :
      `data/experiences/exp_gemini-35-fl_proexp08_jtir_pop-1000_AAMAS_v6_jeu-20260316_EN_t0_nosim/executions/2026-09-15_12_38_15/moves.csv`
      — le critère du ticket y retient exactement 234 candidats et 920187 y compte 15 trajets
      (marche 9, TC 4, train 1, voiture 1), les deux chiffres cités par le ticket ; 609 et 41275
      y sont recalés par le critère (3 options figées, voiture seule) et 11195 aussi (2 trajets).
      ARCHITECTURE RETENUE : un module de calcul pur relu par le contrôleur ET par le CLI, CSV
      réécrits en ENTIER à chaque point du jour (jamais d'ajout en fin de fichier) et métriques
      toutes en Gauges RÉGLÉES — c'est ce qui rend la continuité de la reprise vraie par
      construction plutôt que par précaution. RESTE : le script de sélection et la population de
      dix, le module de mesures et ses quatre CSV, la trace structurée des opérations de concept,
      le branchement au point du jour, le tableau de bord 09, la recette deux jours + reprise.
      LOT 1 LIVRÉ le 2026-09-16, 16 tests : `scripts/data/population/selectionner_personas_mesurables.py`
      et `data/population/population_10_mesurables_093/` (920187, 1250941, 991203 — les trois que
      le ticket citait — plus 442854, 861500, 239142, 962966, 454170 ; quatre modes dominants
      couverts ; Corinne et 616478 conservés et tous deux conformes au critère). DEUX CORRECTIFS
      TROUVÉS PAR LE CODE : le critère est un PLANCHER, pas un objectif — trier par identifiant
      donnait dix agents minimalement conformes et faisait entrer 41275 lui-même, d'où un tri du
      plus observable au moins observable ; et une sélection ne vaut QUE pour son run de
      référence — 41275 passe le critère sur le run de mille et le manque sur celui à cinq
      personas, donc le run est nommé et son empreinte écrite. LOT 2 LIVRÉ le 2026-09-16,
      40 tests : `scripts/analysis/mesures/` (calcul pur, écriture, CLI `make mesures`), CINQ CSV
      — le cinquième isole la durée de vie par type, pour qu'un nouveau type n'oblige pas à
      changer un en-tête. TROIS DÉFAUTS TROUVÉS EN MESURANT : (a) une date nue (`sim_day`)
      subissait la frontière de 3 h et reculait d'un jour, décalant TOUT le vivier et toutes les
      opérations d'une journée par rapport aux trajets — attrapé par les tests ; (b) le rejeu
      d'une reprise ÉCRASE les points de reprise des journées déjà vécues avec l'état gelé
      (jour_002 à jour_009 identiques, 101 entrées), l'historique de mémoire des huit premières
      journées est perdu pour ce run — parade : un état écrit une fois n'est jamais réécrit, la
      cause reste à corriger dans un ticket propre ; (c) rien ne relie un choc au souvenir qu'il
      produit, le vécu étant REFORMULÉ par la réflexion — l'appariement par texte échoue, et
      `scripts/analysis/memoire/choc.py` a le même angle mort depuis le 079 ; la colonne vaut
      donc VIDE et jamais « non servi ». Détail dans `specs/ticket_093/questions.md`, points 8
      et 9.
      LOTS 3 ET 4 LIVRÉS le 2026-09-16, 33 tests de plus (79 au total pour le ticket, suite du
      service verte à 1515). Trace structurée `llm/trace_concepts.py` branchée aux TROIS sites de
      `llm_agent.py` — gelée pendant le rejeu, éteinte par défaut ; couture
      `urban_mobility_agents/utils/mesures_jour.py` appelée au point du jour, APRÈS le point de
      reprise dont elle lit l'instantané d'état, fail-open ; séries Prometheus TOUTES en Gauges
      réglées — un Counter se serait dédoublé sur les 113 trajets et 81 rappels rejoués de ce
      run ; tableau de bord `infra/grafana/dashboards/09_memoire_personas.json` avec un test qui
      REFUSE qu'une requête cite une famille non exposée (une famille disparue trace une courbe
      plate, pas une erreur) ; vérificateur de continuité `make mesures-continuite` qui distingue
      un trou d'un week-end sauté. QUATRIÈME DÉFAUT TROUVÉ EN MESURANT : `trace_rappel` n'est pas
      gelée pendant le rejeu — 81 lignes sur 196 étaient des doublons, la clé
      `(1773637201, 41275)` portant 0 candidat au run vivant et 22 au rejeu ; le vivier plafonnait
      donc à 30 dès le premier jour. Dédupliqué comme `moves.csv`, la courbe attendue apparaît :
      0, 6, 10, 17, 23, 28, 30, 33, 36 — croissante et jamais décroissante. Documentation
      `docs/arch/mesures-personas.md`, entrée de changelog, commandes ajoutées au CLAUDE.md
      projet. RESTE, ET C'EST LE CRITÈRE D'ACCEPTATION DU § 4 : exécuter la recette sur un vrai
      run — deux jours simulés, un arrêt, une reprise NOMMÉE, puis `make mesures-continuite`.
      L'outillage est prêt et testé (cas F1 à F7, dont « un run coupé puis repris donne les mêmes
      lignes qu'un run continu »), mais la recette elle-même demande un run et n'a pas été
      lancée. Restent aussi ouverts les points 8 et 9 des questions, qui appellent chacun leur
      propre ticket.
      TROIS PIÈGES SIGNALÉS PAR L'AUTEUR le 2026-09-16, vérifiés contre le code. (1) Déduplication
      de moves.csv : DÉJÀ EN PLACE via `sources.lire_moves`, et le compte concorde exactement —
      113 activités-jour écartées. La clé est `(personne, activité, TEMPS SIMULÉ)` et non
      `(personne, activité, jour)` : à la journée, deux décisions distinctes d'une même activité
      fusionneraient. (2) « Jour relatif au choc » : cette colonne n'est lue NULLE PART — ni par
      les mesures, ni par `choc.py` ; seul `move_logger` l'écrit. Un test le verrouille. Mais la
      vérification a révélé un piège JUMEAU, et lui mordait : `Temps simulé` est l'instant de la
      DÉCISION, `Heure de départ` celui du DÉPART, et 30 lignes sur 270 les écartent de plus d'une
      heure et demie — dont 19 exactement de 48 h, décidées le samedi 21 pour des départs reportés
      au lundi 23. Dater les journées par `Temps simulé` aurait fabriqué une journée « samedi » à
      19 trajets, un jour où rien ne roule, et amputé le lundi de 19 trajets sur 35. Le découpage
      se fait donc par `Heure de départ`, la déduplication par `Temps simulé`, et cinq tests
      verrouillent la distinction. (3) Population de dix : produite ET VERSIONNÉE — le run de
      référence vit sous `data/experiences/`, ignoré par git, donc hors git la sélection n'aurait
      été ni rejouable ni vérifiable ailleurs et son critère serait resté théorique.
      `population_5_memoire_075` n'était elle-même pas versionnée. `make personas-verifier`
      contrôle empreinte, effectif et source ; ce n'est PAS un sceau AAMAS et le dit — strates et
      marges à ± 1 point n'ont aucun sens à dix agents.
      TERMINÉ le 2026-09-21, sur décision de l'auteur : la recette du § 4 — deux jours simulés,
      un arrêt, une reprise nommée, puis `make mesures-continuite` — relève du travail courant
      d'exploitation et ne garde plus le ticket ouvert. L'OUTILLAGE EST LIVRÉ, TESTÉ ET EN
      SERVICE, vérifié contre le dépôt le 2026-09-21 : `pytest tests/test_093_mesures_jour.py
      tests/test_093_selection_personas.py tests/test_093_trace_et_series.py` donne 86 passants
      et 2 sautés, et TOUS les runs depuis le 2026-09-17 écrivent leur dossier `mesures/` — le
      dernier, `experiments/archive/2026-09-21_15_13/mesures/`, porte les cinq CSV attendus, la
      colonne `part_decidee` renseignée (0,75 au jour 1 pour 861500, l'un des dix retenus), les
      quatre compteurs d'opérations de concept, et la colonne `souvenir_choc_servi` VIDE avec
      `appariement = aucun lien`, exactement la parade du point 9. La continuité à la reprise
      reste vraie par construction — CSV réécrits en entier, séries en Gauges réglées — et par
      les cas F1 à F7 du contrat de tests ; ce qui n'a pas été fait, c'est de l'exécuter sur un
      vrai run, et cela se fera à la prochaine reprise nommée sans qu'un ticket le porte.
      LES DEUX TESTS SAUTÉS SONT ATTENDUS et disent pourquoi : le run de référence de la
      sélection est parti en archive froide avec l'ancien jeu v6 EN (ticket 098). LA
      RE-DÉRIVATION DE LA SÉLECTION SUR LE SUBSTRAT CORRIGÉ N'EST PAS CLOSE PAR CE TICKET et ne
      l'a jamais été : c'est une décision scientifique — 246 candidats au lieu de 234, et 41275,
      qui porte la démonstration du test A5bis, cesse d'être candidat — déjà consignée comme
