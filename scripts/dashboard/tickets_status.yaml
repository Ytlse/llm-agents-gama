      GAIN COLLATÉRAL : plus aucun téléchargement, le département 31 est déjà là.
      CODE LIVRÉ LE 2026-08-24, RÉGÉNÉRATION À FAIRE. (1) LE SNAP N'EXISTE PAS —
      CORRECTION : `_snap_to_polygon` est défini et appelé NULLE PART (une seule occurrence
