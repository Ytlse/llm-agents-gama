  ticket_094_alignement_de_l_article_apres_la_reecriture_du_chapitre_7:
    status: terminé
    category: Rédaction & Publication
    note: >-
      Ouvert le 2026-09-17, à la clôture de la réécriture du chapitre 7 en `brouillon v1.0`
      (formule w_m(t) retirée car implémentée nulle part, parts modales du manuscrit retirées car
      jamais mesurées, vocabulaire « Tier » retiré, épreuve de presse ramenée aux cinq événements
      du § 1.3). SIX CORRECTIONS DANS QUATRE À SEPT FICHIERS VERROUILLÉS, aucune faite : ce ticket
      constate, il n'écrit pas. DEUX DES TROIS MAJEURS ÉTAIENT DÉJÀ FAUX AVANT LA RÉÉCRITURE — le
      résumé FR et EN annonce « trente articles, 120 prédictions » quand le chapitre 1 en gèle cinq
      et vingt depuis sa v0.23 du 2026-09-17, et il promet que « l'ablation du registre de mémoire
      dit si l'inertie vient de lui » quand la position de l'auteur du 2026-09-14 est que la
      mémoire est un élément du dispositif et non l'objet d'une preuve causale isolée (le
      chapitre 1 dit « évalués pour leur robustesse »). Le chapitre 7 disait comme le résumé, ce
      qui rendait l'écart invisible ; il dit maintenant comme le chapitre 1. Écrit à trente, le
      résumé annonce 494 850 décisions là où la campagne annoncée en pèse 82 475. TROISIÈME
      MAJEUR : la fiche 7 de `fr/README.md` décrit le brouillon précédent (brouillon v0, 1 220
      mots, sections 5.1-5.3, dette « Tier ») quand le chapitre est à 1 523 mots de prose en trois
      sections et ne porte plus une occurrence de « Tier ». TROIS MINEURS, tous sur l'ordre des
      deux régimes : le chapitre passe la presse avant l'hystérésis, le § 1.4 FR et EN, `PLAN.md`
      lignes 77-80 et `README.md` ligne 58 annoncent l'inverse. AUTRE ISSUE OUVERTE : remettre le
      chapitre dans l'ordre annoncé coûte deux permutations et rend ces quatre corrections sans
      objet — l'ordre n'est pas un résultat. NE COUVRE PAS : la réécriture des chapitres 9 et 99,
      qui portent encore « Tier », la thèse attribuée à Baronchelli et la cascade retirée des
      contributions en v0.2, et que le détecteur signale au-dessus des seuils (09 à 12,8 gras/1k,
      99 à 6,9 cadratins et 13,2 gras) ; les huit points à traiter avant la première campagne du
      chapitre 7, qui vivent dans la note de travail du chapitre et appartiennent aux tickets 041,
      048, 059, 064, 077 et 079 ; l'instruction dans CITATIONS.md des deux ordres de grandeur du
      § 7.2.2 (van Exel & Rietveld 2001, Larcom et al. 2017), portés sans appel de citation faute
      de PDF au dépôt. BLOCAGE NON TECHNIQUE, donc pas de statut `bloqué` : chaque fichier visé est
      sous le verrou de `docs/paper/article/` et demande un accord explicite de l'auteur, selon la
