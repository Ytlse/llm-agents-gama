      LLM est clé par NOM de population, pas par contenu : corriger un fichier ne l'invalide
      pas, ce qui est voulu ici et serait un bug silencieux pour un trait entrant dans le prompt.
      ISSUE ATTENDUE : une DÉGRADATION de la lecture par zone, de l'ordre du 47,8 → 50,7 pt
      mesuré sur le run du 2026-08-24 — à RECALCULER sur `v7`, dont le périmètre de records
      diffère. Le composite comparable, lui, ne bouge pas. C'est le critère d'acceptation, pas
      un échec : le ticket retire un avantage que la mesure n'avait pas mérité. Un ticket de
