      TERMINÉ le 2026-09-21, accord de l'auteur donné en séance, en deux fois. LES DEUX MAJEURS DU
      RÉSUMÉ ÉTAIENT TOMBÉS D'EUX-MÊMES avant cette séance, par les réécritures du résumé : les
      trente articles et les 120 prédictions sont corrigés à cinq dès la `v1.0` du 17/09, puis la
      phrase entière des prédictions gelées quitte le résumé à la `v1.3` faute d'emplacements
      remplis (ticket 064) ; l'ablation causale du registre de mémoire sort à la `v1.2` (choc
      remplacé par la chute à vélo) puis à la `v1.5` (§ 3 du tuteur, qui énonce l'effet de presse
      et son atténuation sans promettre de preuve causale). Vérifié sur le corps des deux résumés,
      FR `v1.6` et EN : les phrases fautives ne subsistent que dans l'historique de versions en
      en-tête. ÉCRIT EN SÉANCE, quatre fichiers. `fr/README.md` : ligne 43 du tableau passée à
      `🟢 première version · brouillon v1.0`, fiche 7 refaite sur les trois sections réellement
      écrites (7.1 presse, 7.2 hystérésis, 7.3 ce que le chapitre transmet) avec son titre aligné
