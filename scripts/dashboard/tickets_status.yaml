      TRIAGE MANQUANT : ce ticket n'a pas de bloc `triage`, et R34 échoue de ce fait depuis son
      ouverture. À l'auteur de poser priorité, sûreté et intérêt AAMAS.
      Ouvert le 2026-09-21 après la campagne appariée du ticket 077. Cinq lots. A : la
      fenêtre de nouveauté cesse d'être un entier posé et se dérive de la gravité du choc
      (seuil 0,35 sur le poids, plancher 2 j, plafond 30 j) — sans quoi le chapitre 7 ne
      peut affirmer aucune durée d'extinction. B : l'enquête du soir, jamais exécutée et
