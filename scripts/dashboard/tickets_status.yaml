      DEUX DÉFAUTS TROUVÉS PAR LES TESTS PENDANT L'IMPLÉMENTATION, tous deux silencieux.
      (a) `v10` portait d'abord le bulletin enrichi : il était donc IDENTIQUE à `v10b` et
