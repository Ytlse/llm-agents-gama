      vélo vit dans bike_ownership.json (015), les deux autres n'ont aucun consommateur.
      C2 chiffré, et c'est le résultat lourd : 249 personas sur 1 021 (24,4 %) changent
      de couronne. L'erreur est UNIDIRECTIONNELLE — les 179 zones fines de Toulouse sont
      toutes à moins de 7,0 km du centre, donc le disque de 8 km ne perd aucun Toulousain
