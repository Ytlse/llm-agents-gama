      CHEMIN sans rien importer du dépôt principal (autonomie de prompt_calibration),
      câblé dans les 3 ab_*.py, sortie 7 sans jeton, --dry-run toujours passant ; la forme
      du fichier est un CONTRAT INTER-DÉPÔTS figé par un test de chaque côté. 13 tests.
      L3 la fenêtre : `WeatherDeck.load(window=)`, `survey_window_md()` lit le YAML par
      chemin et un test le compare à `population_reference.survey_window()` ; 152/365 jours ;
      `validity_report()` publie les DEUX profils (température et précipitation) sans quoi
      un tirage vide serait indistinguable d'un tirage juste ; fenêtre GELÉE au manifeste.
      L4 le bulletin : production `weather_loader` D'ABORD, puis recopie, puis test
      d'égalité — 6 cas enrichis dont neige et repli. L5 les jeux : `rewrite_weather.py`
      produit v10 / v9n / v10b ; DIFF STRICT VÉRIFIÉ sur 2 874 records × 3 variantes —
