      60-100 km → trajets longs → OTP/OSMnx plus lents, caches plus gros).

  ticket_025_dimension_zone_notee:
    status: à faire
    note: >-
      OUVERT le 2026-08-24 à la suite du ticket 021. DÉCISION DE MESURE, pas correction :
      faut-il noter la dimension « lieu de résidence » ? La cible existe dans
      `cerema_values.yaml`, mais `frames` la marque `scored: False` — comme `type_logement` —
      pour que le composite de la page soit EXACTEMENT la loss du moteur, dont les poids
      (global 1,0 · âge 0,5 · occupation 0,5 · motif 0,5 · genre 0,3 · distance 0,3) ne
      portent aucun terme de zone. La raison est bonne, et c'est le problème : sur v7/train
      le L1 de la zone vaut 43,38 contre 6 à 12 pour les dimensions notées. Le
      désajustement le plus grave du modèle est celui que personne ne note, donc celui que
      la calibration n'a jamais eu de raison de réduire.
      ⚠ AVERTISSEMENT D'IMPACT, à lire avant de demander l'implémentation. Le composite
      SAUTE : 25,69 → 38,07 (w=0,3) ou 46,32 (w=0,5), soit un déplacement de niveau 10 à 20
      fois plus grand que l'effet à lire. 728 ÉVALUATIONS STOCKÉES (601 nœuds) portent un
      composite sans ce terme et cessent d'être comparables ; les quatre lignes du registre
      `avancement.yaml` aussi, dont les gains du 013 (−4,52 et −2,17) ; le cache Shapley et
      les ablations reposent sur une loss stable et sont invalidés ; et surtout la
      CALIBRATION CHANGE D'OBJECTIF — un terme à 43 pt dominerait la loss, l'optimiseur
      sacrifierait âge/motif/distance pour gagner sur la zone. Aucun appel LLM nécessaire
      (les décisions sont stockées, c'est du re-scoring), mais rebaseline complet de tout ce
      qui a été publié.
      PRÉALABLE NON NÉGOCIABLE : le ticket 026 (population conforme au périmètre). Sur v7 la
      3ᵉ couronne pèse 15,4 % du cadrage et tient dans 18 agents / 20 communes sur 275 :
      noter cette dimension avant d'avoir une géographie complète ferait piloter la
      calibration par le bruit d'échantillonnage.
      TROIS OPTIONS. A : ajouter le terme (rebaseline complet). B : publier un
      `composite_etendu` À CÔTÉ, sans toucher au composite comparable — aucun historique
      cassé, la zone devient visible et opposable avant d'être engagée dans l'optimisation.
      C : ne rien noter et publier la limite avec son amplitude. RECOMMANDATION : B
      maintenant, A après le 026 livré et mesuré.

  ticket_022_rabattement_mode_principal:
    status: à faire
    note: >-
      OUVERT le 2026-08-24 à la suite du ticket 020, dont il traite l'axe A7. Le 020 lui
      avait donné le verdict « à publier » sur la base du chiffre GLOBAL de 1,41 pt ; la
      mesure PAR STRATE faite pour ce ticket-ci le rend nettement plus grave, donc plus
      urgent. Deux moitiés à ne pas confondre.
      M1, correction de code, latente : `move_logger._plan_transport_mode` teste la voiture
      AVANT les transports collectifs ; l'enquête fait l'inverse (760 de ses 770
      déplacements mixtes voiture+TC sont codés TC, et les 58 déplacements vélo+TC le sont
      TOUS). Zéro déplacement mal classé aujourd'hui — OTP est interrogé mode par mode,
      aucun itinéraire simulé ne mêle les deux. Bombe à retardement, pas bug actif.
      M2, effet miroir, et c'est lui qui mord : la simulation ne peut pas produire les
      déplacements que la cible compte en TC PARCE QU'ILS SONT MIXTES. Le 1,41 pt global
      masque l'essentiel. Par couronne, part de la cible TC perdue : Toulouse 3 %, 1ʳᵉ 22 %,
      2ᵉ 31 %, 3ᵉ 28 %. Par distance, c'est bien pire : 5-10 km 13 %, 10-20 km 39 %,
      20-50 km 59 %, plus de 50 km 64 %. Sur la tranche 20-50 km, près de SIX DIXIÈMES de la
      cible TC est hors d'atteinte par construction — et le modèle en est « corrigé »
      d'autant. Profil : médiane 11,1 km contre 1,9 km pour l'ensemble ; 42 % des motifs sont
      le retour au domicile, 14 % le travail fixe ; 3,1 % des personnes mobiles en font un.
      LE PIÈGE À NE PAS TOMBER DEDANS : retirer le rabattement de la cible TC serait FAUX.
      Ces voyageurs se déplacent quand même et feront, privés d'option mixte, un trajet soit
      tout voiture soit tout TC — on ne sait pas lequel. La cible atteignable est donc un
      INTERVALLE [cible − rabattement ; cible], pas un point : 2ᵉ couronne [4,8 ; 7] %,
      tranche 20-50 km [5,3 ; 13] %. Même raisonnement que la grille de sensibilité T6 du 013.
      LE POST-TRAITEMENT sert à calculer cet intervalle SUR LA POPULATION EN MAIN et non sur
      des marginales d'enquête — supposer les deux identiques est exactement ce que le 020 a
      démoli. Trait `rabattement_plausible`, propension mesurée : ensemble 3,14 % ; par
      couronne 1,76 / 3,62 / 4,61 / 3,95 % ; par motorisation 1,14 / 2,32 / 4,32 %.
      ⚠ Un ménage SANS voiture fait quand même du rabattement (1,14 % — passager, dépose,
      autopartage) : conditionner le trait à la possession serait le motif des 016/017, un
      coefficient appris sur une variable appliqué à une autre. Conditionner à la couronne ET
      à la motorisation. C'est un trait de MESURE : il ne fait rabattre personne, aucun prompt
      ne le lit, aucun cache n'est touché.
      PRÉREQUIS : le ticket 021. Sans la couronne de résidence corrigée, le conditionnement
      géographique retombe sur le classement métrique, qui déplace 66 personas de la 1ʳᵉ
      couronne (propension 3,62 %) vers Toulouse (1,76 %).
      CINQ LOTS : table de hiérarchie mesurée sur EMC² (au lieu d'une cascade de `if`) +
      test de non-régression à zéro déplacement déplacé ; `reachable_targets.json` avec les
      intervalles par strate (test : la borne haute EST la cible de cerema_values.yaml) ;
      `enrich_rabattement.py` (étage D) ; rendu de la bande dans la page de synthèse, avec et
      sans neutralisation ; écriture de la limite résiduelle.
      ⚠ SENS DU SCORE INVERSÉ PAR RAPPORT AU 021. Ici la neutralisation AMÉLIORE
      mécaniquement la note en élargissant la cible : il faut donc la justifier STRATE PAR
      STRATE et montrer qu'elle vient du rabattement mesuré. Une neutralisation qui améliore
      le score sans justification par strate est indistinguable d'un ajustement sur la cible,
      que la décision T2 du 013 interdit. `cerema_values.yaml` n'est PAS modifié — une borne
      d'atteignabilité décrit notre instrument, pas l'enquête, et les mélanger rendrait la
      cible non recoupable sur les microdonnées.
      HORS PÉRIMÈTRE : produire les itinéraires de rabattement (nouveau type d'option,
      parkings-relais localisés, cache de plans ET cache de décisions invalidés) et la chaîne
      de véhicule qui va avec (verrou de retour du 008, position des véhicules du 014).

  ticket_023_fenetre_meteo_jeux_geles:
    status: terminé
    note: >-
      OUVERT le 2026-08-24 à la suite du ticket 020, axe A5. À MENER SELON
      `docs/arch/protocole-parametre-exogene.md` — le paramètre corrigé est ici
      l'INSTRUMENT (la météo gelée dans les jeux de calibration) et non une valeur de
      production. `calibration/weather.py` tire un jour dans l'année climatique entière
      (365 j, graine `meteo_v2`) alors que les cibles auxquelles ces jeux servent à
      comparer sont des déplacements du 20/09/2022 au 18/02/2023 — 152 jours.
      ⚠ CE N'EST PAS UNE REDÉCOUVERTE. L'action A7 du ticket 008 a déjà corrigé le défaut
      GRAVE : les jeux v1 ne portaient que cinq valeurs météo, toutes sèches, et le prompt
      était calibré dans un monde sans pluie. Ce ticket ne fait que rétrécir la fenêtre.
      PRÉ-MESURE FAITE, ZÉRO APPEL LLM DÉPENSÉ (jeux v7 hors test, 2 087 enregistrements,
      les deux tirages rejoués). Traitement : T au créneau de départ 15,65 → 10,75 °C
      (−4,90), part sous la pluie 44,71 → 43,51 % (−1,20 pt), 98,90 % des enregistrements
      changent de phrase météo, 48,9 % basculent pluie/sec. TÉMOIN NUL (même année, graine
      différente, donc re-tirage seul) : ΔT −0,02 °C mais Δpluie −5,08 pt.
      DEUX CONCLUSIONS AVANT TOUT A/B. (1) La correction est THERMIQUE et elle seule : −4,90
      contre −0,02 °C, signal propre. (2) SUR LA PLUIE IL N'Y A RIEN À ANNONCER — le
      −1,20 pt du traitement est QUATRE FOIS plus petit que le −5,08 pt d'un simple
      re-tirage. C'est un critère d'acceptation : refuser d'en tirer un effet quel que soit
      le résultat de l'A/B.
      ⚠ LE TÉMOIN PLACEBO DU PROTOCOLE EST INDISPONIBLE ICI, et c'est le point de méthode du
      ticket. Le § « second piège » suppose un traitement partiel ; ici il touche 98,90 % du
      jeu, donc le canal placebo ne pèse que 1,10 % (23 enregistrements) et sa mise à
      l'échelle en √(masse_placebo/masse_traitée) l'amplifierait par 9,5. SUBSTITUT : un
      témoin nul À PLEINE MASSE — troisième jeu, même liste de 365 jours, graine placebo,
      même quantité de re-tirage (50,3 % de bascules contre 48,9 %) et aucun changement de
      distribution. Coûte un bras d'A/B de plus ; sans lui le chiffre n'est pas opposable.
      SECOND LIVRABLE, TRANSVERSE : LE JETON D'EXCLUSION, exigé par le protocole et jamais
      outillé. Raison scientifique et non hygiénique : le protocole constate lui-même qu'un Δ
      placebo de même signe que le Δ traité « signale une dérive systématique ENTRE BRAS et
      non du bruit pur », et un run concurrent en est une cause directe — il consomme le même
      quota, et si la cascade de fournisseurs bascule entre le premier et le second bras, les
      deux bras n'ont pas été évalués par le même modèle. Facteur confondu avec le
      traitement, invisible dans les agrégats. Deux autres ressources partagées : le store
      content-addressed (deux procédures sous la même clé `ds=`) et le lien
      `experiments/current` que `make run` repointe sous une archive en cours.
      LE JETON DOIT : refuser la prise si un run tourne — en RÉUTILISANT `live.run_process()`
      (pgrep launcher headless + IHM GAMA, mêmes motifs que `make run`) et non une seconde
      implémentation ; enregistrer un instantané de quota à la prise ET au relâchement via
      `live.api_health()`, ce qui permet de DÉTECTER APRÈS COUP une consommation concurrente
      qu'on n'a pas su bloquer, donc de savoir si une mesure est à jeter ; porter hôte,
      utilisateur, PID, sujet, prise, durée attendue ; signaler un jeton orphelin SANS le
      lever automatiquement ; être exigé par tous les `ab_*.py` sauf `--dry-run`.
      ⚠ LIMITE À NE PAS CACHER : un verrou LOCAL ne couvre pas la campagne génétique qui
      tourne en autonomie sur la VM Google Cloud avec son propre quota et son déclenchement
      hebdomadaire. Trois réponses possibles (liste de contrôle obligatoire à la prise,
      marqueur partagé, ou comparaison des instantanés de quota qui DÉTECTE sans prévenir) —
      et la limite doit être écrite dans la doc du jeton ET dans sa sortie, pas seulement
      dans le ticket. Un verrou distribué est un autre ticket.
      SEPT LOTS, le jeton EN PREMIER : jeton + tests ; garde-fou dans les `ab_*.py` (⚠
      `prompt_calibration` est un dépôt git autonome, le garde-fou doit marcher sans le dépôt
      principal sur le sys.path, comme `weather.py` recopie la mise en forme météo) ; la
      fenêtre lue depuis `population_reference.survey_window()` avec son contrôle de validité
      publié ; trois jeux v7 / v8 / v7n ; l'A/B à trois colonnes, modèle épinglé, effectif
      opposable = personas distincts ; archive avec les instantanés de quota comme PREUVE
      qu'aucun run concurrent n'a tourné ; porte de décision.
      PIÈGES DÉJÀ IDENTIFIÉS : la fenêtre FRANCHIT le 1er janvier (test `>= début OU <= fin`,
      jamais un intervalle simple — un test du 020 couvre déjà ce piège) ; nouvelle graine ET
      nouveau nom de jeu obligatoires, car la clé d'éval porte `ds=<nom>` et pas une empreinte
      du contenu, donc un contenu changé sous un nom stable fait servir une éval périmée sans
      que le store le détecte ; vérifier la filiation des jeux avant de parler de réplication
      (`rank ⊂ screen ⊂ train`, `val` seul indépendant, `test` fermé) ; diff du jeu et diff de
      production sur les MÊMES lignes.
      HORS PÉRIMÈTRE : la variance d'un run de simulation — l'autre moitié de l'axe A5, NON
      corrigeable par un choix de dates (27,7 % des séquences de 5 jours de la période
      d'enquête sont elles aussi sèches) ; ce ticket ne ferme PAS A5. La météo de production
      reste sur l'année entière : la simulation doit pouvoir se jouer n'importe quand, c'est
      la MESURE qui doit parler de la fenêtre de sa cible.
      ATTENDU : effet faible et thermique. Le REJET est une issue normale du protocole et
      s'archive autant que l'adoption. Ce qui justifie le ticket n'est pas l'ampleur attendue,
      c'est que la mesure sera enfin faite sur la fenêtre de sa cible.
      ⚠ 2026-08-25 — AMENDÉ, TOUJOURS À FAIRE, ZÉRO APPEL LLM DÉPENSÉ. Trois changements.
      (1) LE SUBSTRAT N'EST PLUS v7 MAIS v9, tiré du run de référence 2026-08-24_17_34
      (`docs/traces/2026-08-25_run_reference`). Pré-mesure REJOUÉE sur v9, train+val,
      1 810 enregistrements / 613 personas : T 15,57 → 10,84 °C (−4,74), témoin nul +0,26 °C.
      LA GRANDEUR THERMIQUE SE RÉPLIQUE (−4,90 sur v7) — sur des TIRAGES disjoints, cf. (b).
      (2) LA PLUIE CHANGE DE SIGNE ENTRE SUBSTRATS : −1,20 pt sur v7, +1,10 pt sur v9, pour
      un plancher de bruit de −1,16 pt sur le même v9. Un effet qui s'inverse quand on change
      de substrat, à magnitude égale au bruit, EST DU BRUIT — la preuve est maintenant faite,
      et le refus de conclure sur la pluie n'est plus une précaution mais un résultat.
      (3) RENOMMAGE OBLIGATOIRE : `v8` EST DÉJÀ PRIS par la réécriture `car_availability` du
      ticket 018 (`derived_from: v7`). Le ticket serait tombé dans son propre piège D3 — clé
      d'éval en `ds=<nom>`, éval périmée servie sans détection. Les jeux deviennent v10
      (fenêtre, graine `meteo_v3`) et v9n (témoin nul, graine `meteo_v3n`). Filiation à
      relire sur le manifeste de v9 (`ga_rank_v9`, screen 0,2807) et non sur celui de v7 :
      v9 est un jeu NEUF, pas un dérivé.
      TROISIÈME LIVRABLE AJOUTÉ LE 2026-08-25 : LE BULLETIN MÉTÉO ENRICHI — lever/coucher du
      soleil, amplitude min/max, créneaux précipitants. Forme validée. Livré DANS LA MÊME
      CAMPAGNE que la fenêtre mais porté par un QUATRIÈME BRAS (`v10b` = fenêtre + bulletin)
      pour rester séparable de la fenêtre seule. PAS DE « RISQUE DE PLUIE » EN POURCENTAGE :
      la source ne porte aucune colonne de probabilité, un chiffre serait fabriqué ; seuls
      les créneaux dont le CODE météo est précipitant sont annoncés. ORDRE NON NÉGOCIABLE :
      d'abord `weather_loader` en production, PUIS la recopie dans `calibration/weather.py`,
      PUIS le test d'égalité des deux sorties — sinon on calibre un prompt que la simulation
      ne peut pas produire. TROIS PIÈGES CHIFFRÉS SUR LA SOURCE : 25 jours sur 365 portent
      des mm SANS aucun créneau précipitant (repli obligatoire sur la formulation actuelle,
      la forme enrichie AJOUTE et n'enlève jamais) ; 30 créneaux sur 1 460 sortent de
      [MIN, MAX] jusqu'à 3 °C, tous de nuit (bornes du jour élargies aux créneaux lus, source
      inchangée) ; la neige n'apparaît QU'UN jour sur 365, branche conservée.
      ⚠ DEUX DÉFAUTS DE LA PRÉ-MESURE D'ORIGINE, TROUVÉS EN RECOUPANT. (a) ELLE COMPTAIT
      DOUBLE : les « 2 087 enregistrements v7 hors test » additionnaient train+val+screen+rank
      alors que screen ⊂ train et rank ⊂ screen — 519 lignes comptées deux fois (24,9 %),
      toutes issues de train. Décompte juste pour v7 : 1 568. La lecture ne prend désormais
      que train+val, et c'est un critère d'acceptation. Le défaut sur-pondère train, il ne
      renverse pas le −4,90 °C. (b) « SUBSTRATS INDÉPENDANTS » ÉTAIT FAUX : v7 et v9 partagent
      89 % de leurs personas (557 des 613 de v9, Jaccard 0,891). Ce qui EST disjoint, c'est
      l'unité mesurée — la clé de tirage (agent_id, entry), commune à 1,8 % seulement (1,0 %
      avec l'heure) : 99 % des enregistrements de v9 lisent une météo que la pré-mesure v7
      n'avait jamais lue. La réplication vaut pour la GRANDEUR, pas pour la POPULATION, et le
      mot « indépendant » est banni du ticket sans recoupement chiffré.
      HUIT LOTS désormais (le bulletin s'intercale en lot 4), le jeton toujours EN PREMIER.
      ⚠ 2026-08-25 — LOTS 1 À 5 LIVRÉS, ZÉRO APPEL LLM DÉPENSÉ. L1 le jeton :
      `scripts/protocol_lock.py` + make protocol-{status,lock,unlock} ; refuse la prise si
      `live.run_process().active` (sonde RÉUTILISÉE, pas réimplémentée) ou si
      controller/worker tournent ; exige SUBJECT et CLOUD_PAUSED=1 (liste de contrôle du
      § cloud, axe D4) ; PID enregistré = `os.getsid(0)`, le MENEUR DE SESSION, car
      `make protocol-lock` se termine aussitôt et son PID paraîtrait orphelin dans la
      seconde ; orphelin SIGNALÉ en [ALARME] et jamais levé sans STEAL=1 ; deux instantanés
      de quota via `live.api_health()`, archivés au relâchement avec le delta de
