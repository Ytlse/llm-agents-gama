      livré dépasse le périmètre mesuré, le dire et le mesurer.

  ticket_020_perimetre_population_cerema:
    status: terminé
    note: >-
      OUVERT le 2026-08-24 sur demande utilisateur : s'assurer qu'on travaille bien sur
      la même base que l'enquête avant de juger un résultat. Travaux d'INSTRUCTION —
      inventaire chiffré des écarts de périmètre et de définition entre la population
      EMC²/CEREMA et la population simulée, avec un verdict écrit par axe (corriger /
      neutraliser dans le scoring / publier comme limite). Neuf axes à mesurer ; trois
      constats sont DÉJÀ établis à la lecture du dépôt : (C1) les caractéristiques de la
      population enquêtée existent dans `population_emc2_2023.yaml` mais AUCUN code ne
      lit ce fichier et l'essentiel dort en commentaire — méthodologie, territoire,
      totaux de population, équipement vélo ; (C2) `geo_reference.py` classe les
      couronnes par DISTANCE à l'hypercentre (8/20/40 km) là où l'enquête découpe par
      LISTE DE COMMUNES (1/68/109/275), alors que son commentaire annonce l'inverse — or
      la cible voiture vaut 31 % à Toulouse contre 64 % en 1ʳᵉ couronne, et depuis le
      013 ce classement FACTURE le temps terminal ; (C3) l'enquête couvre le
      20/09/2022-18/02/2023 hors vacances scolaires, quand les jeux gelés v2 tirent la
      météo dans l'année entière — l'écart porte sur le mode le plus sensible à la
      météo, le vélo. Passe AVANT la reprise des tickets 004 et 009, mis en veille le
      même jour.
      ⚠ 2026-08-24 — INSTRUIT ET RENDU. Les neuf axes ont chacun une valeur enquête, une
      valeur simulée et un verdict : 2 conformes (A1 âge, A6 jour de semaine), 2 À
      CORRIGER (A2 couronnes, A4 hors périmètre), 5 À PUBLIER comme limites (A3, A5, A7,
      A8, A9). Aucun axe non mesuré. Les trois constats sont confirmés et chiffrés.
      C1 levé : `population_emc2_2023.yaml` est actif, chargé par
      `llm_module/core/population_reference.py` et couvert par 17 tests ; chacune de ses
