      le module vit dans son dépôt autonome `prompt_calibration/`. Rien ne bloque —
      décision de priorité : le gain de la calibration de prompt (3,67 de composite)
      est du même ordre que celui d'un seul paramètre de POPULATION en amont (2,17
      pour le calibre du temps terminal, ticket 013 — chiffre révisé le 2026-08-24,
