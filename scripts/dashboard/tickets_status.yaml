  ticket_056_audit_et_reflexion_resultats_prompt_expert:
    status: abandonné
    category: Expériences & Cognition
    note: >-
      Ouvert le 2026-09-13 (Task 13 de suivi_actions_publication.md). Tâche de réflexion critique et d'audit
      méthodologique « ceinture et bretelles » sur le saut spectaculaire du prompt expert v2 (composite 5.35,
      métrique 2 à 8.09) : vérification de la chaîne de calcul des métriques, traque des fuites de données,
      analyse de la régression v3 (9.32) et validation sur v4 avant toute conclusion pour le Chapitre 6.
      CE QUE LE 2026-09-15 A ÉTABLI, et qui répond à une partie de l'audit sans le clore : le
      composite 5,35 du bras expgem38v2 était calculé sur 274 lignes de `moves.csv` sur 3 161 —
      arrêt forcé, reprise à froid, journal non réécrit, scoreur sans garde. Le ticket 081 a livré
      le garde-fou et la régénération ; rescoré, le bras vaut 6,157, confirmé au centième par une
      reconstitution manuelle indépendante (6,17). Le chapitre 6 publie désormais quatre lectures
      avec leurs intervalles appariés, tous contenant zéro. CE QUI RESTE DE L'AUDIT PROPREMENT DIT
      : le diff textuel v2/v3/v4 et l'explication de la non-monotonie, que ni le 081 ni le 080
      n'ont instruite — mais elle porte sur des prompts (pe06/07/08) déclarés inadmissibles pour
      H0 par le 080, ayant été édités au vu des scores de la cohorte. À L'AUTEUR DE DIRE si cela
      suffit à clore le ticket.
      ⚠ 2026-09-16 : le chiffre que cet audit poursuit change encore de substrat. Le jeu de mesure
      a été refait à la bonne date (ticket 088) et les deux conditions calibrées du chapitre 6
      sont restées sur l'ANCIEN jeu, quand les quatre méthodes auxquelles elles se comparent sont
      sur le nouveau : les huit différences appariées du chapitre ne sont plus appariées du tout,
      et le tableau est marqué comme tel plutôt que recalculé à moitié. L'audit de la
      non-monotonie v2/v3/v4 ne peut donc pas conclure avant le rejeu des neuf bras LLM.
      ⛔ DÉPEND DE : 088 — il poursuit un composite dont les deux conditions calibrées sont restées
      sur l'ancien jeu quand leurs comparants sont sur le nouveau ; aucune conclusion n'est
      possible avant le rejeu des neuf bras LLM. Statut passé à `bloqué` le 2026-09-16 : le ticket
      ne peut pas être ENTIÈREMENT fait avant la fin de ce ou ces tickets. DÉBLOQUÉ le 2026-09-17 : le ticket 088 est terminé, les deux conditions calibrées sont sur le jeu corrigé — prompt expert (pe05) à 4,86 de composite pour gemini-3.5.
      ABANDONNÉ le 2026-09-21, décision de l'auteur : le ticket est obsolète. Les deux volets
      qui portaient un risque réel ont été traités ailleurs — la chaîne de mesure par le 081
      (garde-fou du scoreur, bras rescoré à 6,157, reconstitution manuelle à 6,17) et le substrat
      par le 088 (jeu de mesure refait à la bonne date, seules les expériences suffixées `_c_`
      sont publiables). Ce qui restait de l'audit proprement dit, le diff textuel v2/v3/v4 et
      l'explication de la non-monotonie, porte sur des prompts (pe06/07/08) que le 080 a déclarés
      inadmissibles pour H0, ayant été édités au vu des scores de la cohorte : il n'y a plus de
      chiffre publiable derrière ce diff. Le chapitre 6 est désormais porté par l'ablation du
      prompt répliquée sur trois modèles sur le jeu corrigé, pas par le composite de 5,3452 qui
      avait déclenché ce ticket. Bloc `triage` retiré : un ticket clos ne se trie pas.

  ticket_057_audit_et_reflexion_double_lecture_tabulaire:
    status: terminé
    category: Modélisation Statistique
    note: >-
      CLOS le 2026-09-16 par l'auteur, les cinq critères remplis. Rapport, scripts rejouables et
      données : docs/traces/2026-09-16_08-51_ticket057_audit_double_lecture/. Baseline v6.
      CE QUE L'AUDIT ÉTABLIT. (1) Le runner applique la règle qu'il annonce : une seule
      implémentation partagée GAMA / sans simulateur, invariant vérifié sur les 894 personnes et
      non sur 30 parcours, 75 tests verts. Fait de mécanique non écrit jusque-là : TOUT retour
      forcé devient un choix unique — le verrou ne restreint pas le choix, il le supprime. (2)
      Aucun effet de sélection : apparié sur (person_id, activity_id), les deux bras prennent
      EXACTEMENT les mêmes décisions sur les déplacements que la chaîne laisse libres, sur les
      quatre témoins. (3) La règle est conforme au terrain : dans EMC² Toulouse 2023, 98,5 % des
      retours au domicile avec voiture sortie se font en voiture, et ces retours pèsent 18,2 % des
      déplacements contre 18,0 % dans la cohorte, sans ajustement. (4) Le blocage de SORTIE, lui,
      joue quatre fois plus souvent que dans la réalité — 18,0 % contre 4,2 % — et c'est là que se
      mesure le coût de la non-anticipation, directement, sans passer par l'écart entre lectures.
      Il s'ordonne par décideur : 13,8-15,4 % prompt expert, 17,7-18,0 % familles tabulaires,
      18,7-18,9 % prompt minimal, 30,9 % plancher aléatoire — l'agent calibré se coince moins que
      les tabulaires, parce qu'il lit l'agenda de sa journée que le décideur `modele` ignore.
      CE QUE L'AUDIT A TROUVÉ AU-DELÀ DE SON PROGRAMME, et qui explique le saut : le PÉRIMÈTRE DE
      SCORE. La coupe au premier jour simulé retirait 866 décisions sur 3 299 pour zéro doublon,
      dont 797 le départ du matin, que `jeu.py` datait du lendemain parce que l'activité « home »
      d'origine enjambe minuit. Le périmètre scoré montait à 56,9 % de retours contre 43,8 % sur la
      journée entière et 39,0 % dans l'enquête. Corrigé (règle iii, spec
      specs/ticket_057/perimetre_de_score.md, 9 tests) : la coupe ne s'applique plus qu'aux
      journaux qui portent des répétitions, un invariant garantit qu'un déplacement compte une
      fois — vérifié sur les 25 exécutions, zéro doublon — et 25 exécutions ont été rescorées hors
      ligne, sans un appel de modèle. L'écart entre les deux lectures perd les deux tiers de son
      ampleur (lgbm +5,64 → +2,24) et l'écart entre bras chaîne / hors chaîne disparaît.
      QUATRE BRAS `noret` joués le 2026-09-16 (chaîne active, verrou de retour coupé) : l'écart
      entre lectures tombe à ±0,10 sur les quatre témoins, ce qui prouve qu'il vient ENTIÈREMENT du
      verrou de retour ; le verrou de sortie seul coûte le composite, le verrou de retour le rend.
      PARTAGE DE VÉHICULE dans le ménage : chiffré à 0,07 point de composite, dix-huit fois sous la
      résolution de l'instrument — écarté par l'auteur, aucun run rejoué de ce fait.
      RELIQUAT DU 086 : objection 1 classée avec ses quatre écarts assumés et documentés,
      objections 2 et 3 abandonnées par l'auteur.
      CONSÉQUENCES SORTIES DU TICKET : chapitres 4 et 6 repris le même jour sur accord explicite
      (18 passages, dont un intervalle apparié qui ne contient plus zéro — pe04 − lgbm vaut
      +1,15 [+0,18 ; +2,26]) ; la correction de `jeu.py` entraîne un jeu à re-préparer et un rejeu
      complet, portés par le ticket 088 ; la filière de `number_of_cars` part au ticket 087.

  ticket_058_perimetre_et_methode_audit_unitaire:
    status: en cours
    category: Modélisation Statistique
    note: >-
      Ouvert le 2026-09-13 (Task 15 de suivi_actions_publication.md). Clarifier le périmètre et la méthodologie
      de l'audit unitaire à parité des 21 variables (§ 6.3) : cohérence de la mesure sur la cohorte scellée v5
      (3 299 trajets) vs sous-échantillon d'enquête réelle (1 000 trajets) et harmonisation de la section 6.3.
      AVANCE DU 2026-09-15 : le périmètre est TRANCHÉ et écrit. L'exactitude ne se mesure pas sur
      la cohorte scellée — synthétique, aucune vérité individuelle — mais sur les déplacements de
      l'enquête, offre d'itinéraires reconstruite par les mêmes moteurs, tous les décideurs joués
      sur cette même offre. C'est le § 5.4 du chapitre 5, publié le même jour, qui déclare aussi
      ses deux écarts au terrain (centroïdes de zone fine, journée non reconstituable). Les deux
      échelles sont dites non commensurables : composite sur la cohorte, exactitude sur l'enquête.
      RESTE : le protocole de mesure lui-même (tirage de l'échantillon, reconstruction de l'offre,
      métriques du § 4.1) et l'harmonisation du § 6.3.
      DEUX PRÉALABLES LIVRÉS le 2026-09-16, et l'audit a de quoi partir. (1) LES ZONES OD DES
      DÉPLACEMENTS ENQUÊTÉS SONT EXPORTABLES : `export_trip_od_zones.py` les reconstruit depuis
      les microdonnées et les joint au jeu de choix modal sur ses quatre clés — 13 045 appariés
      sur 13 045, tous dans la couche des 785 zones fines, et `mode_choice_test_od.csv` porte en
      plus les heures déclarées à la minute et la date du jour décrit. Sans elles il n'y avait ni
      origine ni destination à router, donc aucune offre à proposer à un décideur. (2) LE LIBELLÉ
      DE ZONE SE RECONSTRUIT : `zone_label.py` recompose la phrase `destination_zone` depuis la
      grille de densité INSEE et les aires d'attraction, et la réplication est CONTRÔLÉE — 997
      libellés sur 997 comparables identiques au caractère près sur le domicile des personas de la
      v6. PÉRIMÈTRE RESSERRÉ : 3 413 déplacements sur 13 045 (26,2 %) ont la même zone à l'origine
      et à la destination, donc rien à router ; l'audit portera sur les 9 632 inter-zones, et le
      biais que cela introduit — les courts trajets sont surtout de la marche — se chiffre au
      tirage. UN ÉCART DÉCLARÉ TOMBE : on sait quel jour chaque enquêté a décrit (du lundi au
      vendredi pour 20 462 personnes sur 20 463), donc les conditions du jour seront celles du
      JOUR RÉEL et non tirées dans la fenêtre de recueil — ⚠ le § 5.4 du chapitre 5 déclare encore
      l'inverse. TROUVÉ AU PASSAGE : trois personas de la cohorte scellée lisent « an unknown area
      in an unknown municipality » alors que leur code INSEE désigne Toulouse ou Bazus — géocodage
      inverse muet à la génération.

      AVANCE DU 2026-09-18 : le premier bras LLM de l'audit unitaire est allé au bout. Le palier
      minimal (`gemini-3.5-flash-lite` + `prompt_minimal_02` sur `enquete_058_test_20260316`) est
      terminé — 9 689 décisions, 4 707 sollicitations, 183 minutes, deux renouvellements de quota
      traversés sans erreur — à 64,8 % d'exactitude pondérée, sous le plancher « durée minimale »
      (68,1 %), mais seul décideur à tenir ensemble vélo (24,1 %), transports collectifs (60,0 %)
      et marche (44,2 %) ; la forêt aléatoire, jouée côté hôte, se place troisième à 69,9 %. Les
      sept témoins déterministes sont tous terminés sur ce jeu. LE SECOND BRAS TOURNE : `proexp05`
      sur le même jeu, exécution 2026-09-18_11_20_47, lancée après une exécution arrêtée à 171
      décisions le matin. Ce sont ces deux bras qui remplissent les deux [xx] du § 6.4 attendus
      par le ticket 080.
    triage:
      faisabilite: 4
      surete: 5
      jeux_de_test: false
      motif: >-
        Arbitrage de périmètre (cohorte v5, sous-échantillon d'enquête, ou les deux) puis réécriture
        du § 6.3 pour éliminer les anachronismes de la v1.6. Aucun code.
        AAMAS ⭐⭐⭐⭐⭐ (5/5) — c'est le SEUL dispositif du papier où l'exactitude d'un agent est
        définie — la cohorte scellée n'a pas de vérité individuelle — et il répond à l'objection
        de fond du relecteur : un modèle tabulaire n'est jugé que chez lui.
      date: '2026-09-14'
      aamas: 5
  ticket_059_etape_3b_presse_locale_et_predictions_preenregistrees:
    status: à faire
    category: Expériences & Cognition
    note: >-
      Ouvert le 2026-09-13 (Tasks 21 & 22 de suivi_actions_publication.md). Cadrage méthodologique et rédactionnel
      de l'Étape 3b pour le Chapitre 7 : protocole expérimental à 5 conditions (nominal, brut, paraphrase sans indice,
      placebo, oracle encodé), corpus gelé de 30 scénarios (Top 5 majeur), métrique de concordance directionnelle
      (taux de signe et kappa pondéré) et critères stricts de réfutation de H3.
      ÉLARGI LE 2026-09-21 — le ticket portait une réponse INSTANTANÉE à un texte, mémoire
      éteinte. Il porte désormais TROIS ÉTAGES : (1) la réponse du jour, cinq conditions, cohorte
      entière, hors simulateur — ne dépend de RIEN et peut démarrer aujourd'hui ; (2) la
      PERSISTANCE du souvenir de lecture, en run GAMA, qui attend les expériences E1 à E3 du 095
      (pas son code, en service) ; (3) la DIFFUSION dans le foyer, qui attend les lots 1 à 3 du
      078, lequel n'a aucun code. Constat central de l'élargissement : un article ne fait subir
      AUCUN retard, donc gravité 0,00 et souvenir servi ~3 jours — un canal `information` distinct
      du canal `choc` du 079 est à écrire, avec une gravité CONSTANTE identique aux cinq articles
      (0,70) pour que les écarts viennent du contenu et non du réglage, plus deux bras de
      sensibilité. Second constat : en l'état, un article NE se diffuse PAS dans le foyer — la
      règle R1 du 078 (`observations >= 1`) bloque l'ouï-dire, et il faut que le lecteur ait
      vérifié par un déplacement réel pour que sa croyance reparte. C'est une prédiction de DÉLAI,
      falsifiable, et c'est l'intérêt de l'étage 3. Plan d'expérience : UN SEUL RUN à cinq blocs de
      foyers disjoints (le foyer est le seul canal inter-agents, donc aucun effet ne traverse) plus
      un bloc témoin interne. REVU LE JOUR MÊME après retour de l'auteur — le run à cinq blocs est
      ÉCARTÉ comme mode de travail (indébogable, et la facture d'appels se paie à chaque itération)
      et redevient la FORME FINALE, jouée une fois quand plus rien n'itère. Le mode de travail est
      un article à la fois, sur un escalier dont chaque marche décide de la suivante. Chiffrage :
      le gros poste n'est pas les runs GAMA mais l'ÉTAGE 1 — 52 784 requêtes sur la cohorte entière
      et cinq articles, soit 26 jours de campagne au plafond. D'où E1-a (200 déplacements, un
      article, C1+C2) à 400 requêtes et E1-b (C3+C4) à 400 : le premier chiffre du chapitre 7
      devient atteignable pour 800 requêtes. Runs GAMA : P0 la plomberie, 4 agents, 12 jours,
      ~300 requêtes, OBLIGATOIRE ; P1 le mécanisme, 20 agents en foyers de taille 2, 25 jours,
      ~3 100 ; P2 la mesure, un article, ~55 agents, ~10 200 ; P3 la campagne en blocs, ~43 000.
      L'essentiel de la mise au point ne consomme AUCUN appel : le 079 a livré son canal avec
      34 tests et zéro run. Vivier mesuré dans la v6 : 217 foyers multi-membres tous mobiles,
      590 agents, dont 122 de taille 2 et 89 mêlant abonné TC et non-abonné — le vivier n'est
      jamais le facteur limitant, le quota l'est. SEPT LOTS CODABLES DÈS MAINTENANT sans attendre le 095 :
      corpus textuel `articles_txt/` avec test de lexique pour C3, grille des vingt signes gelée
      (trois cellules ambiguës à trancher), script d'injection de l'étage 1 (= le 064), canal
      `llm/informations.py`, sixième CSV `presse_par_jour.csv`, population de foyers, figures F1 à
      F3. GO DE L'AUTEUR LE 2026-09-21 sur ces sept lots ; le plan d'architecture détaillé et le
      contrat de tests passent d'abord (plan-first). Statut INCHANGÉ (`à faire`) tant qu'aucune
      ligne n'est écrite ; onze questions attendent l'auteur au § 13 du ticket et dans
      specs/ticket_059/questions.md, dont quatre bloquent le lot 4.

    triage:
      faisabilite: 3
      surete: 5
      jeux_de_test: false
      motif: >-
        Protocole à cinq conditions clairement posé, corpus de 30 scénarios pré-enregistré et gelé
        avant campagne. Cadrage et rédaction seulement : aucun code de production n'est touché.
        AAMAS ⭐⭐⭐⭐⭐ (5/5) — il gèle le corpus des 30 articles et des 120 prédictions
        directionnelles que le résumé annonce ; sans ce gel avant campagne, la prédiction n'est
        plus pré-enregistrée.
      date: '2026-09-14'
      aamas: 5
  ticket_060_formalisation_architecture_hybride_et_perspectives:
