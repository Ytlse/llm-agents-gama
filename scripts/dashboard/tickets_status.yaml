      instances, jamais force_provider, binding dans identite_run. D : `utils/filiation.py`,
      RUN_PARENT + CHAMPS_LIBRES, amorçage depuis le point de reprise du parent et recette de
      reproduction au dégel. E : `utils/modeles.py`, provider+modèle sur décision, réflexion
      STM, auto-réflexion et enquête.
      DEUX DÉFAUTS DU TICKET CORRIGÉS AU PASSAGE, à arbitrer avant de lancer E4 : la gravité
      étant plafonnée à 1,0 par `borne_0_1`, la durée maximale qu'elle produit vaut 20,58 j —
