      à l'octet). TROIS écritures distinctes : couronne / `hors périmètre` / AUCUN trait sans
      coordonnées — écrire « dehors » de qui on ne sait rien serait une affirmation ; et la
      commune ne s'invente jamais. `--check` = couverture + ACCORD code ↔ géométrie +
      modalités + taux hors périmètre ; l'écart au cadrage sort en CODE 4, informatif (axe A9,
      le tirage), traduit en succès par le Makefile comme par le notebook. `--out` protège les
      populations épinglées : sha256 de l'archive 2026-08-19_14_36 vérifié inchangé après une
      passe. Recoupement indépendant du 020 au passage : 249 personas (24,4 %) sur la
      population de référence et 178 (19,1 %) sur celle des jeux gelés divergent du classement
      métrique — exactement les chiffres publiés. 16 tests. 3 : FAIT le 2026-08-24 — `move_logger`
      recopie le trait et son IMPORT de `residence_zone` a DISPARU, ce qu'un test exige
      (`not hasattr(move_logger, "residence_zone")`) : le repli à la distance est impossible,
      pas déconseillé. La colonne accepte `hors périmètre` (déclaré dans `RESIDENCE_VALUES`)
      et ramène à vide toute valeur hors référentiel. Docstring de `residence_zone` réécrit :
      classement MÉTRIQUE du temps terminal, sa prétention EMC² dite fausse avec son coût, la
      divergence chiffrée, et l'alignement présenté comme un RÉ-EXPORT de ressource. Les deux
      tests qui encodaient l'ancienne décision sont inversés — leur inversion EST la
      décision. 253 tests verts côté llm-agents. 4 : FAIT le 2026-08-24 — `frames.normalize_place` rend
      `(clé, référencée)` avec la clé ASCII `hors_perimetre` (la sortie brute donnait
      `hors_périmètre`, qui ne joignait rien et disparaissait), et `dimension_detail` publie une
      ligne « — hors référentiel — » portant la MASSE EXCLUE : « exclu des cibles » ne doit pas
      se confondre avec « inexistant ». Le geste vaut aussi pour « Autres » du logement (test du
      019 étendu). Mesure `make couronne-v7` : ZÉRO appel LLM, décisions déjà en base
      (ab_chaine.db, node c00b4318b3, T=0), splits train+val = 2 197 décisions / 569 agents.
      RÉSULTAT : +2,11 pt de L1 par zone (41,26 → 43,38), les QUATRE strates dégradées et une
      3ᵉ couronne qui APPARAÎT à 41,88. ⚠ PIÈGE ÉVITÉ : pondérer par la MASSE observée rend
      −0,26 pt, une fausse amélioration — le reclassement sort 47 agents de la strate la pire
      (Toulouse, L1 59), donc la moyenne baisse par changement de mélange alors que chaque
      strate empire. Une moyenne pondérée par la masse n'est pas une règle de score valide pour
      comparer deux CLASSEMENTS ; les poids publiés sont ceux du cadrage, identiques des deux
      côtés. C'est le critère « une correction qui améliore le score est suspect » qui a attrapé
      le cas. Trace `docs/traces/2026-08-24_couronne_v7/` + ligne `couronne_residence` au
      registre `avancement.yaml`. 5 : ÉCRIT LE 2026-08-24, NON REJOUÉ — trait posé dans
      `eqasim-toulouse/synthesis/population/llm_agents.py` sur `home_location` APRÈS le snap
      OTP, donc sur les coordonnées que `identity.home` portera (les mêmes que lit le journal) ;
      le poser en étage A (`enriched.py`, avant snap) l'aurait fait diverger pour tout persona
      snappé. Demande `docker compose build eqasim` + régénération : tant que ce n'est pas fait,
      une génération neuve n'a PAS le trait et doit passer par `make residence-zone`. Même règle
      que le lot 4 du 015 : ne pas le dire livré.
      PIÈGES À CONNAÎTRE. (1) Les 45 hors-périmètre ne se trahissent pas par leurs distances :
      5,15 km de parcours moyen contre 4,92 km pour les résidents du périmètre. Leur exclusion
      ne déplacera presque pas l'agrégat, et il NE FAUT PAS en conclure au non-effet — tout le
      dommage est concentré dans le stratum 3ᵉ couronne dont ils forment 76 %. C'est exactement
      le piège d'A2, qui ne bouge la cible moyenne que de 1,7 pt tout en déplaçant un quart de
      la population. (2) Ni le run courant ni `v7` n'exposent A4 : populations bbox-filtrées,
      aucun domicile hors couche. A4 est latent pour les runs, actif pour la population de
      référence — un `--check` qui passe sur le run ne prouve rien. (3) Le cache de décisions
      LLM est clé par NOM de population, pas par contenu : corriger un fichier ne l'invalide
      pas, ce qui est voulu ici et serait un bug silencieux pour un trait entrant dans le prompt.
      ISSUE ATTENDUE : une DÉGRADATION de la lecture par zone, de l'ordre du 47,8 → 50,7 pt
      mesuré sur le run du 2026-08-24 — à RECALCULER sur `v7`, dont le périmètre de records
      diffère. Le composite comparable, lui, ne bouge pas. C'est le critère d'acceptation, pas
      un échec : le ticket retire un avantage que la mesure n'avait pas mérité. Un ticket de
      correction qui améliore le score est suspect.

  ticket_026_population_conforme_perimetre:
    status: en cours
    note: >-
      OUVERT le 2026-08-24. CORRECTION DE BASSIN : le cadre de tirage n'est pas le périmètre
      d'enquête, et c'est la cause racine de l'axe A9 du ticket 020. « Conforme » = le CADRE
      est exactement les 453 communes (donc les parts par couronne convergent vers
      36,4/34,1/14,2/15,4), PAS « chaque commune porte un persona » : à 1 000 agents pour
      1,32 M d'habitants, la plupart des 275 communes de 3ᵉ couronne resteront vides et c'est
      correct.
      CONSTAT MESURÉ. Le périmètre couvre 453 communes sur SIX départements (31:346, 32:38,
      81:27, 82:22, 09:10, 11:10) — VÉRIFIÉ par trois chemins : recompte depuis le shapefile
      source, surface 5 428 km² contre 5 400 km² annoncés par le rapport auat, et le rapport
      lui-même (453 communes, 1,4 M hab., 1,32 M de 5 ans et +, découpage 1/68/109/275 — la
      couche donne 1/69/108/275, écart d'une commune déjà documenté). Le rapport affiche
      « Département 31 » comme COUCHE DE CARTE et comme périmètre d'ANALYSE, pas comme le
      périmètre d'enquête. La frange hors 31 fait 107 communes, 25 % de la surface, dont 100
      communes en 3ᵉ couronne. Et elle n'est pas sous-représentée mais ABSENTE : les 976
      personas de la population de référence dont la commune est connue sont TOUS en 31. Ce qu'on génère : 111 communes sur 453 (24,5 %), 290/785
      zones fines, et un déficit STRUCTURÉ parce que le filtre est un rectangle — 3ᵉ couronne
      20 communes sur 275, 54 personas pour 15,4 % du cadrage. La population de référence, en
      plus, porte 45 domiciles HORS périmètre : non conforme dans les deux sens.
      ⚠ VERSION VOLONTAIREMENT PARTIELLE (décision du 2026-08-24) : le cadre de tirage devient
      les 346 communes du périmètre situées EN HAUTE-GARONNE, pas les 453. Les 107 communes des
      cinq autres départements (dont 100 en 3ᵉ couronne) demandent +10 Go de BD TOPO/BAN et
