  ticket_032_lts_velo_propositions_gama:
    status: amélioration
    category: Données & Population
    note: >-
      SPEC rédigée le 2026-09-03, RESSERRÉE ce jour. Post-traite les itinéraires vélo OSMnx pour
      exposer à l'agent LLM un PROFIL DE SÉCURITÉ DESCRIPTIF (bloc bike_safety, nom propre au mode)
      dérivé des tags cycleway/highway/maxspeed, fallback vitesse par highway. Choix de rigueur :
      PAS de LTS normé ni de score synthétique (le graphe n'a ni voies, ni stationnement, ni ADT) —
      des faits OSM agrégés par distance (protected/calm/urban_pct, exposed_m, classified_pct) ;
      worst_lts SUPPRIMÉ (« max pondéré distance » était auto-contradictoire) et remplacé par
      exposed_m en maillon faible SANS seuil. NON routage : profil extrait dans _route_sync sur le
      chemin déjà calculé. Profil TRANSITOIRE : il ne vit que jusqu'au rendu texte de l'option, pas
      de remontée GAMA (déterministe, donc recalculable hors ligne). Pose la plomberie réutilisée par
      le ticket 033. Cache : le profil voyage dans le dict retour (aucun versionnement, ne PAS bumper
      routing_version) ; toute la chaîne est déjà transparente (réplica /route, client HTTP,
      store/lookup, peupleur en masse) SAUF le CHEMIN DE CACHE HIT, qui déballe deux clés nommées et
      jetterait le profil en silence — corrigé par un paramètre additif route_extras sur
      _make_travel_plan (portant le dict retour complet ; défaut None, donc les 4 appels de
      test_terminal_time.py restent intacts et le 033 n'ajoute aucune plomberie). Migration = SÉQUENCE
      ORDONNÉE en 3 temps : reconstruire le graphe (volume partagé, une fois) → purger → repeupler
      (étape 6 du notebook). L'ordre est contraignant : repeupler avant de reconstruire le graphe
      donne un cache peuplé uniformément SANS profil, silencieusement. La purge est obligatoire non
      pour les durées (identiques) mais parce que le peupleur est idempotent par couverture : sans
      purge il saute les entrées existantes, qui survivent sans profil → cache durablement mixte,
      biais silencieux dans la mesure de calibration. CORRECTIONS DU 2026-09-03 (vérifiées dans le
      code) : (1) éditer le texte des options NE PURGE PAS le cache de décisions LLM — le texte
      n'entre pas dans _make_state_hash (llm/cache.py:207) et active_prompt_checksum ne hache que
      les prompts système (manager.py:164) ; correctif retenu = ÉTENDRE le checksum au gabarit
      travel_plan_describe_v2.j2, et NE PAS bumper data_version() qui invaliderait aussi 601 Mo de
      cache OTP (otp_persistent_cache.py:71). (2) Il n'y a QU'UN SEUL pickle pour les 3 modes
      (osmnx_direct.py:394) : reconstruire, c'est reconstruire walk+bike+drive. (3) La migration
      commence par docker compose build osmnx1 osmnx2 (config montée en ro, code figé dans l'image,
      incident park_base). (4) L'assertion de démarrage va dans le lifespan de osmnx_server.py:47,
      PAS dans osmnx_direct.warmup() qui est du code mort. (5) La purge de la LTM est un non-sujet
      (LTM par run, vierge sans CONT=1). (6) NE PAS utiliser make purge_cache : il détruit
      data/population/*.json et ne supprime aucun .db. PRÉREQUIS BLOQUANT : le peupleur et le
      runtime écrivent dans deux fichiers de cache OSMnx différents (29 Mo vs 20 Ko mesurés) — à
      aligner avant toute repopulation (~83 500 routes, ~2 h 30, MAX_WORKERS=6 et non 12).
      DIFFÉRÉ : attend la fin du ticket 031 partie 2 (bascule vers le graphe polygone) ; signal GO
      utilisateur. Spec testable : specs/profil_securite_velo.md (R16 = aller-retour cache préserve
      le profil).

    triage:
      faisabilite: 3
      surete: 2
      jeux_de_test: true
      motif: >-
        Spécification solide et honnête sur ce qu'elle ne mesure pas. Mais `cycleway` n'est pas retenu
        par défaut : il faut étendre les tags et RECONSTRUIRE `graphs_*.pkl`. Le profil s'ajoute
        au texte de l'option, donc le prompt servi change et le jeu gelé avec lui.
        AAMAS ⭐⭐ (2/5) — le profil de sécurité change le TEXTE d'une option, pas ce que le
        papier mesure ; il nourrirait au mieux les limites du chapitre 8.
      date: '2026-09-14'
      aamas: 2
  ticket_033_profil_confort_pieton_propositions_gama:
    status: amélioration
    category: Données & Population
    note: >-
