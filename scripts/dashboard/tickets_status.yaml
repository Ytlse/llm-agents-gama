  ticket_015_acces_velo_progedo:
    status: en cours
    note: >-
      Lots 1 à 3 livrés et mesurés. Le gradient de taille de ménage est REDRESSÉ
      (34,8 / 49,7 / 60,9 / 67,5 % pour les tailles 1 à 4, contre 76 → 36 %
      avant) et le total ne bouge pas (50,3 % de porteurs pour 50,9 % observés).
      Trois étages appris sur EMC² dans `llm_module/core/bike_ownership.py`
      (`make bike-ownership`), appliqués par
      `scripts.data.population.enrich_personal_bike --check` sur les populations
      10 / 100 / 1000. Alarme sur champ absent posée (lot 1). Politique de choix
      modal ré-entraînée sur l'indicateur nominatif construit (spec v2) : les
      deux côtés parlent enfin de la même variable. Trois critères d'acceptation
      RESTATÉS, mesure à l'appui — l'axe habitat est inatteignable comme écrit
      (l'habitat du persona est lui-même imputé et juste une fois sur deux, ce
      qui plafonne l'amplitude à ~20 pts au lieu de 33), « 1,22 vélo/ménage »
      compte des vélos sans titulaire, et les cibles par catégorie doivent être
      standardisées et comptées en ménages.
      ⚠ 2026-08-24 — LOT 4 REJETÉ, décision utilisateur : le post-traitement est
      obligatoire dans tous les cas, donc inutile de porter la même loi à DEUX
      endroits. Le lot 4 remontait les deux étages dans le fork eqasim pour qu'une
      génération neuve produise le trait nativement ; c'était une ceinture par-dessus
      des bretelles, au prix d'un risque de DÉRIVE entre deux implémentations de la
      même loi — le motif même que les tickets 015 à 019 passent leur temps à
      corriger. L'objection avancée contre le rejet (« une population régénérée sans
      post-traitement récupère l'ancien gradient ») ne tient pas : le pipeline le
      REFUSE bruyamment — `simulation_controller.py:352` lève une `[ALARME]` en ERROR
      sur `personal_bike` absent, compte les agents dans
      `alarme_total{source="personal_bike_absent"}`, et les sept populations sans le
      trait sont sorties du champ du loader (`data/population/old/`). L'échec est
      détecté, pas silencieux. Voir aussi `docs/setup/population.md` étape 8 : les
      trois post-traitements refusent de tourner si leur ressource manque, au lieu
      d'imputer à l'aveugle.
      RESTE UNE SEULE CHOSE : les chiffres du volet 3 sont transitoires — le run
      épinglé lit ses propres personas archivés, qui portent encore l'ancien gradient
      inversé. La relance était le ticket 006, abandonné : la dépendance bascule sur
      le NOUVEAU JEU DE TEST. L'axe habitat s'est déjà resserré avec le ticket 019
      (accord 47,6 → 50,2 %, amplitude 19,9 → 26,8 pts).

  ticket_019_habitat_taille_menage:
    status: terminé
    note: >-
      Les quatre lots sont livrés et mesurés. La loi du logement est passée en
      pondération ménages (`COE0`) et reçoit un levier de taille
      `P(M1|taille)/P(M1)` estimé au périmètre puis renormalisé ; ressource
      `zf_housing_type.json` en v2 (leviers, effectifs de cellule, bloc de
      validation), sel de tirage `housing_type_v2`, et le module REFUSE une v1
      plutôt que d'imputer sans levier. Test interne EMC² publié dans la
      ressource et exécuté à chaque `make housing-type` : erreur absolue moyenne
      sur les 20 cellules 3,00 pt (mécanisme précédent) → 0,75 pt, sous le
      critère de 1 pt, marginale géographique préservée (34,7/12,9/28,2/23,6/0,6
      observés contre 34,1/13,1/28,2/23,9/0,7 rakés). Populations 10/100/1000
      ré-imputées : part d'individuel isolé par taille 14,5 / 41,8 / 36,9 /
      52,1 % pour 15,7 / 46,5 / 45,5 / 53,9 % observés sur le 1000, et surtout la
      PENTE est retrouvée (+37,6 pt contre +38,2 observés, là où elle valait
      +9,5 pt avant). Critère n° 2 du ticket 015 rejoué : l'accord habitat
      imputé/observé monte de 47,6 à 50,2 %, et l'amplitude opposable de 19,9 à
      26,8 pts sur les 33,4 publiés — +6,9 pts regagnés sans qu'une ligne du
      modèle vélo bouge. Deux cellules du 1000 (tailles 2 et 3) dépassent les
      ± 4 pts stricts du ticket mais restent dans la marge de bruit 2 σ : à
      n = 71 adresses, l'écart-type de la cellule vaut 5,9 pts, le seuil du
      ticket est sous le plancher de mesure — c'est le même constat que les
      critères restatés du 015. Levier par secteur de tirage : hors périmètre,
      non nécessaire (résidu 0,75 pt).

  ticket_016_abonnement_tc_progedo:
    status: en cours
    note: >-
      LOTS 1 ET 2 LIVRÉS le 2026-08-27, communs avec le 017. Loi apprise sur `P12`
      (`make equipment-propensity`, AUC hors-échantillon 0,798, CV groupée par ménage),
      posée par `scripts.data.population.enrich_equipment` et câblée dans l'étape 8 du
      notebook de génération. Reproduit ses cibles sur l'enquête : toutes les strates
      d'occupation à 0,1 pt, gradient de motorisation exact (61,8 / 25,5 / 16,1 %).
      Sur la population 1000, l'écart étudiant − retraité passe de +5,7 à +45,5 pts
      (cible +54,5) — le critère le plus discriminant du ticket. Les paliers tarifaires
      Tisséo (moins de 26 ans, ouverture senior) sont ARBITRÉS sur l'AUC et retenus
      (+0,0079), pas décrétés ; la tarification n'entre jamais comme grandeur (P12 ne
      sert que deux modalités, et M22/revenu est livré vide). Cible « étudiants »
      RESTATÉE de 74,3 à 72,2 % : le recodage du dépôt range l'alternance avec les
      étudiants, et c'est la définition du persona qui doit gagner. Contrefactuel volet 3
      à politique figée : les 15-19 ans gagnent 5,3 pts sur les TC et 4,2 sur la voiture,
      mais le composite de TÊTE ne bouge pas (6,015 → 5,941) — il était juste pour les
      mauvaises personnes, exactement ce que ce ticket annonçait. RESTE : lot 3 (recette
      sur un run, volet 1) et lot 4 (remontée dans le fork eqasim). Ancien diagnostic
      ci-dessous. Même diagnostic que le 015 sur un trait
      qui pèse davantage : le total tient (21,9 % d'abonnés simulés contre 25,8 %
      mesurés) mais la répartition est RETOURNÉE — étudiants 35,4 % contre 74,3 %
      observés, retraités 29,7 % contre 17,7 %, et le signe de l'écart 18-24 ans /
      65 ans et + est inversé (−2,4 pts simulés contre +44,4 observés). Cause isolée :
      eqasim recopie l'abonnement du donneur ENTD 2008, et la classe d'appariement 15-29
      mélange 64 % (15-17), 63 % (18-24) et 29 % (25-29). C'est le levier d'équipement le
      plus fort de la politique (+9,5 pt de TC, −8,0 pt de voiture sur l'artefact v2, à
      comparer à +5,7 pt de vélo pour `has_bike`) : biais induit −3,7 pt de TC chez les
      étudiants, +1,1 pt chez les retraités, −0,4 pt seulement en agrégat. Plus simple que
      le 015 : trait individuel, un seul étage, aucun ménage à reconstituer, et la
      politique est déjà entraînée sur `P12` — aucun ré-entraînement. Lots 1-2 COMMUNS
      avec le 017. ⚠ 2026-08-24 : actualité CONFIRMÉE par l'utilisateur, c'est le
      chantier prioritaire avec le 017.

  ticket_017_permis_progedo:
    status: en cours
    note: >-
      LOTS 1 ET 2 LIVRÉS le 2026-08-27, communs avec le 016 (même chargeur, même script
      de pose). Loi apprise sur `P7` — `P7 == 3`, conduite accompagnée, compte NON —
      AUC hors-échantillon 0,953, plancher légal 18 ans en dur. Sur la population 1000 :
      91,5 % → 87,7 % chez les majeurs (cible 85,9). Les paliers tarifaires ont été
      offerts puis RETIRÉS par l'arbitrage (gain −0,0001) : la règle tranche dans les
      deux sens. Piège de l'ordre FERMÉ : `car_availability` dérive du nombre de permis,
      le notebook rejoue donc `fix_minor_traits` (idempotent) APRÈS la pose — 68 ménages
      recalculés — et la recette échoue si les deux ne sont plus d'accord. ⚠ Écart des
      25-34 ans à −3,2 pt, AU-DELÀ de la tolérance ± 3 du ticket : demande soit
      l'interaction âge × genre que le ticket prévoit, soit un critère restaté — non
      tranché. ⚠ Le contrefactuel volet 3 SOUS-ESTIME l'effet du permis : l'offre OTP y
      est gelée alors que `_can_drive` la conditionne. RESTE : lot 3 (run) et lot 4
      (fork). Ancien diagnostic ci-dessous. Écart modéré en agrégat (91,5 % simulé
      contre 85,9 % mesuré chez les majeurs) et concentré sur les jeunes adultes : 85,4 %
      contre 58,1 % à 18-24 ans, soit +27 points. Même cause que le 016 (classe
      d'appariement 15-29 : 0 % à 15-17, 58 % à 18-24, 78 % à 25-29) plus le millésime
      ENTD 2008. Point mesuré qui simplifie le ticket : la structure de foyer du permis est
      DÉJÀ correcte (82,3 % de doubles titulaires observés, 81,3 % simulés, surdispersion
      ×1,13 contre ×2,4 pour le vélo) — donc pas d'étage « combien dans le ménage », un
      logit individuel suffit. Verrou dur sur le mode voiture (+8,1 pt de voiture sur
      l'artefact v2, contre +6,5 en v1) et amont de `car_availability` : à livrer AVANT le
      018, qu'il désamorce en partie. Lots 1-2 COMMUNS avec le 016.

  ticket_018_partage_voiture_foyer:
    status: à faire
    note: >-
      NON PRIORITAIRE, et écrit pour ne pas être oublié. `_owns_car` vaut
      `number_of_cars > 0` : tout membre d'un foyer motorisé conduit « la » voiture, sans
      rivalité, et `car_availability` ne colore que le prompt sans jamais restreindre le
      jeu d'options. Mesuré : 20,6 % des ménages motorisés ont plus de titulaires que de
      voitures (25,4 % des agents), et 6,1 % des 2 505 trajets voiture conduits du run
      2026-08-19 partent alors que toutes les voitures du foyer sont déjà sorties — mesures
      antérieures aux livraisons 015 et 019, à refaire au prochain run de référence. Une
      voiture étant réellement partagée, la bonne réponse n'est PAS l'attribution nominative
      du 015 mais une capacité de ménage (option B), ou un jeu d'options conditionné
      (option A), ou la limite écrite (option C). Recommandation : livrer le 017 d'abord —
      il retire l'essentiel des 6,9 points de « some » en excès. Annexe : le deux-roues
      motorisé (9 % des ménages, 0,85 % des déplacements) est mesuré à zéro parce
      qu'absent, et la référence CEREMA ne le ventile pas — décision du 2026-08-21 : rien
      n'est entrepris.
      ⚠ 2026-08-24 — TESTÉ au signal « GO18 » : le canal NARRATIF est REJETÉ. `v8` dérivé
      de `v7` (72 personas sur 818 basculés `some` → `all`, distribution portée à
      69,7/16,7/13,6 % pour une cible EMC² recalculée à 70,0/16,9/13,1 %), A/B apparié sur
      trois jeux. Effet voiture sur les personas traités : +0,24 pt sur `train` (35
      personas, plancher 2,38), +4,25 sur `val` (10 personas, plancher 5,49), et en mise en
      commun des deux jeux DISJOINTS +1,34 pt pour un plancher de 1,31 — soit exactement le
      niveau du bruit. Effet AGRÉGÉ reconstruit : +0,12 pt de part voiture, contre 5,28 de
      composite pour le temps terminal par la même méthode. C'est l'amplitude qui ferme la
      question, pas le test. Le premier chiffre (+7,27 pt sur `rank`) était un FAUX POSITIF :
      médiane de +1,3 pt derrière la moyenne, plancher mal posé, et `rank ⊂ screen ⊂ train`
      donc aucune réplication indépendante. Cible recalculée par `make car-availability`
      (contrôle positif : motorisation publiée reproduite ; négatif : non-réponse P7 nulle
      chez les majeurs) — 70,0/16,9/13,1 contre les 69,5/16,9/13,6 cités, le recoupement
      tient. Trace : `docs/traces/2026-08-24_car_availability/`. NE DIT RIEN de la rivalité
      (option B) ni de l'option A : un jeu gelé ne change pas quelles options ont été
      offertes. Sortie recommandée : OPTION C (écrire la limite), le 017 corrigeant le
      niveau gratuitement.
      Méthode suivie : Le test
      suivra `docs/arch/protocole-parametre-exogene.md`, celui qui a servi au temps
      terminal : mesurer la variable dans EMC² (avec contrôle négatif ET positif, une
      variable nulle parce que non renseignée n'est pas une variable nulle), réécrire un
      jeu gelé `vN+1` où UNE SEULE variable bouge, A/B APPARIÉ sur le moteur de
      calibration (`--dry-run` d'abord, effectif opposable = personas distincts, jeu
      `test` refusé, modèle d'éval épinglé), archiver dans `docs/traces/` — le rejet
      compte autant que l'adoption — puis porte de décision. Intérêt décisif ici : ça
