      changement de modèle comportemental, il se mesure contre une référence stable — donc après
      le nouveau jeu de test. CTerminé au profit du ticket 045

  ticket_014_annexe_prompt_journee:
    status: terminé
    category: Expériences & Cognition
    note: >-
      Annexe de démonstration au ticket 014 : transformation d'une journée réelle
