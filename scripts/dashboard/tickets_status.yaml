      ⛔ DÉPEND DE : 088 — toutes ses mesures sont désormais dans le rejeu du 088 : la campagne
      `multimodeles_v6` a été supprimée, et les bras multi-modèles vivent dans
      `rejeu_jeu_corrige_v6`. ⚠ Le protocole a maigri sans le dire : plus aucun run Antigravity,
