      ⚠ 2026-08-25 — CLOS. A/B LANCÉ ET RENDU, 232 appels, VERDICT REJET. Jeton pris avec la
      preuve d'exclusion la plus forte : AUCUN service en marche à la prise NI au
      relâchement (`docs/traces/2026-08-25_ab_meteo/protocol_lock.json`). Les quotas
      manquent parce que l'API était arrêtée — c'est la CAUSE de l'exclusion, pas un trou :
      d'où la seconde sonde d'état de pile ajoutée au jeton pendant l'implémentation.
      RÉSULTAT, composite ↓ meilleur. screen (121 personas) : v9 22,93 / v10 22,51 /
      v9n 22,60 / v10b 23,06. val (182 personas, SEUL JEU INDÉPENDANT) : v9 26,75 /
      v10 25,06 / v9n 28,73 / v10b 26,78. Contrastes — fenêtre (v10−v9) : −0,43 et −1,69 ;
      TÉMOIN NUL (v9n−v9) : −0,34 et +1,98 ; bulletin (v10b−v10) : +0,55 et +1,72.
      CE QUE LA MESURE ÉTABLIT PORTE SUR L'INSTRUMENT PLUS QUE SUR LA MÉTÉO. Le témoin nul
      ne change AUCUNE distribution et déplace pourtant le composite de 2 points sur val,
      en CHANGEANT DE SIGNE entre les deux jeux. Sur val, le traitement (−1,69) est SOUS ce
      plancher (+1,98). La variance propre de l'éval dépasse l'effet visé.
      LE TÉMOIN NUL A ÉVITÉ UN FAUX POSITIF, et c'est ce qui justifie son coût : avec le
      canal placebo du protocole (1 % du jeu, plancher étroit), le −1,69 aurait été déclaré
      « signal » sans hésitation.
      ⚠ LE VERDICT IMPRIMÉ SUR screen EST TROP GÉNÉREUX. `ab_meteo.py` applique la règle
      héritée de `ab_car_availability.py` (|Δ traité| > |Δ plancher| ⇒ SIGNAL), ce qui donne
      0,43 contre 0,34 — 1,26 fois le bruit, un rapport qui ne veut rien dire. Le seuil n'a
      PAS été modifié après coup : déplacer les poteaux une fois le résultat connu
      invaliderait la mesure. La sortie brute est archivée telle quelle avec la réserve à
      côté. Un seuil opposable est à définir AVANT la prochaine campagne.
      AUCUNE CONCLUSION SUR LA PLUIE, comme le ticket l'exigeait AVANT la mesure.
      PORTE DE DÉCISION : le tirage de PRODUCTION reste sur l'année entière (la simulation
      doit pouvoir se jouer n'importe quand) ; pas de garde-fou de non-régression, puisque
      rien n'est adopté. La fenêtre reste disponible dans `WeatherDeck.load` et gelée aux
      manifestes de v10/v10b. LE BULLETIN ENRICHI RESTE EN PRODUCTION comme un choix de
      CONTENU et non un résultat de mesure : +1,72 sur val va dans le mauvais sens mais
      reste sous le plancher, donc il n'y a pas de preuve qu'il dégrade — seulement absence
      de preuve qu'il améliore. À rouvrir si un instrument moins bruyant le permet.
      NE FERME PAS l'axe A5 du ticket 020 (variance d'un run de 5 jours) ni l'excès de
      transports collectifs (20,8 % sur val contre 12,4 % attendus).
      TRACE DE L'A/B : `docs/traces/2026-08-25_ab_meteo`. Registre : `avancement.yaml`,
      mesure `fenetre_meteo`.
      ⚠ 2026-08-25 — CINQUIÈME BRAS `v10c` MESURÉ ET REJETÉ, +58 appels (290 au total).
      AGENDA ANNOTÉ PAR ÉTAPE : chaque trajet prévu porte condition, température,
      luminosité (jour/nuit/aube/crépuscule, ±30 min autour du lever et du coucher),
      rafales ≥ 30 km/h (seuil Beaufort 5, 14,5 % des jours de la fenêtre) et verglas < 3 °C
      (19 jours sur 365). RÉSOLUTION DE 3 H : la source porte HUIT relevés (0/3/6/9/12/15/
      18/21H), tous complets sur 365 jours, et le code n'en lisait QUE QUATRE depuis
      l'origine. Le code météo diffère entre 12H et 15H sur 159/365 jours (44 %), la
      température de ≥ 2 °C sur 236/365 (65 %) : deux trajets du même après-midi étaient
      annoncés identiques dans les deux tiers des cas.
      RÉSULTAT — LE CAS D'ÉCOLE DE LA CAMPAGNE. `screen` : v10c−v10 = +1,95, soit 5,7 FOIS
      le plancher (−0,34), le contraste le plus fort de toute la mesure, avec la marche qui
      recule de 13,26 % à 10,93 % (cible 26). On tenait un résultat. `val` : −0,17, soit un
      DIXIÈME du plancher (+1,98), ET CHANGEMENT DE SIGNE. Il ne reste rien. REJET.
      ⚠⚠ RÉSULTAT SUR L'INSTRUMENT, plus important que celui sur la météo : DEUX FOIS dans
      cette campagne `screen` a produit un signal que `val` n'a pas confirmé (le bulletin,
      puis l'agenda). `screen ⊂ train`, 121 personas, plancher SIX FOIS plus étroit que sur
      `val`. UN PLANCHER ÉTROIT FABRIQUE DES SIGNAUX — `screen` ne doit plus être lu seul, et
      toute lecture future exige `val`.
      L'AGENDA N'EST PAS PORTÉ EN PRODUCTION et n'y a jamais été : le bras était
      EXPÉRIMENTAL, et c'est précisément ce qui a permis de ne rien livrer sur la foi du
      +1,95. Le code vit dans `rewrite_weather.py`, à porter dans `_agenda_lines` seulement
      si un instrument moins bruyant le confirme.
      ⚠ LA RÉSOLUTION DE 3 H N'EST PAS CONDAMNÉE. `v10c` la portait EN PAQUET avec
      l'annotation (choix assumé : un seul bras) ; la mesure ne peut pas les départager, et
      le rejet de l'ensemble ne dit rien de la résolution seule. À reprendre.
      DÉFAUT TROUVÉ ET CORRIGÉ : `check_paired` ne comparait que le champ `context`, or
      `v10c` ne diffère de `v10` que par `section` — une annotation qui n'aurait rien annoté
      serait passée inaperçue et on aurait payé une éval pour un Δ nul. Le contrôle porte
      désormais sur le PROMPT ENTIER et compare les bras DEUX À DEUX, pas seulement au
      premier (ce qui attrape aussi le doublon v10/v10b du début).
      4 ALARMES sur la campagne : vecteurs de probabilités à somme nulle, repli uniforme,
      4 décisions perdues sur 2 262 (0,2 %).
      PAGE D'AVANCEMENT : deux graphiques distincts (courbe des NIVEAUX des runs de
      production, 5 points non monotones ; barres des ÉCARTS par mesure, groupées par unité,
      les non-appliquées estompées) et les niveaux avant→après dans chaque fiche. Champs
      numériques ajoutés à `avancement.yaml`, extraits des traces — les Δ recalculés
      reproduisent exactement les scores écrits à la main.

  ticket_024_diversite_et_contexte:
    status: en cours
    note: >-
      OUVERT le 2026-08-24. Ticket de MESURE, pas de correction : rien n'est modifié, ni
      en production ni dans l'instrument. Trois chiffres à produire, tous lus contre la
      DERNIÈRE VERSION DE PROMPT ACCEPTÉE (`expert_chaine`, graine de `ref2`).
      BLOC A — diversité intra-persona. A1 pondéré / A2 vote majoritaire (`argmax` par
      persona) / A3 choix direct. A1 vs A2 est la mesure centrale et elle coûte ZÉRO appel :
      les décisions `(agent_id, mode, poids)` sont déjà dans la table `evals` du store, donc
      tout se relit comme `rescore --from-decisions`. L'écart pondéré / argmax EST le coût du
      collapse. Quatre métriques de dispersion à livrer dans `metrics.py` mais HORS composite
      (entropie normalisée par le nombre d'options OFFERTES, nombre effectif de modes,
      taux de réponses dégénérées à 0,90 et 0,99, variance inter-persona).
      BLOC B — sensibilité au contexte, par ABLATION descendante depuis `v7` (rien à
      produire : la ligne `Mobilité :` porte déjà les traits des tickets 015-018). Cinq
      paliers L0..L4 + témoin nul L4n (même information reformulée, longueur comparable),
      prompt CONSTANT sur tous les bras.
      LE LIVRABLE PRINCIPAL est la COMPARAISON D'AMPLITUDES, qui n'était dans aucune des deux
      affirmations : prompt = −7,13 de composite (IC90 [−10,37 ; −4,35], n = 259, T1 de
      `ref1`) contre contexte = `L4 − L0`, à mesurer. Si le second ne dépasse pas le premier,
      c'est l'inverse du discours prévu qu'il faudra tenir. ⚠ Les deux amplitudes ne sont pas
      sur le même jeu : comparaison INDICATIVE, pas test apparié — à écrire à côté du chiffre.
      DÉJÀ ACQUIS SANS DÉPENSER : la moitié inter-persona du bloc A. Part voiture du champion
      PLATE (42,7 → 49,1 %) quand la réelle va de 18 % à 77 % ; marche 0-1 km à 31,3 contre
      76,0 (−44,7). Le déficit agrégé de marche (−14,5) est la SOMME d'un effondrement sur les
      courts trajets et d'un excédent sur les longs : l'agrégat masque le défaut.
      DÉPENDANCE DURE : `scripts/protocol_lock.py` est ABSENT — le lot 1 du ticket 023 n'est
      pas livré. Voie propre = livrer le jeton d'abord (il sert tous les tickets suivants) ;
      voie manuelle tolérable UNIQUEMENT parce que les lots 1 et 2 ne consomment rien.
      PIÈGE PRINCIPAL : `eval_temp` vaut 0,0 et il est GELÉ (§3). La dispersion intra-persona
      de A3 vaut donc 0 PAR CONSTRUCTION DE L'INSTRUMENT, pas par propriété du modèle — motif
      « l'absence de mesure produit le score parfait ». A1 vs A3 se lit au niveau AGRÉGÉ
      seulement ; mesurer la dispersion de A3 exigerait K tirages à température > 0, donc hors
      instrument gelé, donc hors lots.
      AUTRES PIÈGES : normaliser l'entropie par le nombre d'options offertes, sinon on mesure
      l'offre d'itinéraires et pas le modèle ; nom de jeu neuf par palier car la clé d'éval
      porte `ds=<nom>` et non une empreinte du contenu, ET le champ `version:` du manifeste
      doit porter ce nom (`v6` et `v7` portent tous deux `version: v5`, recopié de leur
      source) ; témoin nul obligatoire car retirer du texte raccourcit aussi le contexte ;
      effectif opposable = personas distincts, pas décisions.
      HORS PÉRIMÈTRE : la mémoire et la réaction aux perturbations (autre ticket, ouverture de
      présentation) ; la dispersion intra-persona de A3 ; l'injection du fait local (axe D7 —
      témoin de PLAFOND, jamais un candidat de production : c'est la cible dans le contexte) ;
      faire entrer la dispersion dans la loss (ça changerait ce que la campagne optimise).
      `test` est FERMÉ : son regard unique est consommé depuis l'amendement A5. Tous les
      chiffres sont EXPLORATOIRES, jamais confirmatoires.
      ATTENDU : commencer par les lots 1 et 2 donne des chiffres immédiatement, sans jeton,
      sans quota, sans attente. L'issue « pas d'effet » (pente dans le bruit du témoin nul)
      RÉFUTE l'affirmation « plus de contexte = plus de précision » et s'archive comme les
      autres.
      ── LOTS 1 À 3 LIVRÉS le 2026-08-25, ZÉRO APPEL LLM, jeton non requis ──
      Lot 1 : les quatre métriques de dispersion dans `metrics.py`, HORS composite (un test
      verrouille la liste des champs de `Scores`). Entropie normalisée par le nombre de MODES
      DISTINCTS offerts et non par le nombre d'options — le vecteur vit sur les modes, les
      options d'un même mode étant agrégées ; l'offre d'un agent récurrent est l'UNION de ses
      trajets. Toute grandeur non mesurable rend `None` et se déclare, jamais 0,0 : sur une
      dispersion, l'absence de mesure imite le résultat le plus spectaculaire.
      Lot 2 : `analyse_dispersion.py`, store en LECTURE SEULE, compte les évals à l'entrée et
      à la sortie pour démontrer qu'aucune n'est créée. RÉSULTAT sur `expert_chaine`,
      12 évals, juge `gemini-3.5-flash-lite` : modes effectifs 1,43 à 1,75 sur 3 à 4 offerts ;
      réponses DÉTERMINISTES (max p ≥ 0,99) de 24,8 % (`screen@v9n`) à 55,8 % (`val@v7`) ;
      variance inter-persona 0,078 à 0,101 ; coût du collapse (A2−A1) de 6,8 à 13,3 points.
      L'AFFIRMATION D EST CHIFFRÉE ET ELLE TIENT. Le substrat compte : `v7`/`v8` sont bien
      plus dégénérés que `v9`/`v10`. Trace : `docs/traces/2026-08-25_diversite_contexte/`.
      Lot 3 : `rewrite_context.py` produit `ctxL4` (copie à l'octet), `ctxL3`, `ctxL2`,
      `ctxL1`, `ctxL0` et le témoin nul `ctxL4n` (+0,2 % de longueur). Le script REFUSE
      d'écrire si `L4` n'est pas identique à sa source ou si `L4n` dérive de plus de 5 %.
      Trois pièges de périmètre désamorcés et sous test : `Contraintes` survit au retrait de
      `Mobilité` (même ligne ; il vaut `None` sur 2 487/2 487, information constante) ;
      l'agenda survit au retrait de la météo (seules ses annotations « — … prévu » partent) ;
      les sous-puces de l'agenda survivent à celles des options. La météo avait TROIS
      porteurs, pas un — `context`, la ligne de bulletin et les annotations d'agenda.
      D1 CADUC : `scripts/protocol_lock.py` EXISTE depuis le 2026-08-25 (lot 1 du 023), avec
      `make protocol-lock/unlock/status` et le garde `calibration/protocol_guard.py` que tous
      les `ab_*.py` appellent. La dépendance dure du ticket est levée.
      ARBITRÉ le 2026-08-25 : (a) SUBSTRAT = `v7`, on refera sur un jeu plus récent plus
      tard si besoin ; (b) JUGE = `gemini-3.1-flash-lite` (nom stable, `google_gemini31`,
      seau de quota distinct de 3.5 dont la clé 1 est épuisée) — config `run_ab_context.yaml`
      prête et validée contre `assert_pinned_eval_model`. ⚠ CE JUGE N'EST PAS CELUI DE
      `ref2` : le bloc B ouvre une SÉRIE NEUVE au sens du §3 amendé, ses composites ne se
      posent pas à côté de ceux de `ref2` ni du −7,13 de `ref1`, et la comparaison
      d'amplitudes exigera son propre pont (champion vs B0 sous CE juge et CE jeu).
      CE QUE LES LOTS 1-3 ONT APPRIS, AU-DELÀ DE D : le modèle réalise 65 % de l'écart
      inter-persona ATTEIGNABLE (variance A1 0,087 contre 0,133 en A2 décidé, identique sur
      `screen` et `val`) — il n'est donc pas figé, il est SOUS-DÉCIDÉ. Et le tableau
      d'élasticité du ticket est PÉRIMÉ : sur `val@v10c` la part voiture va de 34,5 % à
      87,3 % (contre 42,7 → 49,1 pour le champion de `ref1`), le défaut n'est plus une
      courbe plate mais un EFFONDREMENT DE LA MARCHE SOUS 2 KM (−43,2 pts à 0-1 km, −38,7 à
      1-2 km, contre −6,6 à +5,9 au-delà). Le TC est en grande partie une masse de SECOND
      CHOIX : 22,1 % en pondéré, 17,0 % en vote majoritaire.
      ── LOT 4 (bloc B) le 2026-08-26 — LA PENTE EST DANS LE BRUIT ──
      `screen`, 108 personas appariés, juge `gemini-3.1-flash-lite`, six colonnes :
      L4 23,00 · L3 24,60 (+1,60) · L2 24,36 (+1,36) · L1 25,56 (+2,56) · L0 25,52 (+2,52) ·
      TÉMOIN NUL L4n 25,04 (+2,03). Retirer TOUT le contexte coûte 2,52 ; réordonner et
      réétiqueter le MÊME contexte en coûte 2,03 — rapport 1,24. DEUX PALIERS SONT SOUS LE
      PLANCHER (L3 à 0,79 ×, L2 à 0,67 ×). La pente SATURE dès L1 : retirer la décomposition
      des étapes, soit 55 % de la longueur du prompt, ne change plus rien de mesurable.
      `val` : quota épuisé (429) après deux colonnes, mais ce sont les bonnes — référence
      23,74 et témoin nul 27,66, soit un PLANCHER DE +3,92, presque le double de celui de
      `screen`. L'effet cherché est donc plus petit que le bruit du jeu le plus fiable.
      ISSUE (c) DE LA PORTE DE DÉCISION : l'affirmation C n'est pas soutenue, et la
      comparaison d'amplitudes penche à l'inverse du discours annoncé — contexte 2,5 (dans le
      bruit) contre prompt 7,13 (hors bruit, autre juge, autre jeu, donc indicatif).
      ⚠ Le témoin nul déplace la part voiture de 4,8 points à information constante : aucune
      affirmation sur une part modale sous ~5 points n'est opposable ici.
      DÉFAUT D'INSTRUMENT TROUVÉ ET CORRIGÉ : `make_provider_call` n'envoyait pas `model`,
      l'adaptateur retombait sur le `default_model` du fournisseur. Le modèle ANNONCÉ n'était
      pas le modèle APPELÉ, et le garde anti-alias du §3 portait sur une étiquette décorative.
      Le premier passage a été jeté (store conservé sous
      `ab_context_PREVIEW_ETIQUETTE_FAUSSE.db`) ; les composites du second sont IDENTIQUES,
      donc les chiffres jetés étaient mal étiquetés, pas faux. ⚠ `run_common_set.yaml`
      (volet 2 de la page de synthèse, DÉJÀ PUBLIÉ) est dans le même cas.
      `val` COMPLET le 2026-08-26 (165 personas appariés) : L4 23,74 · L3 20,95 (−2,79) ·
      L2 22,51 (−1,23) · L1 21,99 (−1,75) · L0 22,56 (−1,18) · TÉMOIN NUL L4n 27,66 (+3,92).
      LES QUATRE ABLATIONS AMÉLIORENT LE SCORE SUR `val` LÀ OÙ ELLES LE DÉGRADAIENT SUR
      `screen` : le signe s'inverse, et l'amplitude reste sous le témoin nul dans les deux
      jeux. Résultat nul de la forme la plus nette — l'effet est plus petit que le bruit ET
      sa direction n'est pas stable. AFFIRMATION C RÉFUTÉE sur ce dispositif.
      LE FAIT NON CHERCHÉ, ET LE SEUL SUR LEQUEL LES DEUX JEUX CONCORDENT : le témoin nul est
      la colonne LA PLUS DÉGRADÉE des deux tableaux, davantage que le retrait de tout le
      contexte. Un plancher systématiquement pire que tous les traitements n'est plus du
      bruit : c'est un EFFET DE FORME. Le modèle réagit à la mise en forme du contexte plus
      qu'à son contenu. ⚠ `L4n` cumule 4 permutations et 2 renommages — un palier par
      permutation dirait lequel porte l'effet, et ne coûte que des retraits mécaniques.
      TICKET À OUVRIR, pas une conclusion à écrire.
      ── JEU COMPLET (train + val) le 2026-08-26, 0 appel : `pool_context.py` ──
      569 personnes, 1 568 déplacements (3,4 × `val` seul). L4 22,69 · L0 22,42 (−0,27, soit
      0,10 × le plancher) · TÉMOIN NUL L4n 25,35 (+2,66). Sur `train` seul l'ablation totale
      donne EXACTEMENT −0,00 (22,83 contre 22,83). RETIRER TOUT LE CONTEXTE NE CHANGE RIEN.
      TROIS ÉCHELLES DE BRUIT EMBOÎTÉES, la troisième mesurée par accident : l'épuisement du
      quota a forcé à rejouer `ctxL4` sur la SECONDE CLÉ (même modèle, autre projet) →
      22,83 contre 22,84, écart 0,01, ≤ 0,05 par dimension. Donc : répétition pure 0,01 ·
      contenu du contexte 0,27 · FORME du contexte 2,66. Le témoin nul vaut 250 × l'aléa de
      répétition — ce n'est pas du bruit, c'est un effet systématique de mise en forme, et
      c'est le SEUL signal du bloc B. Le contrôle d'équivalence justifie par la mesure de
      mélanger les deux clés dans un tableau ; le triplet L4/L4n/L0 a malgré tout été refait
      ENTIER sur la clé 2 pour qu'aucun contraste ne repose sur un changement de clé.
      MANQUE : L3/L2/L1 sur `train` (456 appels pour six colonnes contre 500 par seau et par
      jour). Ils restent mesurés sur `screen` et `val`, tous sous le plancher : leur ajout
      préciserait le point de saturation, pas la conclusion.
      COMPARAISON D'AMPLITUDES (livrable principal) : contexte ≤ 2,8 et sans signe stable
      contre prompt 7,13 hors bruit — indicatif (jeux et juges différents), mais l'ordre de
      grandeur est l'INVERSE du discours annoncé.
      LOT 4 CLOS : les trois questions qui précédaient sa mesure sont retombées d'elles-mêmes.
      Le substrat est `v7`, tranché ci-dessus et trace conservée ; le juge a été tenu CONSTANT
      sur les six colonnes, comme l'exige le §3 amendé (A11) ; et `val` a bien été lu à côté de
      `screen`, la leçon du 023 étant appliquée. Rien de ce bloc ne reste ouvert : il ne
      subsiste que le MANQUE déjà énoncé plus haut (L3/L2/L1 sur `train`), qui préciserait le
      point de saturation, pas la conclusion.

  ticket_027_motif_accompagnement:
    status: à faire
    note: >-
      OUVERT le 2026-08-26. Le motif `other` du prompt (19 % des décisions) est aux DEUX
      TIERS de l'accompagnement — le motif le plus routier de la référence (70 % voiture).
      MESURÉ sur les 54 585 déplacements de l'EMC² 2023 (`D5A`) : 6 797 en `other`, dont
      4 503 d'accompagnement (61/64/71/74), soit 66,2 % de `other` et 8,2 % de tous les
      déplacements ; santé et démarches (41/42/43) en font 30,7 %. L'information est détruite
