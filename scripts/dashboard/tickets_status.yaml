  ticket_043_troisieme_famille_regression_logistique_noyau:
    status: terminé
    category: Modélisation Statistique
    note: >-
      Livré le 2026-09-11 (spec specs/ticket_043/klr-troisieme-famille.md, 14 règles, 29 tests).
      `make klr` estime la régression logistique à noyau RBF + Nyström à parité stricte, avec la
      MÊME matrice de dessin que le logit (design_matrix_from_contract, partagée) : 2 000 points
      d'appui tirés par ménage, γ et λ choisis en validation croisée groupée DANS le train, appuis
      retirés dans la partie d'ajustement de CHAQUE pli. Artefact autoportant de 1,5 Mo à
      coefficients duaux (B = W·βᵀ, repliement exact vérifié à 4e-12). Test scellé : exactitude
      0,784 (booster 0,785, logit 0,766), CEL 0,5531, et L1 masse 0,0253 — MEILLEURE des trois.
      Jeu gelé AAMAS : composite 5,0300 contre 4,9182 (booster) et 6,1734 (logit), L1 48,59, la
      meilleure. Second arbitre du bloc C1 livré : une transition n'entre au score que si les deux
      arbitres portent le même signe franc, sinon elle est écartée et comptée ; sur le run épinglé
      les deux s'accordent sur les 20 transitions, donc le s_C1 = 5,0 % du prompt est corroboré.
      Bloc B' publié (accord à la KLR : 1 725 % de la distance inter-oracles ; la KLR est deux fois
      plus proche du booster que le logit). Poids toujours à 0 (K12). Banc : 39 min, 3 configurations
      écartées — une non convergée, deux pour dérive des parts (0,0057 et 0,0061 contre un plafond
      à 0,0056 fixé sur la L1 du logit). Les deux bords de grille du premier banc ont été MESURÉS
      par un banc élargi (41 min) : γ×0,25 est un optimum INTÉRIEUR (×0,125 → 0,55117, ×0,0625 →
      0,55951) et m est sur un PLATEAU (0,54557 / 0,54487 / 0,54476 à 1 000 / 2 000 / 3 000). Le
      banc élargi retient m = 3 000 pour un gain de 0,0001 ; le ticket borne m à 2 000, donc
      l'artefact publié reste à 2 000 et le fait est rapporté, pas appliqué (à 3 000, une
      composante propre passe déjà sous le plancher : rang 2 999/3 000). Relever la borne serait
      une décision de périmètre.

  ticket_044_temoin_random_forest:
    status: terminé
    category: Modélisation Statistique
    note: >-
      Livré le 2026-09-11 (spec specs/ticket_044/temoin_random_forest.md, 10 règles, 25 tests).
      `make forest` mesure le témoin à parité stricte (mêmes parquet, split par ménage,
      sample_weight COEP, métriques partagées ; réglage en validation croisée groupée DANS le
      train ; ni class_weight ni rééquilibrage) et n'écrit QUE des chiffres : aucun modèle
      sérialisé, aucun consommateur. Retenu max_depth 14 / min_samples_leaf 5 /
      max_features 0,3 / 1 200 arbres, aucun bord de grille ; plateau montré (log-loss CV
      0,5687 → 0,5678 → 0,5669 à 200, 400, 1 200 arbres). Test scellé (13 045 trajets) : RF
      0,776 / CEL 0,5703 / GMPCA 0,565 / L1 masse 0,0232 / L1 mode élu 0,0899 / rappel vélo
      0,035. Seuils du verdict déclarés AVANT le chiffre (part de l'écart comblée, 0,70 / 0,30)
      → verdict formel INDÉCIS, et c'est le résultat. Lecture par axe : sur les parts modales
      agrégées les ARBRES suffisent (le RF dépasse le booster, part 3,04) — l'article ne peut
      donc pas attribuer la fidélité des parts au boosting ; sur l'exactitude désagrégée
      l'avantage se partage (0,49 et 0,45) ; sur la classe minoritaire le BOOSTING est décisif
      (rappel vélo 0,035 contre 0,138 booster et 0,108 logit, le RF passant sous les deux alors
      que sa masse vélo est calibrée à 4,3 % contre 4,0 % observés). Rappel vélo du logit
      mesuré au passage (0,108), le ticket le donnait « à mesurer ». Sensibilité d'encodage
      chiffrée : la voie native (codes entiers lus comme ordinales) ne coûte que 0,0005
      d'exactitude et 0,0015 de L1 masse — la précaution ne changeait pas la conclusion.
      Conséquence pour le ticket 043 : une troisième famille d'arbres est écartée sur l'axe des
      parts, mais la question du rappel des minoritaires reste ouverte. Questions dans
      specs/ticket_044/questions.md. Coût réel : 13 min, hors ligne, aucun appel LLM.
      EXTENSION du 2026-09-11 (hors périmètre initial, demandée après le verdict, donc la
      clause « pas de décideur tant que la question n'est pas tranchée » est levée, pas
      contournée) : le témoin est joué comme expérience `exp_rf_jtir_nosim`, dérivée de
      `exp_mnl_jtir_nosim`, même jeu gelé, même couverture (2 634 / 2 645). Composite emd_jsd
      5,5889 contre 4,9182 (booster) et 6,1734 (logit) — part de l'écart comblée 0,47, contre
      0,49 et 0,45 sur le test scellé PROGEDO : deux substrats indépendants, la même moitié.
      Le décideur ne charge AUCUN arbre : artefact de 12 ko (contrat + hyperparamètres + deux
      SHA) plus une matrice .npz de 1,4 Mo ; RFPredictor réajuste en 10 s puis VÉRIFIE que la
      forêt reproduit les métriques publiées. Ce garde-fou a servi : scikit-learn 1.9.0 (le
      conteneur controller) ne donne pas la même forêt que 1.8.0 (l'hôte) — exactitude
      +0,000188, CEL +0,0008 — d'où une exécution sur l'hôte. NON REJOUABLE par la CLI : la
      famille `rf` est enregistrée à l'exécution par
      scripts/progedo_logit/lancer_experience_rf.py, les deux lignes de table (FAMILLES,
      POLICY_FORMATS) étant laissées au ticket 043 qui modifiait ces fichiers en parallèle.
      Un LISEZ-MOI.md dans le dossier de l'expérience le dit et donne la relance. Aucun
      scores.json écrit à la main.

  ticket_045_substrat_unique_v5_et_reconstruction_des_experiences:
    status: terminé
    category: Données & Population
    note: >-
      Ouvert le 2026-09-11. Audit : les 36 exécutions avaient TOUTES lu la cohorte v1 (f67b0777…)
      et non la v5 (de73532e…), référence de l'article. LOTS 1, 2 (partiel), 3 et 5 LIVRÉS le
      2026-09-11 (spec specs/ticket_045/substrat-unique-v5.md, 25 règles ; 6 fichiers de tests
      045 ; suite llm-agents 784 verts, tableau de bord sans aucune régression et 9 échecs
      préexistants réparés). AUCUNE mesure relancée, aucun appel LLM.
      LA JOURNÉE SE REFERME (A1, le plus grave) : énumération unique dans `chaine_activites.py`,
      partagée par le contrôleur et la plateforme ; 3 299 déplacements attendus sur la v5 au lieu
      de 2 405, dont 183 fermetures sur place inexploitables. Trois compteurs corrigés dans la
      foulée, tous cassés PAR cette correction et trouvés en la vérifiant : `est_complet` devenu
      inatteignable, progression bloquée à 80 % sur un run terminé, alarme moteurs déclenchée à
      chaque préparation (5,5 % de fermetures pour un seuil à 5 %). Une fermeture sur place n'est
      pas une défaillance de moteur : `est_defaillance_moteur` porte la distinction.
      A2 REQUALIFIÉ EN ILLUSION : même texte, chemin du gabarit d'option résolu depuis la racine
      du dépôt alors que le conteneur monte llm-agents sur /app — le morceau sortait du hachage
      sans bruit. Corrigé, hôte et conteneur rendent la même empreinte. La comparabilité
      Antigravity/passerelle n'était pas en cause. A3 REQUALIFIÉ : les 23 exécutions complètes ont
      toutes 48 inexploitables ; le vrai défaut était l'accumulation au fil des décisions, corrigé
      par une dérivation depuis le jeu à l'ouverture. A4 corrigé : l'hôte mesure le commit et le
      transmet au conteneur (git absent de l'image), et le manifeste enregistre la clé EFFECTIVE
      du graphe OSMnx. L'artefact KLR n'avait PAS changé (les 4 sha256 sur disque sont ceux des
      exécutions) et le ticket 043 était déjà `terminé` : les deux précautions annoncées tombent.
      CAUSE RACINE FERMÉE : `population_par_defaut()` prend la dernière cohorte scellée par DATE
      de sceau, la population sort de DEFAUTS_NOMMAGE et entre toujours dans le nom via
      `abreger_population` (le tronquage naïf effaçait le suffixe de version — même piège trouvé
      et fermé sur le segment `jeu-`, où deux dates donnaient le même nom), `resoudre_population`
      refuse l'archive sauf motif écrit et journalisé, et le tableau de bord ne propose plus rien
      d'archivé NULLE PART — y compris « S'inspirer de » et « Dupliquer », qui ne filtraient pas.
      BASE VIERGE : 46 définitions, 36 exécutions, 3 cohortes et le jeu v1 déplacés (jamais
      supprimés), documentés, zippés (57,3 Mo + 7,0 Mo + 2,2 Mo), chemins journalisés dans
      data/JOURNAL_archivage_ticket_045_2026-09-11.json. Script idempotent et vérifié :
      scripts/archiver_substrat_v1.py.
      LE JEU v5 ET LES 14 EXÉCUTIONS GRATUITES SONT FAITS le 2026-09-11 : 3 299 déplacements
      attendus, 3 161 exploitables, ZÉRO défaillance de moteur (les 138 sans proposition ont tous
