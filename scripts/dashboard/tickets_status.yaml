      divergence chiffrée, et l'alignement présenté comme un RÉ-EXPORT de ressource. Les deux
      tests qui encodaient l'ancienne décision sont inversés — leur inversion EST la
      décision. 253 tests verts côté llm-agents. 4 : FAIT le 2026-08-24 — `frames.normalize_place` rend
      `(clé, référencée)` avec la clé ASCII `hors_perimetre` (la sortie brute donnait
      `hors_périmètre`, qui ne joignait rien et disparaissait), et `dimension_detail` publie une
      ligne « — hors référentiel — » portant la MASSE EXCLUE : « exclu des cibles » ne doit pas
      se confondre avec « inexistant ». Le geste vaut aussi pour « Autres » du logement (test du
      019 étendu). Mesure `make couronne-v7` : ZÉRO appel LLM, décisions déjà en base
      (ab_chaine.db, node c00b4318b3, T=0), splits train+val = 2 197 décisions / 569 agents.
      RÉSULTAT : +2,11 pt de L1 par zone (41,26 → 43,38), les QUATRE strates dégradées et une
      3ᵉ couronne qui APPARAÎT à 41,88. ⚠ PIÈGE ÉVITÉ : pondérer par la MASSE observée rend
      −0,26 pt, une fausse amélioration — le reclassement sort 47 agents de la strate la pire
      (Toulouse, L1 59), donc la moyenne baisse par changement de mélange alors que chaque
      strate empire. Une moyenne pondérée par la masse n'est pas une règle de score valide pour
      comparer deux CLASSEMENTS ; les poids publiés sont ceux du cadrage, identiques des deux
      côtés. C'est le critère « une correction qui améliore le score est suspect » qui a attrapé
      le cas. Trace `docs/traces/2026-08-24_couronne_v7/` + ligne `couronne_residence` au
      registre `avancement.yaml`. 5 : ÉCRIT LE 2026-08-24, NON REJOUÉ — trait posé dans
      `eqasim-toulouse/synthesis/population/llm_agents.py` sur `home_location` APRÈS le snap
      OTP, donc sur les coordonnées que `identity.home` portera (les mêmes que lit le journal) ;
