  ticket_047_offre_a_mode_unique_ce_qui_compte_comme_decision:
    status: terminé
    category: Modélisation Statistique
    note: >-
      2026-09-12 — LA MESURE EST FAITE, SYSTÉMATIQUEMENT ; la convention reste à trancher (décision
      de l'auteur : mesurer d'abord, décider d'en parler ensuite). Chaque scoring produit désormais
      les DEUX lectures du composite (toutes décisions / hors itinéraire unique), leurs scores bruts
      par dimension — donc le rejeu de formule reste exact des deux côtés — et le compte de choix
      forcés sur SES DEUX périmètres, chacun nommé : celui de l'exécution (toutes décisions
      archivées) et celui du score (premier jour simulé, dernière tentative), qui diffèrent de 14 à
      19 lignes sur chaque exécution du 11/09. Le compte et la seconde lecture sont des colonnes PAR
      DÉFAUT du tableau de bord et du registre CLI, des tuiles d'en-tête de la page d'exécution, et
      une [ALARME] part au journal au-delà de 1,0 point EMD d'écart. Un scores.json sans seconde
      lecture est réputé périmé : il se recalcule à plein au lieu d'être rejoué, sinon tout
      l'historique serait resté « non mesuré ». Les 16 exécutions du 11/09 ont été recalculées.
      CE QUE LA MESURE MONTRE, et qui n'était pas su : retirer ces lignes déplace le composite de
      -3,75 (durmin) à +12,22 (alea) et CHANGE LE CLASSEMENT — lgbm premier à 4,50 passe à 10,46,
      derrière klr (4,55 -> 9,95). Chaîne coupée, l'écart plafonne à 0,32 et les choix forcés
      tombent à 44 pour TOUS les bras (contre 279 à 811 chaîne active) : ces lignes viennent de la
      chaîne des véhicules, donc des choix antérieurs du bras lui-même. Conséquence signalée à
      l'article, non corrigée (verrou) : l'écart « en chaîne / hors chaîne » du chapitre 6 — que le
      texte désigne comme son argument le plus direct — vaut +0,31 toutes décisions comprises et
      +6,45 hors itinéraire unique pour lgbm. L'ordre cité en conclusion (9,28 contre 7,40) A ÉTÉ
      RECALCULÉ le 2026-09-12 sous les deux lectures, sur le même run et la même empreinte moves.csv,
      les trois chiffres publiés étant d'abord reproduits à l'identique : IL TIENT — production 7,40
      -> 10,07, variante à 93,4 % d'accuracy 9,28 -> 11,31, la variante reste la pire. La contribution
      3 ne change pas de démonstration. Mais la marge passe de 1,88 à 1,24 point (un tiers de moins),
      et les deux valeurs citées se dégradent de +2,0 à +2,7 points hors itinéraire unique : les
      citer sans nommer la lecture « toutes décisions » reste inexact. Trace :
      docs/traces/2026-09-12_11-30_ticket047_ordre_des_composites_conclusion/. Piège trouvé au
      passage : docs/synthesis/archive/2026-08-31_v4_matrice_vitesse/ porte la PAGE de la variante
      mais un parquet de production — seule la trace du 31/08 conserve ses prédictions.
      RESTE À FAIRE : l'inventaire écrit de toutes les grandeurs publiées et de leur traitement, la
      convention tranchée dans score-synthesis.md, et la phrase du chapitre 4. Les deux questions
      ouvertes (exactitude unitaire, dénominateur de la couverture) ne sont pas tranchées.
      Ouvert le 2026-09-11 à la demande de l'auteur. Sorti du ticket 045 (alerte
      A5) pour être traité à part. Une offre à mode unique n'est pas une décision : les trois
      décideurs y produisent le même résultat sans qu'aucune préférence ne soit exprimée. Les parts
      modales de la plateforme les COMPTENT (un déplacement contraint est un déplacement de la
      journée), les termes d'accord du score à deux oracles les ÉCARTENT (mesurer un accord là où
      personne n'a décidé fait baisser la perte sans rien mesurer) — aucun des deux n'a tort, mais
      la convention n'est écrite nulle part et diffère d'une grandeur à l'autre sans avertir le
      lecteur. Non trivial parce que le COMPTE dépend du bras : ces situations naissent des choix
      antérieurs de la journée, et l'écart entre bras est donc en partie un écart d'offres. Quatre
      travaux : inventorier toutes les grandeurs publiées et leur traitement, trancher la convention
      dans score-synthesis.md, publier les deux lectures des parts avec le compte par bras, et
      l'annoncer en une phrase au chapitre 4. Hors périmètre : la contrainte de chaîne (045),
      l'asymétrie informationnelle (046), l'ablation du filtre d'éligibilité (040). BLOQUE la
      publication des parts modales par bras.

  ticket_048_calendrier_de_consolidation_et_echelle_d_oubli:
    status: terminé
    category: Expériences & Cognition
    note: >-
      CLOS LE 2026-09-21, SON RELIQUAT EST REPRIS AU TICKET 095 — décision de l'auteur, les deux
      sujets étant le même paramètre : le `S0 = 2,8` de la fenêtre dérivée du 095 EST la constante
      de temps livrée ici. Répartition : mesure du taux d'entrées par agent-jour et arbitrage du
      régime → 095 lot F1 ; garantie « avant le réveil » sous ce volume → F2 ; rejeu des mesures
      publiées qui dépendaient de la min-max → F3 ; conversion de memory_decay_lambda /
      memory_horizon_days d'experiments.yaml (exp_04a, l. 389-390) → F4 ; piste des modèles locaux
      et son protocole d'admission sur jeux gelés → 095 lot C. Les campagnes E2/E3 du 095 sont les
      runs GAMA courants que ce reliquat attendait depuis dix jours sans pouvoir les prendre : la
      mesure F1 se relève sur un bras déjà payé. Bloc `triage` retiré (règle 2 de la skill
      suivi-tickets, épreuve test_R34). Le seul dépendant, le 041, avait déjà repassé cette
      dépendance en note le 2026-09-17 : aucun déblocage en cascade à annoncer. HISTORIQUE
      CI-DESSOUS, inchangé. Ouvert le 2026-09-11 à la demande de l'auteur ; LES TROIS POINTS DE CODE SONT LIVRÉS le
      2026-09-11 (détail en fin de note), le reste tient à une mesure aujourd'hui impossible.
      Préalable BLOQUANT de
      l'architecture mémoire proposée (docs/arch/memory-stm-ltm.md, partie III) : il ne
      construit aucun de ses quatre lots, il tranche les trois points qui touchent au protocole
      de mesure. (1) CORRIGÉ le 2026-09-11 après relecture de l'auteur : la première rédaction
      annonçait que 70,6 % des agent-jours ne franchissent pas le seuil de réflexion, sur la foi
      du run 2026-07-08_08_54 — CHIFFRE FAUX, ce run mesure 1,80 déplacement par agent-jour quand
      le manifeste scellé v5 en prévoit 3,30 par persona et 3,69 par mobile (enquête EMC² : 3,53
      et 3,95). Le run est antérieur à la correction de chaîne cyclique du ticket 045 (+37 %) et
      sous-exécute son propre plan. Reconstruit sur la source de vérité : à 6,34 entrées par
      déplacement, un agent mobile produit ~23 entrées par jour et franchit le seuil DEUX FOIS
      par jour. Ce qui subsiste, plus faible mais réel : le moment de la consolidation est une
      fonction du nombre de déplacements de l'agent, donc la position d'un choc par rapport à la
      consolidation est une variable NON CONTRÔLÉE de l'expérience, et la décision ne lit que la
      mémoire longue. Le plancher journalier reste justifié parce qu'il rend le calendrier
      déterministe et protège la queue basse. Le taux réel d'entrées est à MESURER sur un run
      courant avec GAMA : aucun run exploitable ne le permet aujourd'hui (le seul avec
      observations précède la v5, les récents sont hors simulateur).
      (2) La normalisation min-max par composante rend le paramètre d'oubli presque inopérant :
      l'ordre par ancienneté lui est invariant, seul l'espacement bouge (apport au score à 3
      jours : 0,085 contre 0,138 selon λ), si bien que le critère de réfutation (ii) du bras de
      sensibilité peut se déclencher pour une raison technique. (3) memory_decay_lambda et
      memory_horizon_days, déclarés dans experiments.yaml, ne sont lus par AUCUN code — le bras
      λ÷3 n'est pas exécutable. DÉCISIONS DE L'AUTEUR le 2026-09-11 : une réflexion par jour
      simulé au minimum indépendamment du remplissage, l'idéal visé étant une par déplacement
      sous réserve de coût ; normalisation min-max abandonnée. PROPOSÉ pour arbitrage : le
      paramètre d'oubli devient une constante de temps EN JOURS (S = 1/λ ; défaut 2,8 jours qui
      reproduit exactement la décroissance en service, bras principal 2,5, sensibilité 7,7), un
      paramètre en jours étant le seul qui se discute devant un relecteur. COÛT chiffré, et il
      renverse l'intuition DANS L'AUTRE SENS. La grandeur de référence est l'APPEL MÉMOIRE PAR
      DÉPLACEMENT, seule indépendante de la population et de l'horizon, auto-réflexion longue durée
      comprise (894 appels sur 5 jours, identiques dans tous les régimes) : aujourd'hui 0,69 ; une
      par jour SEULE 0,33, soit MOINS cher qu'aujourd'hui (−22 % sur le total) puisque le seuil
      volumétrique déclenche déjà deux consolidations quotidiennes ; plancher journalier, le régime
      retenu, 0,69 à 0,96 (0 à +16 %, la borne haute supposant que tous les agents ont besoin du
      plancher chaque jour, ce qui est faux — la valeur réelle est proche de la borne basse) ; une
      par déplacement 1,05, soit +22 % sur le total et non +52 %.
      Sous ce régime les réflexions sont la moitié du volume, ce qui rend légitime la piste des
      huit modèles LM Studio déjà déclarés — mais l'admission d'un modèle local est CONDITIONNÉE
      à une mesure sur jeux gelés (conformité au schéma, accord sur le niveau nommé et les axes,
      et surtout écart en aval sur les distributions de probabilité modale), jamais accordée
      parce que c'est moins cher. La décision, elle, n'est pas candidate : c'est la grandeur que
      l'article mesure. LIVRÉ le 2026-09-11, les trois points de code : plancher journalier de
      consolidation à 22 h (stm_reflection_daily_floor_*), normalisation min-max supprimée du
      classement au profit de valeurs absolues, et constante de temps d'oubli EN JOURS
      (long_term_retrieval__force_base_jours = 2.8, qui reproduit l'ancienne base 0,7 à 1e-3).
      15 tests neufs (test_048_calendrier_et_oubli.py), suite complète verte à 861 tests.
      RESTE À FAIRE : mesurer le taux réel d'entrées par agent-jour sur un run courant avec
      GAMA avant de trancher entre plancher et régime par déplacement (action 2) ; convertir les
      déclarations memory_decay_lambda / memory_horizon_days d'experiments.yaml vers le nouveau
      paramètre (action 4, partie données) ; instruire la piste des modèles locaux (action 5).
      BLOQUE l'expérience d'hystérésis tant que les actions restantes ne sont pas faites.
      DÉPEND DE : aucun ticket — sa mesure manquante — le taux d'entrées par agent-jour — demande
      un run GAMA courant, qu'il peut lancer lui-même : aucun ticket ne le lui doit.
      CLÔTURE DU 2026-09-21, ce qu'elle emporte : l'intérêt AAMAS ⭐⭐⭐⭐ que portait le triage
      retiré ne disparaît pas, il passe au 095 avec le lot F — le calendrier de consolidation
      décrit au § 3.4 est tranché et en service, et c'est désormais le 095 qui BLOQUE l'expérience
      d'hystérésis du chapitre 7. Le ticket .md porte un bandeau de clôture en tête avec le
      tableau de répartition, et ses cinq actions sont annotées une à une (livré / repris au 095).
      ARTICLE MIS À JOUR LE 2026-09-21, sous accord explicite de l'auteur via la skill
      article-verrou : le chapitre 7 FR (note de travail, point 6) nomme désormais le lot F4 du
      095 au lieu du 048 comme porteur du blocage, et les listes « Tickets associés » du FR et de
      l'EN portent la clôture du 048 et la ligne du 095. Cinq passages, deux fichiers ;
      `make paper-style` vert sur les deux (0 écart bloquant, 1,2 cadratin et 4,9 gras pour 1000
      mots). Le blocage lui-même n'est PAS levé : la conversion d'experiments.yaml reste à faire.
  ticket_049_itineraire_mixte_limite_a_publier:
    status: terminé
    category: Rédaction & Publication
    note: >-
      Ouvert le 2026-09-12, rien n'est écrit. Porte le LOT 5 du ticket 022, clos le même jour :
      publier la limite, sans toucher au code. LE FAIT : OTP est interrogé mode par mode, donc le
      jeu d'options ne contient AUCUN itinéraire mixte (ni voiture + parking-relais + métro, ni
      vélo + TER), alors que l'enquête en compte et les range presque tous en transports collectifs
      (760 des 770 déplacements voiture + TC, et les 58 vélo + TC). Une part de la cible TC est
      donc hors d'atteinte PAR CONSTRUCTION : 1,41 pt globalement, mais jusqu'à 22 / 31 / 28 % de
      la cible par couronne (1ʳᵉ, 2ᵉ, 3ᵉ) et 39 / 59 / 64 % par tranche de distance (10-20,
      20-50, plus de 50 km). Le chiffre global est trompeusement rassurant, c'est l'erreur que le
      ticket 020 a trouvée trois fois. LA MOITIÉ NEUVE, ET ELLE RENVERSE LA LECTURE DU 022 : la
      limite ne pénalise PAS le modèle aujourd'hui. Mesuré le 2026-09-12 sur 17 exécutions, la
      simulation sur-produit les TC sur les longues distances, et neutraliser la cible ne
      rapporterait 0,000 pt aux bras LLM mais +2,2 pt aux baselines dégénérés. Il faut donc écrire
      la limite AVEC SON SENS — sans quoi le lecteur croit qu'elle joue contre le modèle. QUATRE
      TRAVAUX : deux paragraphes au chapitre 8 de l'article (fr ET en), le classement des lots 2 à
      4 consigné dans perimetre-population.md § A7 qui promet encore un trait qui n'existera pas,
      l'occasion de re-mesurer (ticket 025, changement d'offre), et ne pas transporter le
      raisonnement au ticket 021 dont la correction dégrade le score. ⚠ TOUCHE L'ARTICLE : passe
      par la skill `article-verrou`, diff présenté et accord explicite. Hors périmètre : produire
      les itinéraires mixtes (autre ticket, coûteux), la SUR-PRODUCTION de TC sur les longues
      distances (36 % contre 13 % — problème en soi, plus gros, à traiter à part), la chaîne de
      véhicule d'un rabattement (008, 014).
      ÉCRIT DANS L'ARTICLE le 2026-09-17, ce qui lève la réserve « terminé — à vérifier » que le
      README du dossier fr portait depuis la clôture : le statut disait terminé alors que le texte
      n'avait pas intégré la limite. C'est fait. Le § 8.1 de docs/paper/article/fr/08_limits_and_hybrid.md
      porte les deux moitiés en quatre paragraphes, diff présenté et accepté en session sous la skill
      `article-verrou`. L'amplitude par strate y est, 1,41 pt globalement puis 3 / 22 / 31 / 28 % par
      couronne et 39 / 59 / 64 % par tranche de distance, et le profil des déplacements concernés.
      Le sens y est aussi, mesuré sur les dix-sept exécutions : 27 à 36 % de masse en TC sur 20-50 km
      contre une cible de 13 %, 42 à 47 % au-delà de 50 km contre 12 %, gain nul de la neutralisation
      pour les trois modèles de langue contre 2,17 à 2,19 pt pour les deux planchers dégénérés. Le
      quatrième paragraphe ajoute la lecture en profil EMD, où la neutralisation dégraderait le score
      au lieu de le laisser inchangé. Critère d'acceptation non tenu, et il ne le sera pas
      maintenant : les fichiers fr/ et en/ devaient être annoncés ensemble, mais en/08 n'existe pas
      et le README de l'article fixe le français d'abord, l'anglais en fin de parcours. Restent
      ouverts les deux points qui ne dépendent pas de l'article : perimetre-population.md § A7 promet
      toujours le trait `rabattement_plausible`, et l'occasion de re-mesurer n'est pas consignée.

