      aamas: 4

  ticket_075_journal_de_memoire_et_run_60_jours:
    status: terminé
    category: Expériences & Cognition
    note: >-
      Ouvert le 2026-09-14. Rendre LISIBLE l'évolution de la mémoire des agents sur un run long,
      et produire ce run : cinq habitants, soixante jours simulés, gemini-3.1-flash-lite seul,
      mémoire et auto-réflexion actives. Le 071 a livré le mécanisme et l'a validé par 249 tests
      unitaires ; aucun ne dit ce que la mémoire DEVIENT quand elle vit soixante jours. Quatre
      chantiers. (1) PROGRESSION MÉTÉO — seul changement de mécanisme : la date tirée par agent
      devient un jour de DÉPART, avancé d'un jour calendaire par jour simulé. Le dispositif du 023
      était conçu pour une journée unique ; sur soixante jours il faisait relire soixante fois le
      même bulletin. Remplacement décidé par l'auteur, mais ancré sur le premier instant du run :
      au jour 1 l'écart vaut zéro et la date rendue est EXACTEMENT celle d'avant, donc les
      expériences d'un jour déjà scellées rejouent la même météo. (2) JOURNAL DE MÉMOIRE — un
      Markdown par agent, écrit en continu : motif de chaque consolidation (seuil / plancher /
      rupture), entrées consommées, avant/après de chaque opération de concept, état complet de la
      mémoire après. Éteint par défaut, jamais d'exception vers l'appelant. (3) REPRISE À CHAUD —
      point de reprise quotidien à 3 h simulées, puis rejeu à MÉMOIRE GELÉE : sans cela, CONT=1
      retrouve la mémoire pleine pendant que GAMA rejoue depuis t0, et les jours rejoués
      doubleraient épisodes et compteurs. (4) POPULATION DE TEST à cinq profils contrastés,
      prélevés tels quels dans le sceau v6 — PAS un sceau, la référence de l'article reste v6.
      À VÉRIFIER SUR PIÈCES : l'image gamaplatform/gama:2025.06.4 embarque gama.extension.serialize,
      donc repartir au jour k sans rejeu est possible en principe ; la phrase « GAMA ne sait pas
      geler son état » de quickstart.md date du 002 et n'est plus vraie pour cette version.
      ⚠ 2026-09-16, à savoir avant de relancer : jusqu'à ce jour, la consigne « ce run n'utilise
      que tel modèle » ne portait QUE sur les décisions. Les deux autres appels du run — réflexion
      à court terme et auto-réflexion à long terme — partaient sans consigne et étaient servis
      selon la priorité de la passerelle, qui commence par Mistral. Mesuré sur le run du matin : 5
      décisions servies par gemini 3.1, la consolidation mémoire servie par Mistral. Sur un ticket
      dont l'objet EST la mémoire, l'objet mesuré était donc fabriqué par un modèle non déclaré,
      et aucun journal ne le disait. Corrigé le même jour (ticket 087) : la consigne est portée
      par le client de la passerelle, seuil unique des trois appels. CONSÉQUENCE : le run de 30
      jours déjà produit, et le rapport du 077 qui en découle, ont une mémoire écrite en partie
      par un autre modèle — le run long est à produire APRÈS cette correction.
      CLOS LE 2026-09-21, décision de l'auteur, LE RUN DE 60 JOURS N'A PAS ÉTÉ PRODUIT — et
      il ne le sera pas depuis ce ticket. Le dispositif est livré et reste acquis : progression
      météo, journal de mémoire par agent, reprise à chaud à mémoire gelée, population à cinq
      profils. C'est le cinquième chantier, le run lui-même, qui est abandonné. VÉRIFIÉ SUR
      PIÈCES le 2026-09-21, amplitude simulée et nombre d'agents recalculés depuis les
      `moves.csv` de tous les runs portant `population_5_memoire_075` : le seul run long à cinq
      habitants est `experiments/archive/2026-09-14_23_58`, 32,6 jours simulés, 514 décisions —
      celui-là même que la note ci-dessus déclare disqualifié, puisqu'antérieur à la correction
      du 2026-09-16 (ticket 087) et donc doté d'une mémoire écrite en partie par Mistral. Les
      autres runs à cinq agents plafonnent à 15,1 j (2026-09-15_10_03) et 11,1 j
      (2026-09-16_15_58) ; TOUT CE QUI TOURNE DEPUIS LE 18 SEPTEMBRE EST À UN SEUL AGENT — le
      bras choqué du 077, 19 à 40,6 jours. AUCUN RUN À CINQ AGENTS APRÈS LE 2026-09-17.
      CE QUI RESTAIT ET QUI N'EST PAS FAIT, pour la session qui voudrait le reprendre : (a) le
      run 60 j × 5 agents sous `gemini-3.1-flash-lite` seul ; (b) l'arbitrage du lot D1 du
      ticket 077 — servir l'auto-réflexion dans le bloc noyau ou l'éteindre
      (`docs/tickets/ticket_077…md:352` et `:366`) — qui reste ouvert AU 077 et n'est pas
      emporté par cette clôture, puisqu'il change le contenu du prompt de décision. Aucun
      ticket ne portait `DÉPEND DE : 075` : cette clôture ne débloque rien en cascade. Le 070
      reste bloqué par le 077, pas par celui-ci.
