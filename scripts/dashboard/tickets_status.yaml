      population RP 2022 du cadre, paramètre exposé par l'API et par le notebook, garde-fou
      qui LÈVE sur un cadre vide. (3) CHARGEMENT livré : le filtre d'admission porte sur le
      PÉRIMÈTRE (trait `residence_zone`), repli sur la bbox AVEC ALARME quand le trait manque,
      rejets comptés par motif ; le filtre reste sur les 453 même quand le cadre est restreint
      au 31, pour ne pas graver la limitation dans le runtime. 30 tests.
      ANCIENNE ANALYSE, CONSERVÉE POUR MÉMOIRE. (1) le piège du snap (invalidé ci-dessus) :
      `llm_agents` snappe sur l'enveloppe convexe des arrêts OTP (+0,02°) et `identity.home`
      prend les coordonnées POST-SNAP ; le GTFS monté est Tisséo seul (lat 43,40-43,75), donc
      un domicile de 3ᵉ couronne à 60 km serait DÉPLACÉ jusqu'au bord, et la couronne du 021
      annoncerait la commune du bord. Voies : GTFS régional liO, ou ne pas snapper hors zone
      TC en journalisant l'absence d'offre. Le réseau ROUTIER suffit déjà (pbf 0,55-2,25 /
      42,86-44,09 ⊃ périmètre). (2) GÉNÉRATION, version light : `departments: ["31"]` reste
      INCHANGÉ (c'est ce qui rend la version légère) ; remplacer `_communes_from_bbox` par la
      liste des INSEE de `commune_couronne.json` FILTRÉE sur le préfixe 31, soit 346 communes.
      Garde-fou à écrire : le filtre ÉCHOUE si la liste est vide ou ne recoupe pas
      `departments`, sinon une faute de frappe ferait retomber en silence sur tout le
      département — le mécanisme existe déjà, la config synpp accepte
      `"communes"` ; `sampling_rate` devient juste sans autre changement ; données à étendre :
      BAN (adresses-31 seul → 5 fichiers de plus, trivial) et surtout BD TOPO (D031 = 2,0 Go
      → ≈ +10 Go, LE coût matériel) ; RP 2022, FILOSOFI, IRIS, codes, ENTD sont déjà
      nationaux. (3) LE VERROU DU CHARGEMENT : `factory.py:151` calcule world_bbox = arrêts
      GTFS ± 0,05° et `load_population` écarte tout domicile dehors — cette bbox ne contient
      que 221/453 communes et 51/277 zones fines de 3ᵉ couronne (47,9 % de la surface). Sans
      ce changement, une population conforme serait RE-TRONQUÉE DE MOITIÉ au chargement et
      l'étage 2 n'aurait servi à rien. Le filtre devient un filtre de PÉRIMÈTRE (le trait
      `residence_zone` du 021 le rend gratuit), et la `WorldGrid` — qui assertionne que toute
      localisation est dans son rectangle — doit être découplée du filtre et calée sur
      l'emprise du périmètre.
      CRITÈRE D'ACCEPTATION LE PLUS SIMPLE, DÉJÀ OUTILLÉ : `make residence-zone CHECK=1` passe
      du code 4 au code 0. Puis nouveau jeu gelé (v9) et re-chiffrage ; le ticket 025 ne
