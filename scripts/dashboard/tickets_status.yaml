  ticket_073_reproductibilite_prompt_calibre_multi_graines_multi_populations:
    status: en cours
    category: Expériences & Cognition
    note: >-
      Ouvert le 2026-09-14. Évaluation de la reproductibilité et de la robustesse stochastique
      des performances exceptionnelles obtenues par Gemini 3.5 avec prompt calibré (expert_gem_3.8_v2,
      composite 5,34). Les mesures historiques ne reposant que sur une population scellée (v5)
      et un seul seed (42), ce ticket formalise un diptyque expérimental complet : Axe 1 (iso-population,
      multi-seeds 42, 123, 456, 789, 2026 pour mesurer la dispersion résiduelle du LLM et le churn
      décisionnel individuel) et Axe 2 (iso-seed, multi-populations avec 3 à 5 cohortes synthétiques
      répliquées de 1 000 agents pour tester la généralisation hors échantillon). Décomposition de
      variance Two-Way ANOVA pour quantifier précisément la part de hasard vs l'échantillonnage de population.
      RECTIFICATIF 2026-09-15 (ticket 080) : le composite 5,34 reposait sur un journal tronqué à
      274 lignes ; rescoré sur les 3 299 décisions il vaut 6,17 (v5), et 5,30 pour le même prompt
      sur v6 — DERRIÈRE les quatre familles tabulaires, à +0,98 [−0,26 ; +2,39] apparié du lgbm.
      L'écart-type apparié d'échantillonnage de cohorte (≈ 0,7 à N = 1 000) ne baisse pas avec les
      graines : l'axe 2 pèse plus que la cinquième graine. Première mesure à faire : rejouer pe04
      sur v6 à l'identique (même graine).
      ⛔ DÉPEND DE : 088 — jouer la reproductibilité avant le rejeu, c'est produire des mesures à
      jeter : le substrat vient de changer de date. Statut passé à `bloqué` le 2026-09-16 : le
      ticket ne peut pas être ENTIÈREMENT fait avant la fin de ce ou ces tickets. DÉBLOQUÉ le 2026-09-17 : le ticket 088 est terminé, le substrat de référence est `population_1000_AAMAS_v6_20260316_EN_c` — une mesure de reproductibilité ne sera plus à jeter.


      AVANCE DU 2026-09-18, spec seulement, aucune mesure : le ticket porte désormais un AXE 0 —
      réplicat à l'identique, demandé par l'auteur le même jour. Deux exécutions du MÊME bras,
      même modèle, même prompt, même jeu, mêmes trois graines, et comparaison des MASSES de
      probabilité que le modèle attribue aux modes, pas seulement du mode retenu. Il passe avant
      l'axe 1 parce qu'une graine change l'ordre des sollicitations, le tirage et le calendrier :
      la dispersion inter-graines mélange le non-déterminisme du fournisseur et l'aléa du
      dispositif, et l'axe 0 ne change rien du tout. VÉRIFIÉ SUR PIÈCES, le bras est exécutable
      sans une ligne de code : `experiences lancer` sans `--reprendre` crée une seconde exécution
      (cli.py:640), le registre liste une ligne par exécution (registre.py:135), et le cache
      sémantique est éteint par construction dans ce chemin (`settings.cache.enabled = False`,
      cli.py:583, RG-2) — le second passage redemande réellement au modèle. PIÈGE NOMMÉ : avec
      `--reprendre`, les décisions archivées sont resservies sans sollicitation (runner.py:600) et
      le bras ne mesure rien. TÉMOIN DE DÉTERMINISME DÉJÀ ACQUIS : `exp_rf_…_EN_c_nosim` porte
      deux exécutions (2026-09-16_13_53_48 et 15_52_59) au composite strictement identique (4,09 /
      5,81 hors choix unique / L1 38,33), donc tout écart du réplicat LLM appartient au modèle.
      CADUCITÉ CORRIGÉE : le rectificatif du 15/09 demandait ce rejeu sur `pe04`, variante
      SUPPRIMÉE le 2026-09-17 ; le réplicat porte sur `prompt_expert_05`, exécution de référence
