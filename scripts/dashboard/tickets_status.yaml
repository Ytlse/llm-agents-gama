  ticket_070_accidents_aleatoires_sur_les_axes:
    status: bloqué
    note: >-
      Ouvert le 2026-09-14, RIEN N'EST ÉCRIT — le ticket est d'abord un état des sources et
      trois constats de faisabilité, les lots de code ne commencent qu'après une décision
      humaine (lot 0). DEMANDE : faire survenir des accidents au hasard sur les axes, avec une
      probabilité conditionnée à l'heure, au jour, à la météo et au type d'axe, et un retard
      subi par les déplacements concernés. LA SOURCE EXISTE ET ELLE EST BONNE : BAAC/ONISR sur
      data.gouv (Licence Ouverte, 2005-2024, 4 CSV), dont le conditionnement recouvre presque
      exactement ce que la simulation a déjà — hrmn, date, atm (9 modalités), surf, lum, catr,
      agg, vma, lat/long. MESURÉ le 2026-09-14 sur 2019-2024 (trace
      2026-09-14_06-45_accidentalite_baac_haute_garonne, script rejouable) : 3 789 accidents en
      Haute-Garonne sur six ans, soit 1,73 par jour ; 2024 géolocalisé à 100 % ; pointe à 17 h
      (370) contre 55 à 3 h ; vendredi 643 / dimanche 451. TROIS CONSTATS QUI DÉCIDENT DE LA
      CONCEPTION. (1) Les agents GAMA en voiture et à vélo se déplacent À VOL D'OISEAU
      (Inhabitant.gaml:54, le TODO « se déplacer le long des routes OSM » est toujours là) à une
      vitesse calée sur la durée planifiée (l.390) : un accident posé sur une route ne peut
      ralentir personne côté GAMA. Le seul endroit qui connaisse les arêtes empruntées est
      _congested_travel_time (osmnx_direct.py:606), qui module déjà arête par arête avec la table
      TomTom — l'accident a la même forme, c'est là qu'il entre. (2) Le cache d'itinéraires OSMnx
      est adressé SANS LA DATE (make_key: version|jour de semaine|créneau|mode|coordonnées) : une
      durée contenant un accident serait resservie à tous les mardis 8 h. Le surcoût s'applique
      APRÈS la lecture du cache, jamais dedans. (3) VARIANCE QUASI NULLE : à fréquence réelle,
      0,60 déplacement touché par journée simulée à 1 000 agents — le défaut exact que le ticket
      023 a rencontré sur la météo, et que weather_draw a résolu par un tirage par agent. Un
      effet mesuré à zéro ne prouverait rien. À TRANCHER AVANT LE CODE (lot 0) : source par axe
      ou par type d'axe. ARBITRÉ LE 2026-09-14 : accident SUBI d'abord, et en entier — retard ET
      souvenir, la GRAVITÉ (usagers.grav) modulant les deux (9,1 % des accidents du 31 sont
      mortels, 49,9 % comptent un hospitalisé, et la départementale tue 3 fois plus que la voie
      communale) ; rapprochement PAR TYPE D'AXE, obtenu en accrochant l'accident géolocalisé à
      l'arête OSM et en lisant son tag highway, catr servant de contrôle croisé dont le taux de
      désaccord se publie ; PAS DE MISE EN CACHE d'un itinéraire perturbé — calcul à froid quand
      un événement est actif, ce qui ouvre en prime le CONTOURNEMENT que le surcoût a posteriori
      interdisait ; retard construit en TROIS FACTEURS (durée de blocage ← gravité, perte de
      capacité ← nombre de voies, facteur de temps de parcours) exprimé sur l'échelle de la table
      TomTom plutôt qu'en minutes absolues. RESTE À TRANCHER : le régime, et si le souvenir nomme
      la gravité. RÉGIME TRANCHÉ : réaliste, MONDE PARTAGÉ — l'accident est un objet situé, pas un
      tirage par agent, et la conséquence est acceptée : le tirage aléatoire ne portera aucune
      figure (0,6 déplacement touché par journée ; il faudrait 136 376 déplacements retardés par
      accident pour en toucher 5 %). La mesure vient de l'événement POSÉ — même mécanisme, même
      monde, autre déclenchement, protocole du ticket 059. RETARD SIMPLIFIÉ : il ne dépend que de
      la GRAVITÉ, six nombres pour trois niveaux (durée de blocage, ralentissement) exprimés sur
      l'échelle de la table TomTom ; le nombre de voies est abandonné faute d'abaque vérifiée.
      QUATRIÈME SOURCE TROUVÉE le 2026-09-14, et c'est celle qui manquait : le flux DATEX II des
      DIR (« Événements routiers sur le réseau routier national non concédé », Bison Futé,
      Licence Ouverte v2.0) publie les accidents SANS BLESSÉ et les bouchons, avec position et
      horodatages. Vérifié : 399 situations ouvertes, 23 accidents, 33 événements dans la boîte
      toulousaine, A0620/A0621/A0624/A0064/A0068 présentes (DIR Sud-Ouest). Par la loi de Little,
      ≈ 276 accidents/jour sur le seul RRN non concédé contre 149 accidents CORPORELS par jour en
      France entière : c'est bien la population que BAAC ne voit pas. TROIS LIMITES : c'est un
      flux et non un historique (overallEndTime vide tant que l'événement est ouvert — les durées
      se CONSTITUENT en interrogeant le flux), aucune gravité, et ni les autoroutes concédées
      (Vinci ne publie que ses parkings de covoiturage) ni le réseau urbain n'y sont. DEUX
      TRAVAUX À LANCER EN PREMIER : l'archivage du flux (latence incompressible de plusieurs
      semaines) et le comptage d'exposition sur une exécution archivée — sous ~100 trajets
      touchés par l'axe visé, aucune figure n'est annonçable (demi-IC ± 7,8 pt à 100, ± 3,9 pt à
      400). SUR L'EXPOSITION, LE PROBLÈME N'EST PAS LA FIDÉLITÉ MAIS LA TAILLE : 1 000 agents pour
      1,43 M d'habitants = un échantillon à 0,07 %, donc un nombre de trajets touchés fidèle et
      inutilisable. Les seuls leviers compatibles avec le monde partagé sont d'élargir la cohorte
      (linéaire en appels LLM) ou d'allonger l'horizon (qui casse le ceteris paribus de la
      mémoire) — jamais de gonfler la fréquence. CLASSIFICATION SIMPLIFIÉE : par VITESSE
      AUTORISÉE plutôt que par type d'axe — vma est renseignée à 99,1 % sur le 31 (50 km/h =
      48,9 %, ≤ 30 = 17,7 %, 80-90 = 26,0 %) et chaque arête du graphe porte déjà une vitesse
      (OSM maxspeed, sinon la table speeds d'osmnx.yaml) : un nombre des deux côtés, aucune table
      de correspondance à inventer. Croisée avec agg (déjà aligné sur les zones de congestion) et
      normalisée par les KILOMÈTRES DE RÉSEAU de chaque classe — calculables en interne, ce qui
      donne un taux au lieu d'un compte sans avoir besoin de comptages de trafic (⚠ pas un risque
      par véhicule-km : un km de rocade porte plus de véhicules qu'un km de rue). catr n'est plus
      qu'un contrôle de qualité d'appariement. LA GRAVITÉ RESTE INTERNE : elle sert uniquement à
      tirer une durée de blocage, et seules des MINUTES sortent du moteur — un conducteur coincé
      ne sait pas s'il y a eu un mort. Rien dans le prompt, rien dans le souvenir, rien dans les
      clés de cache, et l'objection de suggestion lexicale (condition C3 du ticket 059) tombe
      d'elle-même. DISTINCTION POSÉE LE 2026-09-14, ET ELLE STRUCTURE TOUT : AVOIR un accident
      (2,3 usagers impliqués par événement ; 0,0025 agent par journée simulée à 1 000 agents, soit
      403 674 agent-jours pour en voir un — HORS PÉRIMÈTRE, chiffré et non plus par préférence)
      n'est pas SUBIR un accident (des centaines de conducteurs derrière ; 0,6 déplacement par
      journée simulée — LE SUJET du ticket). Les données le confirment : le flux DATEX distingue
      les enregistrements Accident des AbnormalTraffic (43 queuingTraffic + 5 slowTraffic sur 48),
      et ne les relie QUE PAR EXCEPTION — 0 des 48 trafics anormaux partageait sa situation avec un
      accident à 9 h 13, 1 sur 7 à 11 h le même jour (⚠ et le compte d'accidents ouverts passait de
      23 à 14 en deux heures : un instantané n'est pas une mesure). Donc BAAC dit à quelle fréquence et où, le flux dit combien de temps et à quel
      point, et le lien « ce bouchon vient de cet accident » comme le lien « gravité X → durée Y »
      restent des HYPOTHÈSES DÉCLARÉES — calées sur une échelle mesurée, pas résolues. SENS DE LA
      TABLE ARCHIVÉE : une ligne = la vie d'un événement publié, la grandeur est une DURÉE DE
      PUBLICATION (proxy de la gêne, les deux bornes portant leur retard de saisie) ; elle donnera
      la distribution des durées de bouchon (l'échelle du retard), le rapport événements/corporels
      (le facteur des accidents matériels), le profil horaire sur la rocade (contrôle indépendant
      de la loi BAAC) et les axes concernés. À QUOI SERT CETTE TABLE, EN UNE PHRASE : à ce que
      l'ampleur du traitement ne soit pas inventée — dans l'événement posé, LE RETARD EST LE
      TRAITEMENT, et tout l'effet mesuré sera l'effet de N minutes perdues ; sans elle, la seule
      réponse au relecteur qui demande d'où sort N est « nous l'avons choisi ». Dans le tirage
      aléatoire en revanche, le retard ne porte aucune figure : ce n'est pas une raison de s'en
      passer, c'en est une de NE PAS ATTENDRE la table pour avancer. ⚠ SOLIDITÉ AU 2026-09-14 :
      tout ce qui est chiffré ici est mesuré et rejouable (trace + deux scripts) ; trois choses ne
      sont pas vérifiées, et ce sont L'OBJET MÊME DE L'EXPÉRIENCE, formulées en hypothèses avec
      leurs issues déclarées d'avance. H1 — un retard vécu modifie la décision suivante (l'issue
      « le souvenir remonte et ne pèse pas » EST un résultat publiable : un agent LLM doté d'une
      mémoire n'en fait pas forcément quelque chose) ; H2 — l'exposition suffit pour conclure
      (≥ 400 trajets touchés = une figure ; 100-400 = une figure à intervalle large ; < 100 =
      l'effet ne se mesure pas à cette échelle, et on écrit la cohorte qu'il aurait fallu) ; H3 —
      l'appariement accident → arête est fidèle (un taux de désaccord élevé oblige seulement à
      remonter d'un cran, commune ou classe de vitesse déclarée). L'ORDRE reste inchangé, non pour
      éviter de perdre du temps mais pour DIMENSIONNER : H1 et H2 fixent cohorte, horizon et axe
      visé. ✅ H2 EST TRANCHÉE DEPUIS LE 2026-09-14 (lot 0 bis fait, trace
      2026-09-14_11-20_exposition_rocade_lot0bis, script rejouable) : sur SEPT exécutions
      archivées à 1 000 agents, les trajets voiture partant entre 7 h et 9 h dont l'itinéraire
      recalculé emprunte l'A 620 sont au nombre de 38,5 PAR JOURNÉE SIMULÉE en médiane (étendue
      20,5 – 100,5 ; taux de traversée médian 18,2 %, étendue 13,5 – 28,5 % ; 218 trajets voiture
      dans la fenêtre par journée en médiane). C'est l'ISSUE « < 100 » : l'effet ne se mesure pas
      à cette échelle, et une seule exécution sur sept franchit le seuil. MAIS LA COHORTE REQUISE
      EST TROIS FOIS PLUS BASSE QUE L'ILLUSTRATION DU TICKET (« 5 700 à 29 000 agents ») :
      ≈ 2 600 agents pour une figure à intervalle large, ≈ 10 400 pour une figure annonçable —
      le ticket n'est pas hors d'atteinte, il est hors d'atteinte À 1 000 AGENTS. ÉLARGIR L'AXE
      NE SAUVE RIEN, chiffré : + A 621/A 624 fait passer le taux de 17,1 % à 18,7 %, + M 980
      « Rocade Arc-en-Ciel » à 19,7 % — 2,6 points pour le double d'arêtes, donc l'A 620 seule
      reste la définition retenue. LA MESURE EST EXACTE, PAS APPROCHÉE : le pipeline choisit le
      chemin en temps LIBRE (osmnx_direct.py:754) et n'applique la congestion TomTom qu'APRÈS sur
      le chemin déjà choisi (l. 787), donc nearest_nodes + shortest_path le rejouent à l'identique
      hors ligne ; l'origine, non journalisée, est reconstruite comme l'activité précédente et
      contrôlée par le détour (médiane 1,38-1,41 partout, ~97 % des trajets cohérents). ⚠ LA
      LIMITE QUI COMPTE : l'extrapolation aux grandes cohortes N'EST PAS MESURÉE. La seule
      exécution archivée au-dessus de 1 000 agents (2026-06-03_05_40, 10 000 agents) est
      INEXPLOITABLE — son moves.csv est antérieur aux colonnes ID Personne / ID Activité, donc
      sans O/D récupérables, et les 279 exécutions jointables sont toutes à 1 000 agents. Les
      tailles « 2 600 / 10 400 » supposent la linéarité de p en N, plausible (la cohorte reproduit
      les marges de l'enquête) mais non vérifiée : AUCUNE FIGURE NE DOIT S'Y APPUYER avant une
      exécution à cohorte élargie, et c'est désormais le PREMIER GESTE du chantier, avant le
      mécanisme. ✅ LE RETARD EST LIVRÉ LE 2026-09-15 (travail C), AVEC SES DEUX GARDES DANS LE
      MÊME GESTE (D et E) — un test tombe si l'un des trois disparaît. L'accident multiplie le
      temps de parcours de l'arête qu'il occupe, dans _congested_travel_time : le seul endroit
      qui connaisse les arêtes empruntées, et la durée y gouverne la vitesse de l'agent
      (Inhabitant.gaml:390) malgré le vol d'oiseau. GARDE 1, cache d'itinéraires : ni lecture
      ni écriture tant qu'un accident est actif — volontairement grossière, on ne connaît pas
      le chemin avant de l'avoir calculé ; coût une à trois heures par journée simulée de
      routage à froid. GARDE 2, cache de décisions : la signature des accidents actifs entre
      dans extra_key — quatrième occurrence du même piège dans le dépôt. ⚠ L'AMPLEUR DU
      RALENTISSEMENT EST UNE HYPOTHÈSE DÉCLARÉE (facteur_ralentissement), aucune source ne la
      donne tant que le flux DATEX n'est pas archivé : tout effet mesuré sera l'effet de CE
      nombre et se publie avec le résultat. L'AGENT NE CONTOURNE PAS (chemin choisi en temps
      libre avant le surcoût). ✅ POSE MANUELLE LIVRÉE (travail F) : bouton « Poser un accident
      maintenant » dans l'IHM, catégorie Accidents, et POST /accidents ; accroché à l'arête la
      plus proche, refusé avec alarme si le régime est décoché. C'est de cette pose que
      viendront les figures. RESTE LE SOUVENIR (travail G) : il faudrait que « ce trajet a
      traversé un accident, +N min » remonte du routage jusqu'à l'agent via le TravelPlan, et
      la chaîne mémoire est en refonte (tickets 071, 075) — y écrire maintenant entrerait en
      collision. ⚠ LES RUNS D'AVANT ET D'APRÈS LE 2026-09-15 NE SONT PAS COMPARABLES.
      ⚠ DÉFAUT BASCULÉ À VRAI LE 2026-09-15, sur décision de l'auteur : le régime
      réaliste devient l'ordinaire et c'est sa DÉSACTIVATION qui demande un geste. Conséquence
      assumée — tout run tire des accidents, y compris depuis un sim_params.yaml antérieur qui
      ne porte pas la clé (le repli vaut désormais vrai). INOFFENSIF AUJOURD'HUI puisque aucune
      durée n'est modifiée ; À RÉEXAMINER dès que le retard subi sera branché, car tout run en
      subira alors l'effet sans l'avoir demandé. Les SEPT tickets ouverts qui lancent un run
      GAMA portent un avertissement en tête (018, 032, 033, 048, 071, 075, 079) : vérifier la
      case avant de lancer, et lire accidents_enabled dans le scenario_params.yaml avant
      d'interpréter. ✅ INTERRUPTEUR GAMA LIVRÉ LE 2026-09-14 (spec accidents-interrupteur-gama.md,
      17 tests) : paramètre « Accidents sur les axes » dans l'IHM, FAUX par défaut, persisté dans
      sim_params.yaml, transmis au /init et consigné dans scenario_params.yaml même à faux. Les
      accidents EXISTENT (tirage de Poisson, arête pondérée par la longueur, début et durée) et
      sont journalisés avec leurs compteurs y compris à zéro ; AUCUNE DURÉE D'ITINÉRAIRE N'EST
      MODIFIÉE — ce qui neutralise par construction les deux pièges de cache (itinéraires adressés
      sans la date, décisions indexées sur des codes d'options insensibles aux durées). ⚠ LA LOI
      ✅ TRAVAIL A LIVRÉ LE 2026-09-14 — LE TIRAGE EST DÉSORMAIS REPRÉSENTATIF (trace
      2026-09-14_20-40_loi_accidents_baac, coefficients dans config/accidents_baac.yaml, 25
      tests). Loi estimée sur 3 789 accidents corporels du 31, millésimes 2019-2024, AUCUN non
      géolocalisé, 3 414 dans l'emprise du graphe. TAUX CORRIGÉ : 1,558/jour dans l'emprise et
      non 1,73, qui valait pour tout le département. TROIS CONDITIONNEMENTS : heure (9,77 % à
      17 h contre 1,45 % à 3 h, rapport 6,7 — l'uniforme les égalisait), jour de semaine
      (vendredi ×1,188, dimanche ×0,833), classe de vitesse (`vma` renseignée à 97,9 %).
      LA DÉCISION DE MÉTHODE, ET ELLE VAUT POUR TOUTE LOI GÉNÉRATIVE DU DÉPÔT : une variable
      que la simulation TIRE (heure, jour, classe) se prend sur sa distribution marginale
      d'accidents, SANS dénominateur d'exposition — diviser par le trafic donnerait le risque
      par véhicule-km, qui ferait survenir autant d'accidents à 3 h qu'à 17 h. Seule une
      variable IMPOSÉE (la météo, donnée par le bulletin) réclame un risque relatif, donc un
      dénominateur. LE RÉSULTAT QUI JUSTIFIE LE TRAVAIL : la classe ≤ 30 km/h porte 58,12 % des
      kilomètres du graphe pour 7,95 % des accidents réels, et la classe 71-90 en porte 27,25 %
      pour 4,42 % des kilomètres — le tirage au seul prorata de la longueur plaçait donc 58 %
      des accidents en zone apaisée. Le tirage se fait maintenant en deux temps : classe sur la
      loi BAAC, puis arête au prorata de sa longueur DANS la classe. ⚠ FACTEUR MÉTÉO CALCULÉ
      PUIS REJETÉ, il vaut 1 : l'estimation par exposition donne pluie légère ×0,47, temps
      couvert ×0,17, brouillard ×33,7 — soit « la pluie est plus sûre que la moyenne ». La
      cause est une INCOMMENSURABILITÉ DES NOMENCLATURES (atm est ce que le verbalisateur a
      coché — 84 % de « normale » y compris sous ciel couvert ; la source météo classe 20 % des
      créneaux en « pluie légère », catégorie qui absorbe le code « pluie possible », une
      prévision). Ajuster la correspondance jusqu'à obtenir des nombres plausibles reviendrait
      à choisir le résultat ; la mesure rejetée est conservée dans le fichier pour que le refus
      soit vérifiable. DEUX VOIES PROPRES : une source d'exposition découpée comme atm, ou un
      risque relatif déclaré exogène. CONTRÔLE DU TIRAGE LIVRÉ : un an de journées simulées sur
      le vrai graphe (603 accidents) reproduit la loi à moins de 2 σ sur chaque classe et
      chaque heure.
      UN CAS PRATIQUE entièrement déroulé figure dans le ticket (agent 387324, 19,7 km en
      24 min, accident à 8 h 05 sur l'A620, gravité « blessé hospitalisé » → blocage 45 min et
      facteur 4, contournement par les boulevards à 31 min au lieu de 43, souvenir
      « ralentissement constaté, +7 min » SANS le mot accident), valeurs mesurées et valeurs
      choisies distinguées. (1) L'EXPOSITION N'EST PAS COMPTÉE — combien d'agents traversent un axe donné à la pointe décide si l'événement posé
      peut porter une figure ; une heure de travail sur des fichiers déjà là, et tout le reste est
      conditionnel tant qu'elle n'est pas faite. (2) H1, PERSONNE N'A VÉRIFIÉ QU'UN RETARD CHANGE UNE
      DÉCISION : la chaîne observation → STM → consolidation → LTM → récupération → prompt existe,
      mais rien ne dit qu'un souvenir de ralentissement y survit et y pèse. Testable SANS le
      mécanisme d'accident, en injectant un souvenir à la main sur une cohorte (quelques dizaines
      d'appels, une après-midi) — c'est le LOT 0 TER, et il passe avant l'archivage si les deux ne
      peuvent pas démarrer ensemble : l'archivage a une latence, celui-ci a un verdict. (3) Le
      rapprochement accident → arête OSM n'a pas été essayé. RESTENT DÉCLARÉES, PAS MESURÉES : la
      relation gravité → durée, le facteur de ralentissement, le rapport matériels/corporels
      (loi de Little sur UN instantané — l'estimation la plus fragile du ticket), et les 500
      déplacements retardés par accident du calcul d'exposition. ⚠ BAAC ne recense
      que les accidents CORPORELS — la fréquence est structurellement sous-estimée, cela se
      publie et ne se compense pas. ⚠ Le retard, lui, n'est dans AUCUNE source : c'est un
      paramètre exogène, il passe par docs/arch/protocole-parametre-exogene.md. HORS PÉRIMÈTRE :
      faire rouler les agents sur le graphe routier (ticket à part, gros), l'agent victime, les
      accidents sur le réseau TC, la propagation de congestion, les expériences _nosim.
      ⛔ DÉPEND DE : 077 — le travail G, celui qui fait qu'un agent SE SOUVIENT d'avoir traversé un
      accident, écrit dans la chaîne mémoire — et le ticket dit lui-même qu'y écrire pendant sa
      refonte « entrerait en collision » (refonte portée par le 077, avec le 071 et le 075). Le
      reste du ticket est livré, pose manuelle comprise. Statut passé à `bloqué` le 2026-09-16 :
      le ticket ne peut pas être ENTIÈREMENT fait avant la fin de ce ou ces tickets.
      RECENSEMENT DU 2026-09-21, contre le code et non contre les notes — et il CORRIGE la
      phrase ci-dessus : « le reste du ticket est livré » est INEXACT. FINIR LE 077 NE FINIRA
      PAS CE TICKET ; le 077 ne débloque que le travail G, et DIX autres points restent
      ouverts dont aucun ne dépend de lui. Le détail est au § « Reste à faire » du ticket,
      groupé par ce qui bloque. En résumé : (a) BLOQUÉ PAR 077 — le souvenir du retard ;
      (b) BLOQUÉ PAR UNE DÉCISION DE L'AUTEUR, pas par un ticket — l'ampleur du ralentissement
      (`facteur_ralentissement` est une hypothèse déclarée, pas une mesure) ; (c) RIEN NE
      BLOQUE — la GRAVITÉ n'existe pas (aucun accident tiré n'en porte, le retard est un
      facteur unique, donc le critère « gravité journalisée à côté du retard » est hors
      d'atteinte en l'état), le RAPPORT DE RUN ignore les accidents (run_report.py : zéro
      occurrence ; manquent agents retardés, retard médian et cumulé, et l'[ALARME] quand des
      accidents sont tirés sans toucher personne), le NOMBRE DE CALCULS À FROID provoqués par
      la garde de cache n'est pas journalisé, la GARDE n'a jamais été vérifiée après un run
      réel (le test exerce le prédicat et son branchement sur le TEXTE du module), la
      LINÉARITÉ de l'exposition n'est pas vérifiée, et H1 N'A JAMAIS ÉTÉ TRANCHÉE alors que le
      ticket la voulait tranchée AVANT le mécanisme — le mécanisme a été construit sans cette
      réponse ; (d) EN ATTENTE D'UN DÉLAI, à lancer au plus tôt — l'archivage du flux DATEX
      des DIR (plusieurs semaines de latence, seule source de durées réelles) et l'A/B du
      protocole exogène. CINQ CRITÈRES D'ACCEPTATION COCHÉS le 2026-09-21 avec leur preuve
      (fichier de coefficients, déterminisme du tirage, garde du cache, code unique
      accident/normal, régime écrit dans docs/arch) ; UN CRITÈRE DÉCLARÉ CADUC — le taux de
      désaccord catr/highway, l'appariement étant passé à la vitesse autorisée `vma`.
      ✅ FACTEUR MÉTÉO TRANCHÉ LE 2026-09-21, décision de l'auteur : LA MÉTÉO NE CONDITIONNE PAS
      L'ACCIDENTALITÉ, et ce n'est pas un chantier remis à plus tard mais une limite assumée. LA
      QUESTION ÉTAIT MAL POSÉE et c'est l'auteur qui l'a redressée : on cherchait à mieux
      estimer un coefficient sans vérifier que la condition EXISTE dans le jeu de données servi.
      MESURÉ (trace 2026-09-21_meteo_servie_par_la_simulation, script rejouable) : weather_loader
      ne lit QU'UN fichier, data/weather/meteo_toulouse_12_mois.csv, indexé par (mois, jour) —
      un cycle annuel unique rejoué quelle que soit la date simulée. Sur ses 2 920 créneaux de
      3 h : brouillard 1 (0,03 %), neige/grésil 4 (0,14 %), pluie réelle 239 (8,18 %), pluie
      POSSIBLE — code 176, une prévision — 422 (14,45 %), couvert/brume 365 (12,50 %), dégagé
      1 879 (64,35 %). Un facteur brouillard ou neige ne se déclencherait JAMAIS, et sur le jeu
      gelé jeu-20260316 il est inatteignable (sept jours de ciel dégagé, une averse le 22). Le
      ×33,7 du brouillard reposait sur UN SEUL créneau observé : il faudrait 0,8 jour de
      brouillard par an pour qu'il tienne, et à toute fréquence plausible (10 à 50 jours/an) le
      facteur retomberait entre 0,25 et 2,5. La colonne VISIBILITY_AVG_KM ne sauve rien : c'est
      une moyenne JOURNALIÈRE, jamais sous 5 km en 485 jours, elle ne peut pas voir un
      brouillard de trois heures à l'aube. Le calcul rejeté reste conservé dans le fichier de
      coefficients pour que le refus soit vérifiable. ⚠ CE QUI ROUVRIRAIT LA QUESTION, ET RIEN
      D'AUTRE : un jeu météo servi à la simulation qui porte réellement du brouillard, de la
      neige, ou une distinction pluie/non-pluie fiable. Il reste donc NEUF points ouverts, un
      seul attendant une décision de l'auteur (l'ampleur du ralentissement).

