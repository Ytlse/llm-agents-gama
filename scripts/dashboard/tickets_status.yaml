      multi-modèles est d'abord abandonné, puis RÉTABLI dans la foulée — le ticket repasse à
      faire. Ce qu'il porte désormais : montrer que le gain de calibration n'est pas un artefact
      d'un modèle unique. C'est son seul argument scientifique, et il est fort — la mesure
      intra-modèle du chapitre 6 vaut +2,65 à +3,12 points, reproduire ce signe sur deux ou trois
