      exécution, `modal_variation_rate.py` compare un jour au précédent DANS un run.
    triage:
      faisabilite: 2
      surete: 4
      jeux_de_test: true
      motif: >-
        L'axe 1 (quatre graines, ~12 600 requêtes) est faisable et seulement coûteux. L'axe 2 exige
        TROIS À CINQ NOUVELLES COHORTES SCELLÉES : c'est un chantier population complet déguisé
        en analyse de variance. À ordonner avec le 074, qui régénère la cohorte en v6 — jouer le
        073 avant, c'est produire des mesures à jeter.
        AAMAS ⭐⭐⭐⭐ (4/5) — il éprouve la robustesse du résultat de tête sur d'autres graines et
        d'autres cohortes ; le 080 réclame déjà trois cohortes supplémentaires pour la même
