# Statut des tickets de `docs/tickets/` — SOURCE DE VÉRITÉ.
#
# Le dashboard sait déduire un statut du contenu d'un ticket (cases à cocher, ligne
# `**État**`), mais cette déduction ment dans le mauvais sens : au 2026-08-20 elle
# donnait « à faire 0/15 » pour le ticket 008 dont les actions A1–A7 sont livrées,
# et « sans statut » pour 9 tickets sur 15 — dont 013, livré et documenté au
# changelog. La raison est structurelle : un ticket dont les cases sont des
# CRITÈRES D'ACCEPTATION (006, 007, 008) n'a pas de case cochée tant que le run de
# validation n'a pas eu lieu, ce qui n'a rien à voir avec l'avancement du travail.
# Le statut est donc porté ici, et pas dans l'en-tête des tickets : un `**Statut**`
# recopié dans chaque `.md` se périme en silence et il y en a quinze à tenir.
#
# Clé   : le NOM DE FICHIER COMPLET sans extension.
#         ⚠ Ne pas utiliser la forme courte (`ticket_005`, `005`) : deux tickets
#         DISTINCTS partagent le numéro 005 (choix modal probabiliste / politique
#         PROGEDO) et deux autres le 014 (anticipation / annexe). La résolution
#         courte de `tickets.py` (`overrides.get(f"ticket_{number}")`) appliquerait
#         alors un seul statut aux deux.
# status: à faire | en cours | terminé | bloqué | en veille | amélioration | abandonné
#         `en veille` ≠ `bloqué` : rien n'empêche d'avancer, c'est une DÉCISION de
#         ne pas le faire maintenant. `bloqué` dit qu'une dépendance extérieure
#         manque. Les confondre ferait chercher un déblocage qui n'existe pas.
#         DEPUIS LE 2026-09-16, `bloqué` couvre aussi la dépendance INTER-TICKETS : un
#         ticket qui ne peut pas être ENTIÈREMENT fait avant la fin d'un autre ticket
#         ouvert est `bloqué`, et sa note nomme le bloquant sur une ligne `DÉPEND DE :`.
#         Un blocage qui n'est pas un ticket — accord de l'auteur, verrou de l'article,
#         quota — NE bascule PAS le statut : il se dit dans la note, sans quoi on
#         chercherait un déblocage technique qui n'existe pas.
#         `amélioration` : le ticket est CONSERVÉ comme piste d'amélioration future.
#         Ni chantier interrompu qui reprendra tel quel (`en veille`), ni renoncement
#         (`abandonné`) : rien n'est attendu de lui, et on ne le jette pas pour autant.
# category: Données & Population | Expériences & Cognition | Ingénierie & Système |
#           Modélisation Statistique | Rédaction & Publication
# note  : ce sur quoi le statut s'appuie, et ce qui reste. Affiché dans le tableau.

tickets:

  ticket_002_snapshot_plan_24h:
    status: abandonné
    category: Ingénierie & Système
    note: >-
      REJETÉ le 2026-08-24, décision utilisateur. Le ticket persistait le plan 24 h
      résolu (décisions LLM incluses) pour court-circuiter le warm-up au run suivant,
      avec réutilisation conditionnée à un HASH DE POPULATION. C'est là qu'il meurt :
      chacun des chantiers en cours change la population (016 l'abonnement TC, 017 le
      permis, 019 le logement déjà, 020 possiblement le périmètre), donc chaque
      livraison donne un hash différent et jette le snapshot. Le fichier serait écrit
      puis mis à la poubelle à chaque itération, précisément pendant la phase qui
      s'ouvre. Le filet suffit d'ailleurs : `make run CONT=1` réutilise le workdir, et
      les caches OTP/OSMnx/LLM ne sont PAS invalidés par un changement de trait — un
      itinéraire entre deux points reste valide même si l'agent gagne un abonnement de
      bus. Le warm-up « complet » tape donc dans les caches au lieu de refaire les
      appels réseau. À rouvrir seulement si le temps de démarrage redevient un
      problème mesuré sur une population stable.

