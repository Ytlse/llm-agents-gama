      snappé. Demande `docker compose build eqasim` + régénération : tant que ce n'est pas fait,
      une génération neuve n'a PAS le trait et doit passer par `make residence-zone`. Même règle
      que le lot 4 du 015 : ne pas le dire livré.
      PIÈGES À CONNAÎTRE. (1) Les 45 hors-périmètre ne se trahissent pas par leurs distances :
      5,15 km de parcours moyen contre 4,92 km pour les résidents du périmètre. Leur exclusion
