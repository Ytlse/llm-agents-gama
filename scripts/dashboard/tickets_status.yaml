      E1 JOUÉE LE 2026-09-21 sur le persona 861500 (Capucine Boulay), deux témoins sans choc :
      archives 2026-09-21_11_11 (42 j, 201 décisions) et 2026-09-21_14_28 (1 semaine, 31
      décisions). PLANCHER DE BRUIT NON NUL — 1 écart de mode sur 31 décisions appariées (3,2 %),
