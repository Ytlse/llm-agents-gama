      (volet 2 de la page de synthèse, DÉJÀ PUBLIÉ) est dans le même cas.
      `val` COMPLET le 2026-08-26 (165 personas appariés) : L4 23,74 · L3 20,95 (−2,79) ·
      L2 22,51 (−1,23) · L1 21,99 (−1,75) · L0 22,56 (−1,18) · TÉMOIN NUL L4n 27,66 (+3,92).
      LES QUATRE ABLATIONS AMÉLIORENT LE SCORE SUR `val` LÀ OÙ ELLES LE DÉGRADAIENT SUR
      `screen` : le signe s'inverse, et l'amplitude reste sous le témoin nul dans les deux
      jeux. Résultat nul de la forme la plus nette — l'effet est plus petit que le bruit ET
      sa direction n'est pas stable. AFFIRMATION C RÉFUTÉE sur ce dispositif.
      LE FAIT NON CHERCHÉ, ET LE SEUL SUR LEQUEL LES DEUX JEUX CONCORDENT : le témoin nul est
      la colonne LA PLUS DÉGRADÉE des deux tableaux, davantage que le retrait de tout le
      contexte. Un plancher systématiquement pire que tous les traitements n'est plus du
      bruit : c'est un EFFET DE FORME. Le modèle réagit à la mise en forme du contexte plus
      qu'à son contenu. ⚠ `L4n` cumule 4 permutations et 2 renommages — un palier par
      permutation dirait lequel porte l'effet, et ne coûte que des retraits mécaniques.
      TICKET À OUVRIR, pas une conclusion à écrire.
      ── JEU COMPLET (train + val) le 2026-08-26, 0 appel : `pool_context.py` ──
      569 personnes, 1 568 déplacements (3,4 × `val` seul). L4 22,69 · L0 22,42 (−0,27, soit
      0,10 × le plancher) · TÉMOIN NUL L4n 25,35 (+2,66). Sur `train` seul l'ablation totale
      donne EXACTEMENT −0,00 (22,83 contre 22,83). RETIRER TOUT LE CONTEXTE NE CHANGE RIEN.
      TROIS ÉCHELLES DE BRUIT EMBOÎTÉES, la troisième mesurée par accident : l'épuisement du
      quota a forcé à rejouer `ctxL4` sur la SECONDE CLÉ (même modèle, autre projet) →
      22,83 contre 22,84, écart 0,01, ≤ 0,05 par dimension. Donc : répétition pure 0,01 ·
      contenu du contexte 0,27 · FORME du contexte 2,66. Le témoin nul vaut 250 × l'aléa de
      répétition — ce n'est pas du bruit, c'est un effet systématique de mise en forme, et
      c'est le SEUL signal du bloc B. Le contrôle d'équivalence justifie par la mesure de
      mélanger les deux clés dans un tableau ; le triplet L4/L4n/L0 a malgré tout été refait
      ENTIER sur la clé 2 pour qu'aucun contraste ne repose sur un changement de clé.
      MANQUE : L3/L2/L1 sur `train` (456 appels pour six colonnes contre 500 par seau et par
      jour). Ils restent mesurés sur `screen` et `val`, tous sous le plancher : leur ajout
      préciserait le point de saturation, pas la conclusion.
      COMPARAISON D'AMPLITUDES (livrable principal) : contexte ≤ 2,8 et sans signe stable
      contre prompt 7,13 hors bruit — indicatif (jeux et juges différents), mais l'ordre de
      grandeur est l'INVERSE du discours annoncé.
      LOT 4 CLOS : les trois questions qui précédaient sa mesure sont retombées d'elles-mêmes.
      Le substrat est `v7`, tranché ci-dessus et trace conservée ; le juge a été tenu CONSTANT
      sur les six colonnes, comme l'exige le §3 amendé (A11) ; et `val` a bien été lu à côté de
      `screen`, la leçon du 023 étant appliquée. Rien de ce bloc ne reste ouvert : il ne
      subsiste que le MANQUE déjà énoncé plus haut (L3/L2/L1 sur `train`), qui préciserait le
      point de saturation, pas la conclusion.

  ticket_027_motif_accompagnement:
    status: terminé
    category: Données & Population
    note: >-
      OUVERT le 2026-08-26. Le motif `other` du prompt (19 % des décisions) est aux DEUX
      TIERS de l'accompagnement — le motif le plus routier de la référence (70 % voiture).
      MESURÉ sur les 54 585 déplacements de l'EMC² 2023 (`D5A`) : 6 797 en `other`, dont
      4 503 d'accompagnement (61/64/71/74), soit 66,2 % de `other` et 8,2 % de tous les
      déplacements ; santé et démarches (41/42/43) en font 30,7 %. L'information est détruite
      dans eqasim, en UNE LIGNE : la table ENTD replie les familles 3, 4 et 6 sur `other`
      (famille 6 = accompagnement, RECOUPÉ indépendamment de la nomenclature — la colonne
      dédiée `V2_MMOTIFDACC` est renseignée sur 3 743 des 3 759 cas dans cette seule famille).
      Projection : ~208 records du jeu `all`, 11,5 %. LE SCORE EST DÉJÀ CÂBLÉ — `MOTIF_MAP`
      porte `"escort": "escorting"` et la cible est dans `cerema_values.yaml` ; la
      dimension attend un motif qui n'arrive jamais, et elle est vide pour 59,9 % des records.
      AUCUNE LOGIQUE AVAL NE BRANCHE sur le motif (seules occurrences de `purpose ==` :
      du code commenté) — une valeur neuve traverse sans casse. OPTION A (le patch) : sortir
      la famille 6 de `other`, faire pointer `escort` sur le vivier de lieux `other`, ajouter
      `DEST_TO_MOTIF["escort"]`, régénérer. OPTION B (le substrat) : basculer `hts: entd` →
      `mobisurvstd` sur l'EMC² 2023 — le format standard porte DÉJÀ `escort` comme motif de
      première classe et eqasim l'écrase (`"escort": "other"`), et nos fichiers PROGEDO sont
      à ce format. B fait venir toutes les chaînes d'activités de l'enquête LOCALE et de 2023
      au lieu d'une enquête nationale de 2008 : c'est l'écart de fond, et un chantier de
      substrat (population, run, jeux gelés, comparabilité de la série à re-établir).
      ⚠ RIEN NE SE RATTRAPE APRÈS COUP : contrairement à la couronne du ticket 021, le motif
      d'origine n'est nulle part dans la population ni dans les jeux — il faut régénérer.
      ⚠ LE PROTOCOLE EXOGÈNE NE SAIT PAS MESURER CE TICKET : on ne peut pas fabriquer un bras
      `escort` par réécriture, faute de savoir LESQUELS des `other` en sont. Mesure partielle
      gratuite possible (réécrire le libellé sur 66 % des `other` tirés au hasard) — elle
      borne le gain NARRATIF, pas la justesse de l'affectation, et se lit contre le plancher
      de reformulation du ticket 024 (2,03), pas contre zéro.
      SONDE LIVRÉE le 2026-09-12 (spec specs/ticket_027/sonde-motif-escort.md, 12 règles ;
      scripts/deriver_sonde_escort.py ; 15 tests verts ; llm-agents 861 verts). DÉFAUT DE
      CONCEPTION TROUVÉ ET CORRIGÉ AVANT DE MESURER : la sonde telle qu'elle était pensée le
      2026-08-26 — réécrire le libellé dans le JEU — n'aurait RIEN produit. Le motif servi au
      décideur vient de la POPULATION (runner.py, deplacements_attendus), le jeu n'est interrogé
      que pour ses propositions ; le bras aurait rendu un écart nul parfaitement trompeur. Il faut
      dériver les DEUX : la population (pour le prompt) et le jeu (sinon verifier_population refuse
      au lancement). Le jeu dérivé se fabrique par COPIE — lignes hors tirage recopiées à l'octet,
      empreinte recalculée, dépendances héritées — parce que rejouer les moteurs ferait dériver les
      itinéraires et que cette dérive se confondrait avec le traitement ; la copie est licite parce
      que le motif n'entre dans aucun calcul de proposition (vérifié À CHAQUE dérivation, pas
      supposé). MESURÉ sur le substrat scellé : 436 `other` sur 2 405 déplacements (18,1 %), 289
      réétiquetés `escort` (66,2 %, graine 27), soit 8,8 % des 3 299 de la journée refermée —
      dans la fourchette 8,2 % ± 2 pts du critère. Substrat NON SCELLÉ (PROVENANCE.yaml, pas de
      MANIFEST) : population_par_defaut() reste la v5 et la sonde n'apparaît pas au formulaire.
      Bras apparié DÉFINI et estimé (3 161 sollicitations, 138 non couverts, aucun refus) :
      exp_agy-gemini-38-f_promin_jtir_pop-1000_AAMAS_v5_escort66_t0_nosim, témoin
      exp_agy-gemini-38-f_promin_jtir_pop-1000_AAMAS_v5_t0_nosim. NON LANCÉ : le témoin tournait
      encore (84,8 % à 10:44) et le protocole exogène §0 interdit deux mesures sur le même quota.
      ⚠ TROUVÉ EN CHEMIN, hors périmètre de la sonde : les QUATRE ORACLES TABULAIRES replient
      l'accompagnement une SECONDE fois, indépendamment d'eqasim (purpose_from_code, codes D5A
      61/64/71/74 → `other`). L'affirmation du ticket « aucune logique aval ne branche sur le
      motif » était vraie le 26/08 et ne l'est plus depuis les tickets 042/043/044 : sur un
      substrat portant `escort`, la variable devient NaN pour les oracles pendant que l'agent lit
      un libellé informatif. L'option A a donc TROIS jambes, pas deux : eqasim + DEST_TO_MOTIF +
      purpose_from_code avec réentraînement des quatre artefacts. Aucun bras tabulaire ne se joue
      sur le substrat sondé. Questions vivantes : specs/ticket_027/questions.md.
      SONDE MESURÉE le 2026-09-12, et elle TRANCHE. Bras
      exp_gemini-31-fl_promin_jtir_pop-1000_AAMAS_v5_escort66_t0_nosim (exécution 2026-09-12_09_25_17,
      40 min, 0 erreur, 2 562 sollicitations) apparié au témoin
      exp_gemini-31-fl_promin_jtir_pop-population_1000__t0_nosim (2026-09-11_21_22_55) — MÊME modèle
      gemini-3.1-flash-lite distant, mêmes clés (aucune bascule de fournisseur vérifiée décision par
      décision), mêmes graines, 3 154/3 161 décidés DES DEUX CÔTÉS. Le bras Antigravity prévu au départ
      a été écarté : son témoin s'est bloqué en `en_attente_agent` à 877/894 personnes, agent muet
      depuis 11:11 — un témoin incomplet n'apparie rien.
      RÉSULTAT 1, LE LIBELLÉ NE FAIT RIEN : sur les 284 réétiquetés à choix libre des deux côtés,
      L1 = 4,9 pts et voiture +1,8. Mais les motifs NON touchés bougent de 1,6 (home) à 4,8 (shop)
      entre les deux bras, et le taux de décisions individuellement changées vaut 17,3 % sur les
      réétiquetés contre 19,7 à 23,7 % sur les intacts — le PLUS BAS des sept groupes. L'effet du mot
      est sous le bruit de lot (parallelisme 8 : changer l'étiquette d'un agent change le voisinage
      de prompt des autres). Le gain narratif de l'option A est donc BORNÉ À RIEN : cette
      justification-là tombe.
      RÉSULTAT 2, LA STRATE SORT DU NÉANT : `accompagnement` passe de n=0 / couverte=false à n=124
      couverte, et rend le PIRE L1 des quatre strates du motif — 61,4, avec 44,6 % de voiture contre
      71,4 % de cible EMC². Composite emd_jsd 14,22 → 15,66 et L1 global 41,11 → 41,32 : le score
      EMPIRE, non parce que l'agent décide moins bien, mais parce qu'une strate publiée dans la cible
      et jamais mesurée s'est mise à compter. Motif « vacuité ≠ perfection » confirmé sur pièces.
      DÉCISION QUI EN DÉCOULE : l'option A ne se justifie PLUS par le prompt, seulement par la
      métrologie — un quart de la cible motif publiée reste hors de portée du score sans elle.
      Trace : docs/traces/2026-09-12_10-45_ticket027_sonde_escort/resultat.txt.
