      D'ANCRAGE de toute l'échelle de gravité — à ce retard la composante vaut exactement 0,50
      (gravite.py:171), et 0,50 plus les 0,20 d'un incident réseau font le seuil de rupture
      Θ = 0,70, celui qui décide qu'un souvenir est servi hors contexte et voit sa durée de vie
      passer de 2,8 à 14,6 jours. Trente minutes de retard ne veulent pas dire la même chose selon
      que le déplacement médian de la cohorte en dure vingt ou quarante-cinq : la règle est à
      rattacher à la distribution des durées de déplacement de la cohorte, MESURABLE SANS RUN
      puisque la cohorte scellée est déjà sur disque. Ce lot rejoint le 095 parce que celui-ci
      vient de retoucher cette même courbe le 2026-09-21 (palier vers asymptote,
      `memoire__retard_saturation`) dont `RETARD_REF` reste l'ancre préservée. ⚠ Relever la valeur
      déplacerait TOUTE l'échelle de gravité et rendrait les runs antérieurs non comparables — le
      079 le signalait déjà en Q7 (specs/ticket_079/questions.md:44). Pourquoi cette dette était
      invisible : elle n'existait que dans le ticket 071, à l'intérieur d'un critère de clôture
      DÉJÀ COCHÉ, et une case cochée ne se relit pas ; le 071 aurait pu se fermer en la laissant
      derrière.

  ticket_097_le_plafond_declare_ne_ferme_plus_une_cle:
    status: en cours
    category: Ingénierie & Système
    note: >-
      LE CODE ÉTAIT DÉJÀ ÉCRIT ET INDEXÉ SUR `main` AVANT L'OUVERTURE DU TICKET ; celui-ci
      enregistre la décision et met la spécification en accord avec elle. Ouvert et documenté le
      2026-09-21. Décision de l'auteur ce jour-là, sur question explicite : le retrait de
      l'anticipation d'épuisement vaut PARTOUT, pas seulement au lancement — donc aussi dans
      `DecideurPasserelle._prochaine_instance` et `runner.veiller_quotas`, qui lisent le même
      `MoniteurRessources.disponible`. `rpd_limit` est déclaratif (recopié de documentations
      fournisseur périmées, muettes ou disparues : Groq n'annonce sa limite du jour que dans le
      corps de ses 429, Mistral servait le double du débit inscrit, la page Google source des
      quotas Gemini n'existe plus) ; il ne ferme donc plus une clé. Seuls `quota_exhausted` posé
      sur un 429 réel et la mise hors service (`disabled`, `cooldown`) écartent une instance.
      DÉJÀ SUR `main`, NON COMMITÉ : garde-fou retiré de `experiences/ressources.py`,
      `reinitialiser_quotas()` ajouté, routes `POST /providers/reset-quota` (unitaire et par lot)
      dans `packages/llm_gateway/.../api/routes.py`, appel au lancement dans `experiences/cli.py`,
      réactivation d'`openai_gpt56_luna_key1` et de `groq_openai_20_key1` dans `providers.yaml`.
      LIVRÉ LE 2026-09-21 : règle Q11 marquée abrogée et critère d'acceptation Q11 réécrit dans
      `specs/ticket_035/05-ressources-interruption-reprise.md` ;
      `test_Q11_epuisement_anticipe` remplacé par `test_Q11_le_plafond_declare_n_ecarte_pas` et
      `test_Q11_le_refus_reel_ecarte_toujours` (la contrepartie : Q4 tient toujours quand TOUTES
      les instances sont refusées) ; `docs/arch/plateforme-experiences.md` corrigé en quatre
      endroits — « Disponible » lit désormais DEUX signaux et non trois, la troisième panne est
      consignée ; entrée de changelog en tête. Suite complète de `services/llm-agents` à
      1764 passants, 4 ignorés, 0 échec.
      CONSTAT AU PASSAGE : en production `besoin` a toujours valu 1, aucun appelant ne le
      surcharge. Le scénario d'origine de Q11 — « lot de 10 contre marge de 7 » — n'a donc jamais
      été exercé ; le garde-fou ne mordait qu'à marge nulle.
      DEUXIÈME PASSE LE 2026-09-21 — DEUX DES TROIS POINTS DE LA SECTION 6 SONT SOLDÉS.
      (1) La journalisation du plafond déclaré est livrée : `MoniteurRessources._journaliser_plafond()`
      pose deux WARNING `[ressources] [PLAFOND]` à la lecture de `/health`, SUR FRONT MONTANT (une
      ligne par instance et par fenêtre, pas une par rafraîchissement) — le dépassement pendant
      qu'il se produit (`daily_requests` STRICTEMENT au-delà de `rpd_limit`, sans refus : le chiffre
      du fichier est trop bas), et le refus réel (le compteur au moment du 429 EST la limite du
      fournisseur, l'écart affiché est celui à corriger). Sans `rpd_limit` ou sans compteur publié :
      silence, on ne suppose pas un chiffre. Posé dans `rafraichir()` et NON dans `disponible()`,
      appelé à chaque décision — le journal serait noyé. Nouvelle règle Q11b et son critère dans
      `specs/ticket_035/05-ressources-interruption-reprise.md` ; section 7 du ticket ; paragraphe
      dans `docs/arch/plateforme-experiences.md` ; trois tests `test_097_*` dans
      `test_035_03_05_06_execution.py`. Suite complète de `services/llm-agents` à 1798 passants,
      6 ignorés, 0 échec.
      (2) `POST /providers/reset-quota` VÉRIFIÉ SUR LA PASSERELLE DÉPLOYÉE : le conteneur `api`
      (port 8000) expose les deux routes, unitaire et par lot, dans son `openapi.json`.
      RESTE UN POINT : remesurer les `rpd_limit` de `providers.yaml` aux en-têtes `x-ratelimit-*`.
      L'outil existe déjà — `scripts/providers/refresh.py` (`make providers`) : sondes pour groq,
      cerebras et mistral, API Cloud Quotas pour google, openai ignoré faute de clé dans `.env`
      (d'où la reprise à la main du 2026-09-18). NON LANCÉ : un run était en cours le 2026-09-21 à
      17 h, et le script réécrit `providers.yaml` et dépense une requête sonde par instance.
      Décision de l'auteur ce jour-là : on attend la fin du run, on lance `make providers`, on
      présente le diff, et le ticket ferme après — et non en renvoyant ce point à la maintenance
      récurrente.
      AUCUN IMPACT ARTICLE : la règle ne touche ni une métrique, ni un jeu gelé, ni le contrat
      des 21 variables, ni un chiffre citable — elle ne change que la condition d'arrêt d'un run.
    triage:
      faisabilite: 5
      surete: 3
      jeux_de_test: false
      motif: >-
        Faisabilité 5 : le code est écrit et la suite passe ; ce qui reste est un WARNING, une
        vérification de déploiement et une relève de chiffres aux en-têtes HTTP. Sûreté 3, et pas
        plus : la règle retirée était un garde-fou, et sa contrepartie — la journalisation du
        dépassement — n'est PAS encore écrite. Tant qu'elle manque, un `rpd_limit` faux ne se
        signale plus nulle part, et le coût d'un plafond réellement atteint est un 429 par clé et
        par fenêtre. Rien d'irréversible en revanche : ni jeu gelé, ni scoreur, ni formule, ni
        contrat des 21 variables n'est touché, et les runs archivés restent comparables puisque
        la règle ne portait que sur la condition d'arrêt.
        AAMAS ⭐ (1/5) POSÉ PAR DÉFAUT, À CONFIRMER PAR L'AUTEUR : le ticket est opérationnel et
        ne produit aucun résultat publiable. Il sert l'article indirectement, en évitant qu'un
        run soit interrompu sur un plafond imaginaire.
      date: '2026-09-21'
      aamas: 1
  ticket_098_archive_froide_de_l_ancien_jeu_v6_en:
    status: terminé
    category: Ingénierie & Système
    note: >-
      LIVRÉ LE 2026-09-21, à la demande de l'auteur (« archiver les expériences de l'ancien jeu
      de test, inaccessibles à chaud, consultables à froid »). Le substrat
      `population_1000_AAMAS_v6_20260316_EN`, remplacé le 2026-09-16 par sa version corrigée
      (ticket 088), est passé en archive froide AVEC ses 36 définitions, ses 31 exécutions et le
      jeu scellé lui-même : 37 pièces, 345,3 Mo, 647 fichiers déplacés vers
      `archive/2026-09-21_ancien_jeu_v6_EN/` (MANIFEST.yaml + README.md + JOURNAL.json, empreinte
      sha256 par pièce, revérifiée à l'arrivée). Le statut `archivee` de la plateforme ne
      suffisait pas : il ne change que la VISIBILITÉ, alors que la demande porte sur
      l'accessibilité. C'est `experiences.froid` qui tient la règle, sur l'EMPLACEMENT du chemin,
      et la dérogation exige un motif écrit.
      CONDITION VÉRIFIÉE AVANT TOUT DÉPLACEMENT, et c'est le cœur du ticket : aucun bras portant
      une exécution `terminee` sur l'ancien jeu n'est dépourvu de contrepartie `terminee` sur le
      jeu corrigé (29 bras appariés, 26 exécutions terminées d'un côté, 32 de l'autre) ; les
      7 dossiers sans contrepartie sont 6 coquilles à 0 exécution et un bras `arretee` jamais
      abouti. `scripts/analysis/plot_chapitre6.py` journalisait déjà « Décideurs lus : 13 sur 13
      (0 sur l'ancien jeu) » AVANT le gel : son repli sur l'ancien substrat était mort. PREUVE
      APRÈS COUP : les 8 PNG des figures du chapitre 6 et de l'annexe H sont identiques bit à bit
      (les SVG diffèrent par un horodatage `dc:date` et des identifiants de `clip-path` tirés au
      hasard, sans que le dessin bouge — la comparaison se fait sur les PNG).
      LE JEU PART AVEC LES EXÉCUTIONS, décision de l'auteur sur question explicite. Deux raisons :
      une exécution ne se rejoue pas sans son substrat (`journal.regenerer` recharge jeu ET
      cohorte), et un jeu laissé sous `data/jeux/` resterait proposable — R17 n'écarte que ce qui
      est déjà sous `archive/`, donc rien n'aurait empêché de définir demain une expérience neuve
      sur le substrat daté du 17 mars, qui est le défaut du ticket 045 à un substrat près. La
      cohorte, elle, reste vivante : la correction du 088 portait sur le calcul de l'offre, pas
      sur les personas.
      GARDE DE DÉMARRAGE SCOPÉE, différence assumée avec le script du ticket 074 : celui-là
      déplaçait `data/experiences` en entier et devait donc refuser sur toute exécution vivante
      du dépôt ; ici l'ensemble est disjoint du reste, la garde porte sur les seules pièces
      déplacées et se contente d'avertir pour le travail vivant ailleurs. Une garde globale
      aurait interdit le gel dès qu'une expérience sans rapport tourne.
      TESTS : `scripts/tests/test_098_archive_ancien_jeu.py`, 8 tests (plus aucune expérience
      vivante ne déclare le jeu gelé ; le substrat n'est plus proposable ; le jeu COURANT n'a pas
      été emporté par le préfixe — `…_EN` préfixe `…_EN_c`, c'était la vraie erreur à craindre ;
      le manifeste porte origine et empreinte ; l'archive n'est pas sous `data/` ; `ouvrir()`
      refuse sans motif et le refus DIT comment déroger ; la dérogation passe avec un motif
      écrit ; `reference.yaml` dit où le substrat est parti). Avec les 11 tests du 074 : 19
      passants. `test_093_selection_personas.py` : 19 passants, 2 sautés.
      EFFET DE BORD LAISSÉ OUVERT, À TRANCHER PAR L'AUTEUR : la sélection des 10 personas
      mesurables du ticket 093 a été dérivée d'un run de l'ancien jeu, et
      `data/population/population_10_mesurables_093/MANIFEST.yaml` le scelle (`run_de_reference`,
      `candidats: 234`). Ce run est gelé. Le même critère appliqué à sa contrepartie corrigée
      (`…_EN_c_t0_nosim/executions/2026-09-17_07_34_55`) donne 246 candidats et non 234 ; 920187
      tient (15 trajets, 9 en marche) mais 41275 ne fait plus qu'un seul mode et CESSE d'être
      candidat — or c'est lui qui porte la démonstration du test A5bis. Repointer le chemin
      réécrirait en silence des chiffres que le ticket 093 cite : les deux tests sautent avec un
      motif qui le dit, et rien n'a été décidé à la place de l'auteur. Re-dériver la sélection
      sur le substrat corrigé est une décision scientifique, pas un ajustement de test.
      IMPACT ARTICLE : aucun chiffre du manuscrit ne bouge (figures identiques bit à bit, aucune
      valeur du chapitre 6 ne provenait de l'ancien substrat). Signalement rendu en fin de tâche.

  ticket_099_les_references_de_memoire_deposees_n_ont_pas_de_phrase_citante:
    status: à faire
    category: Rédaction & Publication
    note: >-
      Ouvert le 2026-09-21, RELIQUAT DU TICKET 071 clos le même jour. Le 071 a déposé les PDF et
      créé les clés ; il reste à écrire les phrases qui les citent. État exact des quatre
      conditions de CITATIONS.md : 1, 2 et 4 remplies pour ONZE références (11 PDF dans
      etat_de_lart/, total du dossier 62 ; 11 clés dans sample.bib, total 53 ; chaque PDF ouvert
      et son titre confronté à la notice). LA CONDITION 3 N'EST REMPLIE QUE POUR DEUX : Reflexion
      (chapitre 5) et Laplace (chapitre 7), les deux seules que le texte appelait déjà. Les
      entrées A40 à A50 existent et portent chacune la section visée et le passage à pointer ;
      leur case reste ouverte faute de phrase écrite.
      LOT A — les neuf phrases citantes. Le § 3.4 décrit l'architecture de Park et al. adaptée par
      Vu et al. sans nommer ni l'un ni l'autre. Deux pièges à ne pas perdre : HippoRAG se cite
      COMME PISTE SEULEMENT, aucun mécanisme du dépôt n'en dérive ; A-MEM se cite AVEC SA
      DIVERGENCE, sa voie par seuil de similarité ayant été explicitement écartée. À dire aussi
      quand Vu et al. seront cités : leurs poids publiés sont 0,3/0,3/0,4, la récence portant le
      poids fort, contre 0,30/0,10/0,20/0,20/0,20 en service — l'écart est propre à ce dépôt.
      LOT B — TULVING (1972), À TRANCHER PAR L'AUTEUR. Le § 3.4 FR et EN lui attribue la
      distinction épisodique/sémantique, sans PDF ni clé, et c'est un chapitre d'ouvrage sans
      version libre. Ni le code ni une session ne peuvent lever ce point : consulter l'ouvrage et
      poser la mention, ou renoncer à l'attribution. C'est la citation la plus porteuse de la
      section — elle nomme le partage dont tout le mécanisme découle.
      LOT C — les douze références des groupes C et D restées hors dépôt : huit articles sous
      licence éditeur, trois ouvrages sans PDF. Accès institutionnel ou mention « ouvrage
      consulté », aucun paywall à contourner. ⚠ TANT QUE C N'EST PAS TRAITÉ, L'ANCRAGE ACT-R
      demandé par la relecture extérieure NE PEUT PAS ENTRER DANS LE TEXTE : une référence non
      déposée n'est pas une référence à citer.
      RELEVÉ AU PASSAGE, sans lien avec les citations : le chapitre 9 dépasse le seuil de densité
      de gras du détecteur dans les deux langues, et AVANT les corrections du 21/09 — mesuré sur
      HEAD, fr 12,9/1k et en 11,6/1k pour un seuil de 10,0. Le dé-graisser est une passe de style,
      pas une correction de citation.
      DÉPEND DE : aucun ticket — l'écriture est sous VERROU D'ARTICLE et demande un accord
      explicite ; le lot B demande en plus une consultation d'ouvrage que personne ne peut faire
      à la place de l'auteur.
    triage:
      faisabilite: 4
      surete: 1
      jeux_de_test: false
      motif: >-
        Faisable : la matière est prête, chaque entrée porte déjà sa section et son passage à
        pointer, et l'écriture ne touche ni le code ni un chiffre publié. Sûreté basse : ce sont
        des phrases ajoutées à des sections existantes, sous verrou et sous accord. Le lot B est
        le seul point dur, et il tient à une consultation d'ouvrage. ⚠ Faisabilité et intérêt
        AAMAS posés par la session avec leur raison, à réviser par l'auteur s'il en juge
        autrement. AAMAS ⭐⭐⭐⭐ (4/5) — « les auteurs sont responsables de l'exactitude des
        citations ; un article aux citations erronées risque un refus d'emblée » (règle rappelée
        en tête de CITATIONS.md). Une section qui décrit l'architecture de Park et al. sans la
        citer est exactement ce qu'un relecteur relève.
      date: '2026-09-21'
      aamas: 4
