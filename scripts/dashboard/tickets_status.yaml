  ticket_021_couronne_residence_post_traitement:
    status: en cours
    note: >-
      OUVERT le 2026-08-24 à la suite du ticket 020, dont il exécute les DEUX verdicts
      « à corriger » : A2 (couronnes classées par distance à l'hypercentre au lieu de la
      liste de communes de l'enquête) et A4 (domiciles hors des 453 communes rangés en
      3ᵉ couronne). Un seul trait les résout : la couronne du domicile, POSÉE SUR LE
      PERSONA à la génération au lieu d'être devinée à la distance au runtime.
      POURQUOI CETTE VOIE. `residence_zone` a TROIS appelants de production et un seul ne
      porte aucun cache : `move_logger` (colonne du journal → tout le scoring par zone) ;
      `osmnx_direct._make_travel_plan` (temps terminal → durées des plans → cache OTP ET
      cache de décisions LLM) ; `export_terminal_time` (les 785 centroïdes de zones fines →
      les STRATES des lois de temps terminal, ce que `terminal_time_emc2.json` inscrit dans
      son `meta.crown_definition`). Les deux écarts du 020 vivent ENTIÈREMENT dans le
      premier : ce sont des écarts de LECTURE, pas de décision. Un post-traitement les
      corrige donc sans bumper `terminal_time.yaml`, sans invalider de cache et sans run à
      rejouer. Et le troisième appelant est la raison pour laquelle aligner le temps terminal
      est un ticket distinct : ses lois sont stratifiées par le classement métrique, les
      basculer demande de RÉ-EXPORTER la ressource, pas de changer un `if`.
      Contrepartie assumée et bornée : une divergence de définition avec le temps terminal —
      34 s par bout de trajet sur le pire couple OBSERVÉ (Toulouse ↔ 1ʳᵉ couronne, 66 cas ;
      les deux autres couples réels valent 2 s et 11 s), 43 s sur le pire couple POSSIBLE,
      qui ne se produit pas. Elle valait 4 min sous tt2 — c'est le 013 qui a absorbé le
      risque. À inscrire dans le docstring, pas à subir.
      LA DONNÉE EST PRESQUE TOUTE DANS LE CONTENEUR : le code ZF porte le numéro de secteur
      de tirage sur ses 3 premiers chiffres, le secteur porte la couronne, et `zone_resolver`
      résout déjà un domicile en zone fine (c'est ainsi que 015 et 019 travaillent). CE QUI
      MANQUE FIXE LE GRAIN DE LA TABLE : `zf_zones.gpkg` ne porte NI `INSEE` NI `COM`, donc
      une table secteur → couronne de 88 lignes donnerait la couronne mais jamais la commune,
      que l'audit exige. La table se publie au grain ZONE FINE — 785 lignes
      `zf → secteur, couronne, insee, commune` — depuis la jointure que l'export calcule déjà.
      DEUX ÉQUIVALENCES MESURÉES LE 2026-08-24 (lot 0, `make audit-couronnes`, trace
      `docs/traces/2026-08-24_couronne_equivalences/`) : les SEPT PORTES PASSENT — 785/785 au
      grain zone fine, 1 021/1 021 au grain domicile, différence symétrique VIDE entre « hors
      couche » et « hors périmètre », et 1 021/1 021 d'accord avec la colonne archivée du 020
      (recoupement par un chemin INDÉPENDANT). La porte F établit en plus que ZF → INSEE
      reproduit la commune archivée sur les 976, ce qui CONFIRME le grain zone fine de la
      table. Ce qui était supposé est maintenant mesuré : (1) l'accord entre
      classement par préfixe ZF et classement géométrique sur des DOMICILES n'a jamais été
      mesuré — ce qui est établi est l'intégrité de la jointure ZF → NUM_DTIR, et le seul
      usage du préfixe dans le dépôt porte sur les microdonnées d'enquête, pas sur les
      personas ; (2) `resolve() is None` (hors COUCHE de zones fines) et `hors périmètre`
      (hors des quatre COURONNES dissoutes) sont deux emprises différentes, et le 976/45
      vient de la seconde. Emprise normative : le géojson des couronnes. L'alarme de
      couverture de `zone_resolver` ne protège pas ce cas — elle se déclenche à 15 %, on est
      à 4,41 %.
      SIX LOTS dont le 0 est FAIT.
      LA MESURE SE FAIT SUR `v7`, dernière base de référence du registre `avancement.yaml`.
      Records sans `lieu_residence` et loss à six dimensions sans la zone : « à décisions
      constantes » devient STRUCTUREL, zéro appel LLM. PAS de jeu `v9` — rien du prompt ne
      bouge, seule l'agrégation change, donc une TABLE DE JOINTURE `agent_id → couronne`.
      ⚠ NE JAMAIS enrichir en place `experiments/archive/2026-08-19_14_36/population_1000.json` :
      son sha256 est épinglé par les manifestes de v5, v6, v7 ET v8. PAS de composite non
      plus : `lieu_residence` est `scored: False` dans `frames` et absent de l'évaluateur, un
      `v7 → v9` rendrait 0,00 — publier ce zéro serait « vacuité ≠ perfection » en pleine
      page. Le score porté au registre est le L1 de la dimension ZONE, avec `score_caveat`.
      Et `v7` ne peut pas porter A4 : ses 930 personas sont bbox-filtrés, donc `verdict:
      mesure` (périmètre partiel), A4 chiffré à part sur les 1 021.
      0 : FAIT, cf. ci-dessus.
      1 : FAIT le 2026-08-24 — `llm_module/data/zf_couronne.json` (version `zc1`, 785 zones
      + 88 secteurs, avec INSEE et commune), lecteur `llm_module/core/residence_zone.py`
