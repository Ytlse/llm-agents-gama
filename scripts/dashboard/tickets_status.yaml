      STATUT PASSÉ À `en cours` LE 2026-09-21, règle 1 de la skill `suivi-tickets` : du travail
      est engagé et le ticket disait « à faire ». Preuves dans sa propre note : le bras
      `gpt-56-luna_proexp05` a été lancé puis marqué `epuisee` à 181/3161 déplacements,
      l'adaptateur OpenAI est modifié et non commité (`openai_adapter.py`,
      `tests/unit/test_openai_adapter.py` non suivi), et la clé payante est déclarée depuis le
      18/09. Ce qui reste : faire tenir ce bras, lui ajouter son palier minimal `promin02` — un
      seul palier mesure un niveau, pas l'écart de calibration — ou basculer sur le repli
      gratuit (`gpt-oss-120b` chez Groq ou Cerebras).

      ÉTAT DU 2026-09-18 — la réplication multi-modèles tient déjà sur DEUX familles, et la
      troisième est engagée mais cassée. Sur le jeu corrigé, l'ablation de consigne se réplique
      sur gemini-3.5 (7,02 → 4,86), gemini-3.1 (12,38 → 8,98) et mistral-large (14,75 → 7,63) :
      trois modèles, deux fournisseurs, même signe. La troisième famille au sens fournisseur est
