  ticket_077_la_memoire_apprend_sur_des_observations_fausses:
    status: en cours
    category: Expériences & Cognition
    note: >-
      Ouvert le 2026-09-15 à la lecture du run de 30 jours du 075. Le mécanisme a tourné — 276
      consolidations, 231 concepts, 50 auto-réflexions, aucun plantage — mais ce qu'il apprend est
      FAUX et il ne peut pas se corriger. Six lots. LOT A, cause racine : `mode_canonique` attend
      des étiquettes de jambes (foot, bus, bicycle) quand le schéma de réflexion impose au modèle
      les modes canoniques (walking, cycling, public_transport) ; un seul mot sur sept traverse, et
      c'est `car`. D'où axe_objet vide sur 211 concepts sur 231, panier dégénéré, `known_beliefs`
      VIDE dans 159 blocs sur 235 (100 % pour Adrienne qui n'a pas de voiture, 17 % pour Valérie
      qui ne fait que ça), vivier B vide, et le lot 3 du 071 — un concept se corrige au lieu de
      s'empiler — JAMAIS exécuté : 0 précision, 1 contradiction, 225 concepts sur 231 restés à
      confiance 0,50. Le modèle est innocenté par les chiffres : quand known_beliefs n'est pas
      vide, il confirme 74 fois sur 76. LOT B, les observations que GAMA envoie : le chronomètre
      d'étape démarre à la réception du plan et non au premier mouvement, donc l'attente avant
      départ est journalisée comme une marche — 398 événements sur 412 ont une distance NULLE et
      une durée exactement égale au departure_delay_s ; et les 253 trajets voiture passent par le
      gabarit transit, d'où « Trip by Unknown Unknown ». Xavier prend la voiture 117 fois sur 117
      et rumine dans 62 réflexions sur 83 des marches de 5 à 12 heures qui n'ont pas eu lieu.
      LOT C : les 116 trajets à itinéraire unique n'écrivent aucune entrée de décision, et le
      journal des habitudes remonte au dernier axe_objet trouvé — donc range les retours sous le
      motif de l'aller (Xavier : 48 entrées pour 113 arrivées, aucun `home`). LOT D : les 50
      auto-réflexions coûtent un appel tous les 3 jours et n'atteignent que 2 prompts de décision
      sur 336 — à servir dans le bloc noyau ou à éteindre, décision de l'auteur ; et le rappel
      s'auto-renforce (128 rappels sur 133 servent 10 souvenirs, toujours les mêmes, jusqu'à 55
      fois). LOT E : instrumenter souvenirs servis par décision avec leur vivier, index proposé et
      tiré, descriptif des options, known_beliefs montrés, statut cache, et un run TÉMOIN sans
      mémoire à graines identiques — sans lui la bascule de Corinne vers la voiture en semaines 4
      et 5 n'est pas attribuable. LOT F : générateur de rapport HTML par persona
      (`scripts/analysis/memoire/`), dont le tableau d'itinéraires bleu clair proposé / bleu foncé
      retenu. DEUX RECOMMANDATIONS EXTÉRIEURES ÉCARTÉES, motifs écrits au § 7 : plafonner la marche
      dans GAMA avec repli taxi (le diagnostic est faux — distance nulle, c'est un chronomètre, et
      ce serait une dégradation pour masquer un bug) ; déduplication cosinus au seuil 0,82 (le lot 3
      du 071 a rejeté les seuils fixes en toutes lettres, et la cause est connue et tient en une
      fonction). ORDRE : A puis B, ensuite C et E, F indépendant — et pas de nouveau run avant que
      A, B, C, E soient livrés, sinon trente jours de calcul sont à refaire.
      ÉTAT AU 2026-09-15 : lots A, B, C, D2, E et F livrés avec 92 tests (contrat
      `specs/ticket_077/tests.md` écrit avant le code), suite complète à 1 286 tests verts.
      Modèle GAMA recompilé dans l'image officielle, rapport produit et relu. Reste le seul
      arbitrage du lot D1 — servir l'auto-réflexion dans le bloc noyau ou l'éteindre.
      ⚠ Le lot B modifie GAMA : les mémoires produites avant cette date ne sont plus
      comparables à celles d'après.
      ▶ PASSATION (2026-09-17) : le § 10 du ticket porte l'état complet pour reprendre d'une autre
      session — les SIX causes de mort du bras choqué et ce qui les ferme (ping GAMA à 20 s, OOM
      par deux simulations dans une JVM, choc tombé sur un week-end, champ `choc` d'identité
      toujours vide, trace de rejeu jamais ouverte), la configuration en place, les commandes de
      lancement/arrêt/reprise nommée, la RECETTE de deux jours avec redémarrage qui a trouvé deux
      de ces défauts, quatre pièges d'analyse (moves.csv compte les journées rejouées deux fois,
      « Jour relatif au choc » mélange deux conventions, le rejeu n'est pas fidèle sans la trace,
      `experiments/current` ne prouve rien), et ce qui reste ouvert. MESURES DÉJÀ ACQUISES :
      89 % des réflexions et 74 % des concepts vivent ≤ 4,5 jours — la mémoire est une fenêtre
      glissante de 3 à 5 jours, ce qui explique le « pourquoi la même leçon revient » du § 0 ; et
      100 opérations de concept se répartissent en 38 créés, 61 confirmés, UN SEUL contredit,
      celui de Corinne le jour du choc.

    triage:
      faisabilite: 4
      surete: 4
      jeux_de_test: false
      motif: >-
        Faisabilité 4 : les lots A, B et C sont trois corrections locales, chacune à un endroit
        nommé du code (`llm/axes.py`, `Inhabitant.gaml` lignes 187 et 350, `simulation_controller`
        ligne 2056), toutes testables sans run. Le lot F ne lit que des fichiers déjà produits.
        Sûreté 4 : aucune règle de mémoire n'est touchée — ni gravité, ni oubli, ni viviers, ni
        score de rappel, ni seuils — et aucun chiffre de l'article ne dépend de ce run, qui observe
        un mécanisme sur cinq agents et ne mesure aucune part modale. Le lot B modifie GAMA et
        change donc les observations de TOUS les runs à venir : c'est l'effet recherché, mais il
        rend les mémoires produites avant cette date non comparables à celles d'après, et il faut
        que ce soit dit au moment de la livraison. Pas de drapeau : rien ici ne consomme ni ne
        modifie un jeu scellé.
      date: '2026-09-15'
      aamas: 3

  ticket_078_partage_de_concepts_au_sein_du_foyer:
    status: à faire
    category: Expériences & Cognition
    note: >-
      Ouvert le 2026-09-15 à la demande de l'auteur ; mécanisme arrêté le jour même en trois tours
      (§ 11), dont une relecture extérieure. Le foyer est DÉJÀ dans les données : mesuré sur la v6,
      499 ménages, 0 agent sans `household.id`, 287 ménages multi-membres et 788 agents sur 1 000
      vivant avec au moins un autre agent — conséquence du tirage par ménage du ticket 029 ; et ces
      gens diffèrent (223 ménages hétérogènes sur les motifs, 133 sur le permis, 122 sur
      l'abonnement TC, 120 sur le vélo). PAS DE PASSE SÉPARÉE, PAS DE PROMPT DÉDIÉ, PAS UN APPEL DE
      PLUS, AUCUN CHAMP NOUVEAU : la consolidation journalière devient « expériences personnelles +
      ce que le foyer a raconté », le bloc foyer étant une ENTRÉE de l'appel `stm_reflection` qui a
      déjà lieu. Rien n'est écrit dans la mémoire du receveur : c'est SA réflexion qui décide, avec
      le vocabulaire inchangé du 071 lot 3. Seuls les CONCEPTS passent, jamais les épisodes. La
      source est NOMMÉE avec son âge ; le lien de parenté n'est pas dans les données et ne s'invente
      pas. SIX RÈGLES, dont la première est la clé : ON NE RACONTE QUE CE QU'ON A VU AU MOINS DEUX
      FOIS SOI-MÊME (`observations >= 1`) — vérifié dans le code, un concept créé part à 0 et seul
      un `confirmer` l'incrémente, donc une croyance née d'une conversation NE PEUT PAS repartir
      tant que son porteur ne l'a pas ancrée dans un déplacement réel. Aucune amplification hors-sol
      possible, par construction, sans généalogie ni champ supplémentaire. Puis : jamais montré deux
      fois à la même personne (reproposé seulement si précisé ou mis hors service), `axe_objet`
      renseigné, mode praticable par le receveur, bloc borné à 12 énoncés (garde-fou journalisé),
      membre présent. ⚠ CONTREPARTIE À MESURER EN PREMIER : le 077 a compté 225 concepts sur 231 à
      ZÉRO observation — si le lot A du 077 ne fait pas repartir les confirmations, le canal naît
      VIDE ; seuil paramétrable pour le constater sans toucher au code. PIÈGE NOMMÉ : le lot A du
      077 sur une TROISIÈME route — trois vocabulaires de modes coexistent (canoniques, étiquettes
      de jambes AUAT, `_VEHICLE_MODES = ("bike", "car")`) ; table de correspondance explicite et
      testée, un mot inconnu ne traverse pas. SIX MESURES dont l'ACCORD INTRA-MÉNAGE par divergence
      de Jensen-Shannon, qui rend le ticket réfutable : le partage doit réduire la divergence
      intra-ménage SANS réduire la divergence inter-ménages — avec garde-fou de vacuité obligatoire
      (effectif minimal, verdict « non concluant » en dessous, modèle `slope_verdict` du 031), parce
      qu'un accord calculé sur trois concepts sort parfait sans rien mesurer. RELECTURE EXTÉRIEURE,
      quatre recommandations : règle d'origine `source_members` RETENUE DANS SON INTENTION mais
      refusée dans sa forme (sa clause d'ancrage donne la version gratuite = R1) ; renommage en
      « stigmergie sociale asynchrone » REFUSÉ (terme inexact — la stigmergie passe par des traces
      dans l'environnement, pas par la mémoire d'autrui — et on ne fuit pas un travail voisin en
      changeant de mot), mais son argument d'échelle RETENU et chiffré (n lignes de prompt contre
      n(n−1)/2 appels) ; métrique d'accord RETENUE ; run macro sur la v6 DIFFÉRÉ et écrit comme
      CONDITION D'ENTRÉE dans l'article, pas comme un lot — c'est une campagne (~100 000 décisions
      par bras, à doubler), elle se budgète, elle prend la place de tout run manuel, et l'ambition
      déclarée de l'article est celle d'un élément parmi d'autres, pas d'une preuve causale isolée.
      AUTRES REFUS : dialogue LLM entre membres, écriture directe chez le receveur, héritage des
      compteurs, partage des épisodes, invention de la parenté, extension aux collègues ou voisins,
      déduplication cosinus, généalogie anti-boucle. VARIANTE C sur la table pour elle-même :
      partager les FAITS de la journée plutôt que les croyances. POPULATION DE TEST À CONSTRUIRE :
      les 5 agents du 075 appartiennent à CINQ ménages distincts, le mécanisme y serait
      inobservable ; lot 0 = `population_12_foyers_078`, les mêmes 5 personas plus leurs 7
      co-résidents de la v6, dont Xavier Briand seul dans son ménage comme témoin interne.
      DÉPENDANCE STRICTE : le 077 livré en entier — sans le lot A, 211 concepts sur 231 n'ont pas
      d'axe ; sans le lot B, le foyer se raconterait les marches fantômes d'un seul.
      ⛔ DÉPEND DE : 077 — « DÉPENDANCE STRICTE : le 077 livré en entier » — sans son lot A, 211
      concepts sur 231 n'ont pas d'axe ; sans son lot B, le foyer se raconterait les marches
      fantômes d'un seul de ses membres. Statut passé à `bloqué` le 2026-09-16 : le ticket ne peut
      pas être ENTIÈREMENT fait avant la fin de ce ou ces tickets.
      DÉBLOCAGE DU 2026-09-21 : statut repassé de `bloqué` à `à faire`. La dépendance stricte
      ci-dessus nommait les lots A et B du 077, qui sont LIVRÉS depuis le 2026-09-15 avec 92
      tests (suite à 1 286 verts) — l'axe des concepts et les observations que GAMA envoie sont
      réparés. Le 077 reste ouvert, mais sur son SEUL lot D1, un arbitrage sur le service de
      l'auto-réflexion dans le bloc noyau : il ne touche ni `axe_objet` ni le vocabulaire des
      modes, donc ce ticket peut être ENTIÈREMENT fait sans attendre sa clôture, et la
      convention du 2026-09-16 ne demande plus `bloqué`. CE QUI RETIENT ENCORE, et qui n'est
      pas un ticket : la contrepartie à mesurer en premier (le 077 comptait 225 concepts sur
      231 à zéro observation — si les confirmations ne repartent pas, le canal naît vide), la
      population `population_12_foyers_078` qui n'existe pas, et le budget du run macro.
      DÉPEND DE : aucun ticket.

    triage:
      faisabilite: 3
      surete: 4
      jeux_de_test: false
      motif: >-
        Faisabilité 3 : il ne reste qu'un repère horodaté par agent, la construction d'un bloc dans
        le contexte de `stm_reflection` (`agents/llm_agent.py` et le gabarit
        `categories/stm_reflection/template.md.j2`), et un filtre qui relit deux compteurs existants
        (`observations`, `derniere_observation`) plus `modes_vehicules_eligibles`. Aucun champ sur
        les concepts, aucun champ de sortie, aucun schéma touché. Ce qui retient la note n'est donc
        pas le travail mais la dépendance : rien ne commence avant que le 077 soit livré en entier,
        et il faut d'abord construire une population de test qui n'existe pas. Sûreté 4 : drapeau
        `memoire__partage_foyer_enabled` FAUX par défaut, aucune règle de mémoire touchée, aucun jeu
        scellé consommé ni modifié, tout ce qui a été mesuré avant reste comparable. Deux points de
        vigilance qui ne sont pas des régressions : le bloc foyer allonge un prompt dont le 077
        vient de montrer qu'il stagne à ~2 100 jetons (d'où le garde-fou et sa mesure), et la règle
        d'ancrage peut rendre le canal vide si les confirmations ne repartent pas — c'est la
        première mesure du run, pas une découverte à faire après coup.
      date: '2026-09-15'
      aamas: 2
  ticket_079_chocs_declares_vecus_par_les_agents:
    status: terminé
    category: Expériences & Cognition
    note: >-
      Ouvert le 2026-09-15 ; ENTRÉE DE STATUT CRÉÉE LE MÊME JOUR — le ticket avait son `.md` et
      aucune ligne ici, donc aucun statut et aucune place dans les classements. Objet : déclarer un
      incident (bouchon, crevaison, panne de réseau, train supprimé, orage) qui fait SUBIR un retard
      à un agent et lui laisse un souvenir écrit dans ses mots, sur un ou plusieurs jours, à
      intensité variable. Il livre à l'étape 3a du chapitre 7 l'instrument qui lui manquait :
      jusque-là le format `Evenement` était accepté, archivé, et son exécution REFUSÉE
      (`experiences/experience.py:621-626`). LOTS 1 À 4 LIVRÉS le 2026-09-15, 34 tests, suite
      complète du dépôt à 1 344 verts : `llm/chocs.py`, injection au point unique du contrôleur,
      deux retards séparés partout, colonnes de trace, garde de contenu, cinq cas dans
      `config/chocs/`, levier `make run CHOC=<nom>`, doc `docs/arch/chocs-declares.md`. DEUX CHOSES
      APPRISES EN CODANT, absentes du cadrage : le retard sature à 30 minutes, si bien qu'un profil
      60/40/25 donnait la MÊME gravité aux jours 1 et 2 — la décrue n'aurait existé que dans le
      texte, le cas `c1` descend donc à 60/25/12 et la gravité suit (0,70 → 0,62 → 0,37) ; et tous
      les cas ne franchissent pas le seuil de choc, ce qui est une information — l'orage plafonne à
      0,45, son souvenir vit 10,4 jours au lieu de 2,8 mais il est rappelé par le mode concerné et
      non hors contexte. RESTE LE LOT 5, la répétition générale à cinq agents, qui demande les lots
      A/B/C du ticket 077 (prérequis dur, § 7). ⚠ Créé d'abord sous le n° 078, pris le même jour
      par le partage de concepts au sein du foyer dans une autre session ; renuméroté en 079 avant
      toute référence extérieure.
      ⛔ DÉPEND DE : 077 — les lots 1 à 4 sont livrés avec 34 tests ; il ne reste que la répétition
      générale à cinq agents, et elle demande les lots A/B/C du 077 — « prérequis dur » selon son
      § 7. Statut passé à `bloqué` le 2026-09-16 : le ticket ne peut pas être ENTIÈREMENT fait
      avant la fin de ce ou ces tickets.
      DÉBLOCAGE DU 2026-09-17 : le lot 5 attendait les lots A/B/C du ticket 077, qui sont LIVRÉS
      (92 tests, suite à 1 286 verts). Ce ticket n'est donc plus bloqué. RECTIFICATIF au passage —
      sa première phrase datait d'avant la livraison : les lots 1 à 4 SONT livrés depuis le
      2026-09-15 et vérifiés dans le dépôt ce jour — `services/llm-agents/llm/chocs.py` (24 ko),
      six cas déclarés dans `services/llm-agents/config/chocs/` (bouchon, crevaison, panne réseau,
      train supprimé, orage, voiture suspecte), levier `make run CHOC=<nom>`, documentation
      `docs/arch/chocs-declares.md`, tests `test_079_chocs.py`. RESTE le seul lot 5 : la répétition
      générale à 5 agents. Aucun run portant un choc n'existe encore dans `experiments/archive/`.
      CLÔTURE DU 2026-09-21, LE LOT 5 EST TRANSFÉRÉ AU TICKET 095 (E3) — décision de l'auteur.
      Deux constats mesurés contre le dépôt ce jour, et non contre cette note. (1) La dernière
      phrase ci-dessus est PÉRIMÉE : huit runs portant un choc existent dans
      `experiments/archive/`, du 2026-09-16_15_58 au 2026-09-21_15_13, chacun avec son
      `choc.yaml` et son `chocs.jsonl` — injection, gravité 0,70 avec son détail par
      composante, retard injecté distinct du retard mesuré, texte vécu écrit. Le mécanisme a
      donc déjà tourné de bout en bout huit fois, et le 077 § 10 a fermé au passage les six
      causes de mort du bras choqué. (2) Ce qui reste vraiment du lot 5 n'est PAS la
      répétition générale : c'est qu'UN SEUL des six cas déclarés a jamais été joué —
      `c6_voiture_suspecte`, et toujours sur un agent seul (899549, puis 861500). C2
      « crevaison », le cas où rien ne change dans le graphe et que le lot 5 désignait
      nommément, n'a jamais été exécuté ; ni C1, C3, C4, C5. Or E3 du ticket 095 joue
      précisément C2, C6 et C3, avec un attendu falsifiable — la date d'extinction suit la
      gravité — là où la répétition générale n'aurait été qu'une épreuve de fumée payée ~1 jour
      de quota. Le reliquat part donc dans E3 sous la forme de deux sorties attendues, écrites
      dans la note du 095 : pour chacun des trois cas, `chocs.jsonl` non vide avec gravité et
      détail par composante conformes à la déclaration ; et au moins un run à exposition
      MULTI-AGENTS avec témoin interne non exposé, la règle `exposition.agents` n'ayant jamais
      servi qu'avec un seul identifiant. La population des 10 personas mesurables du 093 la
      fournit. Bloc `triage` retiré (règle 2 de la skill suivi-tickets, épreuve test_R34).
      Aucun ticket ne portait `DÉPEND DE : 079` — vérifié, rien à débloquer en cascade.

  ticket_080_idee_directrice_du_chapitre_6_et_impact_sur_le_papier:
    status: bloqué
    category: Rédaction & Publication
    note: >-
      Ouvert le 2026-09-15. DÉCISION, pas mesure : quelle idée directrice porte le chapitre de
      résultats. NOTE REMISE À JOUR LE 2026-09-17 — tous les chiffres des versions précédentes de
      cette note sont PÉRIMÉS, deux fois plutôt qu'une. D'abord le 5,35 d'origine, calculé sur
      274 lignes de journal (corrigé par le 081). Ensuite et surtout le substrat lui-même : le
      ticket 088 a établi que l'offre d'itinéraires du premier déplacement de la journée avait été
      calculée pour le LENDEMAIN chez 797 des 894 personas mobiles, soit 866 déplacements sur
      3 299. Aucun rescoring ne corrige cela ; il a fallu rejouer. Les expériences du jeu corrigé
      portent le suffixe `_c_`, et elles seules sont publiables. ÉTAT AU 2026-09-17 sur le jeu
      corrigé — prompt neutre / prompt réglé, composite : gemini-3.5 7,02 / 4,47 ; gemini-3.1
      12,38 / (rejeu à 50 %) ; mistral-large 14,75 / 7,63. Le plafond tabulaire en chaîne est à
      3,60 (lgbm) et 3,61 (klr). L'ablation du prompt se réplique donc sur trois modèles, et c'est
      le résultat qui porte le chapitre. CE QUI RESTE : trois bras gemini-3.5 et un bras gemini-3.1
      à rejouer sur le jeu corrigé, tous arrêtés sur quota — un bras coûte ~2 100 sollicitations
      contre 1 000 requêtes/jour de quota gratuit, soit un peu plus de deux jours par bras. Le
      chapitre porte trois chiffres marqués TBD qui sont exactement ces bras. DÉCISION ACQUISE LE
      2026-09-16 : Antigravity est écarté du périmètre publiable — ni le modèle ni la température
      n'y sont vérifiables (P2 et P2 bis de sa spec), donc ses résultats ne seront pas utilisés,
      et les quatre bras Claude avec eux. La réplication multi-modèles tient sans Claude.
      RÉORGANISATION DU 2026-09-17 : le chapitre passe de sept à cinq sections autour d'un seul
      énoncé, ce qui est mesuré est un couple modèle-consigne ; trois figures régénérables
      (`scripts/analysis/plot_chapitre6.py`) remplacent les paragraphes descriptifs ; le coût part
      au chapitre 9 ; le vocabulaire s'aligne sur le dépôt (décideur, prompt minimal, prompt
      expert) au chapitre 6 comme au chapitre 5. L'écart au plafond tabulaire, recalculé sur le
      jeu corrigé, n'exclut plus zéro face à aucune des quatre méthodes de référence.
      VERROU DE CLÔTURE : le § 4 ter du ticket porte le signalement d'impact du 2026-09-17, trois
      entrées MAJEURES (résumé FR et EN : le 1,2 point devient 1,00 [-0,06 ; +2,09] et n'exclut
      plus zéro ; renvois § 6.5 et § 6.6 du résumé vers des sections qui n'existent plus ;
      vocabulaire des conditions au § 1.2 et § 1.3 de l'introduction) et quatre mineures. Ce
      ticket NE PASSE PAS à `terminé` tant qu'une entrée majeure n'est pas soit corrigée, soit
      marquée « laissé en l'état, décision du <date> » par l'auteur. AU 2026-09-17 SOIR : les sept
      entrées sont statuées (six corrigées, une laissée en l'état), la campagne de rejeu est
      terminée et les quatorze différences appariées sont recalculées sur le seul jeu corrigé
      (trace 2026-09-17_09-40). Deux conclusions bougent : l'écart au plafond exclut zéro face au
      gradient boosté (+1,35 [+0,28 ; +2,47]) et à la régression à noyau, pas face à la forêt ni
      au logit ; et le gain d'ingénierie va davantage à gemini-3.1 (3,37) qu'à gemini-3.5 (2,27),
      le modèle contre lequel la consigne a pourtant été réglée. Ce qui reste avant clôture n'est
      plus un impact mais deux mesures : dispersion inter-graines (073 axe 1, deux TBC au § 6.5) et
      exactitude unitaire de l'agent (058, deux [xx] au § 6.4).
      DÉPEND DE : 073 (dispersion inter-graines, deux TBC au § 6.5) et 058 (exactitude unitaire de
      l'agent sur les déplacements de l'enquête, deux [xx] au § 6.4). Ligne ajoutée le 2026-09-17 :
      le ticket portait `bloqué` sans nommer de bloquant, donc sans apparaître dans aucun
      recensement de dépendances. Il ne dépend d'AUCUN ticket du chapitre 7 — ni du 063, ni du 064,
      ni du 059 : ce sont deux chaînes séparées qui ne se rejoignent qu'au chapitre 9 (ticket 061).

      CONSTAT DU 2026-09-18 : les quatre bras que la note annonçait « à rejouer, tous arrêtés sur
      quota » SONT FAITS. La campagne `rejeu_jeu_corrige_v6` est terminée le 2026-09-17 à 09:34:33
      — 27 expériences faites, `restantes` vide, 2 repêchages, aucune échouée
      (campagnes/…/etat.json). Les composites du jeu corrigé se lisent donc en entier :
      gemini-3.5-flash-lite 7,02 (promin02) contre 4,86 (proexp05), 5,33 (proexp06), 6,58
      (proexp08) ; gemini-3.1-flash-lite 12,38 contre 8,98 ; mistral-large-2512 14,75 contre 7,63
      ; plafond tabulaire en chaîne 3,60 (lgbm) et 3,61 (klr). Les trois TBD du chapitre
      n'attendent plus de run. Le blocage restant est inchangé et n'est pas celui-là : DÉPEND DE
      073 (deux TBC au § 6.5) et 058 (deux [xx] au § 6.4).
      RESTE À FAIRE, relevé le 2026-09-21 et écrit au § 6 bis du ticket — le ticket ne tient plus
      qu'à DEUX MESURES ET UN TEXTE. (1) Ticket 073, seul blocage qui touche encore le chapitre 6 :
      les deux TBC du § 6.5 anticipent une dispersion inter-graines non mesurée ; il faut cinq bras
      sur la v6 et le jeu corrigé, plus l'outil manquant — aucun script du dépôt n'apparie deux
      exécutions. (2) Ticket 058 : les deux [xx] du § 6.4 SONT REMPLIS, les deux bras d'enquête sont
      scorés (promin02 10,41 sur 9 689 décisions, proexp05 7,66 sur 9 686) et le chapitre porte
      l'exactitude unitaire sur 9 621 déplacements de 2 930 enquêtés avec sa figure ; le 058 ne
      bloque donc plus le 080, à l'auteur de le confirmer. (3) Un seul critère d'acceptation sur sept
      reste non satisfait : le chapitre 9 porte encore 7,30 contre 29,81 et le facteur 2 700, ce qui
      contredit l'écart mesuré de +1,35 [+0,28 ; +2,47] — reprise au ticket 061, ce ticket-ci ne fait
      que le signaler. Les six autres critères sont cochés et vérifiés dans le dépôt, pas sur note.
    triage:
      faisabilite: 4
      surete: 5
      jeux_de_test: false
      motif: >-
        Faisabilité 4 : tout ce que le ticket demande d'écrire se fait sans appel LLM, et les
        mesures qu'il attend sont planifiées ailleurs (073, 074, 058) ; il ne se clôt qu'après une
        décision humaine et deux résultats extérieurs. Sûreté 5 : aucun code, aucun jeu scellé,
        aucune expérience touchés ; l'article est sous verrou et le ticket ne fait que signaler.
        Le seul risque est de figer un chapitre sur un chiffre qui bouge encore — d'où le critère
        « aucun chiffre d'une exécution dont lecture.total s'écarte de 3 161 ».
      date: '2026-09-15'
      aamas: 1
  ticket_081_garde_fou_du_scoreur_sur_journal_tronque:
    status: terminé
    category: Ingénierie & Système
    note: >-
      Ouvert et LIVRÉ le 2026-09-15 (suite du 080). Le composite 5,35 du bras expgem38v2 v5 avait été
      calculé sur 274 lignes de moves.csv : arrêt forcé, reprise à froid qui resserre 3 299 décisions
