  ticket_083_signature_ia_dans_l_ecriture_de_l_article:
    status: en cours
    category: Rédaction & Publication
    note: >-
      Ouvert le 2026-09-15 à la demande de l'auteur : une évaluation à double insu lit un manuscrit
      rédigé avec assistance, et les marqueurs d'écriture générée se mesurent. Passe faite le jour
      même sur les 15 chapitres rédigés (trace
      docs/traces/2026-09-15_14-53_ticket083_signature_ia_corpus/, hors git), densités sur la prose
      seule après retrait du code, des tableaux, des liens, des listes de tickets et des en-têtes
      éditoriaux. LE CORPUS PORTE SA PROPRE NORME : fr/02 est à 0,0 cadratin et 0,0 gras pour 1000
      mots, fr/01 à 0,7 et 6,1 — ce sont les deux chapitres les plus relus — quand fr/99 monte à
      17,5 et fr/08 à 36,1. Facteur 20. Les seuils du détecteur se lisent donc dans les chapitres
      validés, ils ne s'importent pas. Relevé : 3 défauts typographiques (incise fermée par « —, »
      dans fr/03:39, en/03:39, fr/04:58) ; la glose en cadratin devenue tic de chapitre (11 des 31
      paragraphes de fr/03, série reproduite ligne pour ligne dans en/03, 14 occurrences dans
      fr/04) ; le gras qui porte l'argument (fr/06:62 met en gras la copule « est », fr/08:16-22
      quatre résultats chiffrés, les deux abstracts cinq emplacements [xx] chacun) ; 4 amorces en
      gras en série. RIEN côté lexique : 13 occurrences relevées, 13 faux positifs vérifiés
      (robust/robustness = vocabulaire SILICA, « paysage de perte » = loss landscape, « ni … ni …
      ni » = énumération française) — d'où la décision de sortir la famille lexicale en informatif
      plutôt que de maintenir une liste d'exemptions. RIEN côté puces : le 13,9 % de en/03 était un
      faux positif du filtre de la passe, qui ne reconnaissait pas le titre anglais de la section
      de queue. Trois lots : A le détecteur `make paper-style` calqué sur verifier_parite.py, B le
      hook PostToolUse fail-open plus la section Style dans la skill article-verrou, C la reprise
      du corpus SOUS VERROU, chaque écriture soumise à accord. Séquencer C4 avec le ticket 080,
      qui réécrira une partie des mêmes passages du chapitre 6.
      LOTS A ET B LIVRÉS le 2026-09-15, lot C livré aux deux tiers. A : `make paper-style`
      (scripts/paper/detecter_artefacts_ia.py), seuils 5 cadratins et 10 gras pour 1000 mots de
      prose, justifiés en tête de script par les densités de fr/01, fr/02, en/01 et en/02 ; famille
      lexicale en informatif, famille puces retirée, filtre de queue bilingue. B : hook PostToolUse
      fail-open (scripts/paper/hook_style_article.py), section « Style » dans article-verrou, bloc
      dans l'agent article-writer, pointeur dans .claude/CLAUDE.md. 18 tests verts
      (scripts/tests/test_083_detecteur_artefacts_ia.py), dont le critère d'acceptation « détecteur
      renommé, l'écriture aboutit ». C livré sur les six fichiers annoncés : C1 les trois incises
      « —, » ; C2 chapitres 3 FR et EN de 8,7 et 8,9 cadratins/1k à 0,0, parité conservée ; C3
      chapitre 4 de 13,1 à 1,6 et de 27,8 à 9,0 de gras, les trois amorces `Règle N` conservées ;
      C4 les deux résumés à 0,0/0,0. Corpus : 19 écarts bloquants ramenés à 10.
      ⚠ TROUVÉ EN CHEMIN, hors du diff accordé : le chapitre 6 a été renommé 06_results.md et
      réécrit par une autre session pendant l'ouverture du ticket — `**est**` et les trois
      `**Matière disponible.**` n'existent plus, et C5 est sans objet sur ce chapitre. Il porte en
      revanche un gras neuf à 27,8/1k, non diagnostiqué ici. RESTE À FAIRE, chacun demandant son
      propre accord : fr/05 (12,0 et 18,0), fr/06_results (5,1 et 27,8), fr/07 (23,1 de gras),
      fr/09 (7,2 et 16,9), fr/99 (17,5 et 19,0). fr/08 reste à 15,2 de gras avec CINQ occurrences
      toutes légitimes sur 330 mots : c'est une limite de la densité sur un chapitre court, pas un
      défaut de style, et le seuil n'a pas été desserré pour le faire passer. Les en-têtes de
      version des six chapitres touchés n'ont pas été incrémentés : la numérotation appartient à
      l'auteur.
      ⚠ OUBLI RATTRAPÉ, signalé par l'auteur : overleaf/ était hors périmètre du DÉTECTEUR (le .tex
      demande un autre filtrage) et j'en avais conclu à tort qu'il était hors périmètre des
      CORRECTIONS. overleaf/00_abstract.tex et overleaf/03_architecture.tex portaient les mêmes
      passages mot pour mot, y compris le défaut « ---, » ; repris à l'identique, plus aucun
      cadratin hors commentaires LaTeX, accolades et dollars équilibrés. Deux enseignements :
      le .tex écrit le cadratin de deux façons (« — » et la ligature « --- », 8 et 14 occurrences
      dans 03_architecture.tex), noté en tête du détecteur pour le jour où overleaf/ entrera dans
      son périmètre ; et make paper-parite compare les NUMÉROS DE VERSION, pas le contenu, donc il
      déclarait ces deux fichiers conformes pendant qu'ils divergeaient de leur maître. Une parité
      de contenu reste à outiller.
    triage:
      faisabilite: 4
      surete: 4
      jeux_de_test: false
      motif: >-
        Les lots A et B sont un script, une cible make et une entrée de hook, sans effet sur aucun
        chiffre publié ; le hook est fail-open par construction. Le lot C écrit dans l'article et
        c'est sa seule zone de risque : il passe par le verrou, diff présenté puis accord, et la
        parité FR/EN des chapitres 3 se vérifie par make paper-parite. Aucune métrique, aucun jeu
        gelé, aucune exécution n'est touchée.
      date: '2026-09-15'
      aamas: 1

  ticket_084_restriction_de_routage_par_instances_admises:
    status: terminé
    category: Ingénierie & Système
    note: >-
      Ouvert et LIVRÉ le 2026-09-16, 27 tests dédiés, contrat `specs/ticket_084/tests.md` écrit
      avant le code. Une requête peut déclarer `instances_admises`, la LISTE des instances de
      passerelle autorisées à la servir, et la restriction est honorée par
      `LoadBalancer.select_provider` — l'unique point de décision du routage — donc AVANT qu'un
      appel ne soit payé. Les trois branches sont couvertes : fournisseur forcé, cascade,
      rotation pondérée. POURQUOI : le fichier de fournisseurs est global à la pile (api, worker,
      contrôleur partagent une valeur), donc un seul travail à la fois ; `force_provider` épingle
      UNE instance et supprime la bascule entre deux clés d'un même modèle ; `allowed_providers`
      refuse APRÈS COUP une réponse déjà facturée. Aucun des trois ne permet de mener une
      expérience sur une famille de modèles pendant que la passerelle en sert d'autres — c'est le
      cas concret du 2026-09-16, mémoire des agents sous gemini 3.1 et gemini 3.5 pour une autre
      session. CINQ RÈGLES : une liste fausse n'est JAMAIS « aucune restriction » (refus nommant
      le fautif) ; toutes les admises saturées lève en les nommant, sans proposer les autres en
      recours ; un fournisseur forcé hors des admises est refusé plutôt qu'arbitré en silence ;
      la restriction est REPORTÉE sur les trois chemins de bascule après incident — c'est le
      point que la première rédaction du plan avait manqué, sans lui elle disparaissait au premier
      4xx et le lot finissait servi par un modèle exclu ; la taille de lot et le seuil de dispatch
      se calculent sur les admises. DEUX PIÈGES INVISIBLES traités : `LLMRequest` n'interdit pas
      les champs supplémentaires, donc un champ non déclaré serait ignoré sans exception ni
      journal ; et la clé de lot est la SEULE garde contre la fusion de deux restrictions dans un
      même lot. `allowed_providers` est conservé comme défense en profondeur. DÉFAUT ANTÉRIEUR
      SIGNALÉ, NON CORRIGÉ : le budget de sortie n'entre pas dans la clé de lot, à traiter dans
      son propre ticket. RÉGRESSION TROUVÉE EN CHEMIN : le bloc `llm_params` de la configuration
      de run REMPLACE le dictionnaire par défaut au lieu de s'y ajouter — y poser la variante de
      prompt avait effacé température, top_p et budget de sortie, vu par le test de régénération
      du journal du ticket 081.


  ticket_086_fidelite_de_la_regle_de_chaine_face_aux_journees_declarees:
    status: abandonné
    category: Modélisation Statistique
    note: >-
      REJETÉ le 2026-09-16, décision de l'auteur : DOUBLON du ticket 057, et fusionné dedans.
      Ouvert à 11:08 pendant la relecture du chapitre 4 pour commander une mesure — rejouer notre
      règle de chaîne sur les journées déclarées d'EMC² — qui avait été faite à 10:52 le même jour
      et écrite au § 2.3 de l'audit du 057. Il citait la « Mesure du 2026-09-16 » de son parent sans
      voir l'audit complet rédigé en dessous : il argumentait contre une version périmée du 057.
      CE QU'IL DEMANDAIT EXISTE : 4,2 % de départs sans voiture dans l'enquête contre 18,0 % sur la
      journée entière du modèle, verrou de retour conforme à 98,5 % du terrain, 18,2 % contre 18,0 %
      de retours contraints. SA DICHOTOMIE H1/H2 EST CADUQUE : l'excès de blocages de sortie varie
      avec le SEUL décideur sur une cohorte unique — 13,8 % prompt calibré, 17,7-18,0 % familles
      tabulaires, 30,9 % plancher aléatoire — ce que ni un défaut de la règle (H1) ni la synthèse de
      population (H2) ne produirait. CE QUI EN SURVIT est repris comme reliquat en fin du ticket 057
      et y devient un critère de clôture : la mesure du § 2.3 réimplémente la règle au lieu d'appeler
      les helpers partagés de vehicle_chain.py (et ignore de ce fait la possession telle que le code
      la lit, _is_car_passenger et RETURN_LOCK_MIN_DISTANCE_KM) ; les blocages à tort ne sont lus
      qu'en dérivé (~173 déplacements, 0,6 %) au lieu d'être isolés ; aucune ventilation par motif ni
      par couronne. Rien à faire sous ce numéro. Fichier conservé avec bandeau de rejet.
    date: '2026-09-16'
  ticket_085_une_contrainte_de_run_ne_doit_pas_vivre_dans_un_fichier_global:
    status: terminé
    category: Ingénierie & Système
    note: >-
      Ouvert le 2026-09-16, à la suite d'un incident de trois heures le matin même. La
      restriction du ticket 084 est posée dans `services/llm-agents/config/config.yaml`, fichier
      GLOBAL à la pile : tout processus lancé depuis le conteneur `controller` la lit, donc aussi
      une expérience en gemini 3.5 qui épingle de son côté `google_gemini35_key1`. Le routeur
      refuse la contradiction — et il a RAISON de refuser, la règle du 084 n'est pas en cause :
      c'est un défaut de PORTÉE, un choix par run logé dans un fichier partagé. Symptôme : la
      reprise avance jusqu'à 2533/3161 puis n'avance plus, en échouant en boucle sans rien dire
      au terminal ; 26 appels en trois heures, tous en gemini 3.1, zéro en gemini 3.5 alors que
      les deux clés 3.5 étaient saines dans /health. TROIS LOTS, ordre imposé. LOT A (prioritaire,
      indépendant) : la boucle d'attente de `task_worker.py:97` n'intercepte que `RuntimeError`
      alors que `RestrictionInstances` est un `ValueError` — elle traverse la tâche AVANT le
      `queue.pop`, si bien que les tâches restent DANS LA FILE et que chaque dispatch suivant les
      reprend et échoue à l'identique. L'échec ne coûte pas 120 s une fois, il se réarme tout
      seul, d'où les dix échecs consécutifs jusqu'au disjoncteur. Le worker rattrape, vide la file
      (`pop` ET `clear_scheduled`), marque en échec avec LES DEUX contraintes nommées, ne
      réessaie pas (erreur déterministe) et ne classe pas cela en `passerelle_occupee`. LOT B :
      `experiences lancer` dérive `instances_admises` du modèle de l'expérience courante et
      l'impose aux réglages du processus, comme `appliquer_fenetre_age` le fait déjà pour la
      fenêtre mémoire ; liste journalisée et consignée dans `execution.yaml`. Le fichier NE
      REPASSE PAS À VIDE : il y a deux chemins de lancement disjoints, et le run 60 jours du
      ticket 084 passe par `make run`, pour qui `config.yaml` est le SEUL véhicule — le vider
      supprimerait la garantie du run qui l'avait motivée, en silence. LOT C : dans
      `experiences/cli.py:384-390` la variable `instances` porte d'abord « sert ce modèle » puis
      est écrasée par « a encore du quota » ; le refus lit la seconde et annonce la première, d'où
      « aucune instance ne sert gemini-3.5-flash-lite » juste après avoir listé ce modèle parmi
      les modèles servis, alors que le motif réel était un quota non renouvelé (fenêtre
      America/Los_Angeles). Les deux ensembles sont séparés, `raison_epuisement()` existe déjà.
      CONSTAT ANNEXE NON TRAITÉ : le verrou par clé API n'est pris que par `cmd_lancer`, donc
      `make run` ne tient aucune clé et rien ne pouvait mettre la reprise en file derrière le run
      3.1 — le chemin `make run` est invisible à toute la coordination inter-expériences, à
      traiter dans son propre ticket. LEÇON PLUS LARGE : `cache.enabled` et `cache_dir` ont
      rigoureusement la même forme et attendent leur incident. LIVRÉ le 2026-09-16, les trois
      lots dans l'ordre imposé, contrat de tests écrit d'abord (`specs/ticket_085/tests.md`, 11 +
      22 tests, tous rendus rouges avant d'être rendus verts). LOT A : le worker rattrape
      `RestrictionInstances`, DRAINE la file (`pop` est borné par un nombre d'AGENTS, un seul
      appel en laissait derrière), appelle `clear_scheduled`, nomme les deux contraintes, ne
      rejoue pas ; l'échec porte `error_kind="restriction_instances"`, que le client traduit en
      `configuration:` — le chemin `RuntimeError` (saturation ordinaire) est intact. LOT C : deux
      variables nommées (`servantes` / `disponibles`) et deux branches de refus exclusives, la
      seconde rendant `raison_epuisement()` ; `instances_servantes=None` conserve au mot près le
      message des appelants écrits avant. LOT B : `appliquer_instances_admises` dérive la liste du
      MODÈLE (pas de la disponibilité : une clé au plafond reste admise), la pose en mémoire,
      journalise tout écrasement d'une valeur non vide du fichier, et l'écrit dans
      `execution.yaml` via `Execution.noter_reglages_herites` à la création COMME à la reprise. Un
      décideur hors passerelle impose une liste vide, y compris quand le fichier en portait une.
      `config/config.yaml` n'est pas touché. QUESTION TRANCHÉE PENDANT LE LOT (§ 9) : le
      comportement du client ne change pas — `configuration` reste un type non terminal, la pause
      pour immobilité fait le reste ; consigné dans `specs/ticket_085/questions.md`, à confirmer.
      RESTE OUVERT : le verrou par clé sur `make run`, l'injection par run de `make run` (préalable
      à tout vidage du fichier), et `cache.enabled` / `cache_dir`.

  ticket_087_la_restriction_ne_couvrait_que_les_decisions_et_gama_mourait_sur_une_pause:
    status: terminé
    category: Ingénierie & Système
    note: >-
      Ouvert et LIVRÉ le 2026-09-16, 11 tests dédiés, contrat `specs/ticket_087/tests.md` écrit
      avant le code. ENTRÉE DE STATUT REMISE LE 2026-09-21 : le ticket avait son `.md` et plus
