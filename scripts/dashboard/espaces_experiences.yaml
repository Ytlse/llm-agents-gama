# Espaces de travail du registre d'expériences — spec `espaces-de-travail-experiences.md`.
#
# Un espace est une VUE, jamais un rangement : y ajouter ou en retirer une expérience ne
# déplace, ne renomme et ne supprime rien sur le disque (R7).
#
# Le nom d'une expérience se calcule depuis ses paramètres (spec `nommage-canonique-experiences`) :
# il ne peut donc pas porter sa phase. C'est l'étiquette `phase` ci-dessous qui fait le lien,
# et elle n'existe que dans cette vue (R6a).
#
# Un nom sans dossier sur le disque n'est pas une erreur : la ligne s'affiche comme attendue
# et le registre compte les manquantes (R9). Ce fichier échoue OUVERT : s'il est illisible,
# le registre s'ouvre sur « Toutes les expériences » (R13).
version: espaces1
espaces:
  - nom: papier version courte
    note: >-
      Ticket 103 — le carré Jev × Gemini hors échantillon sur la cohorte c2, et trois graines
      par décideur clé sur c1. Les entrées « Acquis (c1) » sont déjà mesurées : elles ne sont
      pas à rejouer, elles sont là parce que les nouvelles ne se lisent pas sans elles (une
      mesure c2 ne se compare pas à une bande c1).
    entrees:

      # ── Phase 1 — l'échelle de c2 ──────────────────────────────────────────────────
      # Déterministes et gratuites, elles passent EN PREMIER : sans le plafond et le plancher
      # de c2, aucune ligne des phases 2 et 3 ne se lit (ticket 103, § 1).
      - experience: exp_mnl_jtir_pop-1000_AAMAS_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
      - experience: exp_lgbm_jtir_pop-1000_AAMAS_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
