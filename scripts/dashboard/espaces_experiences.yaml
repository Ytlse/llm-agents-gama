        phase: Phase 1 — échelle c2
        note: >-
          Lanceur dédié et chemin de population HÔTE : la forêt a été estimée sous
          scikit-learn 1.8.0 et le conteneur porte la 1.9.0 (cf. campagne `rejeu_jeu_corrige_v6`).
      - experience: exp_alea_jtir_pop-1000_AAMAS_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
      - experience: exp_majvoiture_jtir_pop-1000_AAMAS_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 1 — échelle c2
