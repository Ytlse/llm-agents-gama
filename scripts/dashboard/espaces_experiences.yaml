        phase: Phase 1 — échelle c2

      # ── Phase 2 — Jev sur c2 ───────────────────────────────────────────────────────
      # Cinq minutes et ~0,35 $ pour les trois. `proexp32` est le résultat pivot hors
      # échantillon : c'est lui que la question Q1 du ticket interroge.
      - experience: exp_jev-1130_promin02_jtir_pop-1000_AAMAS_v6_c2_jeu-20260316_EN_c_nosim
        phase: Phase 2 — Jev sur c2
      - experience: exp_jev-1130_proexp05_jtir_pop-1000_AAMAS_v6_c2_jeu-20260316_EN_c_nosim
