# Caractéristiques de la population INTERROGÉE par l'enquête qui sert de cible.
#
# ⚠ CE FICHIER EST LE CADRAGE OPPOSABLE (ticket 020). Il décrit *qui* l'enquête a
# compté, *où*, *quand* et *comment*. Toute comparaison entre une part modale simulée
# et une cible de `cerema_values.yaml` suppose que les deux côtés parlent de la même
# population : ce fichier est ce qui rend cette supposition vérifiable.
#
# Source : Enquête Mobilité Certifiée CEREMA — EMC² 2023, bassin de vie toulousain.
# Microdonnées ProGEDO/ADISP lil-1750 (accès restreint, `data/PROGEDO 2023/`).
#
# ⚠ CHAQUE VALEUR CI-DESSOUS EST RECALCULÉE DEPUIS LES MICRODONNÉES par
# `llm_module.core.population_reference`, et le test `test_population_reference.py`
# échoue si l'une d'elles s'écarte de sa tolérance. Avant le ticket 020, l'essentiel
# de ce fichier dormait en commentaire et AUCUN code ne le lisait : une valeur de
# cadrage sans lecteur est une valeur fausse en attente.
#
# Ce qui a été RETIRÉ, et pourquoi — trois blocs commentés ne sont pas revenus :
#   * équipement vélo par type d'habitat : servi par `llm_module/data/bike_ownership.json`
#     (ticket 015), seule source de vérité. Une seconde copie ici finirait par diverger.
#   * stationnement au domicile par type d'habitat : aucun consommateur, et la variable
#     d'enquête correspondante n'est pas celle que le bloc annonçait.
#   * télétravail : aucun consommateur, et la chaîne d'activités vient d'eqasim, pas d'ici.
# Un bloc commenté « au cas où » est de la vacuité : il a l'air d'être une donnée.

enquete:
  nom: "Enquête Mobilité Certifiée CEREMA - EMC²"
  annee: 2023
  periode_enquete:
    debut: "2022-09-20"
    fin: "2023-02-18"
    hors_vacances_scolaires: true
    contexte_sanitaire: "normalisé"
  methodologie:
    type: "EMC² (méthode nationale Cerema)"
    selection: "tirage aléatoire des ménages"
    modes_passation:
      face_a_face: 0.50
      telephone: 0.50
    age_minimum_enquete: 5          # ans — vérifié : min(P4) = 5 dans le fichier personnes
    jours_enquetes: [1, 2, 3, 4, 5] # veille = lundi à vendredi ; aucun week-end
    populations_exclues:
      - "touristes / visiteurs"
      - "populations spécifiques (EHPAD...)"
      - "flux de marchandises"
    redressement:
      effectue_par: "CEREMA"
      etapes:
        - "redressement de la non-réponse (fichier des Propriétés Bâties)"
        - "redressement sur données RP2019"
      variables_redressement:
        - "taille des ménages"
        - "motorisation"
        - "âge"
        - "occupation principale"
        - "sexe"
      poids:
        COE0: "coefficient de redressement du MÉNAGE — toute cible ménage se pondère avec"
        COEP: "coefficient de redressement de la PERSONNE — toute part modale se pondère avec"

  echantillon:
    menages_enquetes: 10783
    personnes_interrogees: 15775    # de 5 ans et + interrogées en propre (PENQ = 1)
    personnes_recensees: 20890      # tous membres des ménages enquêtés, fichier personnes
    deplacements_recenses: 54585    # ⚠ 54 585 et non 54 785 : compté dans le fichier
    communes_couvertes: 453
    secteurs_de_tirage: 88
    zones_fines: 785
    personnes_min_par_secteur: 160

  # Localisation du déplacement (variable TYPD), pondérée COEP. Les cibles de
  # `cerema_values.yaml` correspondent aux déplacements INTERNES : recalcul sur les
  # internes seuls → voiture 55,0 % (cible publiée 55) ; sur TOUS → 56,1 %.
  localisation_deplacements:
    interne_au_perimetre: 95.94
    en_echange: 2.69
    externe_au_perimetre: 1.37

territoire:
  perimetre_2023:
    nom: "aire urbaine toulousaine"
    communes: 453
    superficie_km2: 5400
    densite_hab_km2: 260
  perimetre_2013:
    communes: 178
    habitants: 1200000
    usage: "comparaison des évolutions sur 10 ans"
  # ⚠ Découpage par LISTE DE COMMUNES, jamais par distance au centre. Les comptes
  # ci-dessous sont ceux de la couche SIG de l'enquête (`EMC2_Toulouse_2023_DTIR`,
  # champ `NOM_D2`), qui fait foi : elle donne 69 et 108, là où la publication
  # arrondit à 68 et 109. La correspondance commune → couronne est exportée dans
  # `llm_module/data/commune_couronne.json` (`make communes-couronnes`).
  decoupage_concentrique:
    - nom: "Toulouse"
      communes: 1
    - nom: "1ere couronne"
      communes: 69
    - nom: "2eme couronne"
      communes: 108
    - nom: "3eme couronne"
      communes: 275

population:
  totaux_perimetre_2023:
    habitants: 1400000
    habitants_5_ans_et_plus: 1320000   # population cible de l'enquête (recalcul : 1 319 k)
    nombre_menages: 674000             # recalcul pondéré COE0 : 673 k
    taille_moyenne_menage: 2.08        # ⚠ moyenne PAR MÉNAGE, pas par personne
  repartition_par_territoire:
    toulouse:
      communes: 1
      menages: 288000
      habitants: 507000
      habitants_5_ans_et_plus: 480000
      densite_hab_km2: 4290
      part_population_5_plus: 0.36
      taille_moyenne_menage: 1.75
    premiere_couronne:
      communes: 69
      menages: 215000
      habitants: 479000
      habitants_5_ans_et_plus: 450000
      densite_hab_km2: 720
      part_population_5_plus: 0.34
      taille_moyenne_menage: 2.23
    deuxieme_couronne:
      communes: 108
      menages: 80000
      habitants: 200000
      habitants_5_ans_et_plus: 187000
      densite_hab_km2: 150
      part_population_5_plus: 0.14
      taille_moyenne_menage: 2.48
    troisieme_couronne:
      communes: 275
      menages: 90000
      habitants: 215000
      habitants_5_ans_et_plus: 203000
      densite_hab_km2: 65
      part_population_5_plus: 0.15
      taille_moyenne_menage: 2.39
  concentration:
    coeur_agglomeration_toulouse_plus_1ere_couronne: 0.70   # recalcul : 70,5 %

  repartition_par_classe_age:
    "5-17_ans": 16
    "18-24_ans": 13
    "25-34_ans": 14
    "35-49_ans": 22
    "50-64_ans": 19
    "65_ans_et_plus": 16

  repartition_par_occupation_principale:
    scolaires_jusqu_au_bac: 17
    etudiants: 9
    actifs_temps_plein: 39
    actifs_temps_partiel: 5
    en_recherche_emploi: 7
    retraites: 18
    autres: 5

# ⚠ Cibles MÉNAGES. Une population synthétique est un échantillon de PERSONNES : la
# comparer telle quelle produit un écart fantôme (le biais de taille — les grands
# ménages y sont sur-représentés proportionnellement à leur taille). Pondérer chaque
# personne par 1/taille_du_ménage rétablit la base ménage. Mesuré ticket 020 sur
# `toulouse_population_1000.json` : 1,47 voiture/ménage en brut contre 1,23 pondéré,
# pour une cible de 1,25.
menages_equipement_voiture:
  perimetre_2023:
    voitures_par_menage_moyen: 1.25    # recalcul pondéré COE0 : 1,25
    repartition_motorisation:          # en % — recalcul : 19,4 / 45,3 / 35,3
      sans_voiture: 19
      une_voiture: 45
      deux_voitures_et_plus: 35
  par_territoire:
    toulouse:
      voitures_par_menage: 0.82
      sans_voiture_pct: 35
      une_voiture_pct: 49
      deux_voitures_plus_pct: 16
    premiere_couronne:
      voitures_par_menage: 1.47
      sans_voiture_pct: 9
      une_voiture_pct: 46
      deux_voitures_plus_pct: 45
    deuxieme_couronne:
      voitures_par_menage: 1.71
      sans_voiture_pct: 5
      une_voiture_pct: 38
      deux_voitures_plus_pct: 58
    troisieme_couronne:
      voitures_par_menage: 1.66
      sans_voiture_pct: 6
      une_voiture_pct: 38
      deux_voitures_plus_pct: 55

# ── Où chaque valeur ci-dessus est PUBLIÉE (relu le 2026-09-02) ──────────────────
# Rapport final AUAT/CEREMA « Enquête mobilité 2023 — bassin de vie toulousain », 68 pages,
# mai 2024 (https://www.aua-toulouse.org/wp-content/uploads/2024/05/Rapport-final-68-pages-
# Enquete-mobilite-2023-Bassin-de-vie-toulousain.pdf). Pages du PDF.
#
# Ce bloc n'ajoute AUCUNE valeur : il dit d'où viennent celles du fichier, pour qu'un
# recoupement ne dépende plus de la mémoire de qui l'a saisi. Les fiches méthodologiques
# CEREMA (https://www.cerema.fr/fr/actualites/enquetes-mobilite-certifiees-cerema-methodologie)
# donnent la méthode — hiérarchie des modes, dimensionnement par secteur — mais aucune marge
# toulousaine.
sources_publication:
  population.totaux_perimetre_2023: "p. 10 — 1,4 M habitants, 674 000 ménages, 1,32 M de 5 ans et +, 2,08 pers./ménage"
  population.repartition_par_territoire: "p. 10 — chiffres clés par territoire (ménages, habitants, 5 ans et +, densité, part 36/34/14/15 %)"
  population.repartition_par_classe_age: "p. 11 — 6 classes, population de 5 ans et + redressée"
  population.repartition_par_occupation_principale: "p. 11 — 7 postes, population de 5 ans et + redressée"
  menages_equipement_voiture.perimetre_2023: "p. 21 — 19 / 45 / 35 %, base MÉNAGE ; voitures par ménage par couronne 0,82 / 1,47 / 1,71 / 1,66"
  menages_equipement_voiture.par_territoire: "p. 21 — répartition par couronne (35-49-16, 9-46-45, 5-38-58, 6-38-55)"
  territoire.decoupage_concentrique: "p. 10 — 1 / 68 / 109 / 275 communes tels que publiés ; la couche SIG DTIR donne 69 / 108 et fait foi"
  # ⚠ Absents du rapport, donc sans cible publiée : la répartition par SEXE et le taux de
  # détention du PERMIS (le mot n'apparaît qu'une fois, p. 4, dans la liste des questions).
  # Le contrôle de population les rend « non mesurable » ; des candidats recalculés sur les
  # microdonnées (P2, P7, COEP) vivent dans scripts/AAMAS/cible_jointe_couronne_motorisation.yaml.
  non_publie: ["repartition_par_sexe", "taux_detention_permis"]
  # ⚠ Piège : l'annexe p. 66 est une série historique sur le PÉRIMÈTRE 2013 (984 000 hab.,
  # 504 000 ménages, 1,09 voiture/ménage, 24 % sans voiture). Ne pas la mélanger au 2023.
  perimetre_2013_annexe: "p. 66 — série 1978-2023 sur le périmètre 2013, hors cadrage"
  # La motorisation sur base PERSONNE (13,6 / 37,8 / 48,7 %) n'est publiée nulle part : c'est
  # un recalcul microdonnées, gelé avec sa provenance dans
  # scripts/AAMAS/cible_jointe_couronne_motorisation.yaml — pas une seconde copie ici.
