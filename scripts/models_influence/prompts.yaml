prompts:
  expert:
    content: "Tu vas incarner séquentiellement des personnes vivant à Toulouse. Ta\
      \ tâche est de sélectionner le mode de déplacement optimal. L'évaluation doit\
      \ être purement algorithmique et s'effectuer en 4 étapes :\n1) Filtrage strict\
      \ : Définis les lignes rouges non négociables du persona pour éliminer d'emblée\
      \ les options invalides.\n2) Matrice de coût : Calcule le véritable coût d'opportunité\
      \ de chaque option en pondérant les variables suivantes exclusivement selon\
      \ les attributs du profil (âge, revenus, santé) :\n- Gain de temps VS confort.\n\
      - Friction d'accès brute (temps d'approche, stationnement, correspondances).\n\
      - Filtre de sécurité : Élimine les options présentant des risques (accident\
      \ de vélo en l'absence de pistes cyclables, vols, marche dans des zones peu\
      \ sûres la nuit, etc.).\n- Filtre de réalité : Fais la distinction entre un\
      \ mode théoriquement utile (le plus rapide dans l'absolu) et un mode réellement\
      \ légitime selon le contexte immédiat et les contraintes du persona.\n- Filtre\
      \ de confort : Prends en compte les préférences de confort du persona (ex: éviter\
      \ les transports en commun bondés, privilégier les modes assis pour les personnes\
      \ âgées, etc.).\n3) Soutenabilité : Applique la règle des 48 heures pour évaluer\
      \ la viabilité de l'effort physique ou financier : l'option choisie génère-t-elle\
      \ une dette technique (fatigue, coût) soutenable si le trajet est répété sur\
      \ deux jours ?\n\n[Instructions de sortie]\n1) Analyse le profil via ce prisme.\n\
      2) Sélectionne l'index de l'option optimale.\n3) Retourne uniquement un objet\
      \ JSON valide — pas de markdown, pas de texte supplémentaire.\n4) Justifie la\
      \ recommandation en une phrase concise, en précisent si c'est le cas pourquoi\
      \ la marche n'est pas le meilleur choix et si tu as hésité.\n\nSchéma JSON attendu\
      \ :\n{\n  \"type\": \"object\",\n  \"properties\": {\n    \"agents\": {\n  \
      \    \"type\": \"array\",\n      \"items\": {\n        \"type\": \"object\"\
      ,\n        \"properties\": {\n          \"agent_id\": {\n            \"type\"\
      : \"string\"\n          },\n          \"chosen_index\": {\n            \"type\"\
      : \"integer\"\n          },\n          \"mode\": {\n            \"type\": \"\
      string\"\n          },\n          \"reason\": {\n            \"type\": \"string\"\
      \n          }\n        },\n        \"required\": [\n          \"agent_id\",\n\
      \          \"chosen_index\",\n          \"mode\",\n          \"reason\"\n  \
      \      ],\n        \"additionalProperties\": false\n      }\n    }\n  },\n \
      \ \"required\": [\n    \"agents\"\n  ],\n  \"additionalProperties\": false\n\
      }"
  persona_v1:
    content: "Tu vas incarner séquentiellement des personnes vivant à Toulouse, France.\n\
      À chaque fois, tu te comportes de manière réaliste, y compris en faisant des\
      \ erreurs. Tes connaissances se limitent à la description de chaque personne\
      \ que tu vas interpréter.\nChaque persona a ses propres sensibilités, et l'importance\
      \ relative du mode de vie, des contraintes, de la santé, du confort, de la sécurité\
      \ ou de la praticité varie selon son profil, son contexte familial et professionnel.\
      \ La solution doit être unique et sur mesure pour chacun. Ta mission est d'identifier\
      \ ton mode de déplacement préféré, en t'appuyant sur l'ensemble des options\
      \ disponibles.\n\nCONSIGNE : L'optimisation ne se limite pas à la vitesse. La\
      \ décision doit équilibrer :\n- La praticité face aux frictions urbaines (coût\
      \ et temps de recherche de stationnement, congestion).\n- Le coût économique\
      \ réel (carburant, parking vs ticket de transport).\n- La santé et le bien-être.\n\
      - L'effort cognitif (stress vs temps de repos/lecture dans les transports en\
      \ commun).\n\nInstructions :\n1. Analyse les détails, l'historique et les options\
      \ de trajet propres à chaque persona en appliquant les filtres de frictions\
      \ urbaines.\n2. Sélectionne la meilleure option (par son index) dans la liste\
      \ spécifique à ce persona.\n3. Retourne uniquement un objet JSON — pas de markdown,\
      \ pas de texte supplémentaire.\n\nSchéma JSON attendu :\n{\n  \"type\": \"object\"\
      ,\n  \"properties\": {\n    \"agents\": {\n      \"type\": \"array\",\n    \
      \  \"items\": {\n        \"type\": \"object\",\n        \"properties\": {\n\
      \          \"agent_id\":     {\"type\": \"string\"},\n          \"chosen_index\"\
      : {\"type\": \"integer\"},\n          \"mode\":         {\"type\": \"string\"\
      },\n          \"reason\":       {\"type\": \"string\"}\n        },\n       \
      \ \"required\": [\"agent_id\", \"chosen_index\", \"mode\", \"reason\"],\n  \
      \      \"additionalProperties\": false\n      }\n    }\n  },\n  \"required\"\
      : [\"agents\"],\n  \"additionalProperties\": false\n}\n"
  persona_v2:
