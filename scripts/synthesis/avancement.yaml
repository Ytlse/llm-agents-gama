# ── Le plancher de bruit d'un run, mesuré ────────────────────────────────────
#
# Test de permutation sur le run 2026-08-24_17_34 : on re-DÉCOUPE le MÊME run en deux
# moitiés, 60 fois, et on regarde de combien le composite bouge. Rien de réel ne change —
# c'est le pendant, au niveau du run, du témoin nul `v9n` des jeux gelés.
#
# Résultat : de −4,42 à +5,41 points. TOUS les écarts entre runs consécutifs de la série
# ci-dessus sont PLUS PETITS que cette amplitude. Aucun n'est donc attribuable, y compris
# le −1,88 de la ligne `run_reference_2026_08_24`, que sa propre trace signalait déjà.
#
# Source : docs/traces/2026-08-25_run_reference/results.json, clé `permutation`.
runs_noise:
  source_run: '2026-08-24_17_34'
  method: test de permutation — re-découpage du même run en deux moitiés
  n_draws: 60
  min: -4.4240
  max: 5.4137
  median: 0.4132
  observed: -1.0941
  p_value: 0.6333
