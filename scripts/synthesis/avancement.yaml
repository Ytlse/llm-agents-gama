# Registre des mesures « base de référence → base modifiée », rendu par
# `scripts/synthesis/render_avancement.py` → `docs/synthesis/avancement_et_resultats.html`.
#
# UNE LIGNE = UNE MESURE, et la ligne n'existe que si la mesure a été faite. Ce fichier
# n'est pas un plan : une hypothèse non testée n'y figure pas, sinon la page devient une
# liste d'intentions et cesse de dire ce qui est établi.
#
# Chaque `score` doit être RETRAÇABLE jusqu'à une trace committée sous `docs/traces/`.
# Le champ `trace` porte ce chemin ; une ligne sans trace est refusée par le rendu.
#
# Le champ `synthesis` (optionnel) pointe une page de `docs/synthesis/` : la synthèse
# INTERMÉDIAIRE que cette mesure a fait bouger. Le rendu vérifie qu'elle existe. Ne pas
# confondre les deux supports : une trace score des JEUX GELÉS, une synthèse score un RUN.
#
# ⚠ Le champ `score` n'est pas libre : c'est la grandeur sur laquelle la décision a été
# prise, avec son signe et son unité. Quand le composite n'est PAS attribuable (traitement
# minoritaire noyé dans le bruit — cf. docs/arch/protocole-parametre-exogene.md), on porte
# l'effet RECONSTRUIT et on le dit dans `score_caveat`.

meta:
  title: Avancement et résultats
  subtitle: >-
    Chaque correction envisagée, ce qu'elle a changé, et ce que la mesure a rendu.
    Les mesures de correction portent sur des jeux gelés et coûtent des dizaines d'appels
    LLM au lieu d'heures de simulation — cf. le protocole de paramètre exogène. Les lignes
    de RÉFÉRENCE font exception : elles datent le run de production qui rejoue les
    corrections adoptées, et leur `score` est run à run, donc non attribuable.
  protocol: docs/arch/protocole-parametre-exogene.md
  metric_note: >-
    Le composite est une LOSS : il baisse quand la simulation se rapproche de l'enquête.
    Un Δ négatif est donc une amélioration. Les mesures de correction sont appariées
    (mêmes personas, mêmes options des deux côtés) et évaluées à température 0 sur un
    modèle épinglé ; une ligne de référence, elle, compare deux RUNS entiers — rien n'y est
    apparié, et son caveat de lecture dit ce que le chiffre ne porte pas.

measures:

  - id: run_reference_2026_08_24
    date: '2026-08-25'
    metric: composite
    metric_dataset: 'run'
    composite_reference: 20.1087
    composite_modified: 18.2316
    composite_note: >-
      Comparaison RUN À RUN : plusieurs changements simultanés, l'écart n'est attribuable à
      aucun d'eux.
    subject: Run de référence — corrections implémentées en dur et rejouées sur GAMA
    ticket: '—'
    reference: >-
      Run `2026-08-02_18_55` — 2 830 décisions, 867 personnes. Composite 20,11,
      L1 global 33,27 pt. Parts : marche 10,17 / voiture 56,87 / vélo 16,11 / TC 16,85.
    modified: >-
      Run `2026-08-24_17_34` — 2 911 décisions, 890 personnes. Composite 18,23,
      L1 global 29,81 pt. Parts : marche 11,90 / voiture 57,58 / vélo 13,29 / TC 17,23,
      pour une cible EMC² de 26,80 / 56,70 / 4,12 / 12,37.
    change: >-
      Les corrections validées sur jeux gelés sont passées EN DUR dans la chaîne, puis
      rejouées sur GAMA : temps terminal aligné sur EMC² (production `tt3`), règle de
      chaîne au prompt système (`expert_chaine`), anticipation de la journée
      (`agenda_anticipation_enabled`), mémoïsation des réflexions, disjoncteur du gateway
      LLM. La chaîne de véhicules et le type de logement étaient déjà là au 2 août : ils
      ne font pas partie de l'écart.
    result: >-
      Le run est meilleur que son prédécesseur — composite 20,11 → 18,23. Le vélo
      redescend de 16,11 à 13,29 % (cible 4,12) et la marche remonte de 10,17 à 11,90 %
      (cible 26,80) : le défaut de fond, la sous-représentation massive de la marche,
      n'est pas corrigé. Ce run devient la RÉFÉRENCE : il est épinglé par la page de
      synthèse, le volet 3 y est recalculé, et les jeux gelés `v9` en sont tirés
      (protocole, amendement A10).
    score: '−1,88 composite (run à run)'
    score_kind: better
    score_caveat: >-
      Support : un RUN, pas un jeu gelé — donc l'écart n'est PAS attribuable à une cause
      unique. Plusieurs changements sont simultanés et la flotte de modèles diffère
      (96,4 % des décisions LLM sur les deux Gemini contre 77,9 % dans la référence), le
      bruit de découpage vaut 5,41 pt d'amplitude contre 1,88 mesuré, et 11,4 % des
      décisions du jour sont des replis d'erreur — hors score, mais JOUÉS par la
      simulation. Enfin l'agrégat est meilleur que chacune de ses parties par compensation
      d'erreurs : décisions d'un modèle 19,01, itinéraires uniques 104,47, run entier
      18,23 — les premières sur-représentent les TC (23,8 % contre 12,4), les secondes
      n'en produisent aucun. Cette ligne ne remplace aucune mesure sur jeu gelé.
    verdict: adopte
    comment: >-
      La ligne existe pour que la référence soit DATÉE et retraçable, pas pour créditer les
      corrections d'un gain : ce sont les traces sur jeux gelés qui les chiffrent, une
      variable à la fois. Un run les rejoue toutes ensemble et dit seulement où la
      production en est.
    trace: docs/traces/2026-08-25_run_reference
    synthesis: models/2026-08-24_17_34/index.html

