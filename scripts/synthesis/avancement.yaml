  - id: fenetre_meteo
    date: '2026-08-25'
    metric: composite
    metric_dataset: 'val'
    composite_reference: 26.75
    composite_modified: 25.06
    composite_note: >-
      À lire contre le plancher de bruit du témoin nul `v9n` : +1,98 sur le même jeu.
      L'écart mesuré lui est INFÉRIEUR en valeur absolue.
    subject: Météo des jeux gelés — fenêtre d'enquête, bulletin, et agenda annoté
    ticket: '023'
    reference: '`v9` — météo tirée dans l''année climatique entière (365 j, graine `meteo_v2`), substrat du run de référence 2026-08-24_17_34'
    modified: '`v10` — tirage restreint aux 152 jours de la fenêtre EMC² (20/09 → 18/02, graine `meteo_v3`). `v10b` ajoute le bulletin du jour, `v10c` l''agenda annoté par étape au relevé de 3 h ; `v9n` est le TÉMOIN NUL — mêmes 365 jours, graine différente'
    change: >-
      Réécriture de la seule ligne de contexte météo, de la ligne « Météo plus tard » du
      même jour tiré et des annotations de l'agenda glissant. Diff strict vérifié sur
      2 874 records × 3 variantes : zéro ligne hors périmètre.
    result: >-
      REJET SUR LES TROIS CORRECTIONS, et un second résultat sur l'INSTRUMENT. Le témoin
      nul, qui ne change AUCUNE distribution, déplace le composite de −0,34 sur `screen` et
      de +1,98 sur `val` — il change même de SIGNE entre les deux jeux. La fenêtre vaut
      −0,43 et −1,69 : sur `val`, le seul jeu indépendant, elle est SOUS le plancher. Le
      bulletin (+0,55 puis +1,72) et l'agenda annoté (+1,95 puis −0,17) n'y résistent pas
      davantage. L'agenda est le cas d'école : sur `screen` son +1,95 est le contraste le
      plus fort de la campagne — 5,7 fois le plancher — et sur `val` il tombe à −0,17, en
      changeant de signe. DEUX FOIS `screen` A PRODUIT UN SIGNAL QUE `val` N'A PAS
      CONFIRMÉ : il ne porte que 121 personas, son plancher y est six fois plus étroit, et
      un plancher étroit fabrique des signaux. Ce jeu ne doit plus être lu seul.
    score: '−1,69 composite sur `val`, pour un plancher de bruit de +1,98'
    score_secondary: 'agenda annoté : +1,95 sur `screen`, −0,17 sur `val` — le signal s''effondre sur le jeu indépendant'
    score_kind: neutral
    score_caveat: >-
      Le canal placebo du protocole était INUTILISABLE : le traitement touche 99 % du jeu,
      le placebo aurait pesé 1 % (19 enregistrements) et sa mise à l'échelle l'aurait
      amplifié d'un facteur 9,7. Le témoin nul à pleine masse a coûté un quart de la
      campagne — et il a évité un faux positif, puisque le −1,69 aurait été déclaré
      « signal » contre un plancher étroit.
    verdict: rejete
    comment: >-
      Ce que la mesure établit porte sur l'INSTRUMENT plus que sur la météo : la variance
      propre de l'éval (~2 points de composite sur `val`) dépasse l'effet visé. Le tirage
      de production reste sur l'année entière — la simulation doit pouvoir se jouer
      n'importe quand. AUCUNE conclusion sur la pluie n'est tirée, comme le ticket
      l'exigeait avant la mesure : son Δ change de signe selon le substrat. Le bulletin
      enrichi reste en production comme un choix de CONTENU, pas comme un résultat de
      mesure. L'agenda annoté n'est PAS porté en production — il n'y a jamais été, et
      c'est ce qui a permis de ne rien livrer sur la foi du +1,95 de `screen`. ⚠ La
      RÉSOLUTION DE 3 H reste une piste ouverte : `v10c` la portait en paquet avec
      l'annotation, la mesure ne peut pas les départager, et son rejet ne la condamne pas.
      Quatre relevés sur huit dorment encore dans la source, et le code météo diffère entre
      12H et 15H sur 44 % des jours.
    trace: docs/traces/2026-08-25_ab_meteo

