# Grille d'attendus du jugement — remplie le 2026-09-22 par la session, à la demande de l'auteur
#
# ⚠⚠ CONFLIT D'INTÉRÊT À CONNAÎTRE AVANT DE LIRE LE RÉSULTAT. Cette grille devait être écrite par
# l'auteur, avant toute réponse, et par quelqu'un qui n'exécute pas la mesure. Elle est écrite ici
# par celui qui lance le test, et pour six des huit textes après en avoir déjà vu des réponses.
# Le champ `deja_vu` le dit cellule par cellule :
#
#   deja_vu: true   — des réponses avaient été observées avant d'écrire la plage (les cinq
#                     articles le 2026-09-22 par B1, c6 par B3). La plage peut avoir été
#                     inconsciemment ajustée : le test n'y prouve presque rien.
#   deja_vu: false  — AUCUNE réponse n'a jamais été observée sur ce texte. La prédiction est
#                     aveugle, et c'est là que le test a une valeur.
#
# Deux cellules sont aveugles : `c2_crevaison` et `c3_panne_reseau`. Ce sont deux des trois bras
# de l'expérience sur la durée, et la prédiction posée sur elles — c2 plus faible que c6, c3 plus
# fort — est exactement l'hypothèse que l'expérience veut tester.
#
# L'auteur peut écraser n'importe quelle plage ; c'est sa grille, celle-ci n'est qu'un brouillon
# qui permet de faire tourner le test tout de suite.
#
# POURQUOI CE FICHIER EXISTE
# --------------------------
# Depuis la décision du 2026-09-22, la gravité d'un souvenir est celle que l'agent estime, et
# elle seule. C'est elle qui fixe la durée de vie du souvenir. Un modèle qui répondrait « anodin »
# partout ferait donc tourner cinquante jours de campagne pour ne rien mesurer — ce qui a failli
# arriver le 2026-09-22, pour une autre raison (le texte n'atteignait pas le modèle).
#
# Cette grille est le garde-fou : elle dit, AVANT la campagne, ce qu'on trouverait normal à la
# lecture de chaque texte. Le test fonctionnel confronte les réponses à cette déclaration et
# refuse de lancer si l'écart est trop grand.
#
# ⚠ ELLE DOIT ÊTRE ÉCRITE AVANT DE VOIR LES RÉPONSES. Une grille ajustée après coup ne garde
# plus rien : elle décrit ce que le modèle a répondu, et le test passe toujours.
#
# COMMENT LA REMPLIR
# ------------------
# `attendu` : la PLAGE d'échelons qu'on trouverait raisonnable — pas une valeur. Deux personnes
#   sensées ne jugent pas identiquement un article sur des punaises. Une plage d'un seul échelon
#   est un pari fort ; elle est permise, elle sera juste plus souvent violée.
#   Échelons, du plus faible au plus fort, avec leur durée servie :
#     anodin (4,70 j) · notable (8,23 j) · genant (11,76 j) · grave (16,17 j) · marquant (20,58 j)
#
# `modes_attendus` : les modes sur lesquels cela devrait porter. Liste vide = ne devrait porter
#   sur aucun en particulier. Le test signale un mode rendu hors de cette liste, sans refuser.
#
# `motif` : une phrase. C'est elle qu'on relira dans six mois pour savoir si la plage était un
#   jugement réfléchi ou un chiffre posé au hasard.
#
# `sensible_au_profil` : true si l'on S'ATTEND à ce que la réponse dépende de la personne (un
#   automobiliste et un usager du métro ne lisent pas de la même façon un article sur le métro).
#   Le test mesure alors l'écart entre profils au lieu de le traiter comme du bruit.

# ══════════════ LES CINQ ARTICLES DE PRESSE — canal « lu », injection au réveil ══════════════

a07_greve_eboueurs:          # « Refuse collectors' strike »
  attendu: [anodin, notable]
  modes_attendus: []
  motif: "Les poubelles ne sont pas ramassées : rien n'empêche de se déplacer, rien ne coûte de temps sur un trajet. Une contrariété de ville, pas de mobilité."
  sensible_au_profil: false
  deja_vu: true

a09_vent_autan:              # « Autan gales, parks closed »
  attendu: [notable, genant]
  modes_attendus: [walking, cycling]
  motif: "Des rafales à plus de 80 km/h et des parcs fermés annoncent une journée où l'on s'expose : à pied et à vélo, cela pèse sur le choix du matin."
  sensible_au_profil: true
  deja_vu: true

a13_punaises_metro:          # « Bed bug scare on the metro »
  attendu: [anodin, notable]
  modes_attendus: [public_transport]
  motif: "Une inquiétude sans conséquence pratique — aucune rame supprimée, aucun retard. Porte sur le métro et sur rien d'autre."
  sensible_au_profil: true
  deja_vu: true

a18_la_machine:              # « La Machine street show »
  attendu: [notable, genant]
  modes_attendus: [walking, public_transport, car]
  motif: "900 000 visiteurs au centre-ville sur trois jours : c'est une journée où traverser le centre coûtera du temps, quel que soit le mode."
  sensible_au_profil: true
  deja_vu: true

a25_velotoulouse:            # « VélôToulouse overhaul »
  attendu: [anodin, notable]
  modes_attendus: [cycling]
  motif: "Une amélioration de l'offre, annoncée pour plus tard et de valence positive. Elle ne perturbe rien aujourd'hui ; elle peut changer un arbitrage à venir."
  sensible_au_profil: true
  deja_vu: true

# ══════════════ LES INCIDENTS VÉCUS — canal « vecu », injection à l'arrivée ══════════════
#
# ⚠ CES TROIS-LÀ SONT LES BRAS DE L'EXPÉRIENCE SUR LA DURÉE. C'est ici que la grille sert le
# plus : si l'agent ne les sépare pas, l'expérience ne mesurera rien, et il vaut mieux le savoir
# pour trente appels que pour trois campagnes.
#
# Pour mémoire, ce que la simulation MESURE de ces trois incidents aujourd'hui — ce n'est plus
# ce qui fixe la durée, mais c'est le fait auquel le jugement de l'agent sera comparé :
#   c2_crevaison   35 min de retard, incident        → 0,768
#   c6_voiture     30 min de retard, incident        → 0,700
#   c3_panne       45 min, incident, corresp. ratée  → 1,000
# Deux d'entre eux sont donc à un écart de 0,07 : si le protocole attend trois durées bien
# séparées, c'est du jugement qu'elles devront venir, pas du retard déclaré.

c2_crevaison:                # « Flat tyre on the way » — le cas censé être FAIBLE
  attendu: [notable, genant]
  modes_attendus: [cycling]
  motif: "TEXTE ÉCRIT PAR L'AUTEUR le 2026-09-22, prédiction AVEUGLE. Vingt minutes de réparation, mains pleines de cambouis pour le reste du trajet, vingt minutes de retard. Du temps coûté, donc au moins `notable` ; rien de manqué et rien de décalé, donc pas `grave`."
  sensible_au_profil: true
  deja_vu: false

c6_voiture_suspecte:         # « Engine trouble » — le cas censé être MOYEN
  attendu: [grave, marquant]
  modes_attendus: [car]
  motif: "TEXTE ÉCRIT PAR L'AUTEUR, prédiction AVEUGLE. Un poids lourd s'arrête à quelques mètres du pare-chocs, quarante-cinq minutes de retard. L'ancre de `grave` parle de mise en difficulté et celle de `marquant` de ce dont on se souvient dans un mois : un accident évité de justesse relève des deux. ⚠ Je ne sais PAS prédire ce bras au-dessous ou au-dessus de c3 — les deux plages sont identiques, et c'est un aveu, pas une commodité."
  sensible_au_profil: true
  deja_vu: false

c5_orage_grele:              # « Violent hailstorm » — HORS MARCHE ORDONNÉE, sonde à part
  attendu: [genant, grave]
  modes_attendus: [walking, cycling]
  motif: "Demandé par l'auteur le 2026-09-22. Prédiction AVEUGLE, et c'est la sonde la plus
    intéressante des quatre : quinze minutes de retard seulement — donc presque rien de perdu en
    temps — mais arrivée trempé et chaussures mouillées TOUTE LA JOURNÉE. L'ancre de `notable`
    exclut explicitement une conséquence sur la suite de la journée, ce qui pose le plancher à
    `genant` ; celle de `grave` parle de « mise en difficulté », ce qu'une journée en chaussures
    mouillées peut être. Ce texte demande donc à l'agent si une GÊNE QUI DURE pèse autant qu'un
    TEMPS PERDU. Il ne fait pas partie de la marche ordonnée : il la traverse."
  sensible_au_profil: true
  deja_vu: false

c3_panne_reseau:             # « Metro network failure » — le cas censé être FORT
  attendu: [grave, marquant]
  modes_attendus: [public_transport]
  motif: "TEXTE ÉCRIT PAR L'AUTEUR, prédiction AVEUGLE. Vingt-cinq minutes sans information, rendez-vous MANQUÉ, rame bondée au redémarrage, et la QUATRIÈME panne de la ligne ce mois-ci. Le rendez-vous manqué donne `grave` ; la répétition est ce qui « change ma façon de me déplacer », l'ancre de `marquant`."
  sensible_au_profil: true
  deja_vu: false

# ══════════════ LA MARCHE ══════════════
# Les bras, dans l'ordre de sévérité VISÉ. Le test vérifie que les échelons rendus ne DESCENDENT
# jamais le long de cette liste, et qu'ils montent STRICTEMENT entre deux bras dont les plages
# attendues sont disjointes. Deux bras qui partagent la même plage ne sont pas départagés : on
# n'exige pas d'une mesure qu'elle tranche ce que personne n'a su prédire.
marche: [c2_crevaison, c6_voiture_suspecte, c3_panne_reseau]

# ══════════════ SEUILS DU TEST — proposés, à valider ══════════════
seuils:
  # Part maximale de jugements hors de leur plage avant que la campagne soit refusée.
  part_hors_plage_max: 0.20
  # Nombre minimal d'échelons DISTINCTS sur l'ensemble des textes. En dessous, le dispositif
  # ne sépare rien et l'expérience sur la durée ne mesurera pas ce qu'elle annonce.
  echelons_distincts_min: 3
  # Personas interrogés par texte. 4 × 8 textes = 32 appels, une douzaine de minutes. Les quatre
  # premiers de la population du banc couvrent les quatre combinaisons qui comptent ici : avec ou
  # sans permis, avec ou sans voiture, avec ou sans vélo, avec ou sans abonnement.
  personas: 4
