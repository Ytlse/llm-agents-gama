# Filet local avant commit (ticket 037). Installation, une fois :
#   pip install pre-commit && pre-commit install
# Portée : les trois paquets. Le reste du dépôt n'est pas touché.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(llm_gateway|mobility_core|mobility_llm)/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        files: ^(llm_gateway|mobility_core|mobility_llm|\.github)/
      - id: end-of-file-fixer
        files: ^(llm_gateway|mobility_core|mobility_llm)/
      - id: trailing-whitespace
        files: ^(llm_gateway|mobility_core|mobility_llm)/
