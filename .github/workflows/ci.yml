# CI des trois paquets (ticket 037) : lint, typage, contrats d'architecture, tests, build.
# Un job par paquet + un job docs. Les tests de contrat du gateway tournent contre un Redis
# de service (en plus de fakeredis), pour tester l'implémentation réelle, scripts Lua compris.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "llm_gateway/**"
      - "mobility_core/**"
      - "mobility_llm/**"
      - ".importlinter"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "llm_gateway/**"
      - "mobility_core/**"
      - "mobility_llm/**"
      - ".importlinter"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · contrats d'architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les paquets (editable) et l'outillage
        run: |
          python -m pip install --upgrade pip
          pip install -e ./mobility_core[geo,test,dev] -e ./llm_gateway[test,dev] -e ./mobility_llm[test,dev]
      - name: ruff
        run: ruff check llm_gateway mobility_core mobility_llm
      - name: ruff format (informatif tant que le reformatage n'est pas appliqué, cf. H10)
        run: ruff format --check llm_gateway mobility_core mobility_llm || true
      - name: mypy — contrat public du gateway (core, ports, sdk)
        working-directory: llm_gateway
        run: mypy src/llm_gateway/core src/llm_gateway/ports src/llm_gateway/sdk
      - name: import-linter — 5 contrats
        run: lint-imports

  test-gateway:
    name: llm_gateway · tests (Redis de service)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LLM_GATEWAY_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ./mobility_core -e ./llm_gateway[test] -e ./mobility_llm
      - name: pytest (unit, contract, integration) avec couverture
        working-directory: llm_gateway
        run: pytest -m "not e2e" --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-llm-gateway
          path: llm_gateway/coverage.xml

  test-mobility:
    name: mobility_core + mobility_llm · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ./mobility_core[geo,test] -e ./llm_gateway -e ./mobility_llm[test]
      - name: mobility_core
        working-directory: mobility_core
        run: pytest --cov --cov-report=term-missing
      - name: mobility_llm
        working-directory: mobility_llm
        run: pytest -m "not e2e" --cov --cov-report=term-missing

  build:
    name: wheels + sdist
    runs-on: ubuntu-latest
    needs: [quality, test-gateway, test-mobility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: |
          for pkg in mobility_core llm_gateway mobility_llm; do
            python -m build --outdir dist/ "$pkg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    name: mkdocs --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ./mobility_core -e ./llm_gateway[docs] -e ./mobility_llm
      - working-directory: llm_gateway
        run: mkdocs build --strict
