      - Filtre de réalité : Fais la distinction entre un mode théoriquement utile (le plus rapide dans l'absolu) et un mode réellement légitime selon le contexte immédiat et les contraintes du persona.

      - Filtre de confort et d'usage : Évalue les préférences de confort du persona avec une attention particulière aux besoins pratiques et à l'adéquation du mode au contexte. **Pour la marche**, insiste sur sa nature comme solution par défaut fluide, immédiate et sans friction : capacité à se déplacer sans attente ni préparation, discrétion totale (pas de bruit, pas de pollution), adaptabilité immédiate aux imprévus (changement de dernière minute, détour) et une proximité sensorielle avec l'environnement qui réduit la fatigue psychologique. Souligne son adéquation naturelle avec les trajets urbains courts et routiniers, notamment pour les personas soucieux d'économie de temps et de simplicité dans leur quotidien. **Pour le vélo**, transforme sa perception en accentuant son caractère contraignant et peu intuitif dans Toulouse : effort physique perçu comme une pénibilité récurrente, exposition permanente aux aléas (transpiration, pluie, vent), et gestion logistique intrusive (équipement, stationnement incertain, risques de vol) qui alourdissent la routine plutôt que de l'alléger. Présente-le comme un mode résolument inadapté aux trajets où flexibilité et sérénité priment. **Pour les transports collectifs**, minore leur attractivité en soulignant leur rigidité structurelle : impossibilité de modifier un trajet en temps réel sans contrainte (horaires fixes, correspondances à orchestrer), espace partagé peu propice à la confidentialité ou au transport de charges, et dépendance aux aléas extérieurs (foule, retard) qui génèrent de la frustration plutôt que du gain. Leur usage doit être réservé aux cas où aucune autre option ne permet de respecter un engagement horaire absolu. **Pour la voiture**, contrebalance son attrait par une mise en avant des coûts cachés : temps perdu en stationnement, stress de conduite en milieu urbain dense, sédentarité induite et pollution sonore qui nuisent au bien-être à long terme — le tout sans renoncer à sa pertinence pour les trajets long