# Famille des prompts (specs/hygiene-prompts-et-plateforme-experiences.md §4.1) :
# un seul prompt de famille minimale, toutes les autres variantes sont expertes.
familles:
  minimale:
  - prompt_minimal
  defaut: experte
active:
  itinary_multi_agent: expert_chaine
prompts:
  expert_gem_3.8_v2:
    _neutralite:
      verdict: conforme
      famille: experte
      le: '2026-09-10'
      sha256_texte: 018b598bb223dc518974e83545bd38f4af2fa6dd625f715dd182154fec399814
      auditeur: prompt-auditor (agent independant)
      regles_evaluees: [C1, C2, C3, C4, C5, E1]
      constats: []
    content: |
      Sélectionner le mode de déplacement optimal en tenant compte du persona.

      Principes d'arbitrage situationnel :
      - Friction de chaîne : Reconstitue la durée porte-à-porte réelle (marche d'approche, attente, trajet, diffusion). Si la marche d'accès représente l'essentiel du trajet direct pour quelques minutes à bord, l'usager privilégie la simplicité du trajet direct à pied sans rupture ni attente.
      - Autonomie des aînés : Chez les personnes âgées ou fragiles, une marche continue et paisible à son propre rythme est le mode naturel d'indépendance pour la proximité, face à la pénibilité et au stress d'un transport collectif (secousses, risque de chute, montées de marche, attente debout sans banc).
      - Logistique d'emport : Intègre la contrainte physique des charges (courses, sacs lourds, cabas). Porter des charges dans un transport collectif est dissuasif ; l'arbitrage s'oriente vers l'accès direct sans rupture (marche immédiate de quartier ou coffre d'un véhicule individuel).
      - Temps de vie des actifs : Pour un actif engagé dans une journée contrainte, le temps retranché sur la vie personnelle a une valeur critique. Face à des liaisons collectives qui augmentent significativement la durée ou imposent de multiples correspondances, l'usager privilégie l'efficacité et la maîtrise horaire de son véhicule disponible.

      [Instructions de sortie]

      1. Analyse le profil à travers ces principes.
      2. N'élimine aucune option : attribue à CHAQUE option proposée, par son index, la probabilité en % que ce persona la retienne — d'autant plus élevée qu'elle lui correspond, 0 si elle lui est impossible. La somme doit valoir exactement 100.
      3. Retourne uniquement un objet JSON valide — pas de markdown, pas de texte supplémentaire.
      4. Justifie la répartition en une phrase concise, en précisant si c'est le cas pourquoi la marche n'obtient pas la plus forte probabilité.

      Schéma JSON attendu : { "type": "object", "properties": { "agents": { "type": "array", "items": { "type": "object", "properties": { "agent_id": { "type": "string", "description": "Recopie exactement l'agent_id fourni pour ce persona (identifiant numérique uniquement, sans préfixe ni nom)." }, "probabilities": { "type": "array", "description": "Une entrée par option proposée à ce persona, sans exception. La somme des `probability` doit valoir exactement 100.", "items": { "type": "object", "properties": { "index": { "type": "integer", "description": "Index de l'option, tel qu'affiché entre crochets." }, "mode": { "type": "string", "description": "Mode de l'option, recopié depuis l'option." }, "probability": { "type": "number", "description": "Probabilité en % (0 à 100) que ce persona retienne cette option. 0 si l'option lui est impossible." } }, "required": [ "index", "mode", "probability" ], "additionalProperties": false } }, "reason": { "type": "string" } }, "required": [ "agent_id", "probabilities", "reason" ], "additionalProperties": false } } }, "required": [ "agents" ], "additionalProperties": false }
    _provenance:
      role: correction de 'expert_gem_3.8_v1' — le multiplicateur de durée est retiré au profit d'un
        qualificatif, la clause ne fixe plus de seuil chiffré
      obtention: >-
        « Face à des liaisons collectives qui doublent la duré… » devient « Face à des liaisons collectives qui augmentent signi… ». Aucune autre différence, au caractère près.
        Audit du 2026-09-10 : la clause d'origine tombait sous C1 (seuil chiffré suivi d'une
        consigne de rang), un multiplicateur écrit en lettres restant un nombre.
      date: '2026-09-10'
      derive_de: expert_gem_3.8_v1
      reference: specs/hygiene-prompts-et-plateforme-experiences.md
