      regles_evaluees: [C1, C2, C3, C4, C5, E1]
      constats:
      - regle: C1
        passage: "Quand un transport collectif double ou triple la durée porte-à-porte par rapport à un véhicule individuel disponible, l'usager arbitre en faveur du mode le plus économe en temps de vie"
        lecture: "Bloquant. « double ou triple » est un seuil chiffré sur une durée : un nombre écrit en lettres et exprimé en multiple reste un nombre. La protase pose l'indicateur et son franchissement, l'apodose prescrit un rang d'option. La jurisprudence du 2026-09-10 ne couvre pas ce cas — « 48 heures » et « 3 à 25 °C » décrivent une situation sans déboucher sur un mode."
    _invalidation:
