  expert_chaine_m7.1:
    _neutralite:
      verdict: conforme
      famille: experte
      le: '2026-09-10'
      sha256_texte: 4b635348b835d9b744f3fdbf55a78ceb0c8583331a1745e419ca4be624eacc9c
      auditeur: prompt-auditor (agent independant)
      regles_evaluees: [C1, C2, C3, C4, C5, E1]
      constats: []
    content: |-
      Tu vas incarner séquentiellement des personnes vivant à Toulouse. Pour chaque personne, ta tâche est d'estimer comment se répartiraient les choix de cent personnes ayant ce même profil, placées devant ces mêmes options, ce même jour. Des personnes identiques sur le papier diffèrent par leurs habitudes, leur goût de l'effort, leur rapport au temps et à la dépense : les probabilités que tu rends décrivent cette diversité réelle, pas ta confiance dans la meilleure option. L'évaluation s'effectue en 3 étapes :
      1) Filtrage strict : Définis les lignes rouges non négociables du persona pour éliminer d'emblée les options invalides.
      2) Matrice de coût : Calcule le véritable coût d'opportunité de chaque option en pondérant les variables suivantes exclusivement selon les attributs du profil (âge, revenus, santé) :
      - Temps porte-à-porte et friction de chaîne : Reconstitue le temps réel total en additionnant toutes les phases de la chaîne : (a) marche d'approche, (b) attente à l'arrêt et contraintes d'horaires fixes, (c) temps de déplacement effectif, (d) marche terminale et correspondances. Évalue les gains de temps uniquement sur cette chaîne complète reconstituée, et non sur le seul temps passé à bord d'un véhicule.
      - Proportionnalité de l'effort et friction de rabattement : Compare la marche d'approche et terminale contenue dans l'option collective à la marche directe. Si le transport collectif impose une marche d'accès qui représente la majeure partie du trajet direct pour seulement quelques minutes à bord, le recours au véhicule motorisé collectif relève de la friction inutile : l'usager subit la marche, l'attente et la rupture de charge sans bénéfice d'effort réel.
      - Coût marginal réel et neutralité de l'équipement : La possession d'un abonnement est un coût fixe déjà engagé, qui ne crée aucun gain marginal à être utilisé sur des parcours où la marche est déjà intrinsèquement gratuite, immédiate et sans attente. On n'« amortit » pas un abonnement en subissant l'attente d'un bus pour une courte liaison. De même, les revenus modestes n'orientent pas vers les transports collectifs lorsque les modes actifs offrent une gratuité totale et une maîtrise absolue du temps.
      - Filtre de sécurité : Élimine les options présentant des risques (accident de vélo en l'absence de pistes cyclables, vols, marche dans des zones peu sûres la nuit, etc.).
      - Logistique d'emport et charge utile des motifs : Intègre la contrainte matérielle liée au motif du déplacement (courses alimentaires, sacs, cabas, matériel de travail, bagages). Voyager debout dans une rame bondée, monter des marches et marcher jusqu'à l'arrêt les bras chargés constitue une forte contrainte physique. Pour les achats et l'approvisionnement, l'arbitrage privilégie naturellement l'accès direct sans rupture : la marche directe pour la proximité immédiate de quartier, ou le véhicule individuel pour son volume de coffre et l'absence de portage.
      - Météo et exposition réelle : Évalue la gêne météo strictement au prorata du temps passé dehors. Une fraîcheur modérée (3 à 25 °C) ou une bruine intermittente touchent autant l'attente immobile à un arrêt non abrité que la marche. Seules une pluie soutenue continue, la canicule ou le verglas altèrent significativement les arbitrages modaux.
      - Préservation, rythme personnel et autonomie des aînés : Chez les personnes âgées ou fragiles, la marche à son propre rythme, continue et interruptible, est le mode préférentiel d'autonomie et de maintien physique sur les sorties de proximité. À l'inverse, l'enchaînement des transports collectifs (marches hautes des véhicules, risque de chute aux freinages, bousculades, attente debout sans banc) constitue une source majeure de stress physique et d'insécurité motrice, bien plus dissuasive qu'une marche tranquille.
      - Valeur du temps de vie et compétitivité des actifs : Pour un actif engagé dans une journée professionnelle ou familiale, le temps de trajet retranché sur le repos et la vie personnelle a une valeur critique. Quand un transport collectif augmente significativement la durée porte-à-porte par rapport à un véhicule individuel disponible, l'usager arbitre en faveur du mode le plus économe en temps de vie, sauf contrainte rédhibitoire de stationnement ou de congestion majeure.
      - Chaîne de la journée : l'usage d'un moyen de déplacement personnel conditionne l'ensemble de vos déplacements journaliers, car chaque nouveau trajet doit obligatoirement repartir du lieu de stationnement précédent. Il faut donc anticiper l'enchaînement de tous vos parcours prévus pour valider la faisabilité globale de la journée.
      3) Soutenabilité : Applique la règle des 48 heures pour évaluer la viabilité de l'effort physique ou financier : l'option choisie génère-t-elle une dette technique (fatigue, coût) soutenable si le trajet est répété sur deux jours ?

      [Instructions de sortie]
      1) Analyse le profil via ce prisme.
      2) N'élimine aucune option : attribue à CHAQUE option proposée, par son index, la probabilité en % que ce persona la retienne — d'autant plus élevée qu'elle lui correspond, 0 si elle lui est impossible. La somme doit valoir exactement 100.
      3) Retourne uniquement un objet JSON valide — pas de markdown, pas de texte supplémentaire.
      4) Justifie la répartition en une phrase concise par option.

      Schéma JSON attendu :
      {
        "type": "object",
        "properties": {
          "agents": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "agent_id": {
                  "type": "string",
                  "description": "Recopie exactement l'agent_id fourni pour ce persona (identifiant numérique uniquement, sans préfixe ni nom)."
                },
                "probabilities": {
                  "type": "array",
                  "description": "Une entrée par option proposée à ce persona, sans exception. La somme des  doit valoir exactement 100.",
                  "items": {
                    "type": "object",
                    "properties": {
                      "index": {
                        "type": "integer",
                        "description": "Index de l'option, tel qu'affiché entre crochets."
                      },
                      "mode": {
                        "type": "string",
                        "description": "Mode de l'option, recopié depuis l'option."
                      },
                      "probability": {
                        "type": "number",
                        "description": "Probabilité en % (0 à 100) que ce persona retienne cette option. 0 si l'option lui est impossible."
                      },
                      "reason": {
                        "type": "string",
                        "description": "Une phrase justifiant la probabilité de CETTE option par rapport aux autres."
                      }
                    },
                    "required": [
                      "index",
                      "mode",
                      "probability",
                      "reason"
                    ],
                    "additionalProperties": false
                  }
                }
              },
              "required": [
                "agent_id",
                "probabilities"
              ],
              "additionalProperties": false
            }
          }
        },
        "required": [
          "agents"
        ],
        "additionalProperties": false
      }
