# C7 — Bruit suspect dans le moteur · voiture · agents nommés
#
# Variante créée pour revenir à l'intention initiale du choc C6 : un bruit important
# et anormal entendu dans le moteur (au lieu d'une simple panne silencieuse), tout en
# respectant les règles R9 et R10 (aucun verdict prématuré ni intention modale dictée).
#
# Le retard (45 min puis 20 min) et l'incident réseau confèrent au souvenir une gravité
# suffisante (≥ 0,70 en palier / ~0,64 en asymptote) pour franchir les filtres de mémorisation
# sans court-circuiter la réflexion nocturne.

choc: c7_voiture_bruit_suspect
libelle: "Abnormal engine noise"
source: "scénario déclaré — cas d'étude individuel, retour au texte initial avec bruit important et anormal"
cadence: jour

exposition:
  regle: agents
  agents: ["899549", "1250941", "861500"]
  modes: [car]

jours:
  - jour: 15
    retard_min: 45
    incident_reseau: true
    vecu: >-
      The engine made a loud and abnormal grinding noise and the car stalled on the expressway.
      I pulled onto the hard shoulder and waited 35 minutes for roadside assistance before the car
      would restart. I arrived 45 minutes after the time I had planned.
  - jour: 16
    retard_min: 20
    incident_reseau: true
    vecu: >-
      Warning lights came on again and the loud and abnormal engine noise was back. I drove at reduced
      speed for the whole journey, constantly listening to the engine, and arrived 20 minutes late.
