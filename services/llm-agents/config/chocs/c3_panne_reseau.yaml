# C3 — Panne du réseau · transports en commun
# Le seul cas qui atteint naturellement la correspondance ratée : 0,50 (retard saturé) + 0,20
# (correspondance) + 0,20 (incident) = 0,90 de gravité, soit 17,9 jours de durée de vie.
# C'est le choc que le chapitre 7 annonce.
choc: c3_panne_reseau
libelle: "Metro network failure"
source: "scénario déclaré — van Exel & Rietveld (2001), Transport Policy 8(4)"

# CADENCE AJOUTÉE le 2026-09-22, avant la campagne d'attribution. Sans cette ligne la cadence
# vaut `trajet` : une panne de réseau déclarée une fois s'appliquait à CHACUN des trajets en
# transports collectifs de la journée. 861500 en fait un à deux par jour — il aurait donc
# « manqué le rendez-vous vers lequel il se rendait » deux fois dans la même journée, avec deux
# jugements et deux souvenirs de gravité 0,75 là où le protocole en déclare un.
# C'est le défaut EXACT que c6 avait payé le 2026-09-19 (quatre dépannages de trente minutes au
# lieu d'un), corrigé là par la même ligne. Les quatre autres cas du 079 — c1, c2, c4, c5 — l'ont
# reçue le 2026-09-24.
cadence: jour

exposition:
  regle: mode
  modes: [public_transport]

jours:
  - jour: 12
    retard_min: 28
    incident_reseau: true
    correspondance_ratee: true
    vecu: >-
      The metro stopped between two stations and the lighting went out. No announcement was made
      for 25 minutes. When the service restarted the carriage was packed full. I missed the
      appointment I was travelling to, and arrived 28 minutes after the time I had planned. It is
      the fourth time this month that this line has stopped.
  - jour: 13
    retard_min: 20
    incident_reseau: true
    vecu: >-
      The line ran at reduced frequency all morning. Three trains passed at full capacity before I
      could board one. I arrived 20 minutes late.
