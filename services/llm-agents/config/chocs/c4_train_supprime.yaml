# C4 — Train supprimé · train
# Peu d'agents concernés, gravité forte. L'exposition par mode suffit : seuls les trajets
# comportant une jambe ferroviaire remontent `train` comme mode principal.
choc: c4_train_supprime
libelle: "Regional train cancelled"
source: "scénario déclaré"

# CADENCE AJOUTÉE le 2026-09-24, comme sur c3 et c6 : au plus une application par agent et par
# jour. Sans elle, la cadence `trajet` injectait l'événement à chaque trajet du mode visé.
cadence: jour

exposition:
  regle: mode
  modes: [train]

jours:
  - jour: 12
    retard_min: 50
    incident_reseau: true
    vecu: >-
      My regional train was cancelled. No reason was given, and no replacement time was announced
      for 30 minutes. I waited 50 minutes on the platform for the next service.
