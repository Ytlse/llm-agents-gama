# ── Classe de vitesse autorisée : distribution TIRÉE, somme 1 ──────────────────────
# Renseignée sur 97,9 % des accidents (`vma` du fichier lieux). Chaque arête du graphe
# porte une vitesse, donc aucune table de correspondance à inventer.
#
# Le contraste avec la longueur du réseau est le résultat le plus parlant de la mesure,
# et il justifie à lui seul le conditionnement : la classe 71-90 km/h porte 27,3 % des
# accidents pour 4,4 % des kilomètres, quand la classe ≤ 30 km/h porte 8,0 % des
# accidents pour 58,1 % des kilomètres. Tirer une arête au prorata de sa longueur, comme
# le faisait la première tranche, plaçait donc 58 % des accidents en zone apaisée.
distribution_classe_vitesse:
  '<=30': 0.079515
  '31-50': 0.574663
  '51-70': 0.042049
  '71-90': 0.272507
  '>90': 0.031267

