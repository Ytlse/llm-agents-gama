# Loi d'accidentalité du ticket 070, estimée sur BAAC/ONISR.
#
# MESURÉ le 2026-09-14 sur les millésimes 2019-2024, département 31, par
# docs/traces/2026-09-14_20-40_loi_accidents_baac/mesure_loi_accidents.py (rejouable).
# Source : data.gouv.fr, Licence Ouverte. 3 789 accidents corporels lus, 3 414 dans
# l'emprise du graphe simulé, aucun non géolocalisé.
#
# CE QUI DEMANDE UN DÉNOMINATEUR ET CE QUI N'EN DEMANDE PAS — la distinction gouverne
# tout ce fichier. L'heure, le jour et la classe d'axe sont TIRÉS par la simulation : la
# distribution marginale des accidents observés est exactement ce qu'il faut, et diviser
# par le trafic serait une faute (on obtiendrait le risque par véhicule-km, qui ferait
# survenir autant d'accidents à 3 h qu'à 17 h). La météo, elle, est IMPOSÉE par le
# bulletin du jour : elle réclamerait un risque relatif, donc un dénominateur.

source: BAAC / ONISR — data.gouv.fr, Licence Ouverte
millesimes: [2019, 2020, 2021, 2022, 2023, 2024]
departement: '31'
mesure_le: '2026-09-14'
accidents_lus: 3789
accidents_dans_emprise: 3414

# Accidents corporels par jour DANS L'EMPRISE DU GRAPHE (périmètre des 453 communes),
# et non sur tout le département : 90,1 % des accidents du 31 y tombent. L'ancienne
# valeur d'amorçage, 1,73/jour, était celle du département entier — elle surestimait.
taux_base_par_jour: 1.5578

