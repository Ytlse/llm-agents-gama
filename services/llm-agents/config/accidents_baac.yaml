# ── Classe de vitesse autorisée : distribution TIRÉE, somme 1 ──────────────────────
# Renseignée sur 97,9 % des accidents (`vma` du fichier lieux). Chaque arête du graphe
# porte une vitesse, donc aucune table de correspondance à inventer.
#
# Le contraste avec la longueur du réseau est le résultat le plus parlant de la mesure,
# et il justifie à lui seul le conditionnement : la classe 71-90 km/h porte 27,3 % des
# accidents pour 4,4 % des kilomètres, quand la classe ≤ 30 km/h porte 8,0 % des
# accidents pour 58,1 % des kilomètres. Tirer une arête au prorata de sa longueur, comme
# le faisait la première tranche, plaçait donc 58 % des accidents en zone apaisée.
distribution_classe_vitesse:
  '<=30': 0.079515
  '31-50': 0.574663
  '51-70': 0.042049
  '71-90': 0.272507
  '>90': 0.031267

# Kilomètres du graphe `drive` par classe — CONTRÔLE, pas dénominateur. Sert à vérifier
# qu'une classe tirée existe bien dans le réseau simulé : une classe sans kilomètres est
# un accident impossible à poser, et cela doit s'entendre plutôt que se taire.
km_reseau_par_classe:
  '<=30': 17750.6
  '31-50': 10350.3
  '51-70': 660.8
  '71-90': 1350.2
  '>90': 431.3

# ── Météo : SEUL FACTEUR NON ÉTABLI, et il reste neutre ────────────────────────────
#
# Le calcul a été fait et son résultat est REJETÉ. Rapporter la part d'accidents par
# condition à la fréquence de cette condition dans les relevés de Toulouse donne :
#   normale × 1,36 · temps couvert × 0,17 · pluie légère × 0,47 · pluie forte × 1,23
#   neige × 0,53 · brouillard × 33,7
# soit « la pluie légère est deux fois plus sûre que la moyenne » et « le brouillard
# multiplie le risque par 34 ». Aucune des deux n'est croyable.
#
# LA CAUSE EST UNE INCOMMENSURABILITÉ DES NOMENCLATURES, pas un manque de données.
# `atm` est ce que l'agent verbalisateur a coché : 84 % des constats portent « normale »,
# y compris sous un ciel couvert. La source météo locale, elle, classe 15,6 % des
# créneaux en « couvert » et 20,2 % en « pluie légère » — cette dernière catégorie
# absorbant le code 176 « pluie possible », qui est une prévision, pas une observation.
# Les deux vocabulaires ne découpent pas le même monde ; leur rapport ne mesure rien.
# Le brouillard s'y ajoute d'un défaut de dénominateur : 0,03 % des créneaux, soit une
# poignée d'observations, et le ratio explose.
#
# TANT QUE CE FACTEUR N'EST PAS ÉTABLI, IL VAUT 1. Ajuster la correspondance jusqu'à
# obtenir des nombres plausibles reviendrait à choisir le résultat. Les deux voies
# propres sont : une source d'exposition découpée comme `atm`, ou un risque relatif
# déclaré exogène (docs/arch/protocole-parametre-exogene.md).
facteur_meteo_etabli: false
facteur_meteo:
  'normale': 1.0
  'temps couvert': 1.0
  'pluie légère': 1.0
  'pluie forte': 1.0
  'neige – grêle': 1.0
  'brouillard – fumée': 1.0

# Ce que le calcul rejeté avait produit — conservé pour que le rejet soit vérifiable,
# jamais lu par le code.
facteur_meteo_mesure_rejete:
  'normale': 1.3621
  'temps couvert': 0.1652
  'pluie légère': 0.4725
  'pluie forte': 1.2294
  'neige – grêle': 0.5269
  'brouillard – fumée': 33.7208
