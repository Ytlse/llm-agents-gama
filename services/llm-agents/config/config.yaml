# Test de non-régression et de mécanisme : une date météo par agent.
#
# Mémoire coupée volontairement (le levier autoritaire est
# services/GAMA/CityTransport/config/sim_params.yaml, via `make run MEM=0` — Settings.gaml
# écrase à cycle 1 tout paramètre injecté par le contenu de ce fichier).
# Sans souvenirs, la décision ne dépend que des conditions factuelles : c'est ce
# qui isole la météo comme seule variable qui bouge.

gtfs:
  mode: OTP

agent:
  # Variante de prompt système servie à la décision d'itinéraire (ticket 035 : la passerelle
  # la lit dans `parameters.prompt_variant`). Sans cette clé, c'est `active:` de
  # `prompts.yaml` qui décide — aujourd'hui `prompt_expert_16`.
  #
  # `prompt_expert_05` (ex-`expert_gem_3.8_v2_neutre_justif`, 2026-09-13) : choix de l'auteur
  # du 2026-09-16. Verdict de neutralité conforme, non invalidé. C'est la variante que les
  # expériences `proexp05` de la campagne emploient, donc le run de mémoire se compare à un
  # bras déjà mesuré à mille agents.
  # ⚠ Ce bloc REMPLACE le dictionnaire par défaut, il ne s'y ajoute pas. Les trois valeurs
  # ci-dessous sont donc recopiées de `settings.py` : sans elles, température, top_p et budget
  # de sortie disparaissaient des appels — trouvé par le test de régénération du journal du
  # ticket 081, qui a vu la colonne « Température » diverger.
  llm_params:
    temperature: 0
    top_p: 1.0
    max_tokens: 4096
    prompt_variant: prompt_expert_05

  reschedule_activity_departure_time: false
  quantify_time_window: false
  long_term_reflect_interval: 86400
  # ⚠ `stm_reflection_min_entries: 5` RETIRÉ le 2026-09-19. Il avait été posé pour tenir sous
  # le plafond de jetons d'entrée de Groq, passerelle qui n'est plus utilisée. C'est surtout un
  # réglage d'EXPÉRIENCE — il double la fréquence des réflexions, donc la vitesse à laquelle la
  # mémoire se forme. Il appartient au run : `AGENT__STM_REFLECTION_MIN_ENTRIES`, posé par
  # `scripts/experiment/run_sequential_cohort.py` et enregistré dans `identite_run.json`.

  # ── Rejeu 30 jours (Ticket 077) ─────────────────────────────────────────────
  # 1. ⚠ RETIRÉS le 2026-09-19 : `vehicle_chain_enabled: false`, `vehicle_return_home_lock: false`.
  #    La désactivation du chaînage (ticket 040, ablation lot 1) reste la décision de l'auteur du
  #    2026-09-18, mais elle appartient au BRAS D'EXPÉRIENCE, pas au dépôt : posée ici, elle a
  #    rendu rouges les treize tests qui énoncent la règle du chaînage, et elle ne figurait dans
  #    aucune identité de run. Elle se pose désormais par `AGENT__VEHICLE_CHAIN_ENABLED` et
  #    `AGENT__VEHICLE_RETURN_HOME_LOCK`, et s'enregistre dans `identite_run.json`.
  # 2. ⚠ RETIRÉ le 2026-09-19 : `mode_choice_truncation_threshold: 0.15`.
  #    Il change la LOI DE TIRAGE : les colonnes `P(…)` de `moves.csv` cessent d'être la
  #    distribution échantillonnée. C'est le plus « expérimental » des quatre, et il se pose par
  #    `AGENT__MODE_CHOICE_TRUNCATION_THRESHOLD`.
  # 3. ⚠ RETIRÉ le 2026-09-19 : `memoire__importance_choc: 0.50`.
  #    Abaisser le seuil de choc était inutile ET c'était une règle de mémoire, que le § 9 du
  #    ticket 077 s'interdit de toucher. La gravité du premier choc de c6 vaut exactement 0,70
  #    et la comparaison est `>=` : il franchissait le seuil d'origine sans qu'on l'abaisse.
  #    Seul le second choc (0,533) en dépendait — et il ne s'est jamais appliqué. Le seul effet
  #    mesuré a été d'élargir le vivier C (rappel hors contexte) à six souvenirs de plus.
  #    Une règle de mémoire se fait varier par l'ENVIRONNEMENT (MEMOIRE__IMPORTANCE_CHOC, nom
  #    NU sans préfixe), où elle appartient au run et se retrouve dans son identité — jamais ici.
  #
  # 4. ⚠ RETIRÉ le 2026-09-19 : `weather_per_agent_dates: false`.
  #    Sa valeur était déjà celle du défaut de `settings.py`, donc rien ne change ; mais tant
  #    qu'une clé figure ici, elle l'emporte sur l'environnement — le YAML est passé à
  #    l'initialisation, qui prime. Un bras qui voudrait la météo par agent ne pouvait pas
  #    l'obtenir. Elle se pose par `WEATHER_PER_AGENT_DATES`.
  # Ticket 075 — fenêtre ANNÉE et week-ends compris : la date tirée est un jour de DÉPART,
  # avancé d'un jour calendaire par jour simulé. Sur soixante jours, chaque agent parcourt
  # soixante journées météo réellement consécutives (épisodes pluvieux qui durent, saison qui
  # avance) au lieu de relire soixante fois le même bulletin. La fenêtre d'enquête, elle, aurait
  # fait boucler la moitié des agents du 18 février au 20 septembre en plein run.
  weather_window: annee
  weather_weekdays_only: false
  weather_draw_seed: 42

  # Journal de mémoire (ticket 075) : un Markdown par agent dans <workdir>/memoires/.
  # ⚠ À REMETTRE À false avant tout run à mille agents — il écrit l'état COMPLET de la mémoire
  # après chaque consolidation.
  journal_memoire_enabled: true

  # Trace des souvenirs servis (ticket 077, lot E1) : une ligne JSONL par rappel, avec le
  # vivier d'origine, le score et le rang de chaque souvenir du top-K. Même consigne que
  # ci-dessus : à remettre à false avant tout run à mille agents.
  trace_rappel_enabled: true
  # Ticket 093 — trace des opérations de concept et mesures par jour simulé (CSV + séries
  # Grafana). Éteintes par défaut : à dix agents c'est immédiat, à mille il faut le vouloir.
  trace_concepts_enabled: true
  mesures_jour_enabled: true

# Cache sémantique des décisions LLM.
#
# `enabled: false` force CHAQUE décision à passer par le modèle, donc à être
# journalisée dans `llm_exchanges.jsonl`. C'est la condition d'un rejeu sur le
# périmètre complet : mesuré le 2026-08-28, un run à cache actif n'a journalisé que
# 377 de ses 3 249 décisions (76,4 % servies par le cache), et un plancher mesuré sur
# ce reste ne porterait que sur les décisions les plus atypiques du run.
#
# Coût à connaître : ~4x plus d'appels, et le run est d'autant plus lent.
# Bascule au lancement : `make run CACHE=0` / `make run CACHE=1`.
# Ticket 084 — seules les instances admises peuvent servir les appels de CE run. Les onze
# instances Google restent chargées pour les autres travaux : la restriction voyage avec la
# requête et est honorée À LA SÉLECTION, pas après coup. Liste vide = aucune restriction.
#
# ⚠ `instances_admises` A ÉTÉ RETIRÉ D'ICI le 2026-09-21 (ticket 095, lot C), et ce n'est pas
# un oubli. Posé dans ce fichier, il PRIMAIT sur l'environnement : l'orchestrateur de campagne
# posait `LLM__INSTANCES_ADMISES` depuis le 2026-09-08 et cette variable n'a JAMAIS eu le
# moindre effet — ni le bon nom, ni la déclaration en passe-plat, ni la priorité. La restriction
# d'un bras ne se déclarait donc pas, elle se subissait.
#
# La valeur par défaut vit désormais dans `infra/docker-compose.yml`, en passe-plat
# (`INSTANCES_ADMISES`), à l'identique de ce qui était posé ici. Un bras d'expérience la
# surcharge, elle entre dans son `identite_run.json`, et elle disparaît avec lui.
#
# Même règle que les réglages de mémoire du ticket 077, lot J : une règle qui appartient au RUN
# ne se redéfinit pas dans le fichier du dépôt.

cache:
  # Ticket 075 — ACTIF pour le run de soixante jours, et ce n'est pas une économie de confort :
  # la reprise à chaud rejoue les jours déjà vécus, et sans cache ce rejeu repaierait chaque
  # décision. À ~1 400 sollicitations attendues contre 1 000 requêtes/jour de quota gemini 3.1,
  # le run n'atteindrait jamais le jour 60.
  #
  # Répertoire DÉDIÉ : le cache n'est pas indexé par modèle (cf. `llm/cache.py`, `_make_state_hash`).
  # Un cache partagé resservirait des décisions produites par mistral ou gemini 3.5, et le run
  # cesserait d'être « gemini 3.1 exclusivement » sans qu'aucune ligne ne le dise.
  enabled: false
  # Sous-répertoire du point de montage ./data/cache/llm : un chemin hors montage vivrait
  # DANS le conteneur et disparaîtrait à sa recréation — donc à la première reprise.
  cache_dir: /app/data/llm_cache/gemini31_memoire_075

# ── Population scellée (article AAMAS) ─────────────────────────────────────────
# Le run prend ce fichier ENTIER, à la place de la recherche par taille et de tout appel à
# eqasim ; s'il ne compte pas exactement `population_size` agents (sim_params.yaml : 1000),
# le chargement refuse au lieu de ré-échantillonner. Chemin vu du conteneur controller
# (./data/population est monté sur /data/eqasim-output). Scellé le 2026-09-03 (règle v4 :
# périmètre des 453 communes sur six départements, ménages entiers, 12 marges conformes et
# 1 à publier — motorisation en base ménage —, 10,6 % d'immobiles, 88,5 % des écoliers mobiles
# avec une activité d'études), sha256 9f05c655c3ad2cf4… — cf.
# data/population/population_1000_AAMAS_v4/MANIFEST.yaml et
# docs/arch/controle-population-jeu-de-test.md. Depuis le 2026-09-03 au soir (ticket 031, partie 2),
# le runtime filtre par COMMUNE du domicile (453 communes) et route sur le graphe OSMnx du polygone :
# ce sceau se charge entier (1 000 / 1 000, 0 écarté, mesuré).
# Les sceaux précédents restent disponibles : population_1000_AAMAS_v3 (sha256 8d8bfa3645fa77fb…,
# Haute-Garonne seule) et population_1000_AAMAS (v2, sha256 f67b07772f3dced9…).
data:
  # Ticket 075 — population de TEST à cinq agents (PAS un sceau AAMAS : cf. son MANIFEST).
  # La référence de l'article reste /data/eqasim-output/population_1000_AAMAS_v6/population.json,
  # à remettre ici avant tout run de mesure.
  population_file: /data/eqasim-output/population_4_foyer_133048/population.json

  # ── Jeu de déplacements enregistré (ticket 035, spec 04) ────────────────────────────────
  # `make run JEU=<nom>` écrit `jeu_enregistre` ici et recrée le contrôleur ; sans lui, calcul en
  # vol inchangé. Les tolérances horaires par groupe de modes sont OBLIGATOIRES dès qu'un jeu est
  # désigné (aucun défaut dans le code) : décommentez et validez ces valeurs PROPOSÉES
  # (specs/ticket_035/questions.md, question 8) — marche et vélo insensibles à l'heure, voiture à
  # l'heure pleine (tables de congestion horaires), transports collectifs et train au pas de 10 min.
  # jeu_enregistre: /app/data/jeux/<nom>
  # jeu_tolerances_horaires:
  #   walk: insensible
  #   bike: insensible
  #   car: heure
  #   transit: {pas_min: 10}
  #   rail: {pas_min: 10}
