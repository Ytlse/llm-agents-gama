# ══ MIGRÉ AU FORMAT DU TICKET 100 (canal unique) le 2026-09-21 ═══════════════════════════
# `choc:` devient `evenement:`, et trois champs apparaissent. Ils ne changent RIEN à ce que ce
# fichier faisait : `canal: vecu` et `moment: arrivee` sont le régime subi du ticket 079, et
# `jugement: aucun` est l'état d'avant le lot 3 — l'agent ne juge pas encore ce qu'il subit.
# Le test en or du lot 1 rejoue l'original de `config/chocs/` et exige la même trace.
# C5 — Orage de grêle · marche, vélo, deux-roues motorisés
# Frappe les modes exposés, ceux que les quatre autres cas laissent de côté.
# ⚠ C'est ici, et SEULEMENT ici, qu'un choc météo devient mémorable. Une canicule seule ne
#   produit aucun retard : sa gravité déterministe vaut zéro, le souvenir vit 2,8 jours et ne
#   franchit jamais le seuil du vivier des chocs. Déclarer l'orage comme incident lui donne
#   l'ancrage mesuré qui lui manque.
evenement: c5_orage_grele
canal: vecu                  # vecu | lu — d'où vient le texte
moment: arrivee              # arrivee (après la décision) | reveil (avant)
jugement: aucun              # aucun | a_l_injection (lot 3 du ticket 100)
libelle: "Violent hailstorm"
source: "scénario déclaré — Böcker et al. (2013), Transport Reviews 33(1), sur l'effet météo"

exposition:
  regle: mode
  modes: [walking, cycling, motorbike]

jours:
  - jour: 12
    retard_min: 15
    incident_reseau: true
    vecu: >-
      A storm broke while I was outside. I reached work soaked through, and my shoes stayed wet
      for the whole day. I arrived 15 minutes after the time I had planned.
