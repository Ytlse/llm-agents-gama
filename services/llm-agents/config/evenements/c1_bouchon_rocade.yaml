# ══ MIGRÉ AU FORMAT DU TICKET 100 (canal unique) le 2026-09-21 ═══════════════════════════
# `choc:` devient `evenement:`, et trois champs apparaissent. Ils ne changent RIEN à ce que ce
# fichier faisait : `canal: vecu` et `moment: arrivee` sont le régime subi du ticket 079, et
# `jugement: aucun` est l'état d'avant le lot 3 — l'agent ne juge pas encore ce qu'il subit.
# Le test en or du lot 1 rejoue l'original de `config/chocs/` et exige la même trace.
# C1 — Bouchon majeur sur la rocade · voiture et deux-roues motorisés
# Trois jours d'affilée, intensité DÉCROISSANTE : c'est le cas qui exerce le profil par jour.
# ⚠ Les valeurs ENJAMBENT le seuil de saturation du retard (RETARD_REF = 30 min) : au-delà, la
#   composante de retard vaut 0,50 quoi qu'il arrive. Un profil 60/40/25 aurait donné la MÊME
#   gravité les jours 1 et 2 (0,70 tous les deux), et la décrue n'aurait existé que dans le texte.
#   Avec 60/25/12 : gravité 0,70 → 0,62 → 0,37, et durée de vie 14,6 → 13,2 → 9,0 jours.
# Valeurs assumées comme scénario ; ordre de grandeur adossé à Zhu et al. (2010), qui mesurent
# un ré-équilibrage du trafic en plusieurs semaines après une rupture d'infrastructure.
evenement: c1_bouchon_rocade
canal: vecu                  # vecu | lu — d'où vient le texte
moment: arrivee              # arrivee (après la décision) | reveil (avant)
jugement: aucun              # aucun | a_l_injection (lot 3 du ticket 100)
libelle: "Major congestion on the ring road"
source: "scénario déclaré — ordre de grandeur adossé à Zhu et al. (2010), TR-A 44(10)"

exposition:
  regle: mode
  modes: [car, motorbike]

jours:
  - jour: 12
    retard_min: 60
    incident_reseau: true
    vecu: >-
      Traffic on the ring road was at a standstill. I covered eight kilometres in one hour and
      arrived 60 minutes after the time I had planned. Nothing I had arranged that day was
      cancelled.
  - jour: 13
    retard_min: 25
    incident_reseau: true
    vecu: >-
      The ring road was blocked again, for 25 minutes this time.
  - jour: 14
    retard_min: 12
    incident_reseau: true
    vecu: >-
      The ring road was slow again: 12 minutes above the usual journey time.
