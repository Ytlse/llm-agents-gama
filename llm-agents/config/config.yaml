# Test de non-régression et de mécanisme : une date météo par agent.
#
# Mémoire coupée volontairement (le levier autoritaire est
# GAMA/CityTransport/config/sim_params.yaml, via `make run MEM=0` — Settings.gaml
# écrase à cycle 1 tout paramètre injecté par le contenu de ce fichier).
# Sans souvenirs, la décision ne dépend que des conditions factuelles : c'est ce
# qui isole la météo comme seule variable qui bouge.

gtfs:
  mode: OTP

agent:
  reschedule_activity_departure_time: false
  quantify_time_window: false
  long_term_reflect_interval: 86400

  # Le dispositif sous test.
  weather_per_agent_dates: true
  weather_window: enquete          # 2022-09-20 → 2023-02-18, jours ouvrés
  weather_weekdays_only: true
  weather_draw_seed: 42

# Cache sémantique des décisions LLM.
#
# `enabled: false` force CHAQUE décision à passer par le modèle, donc à être
# journalisée dans `llm_exchanges.jsonl`. C'est la condition d'un rejeu sur le
# périmètre complet : mesuré le 2026-08-28, un run à cache actif n'a journalisé que
# 377 de ses 3 249 décisions (76,4 % servies par le cache), et un plancher mesuré sur
# ce reste ne porterait que sur les décisions les plus atypiques du run.
#
# Coût à connaître : ~4x plus d'appels, et le run est d'autant plus lent.
# Bascule au lancement : `make run CACHE=0` / `make run CACHE=1`.
cache:
  enabled: false

# ── Population scellée (article AAMAS) ─────────────────────────────────────────
# Le run prend ce fichier ENTIER, à la place de la recherche par taille et de tout appel à
# eqasim ; s'il ne compte pas exactement `population_size` agents (sim_params.yaml : 1000),
# le chargement refuse au lieu de ré-échantillonner. Chemin vu du conteneur controller
# (./data/population est monté sur /data/eqasim-output). Scellé le 2026-09-03 (règle v4 :
# périmètre des 453 communes sur six départements, ménages entiers, 12 marges conformes et
# 1 à publier — motorisation en base ménage —, 10,6 % d'immobiles, 88,5 % des écoliers mobiles
# avec une activité d'études), sha256 9f05c655c3ad2cf4… — cf.
# data/population/population_1000_AAMAS_v4/MANIFEST.yaml et
# docs/arch/controle-population-jeu-de-test.md. Depuis le 2026-09-03 au soir (ticket 031, partie 2),
# le runtime filtre par COMMUNE du domicile (453 communes) et route sur le graphe OSMnx du polygone :
# ce sceau se charge entier (1 000 / 1 000, 0 écarté, mesuré).
# Les sceaux précédents restent disponibles : population_1000_AAMAS_v3 (sha256 8d8bfa3645fa77fb…,
# Haute-Garonne seule) et population_1000_AAMAS (v2, sha256 f67b07772f3dced9…).
data:
  population_file: /data/eqasim-output/population_1000_AAMAS_v5/population.json
