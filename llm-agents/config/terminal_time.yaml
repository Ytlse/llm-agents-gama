# Temps terminal par mode — la part NON-CONDUITE à chaque bout d'un trajet
# véhiculé : rejoindre le véhicule, chercher où le garer, marcher jusqu'à la
# destination.
#
# ⚠ Paramètre EXOGÈNE (ticket 013, décision T2). Il vient d'une source externe,
# il est documenté ici avec sa provenance, et il n'est JAMAIS ajusté pour
# améliorer un score de calibration. L'ajuster sur la cible reviendrait à régler
# l'instrument pour qu'il donne la réponse attendue.
#
# Vocabulaire : « terminal time » de la modélisation à quatre étapes — un
# paramètre tabulé par type de zone, exprimé PAR BOUT DE TRAJET.
#   NCHRP Report 716, Travel Demand Forecasting: Parameters and Techniques
#   https://nap.nationalacademies.org/catalog/14665/travel-demand-forecasting-parameters-and-techniques
#
# Avant ce fichier, ce temps existait déjà mais était invisible : `park_base` de
# config/osmnx.yaml ajoutait 2 × 120 s (voiture) et 2 × 60 s (vélo) DANS la durée
# de conduite, sans provenance et sans décomposition affichée. Le modèle voyait
# un total sans savoir qu'il contenait du stationnement, alors qu'il voit chaque
# jambe de marche des transports collectifs détaillée pas à pas. C'est cette
# asymétrie que le ticket 013 corrige.

# Version des données d'itinéraire. Elle entre dans les clés de cache (routage
# OSMnx persistant ET cache de décisions LLM) : la bumper INVALIDE les deux, ce
# qui est le comportement voulu — sans elle, un run rejouerait des décisions
# prises sur des durées différentes de celles qu'on affiche maintenant.
# Toute modification des valeurs ci-dessous DOIT bumper cette version.
version: tt4   # tt4 : strates COMMUNALES (ticket 028) ; tt3 : aligné sur l'enquête, tiré dans sa loi ; avant : constante par couronne

# Version du ROUTAGE — distincte, et la distinction n'est pas cosmétique. Le cache
# OSMnx persistant ne mémorise plus que du temps de parcours RÉSEAU, qui ne dépend
# d'aucun temps terminal : le versionner par `version` ci-dessus ferait recalculer à
# froid des milliers de routes à chaque ajustement du stationnement — mesuré à ~2 h
# pour une population de 930 personas. À bumper uniquement quand la durée réseau
# elle-même change (vitesses, pénalités d'infrastructure, congestion, ou le retrait
# du stationnement du moteur — ce dernier a produit `r1`).
#
# Les caches qui mémorisent des PLANS, eux, restent indexés sur `version` : le cache
# OTP stocke les TravelPlan sérialisés avec leurs jambes terminales, et le cache de
# décisions LLM porte sur des options dont les durées ont changé.
routing_version: r1

# ⚠ Les temps doivent être des multiples de 60 s, et c'est structurel, pas
# cosmétique : le rendu affiche chaque composante en minutes tronquées
# (`humanize_duration`), et `floor(a + k×60) == floor(a) + k`. C'est ce qui
# garantit que le total affiché est EXACTEMENT la somme des sous-étapes
# affichées (critère d'acceptation 2 du ticket 013). Une valeur non multiple de
# 60 casserait l'égalité une fois sur deux, et le chargeur la refuse.
modes:

# ══════════════════════════════════════════════════════════════════════════════
# tt4 (2026-09-02) — MÊMES LOIS, STRATES COMMUNALES (ticket 028). Bloc GÉNÉRÉ, ne pas
# éditer à la main :
#   make terminal-time                      # loi → llm_module/data/terminal_time_emc2.json
#   python -m scripts.progedo_logit.export_terminal_time --emit-config <fichier>
# puis remplacer ce bloc.
#
# CE QUI CHANGE. Rien dans la mesure — T2, T6, T11 sur les mêmes 24 482 trajets conducteur
# de VP — mais tout dans la STRATIFICATION : la couronne d'une zone fine est lue dans la
# table de l'enquête (zone fine → secteur de tirage → couronne, `CouronneTable`), et non
# plus déduite de la distance de son centroïde à l'hypercentre (8 / 20 / 40 km). C'est la
# définition que le trait `residence_zone` des personas porte depuis le ticket 021 : le
# temps terminal et la résidence parlent enfin du même découpage.
#
# CE QUE ÇA DÉPLACE, mesuré à l'export (trajets à l'accès, tt3 → tt4) :
#     Toulouse         6 439 → 6 130      moyenne 0,36 → 0,45 min
#     1ere couronne    6 995 → 10 576     moyenne 0,14 → 0,16 min
#     2eme couronne    4 383 → 3 447      moyenne 0,16 → 0,15 min
#     3eme couronne      409 → 3 370      moyenne 0,09 → 0,13 min
#     hors strates     6 256 → 959        (25,6 % → 3,9 % des trajets sans couronne)
# La 3ᵉ couronne métrique — au-delà de 40 km — n'existait presque pas ; celle de l'enquête
# compte 275 communes. Et le rattachement par secteur retrouve une couronne pour ~5 300
# trajets que le centroïde laissait hors strates. Les moyennes d'ensemble ne bougent pas
# (0,24 / 0,32 min) : même mesure, autre découpage.
#
# LE BUMP tt3 → tt4 invalide le cache de plans OTP et le cache de décisions LLM : des
# décisions prises sur d'autres durées ne doivent pas être resservies. `routing_version`
# reste r1, les durées réseau n'ont pas changé.
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# tt3 (2026-08-24) — ALIGNEMENT SUR L'ENQUÊTE. Bloc GÉNÉRÉ, ne pas éditer à la main :
#   make terminal-time                      # loi → llm_module/data/terminal_time_emc2.json
#   python -m scripts.progedo_logit.export_terminal_time --emit-config <fichier>
# puis remplacer ce bloc. Une centaine de nombres recopiés à la main dériveraient.
#
# CE QUI CHANGE, ET POURQUOI. Les valeurs tt2 venaient de la littérature (tables COMPASS
# par type de zone, recherche de place encadrée par Shoup et Cerema) : 3 min d'accès et
# 7 min de stationnement à Toulouse, 1 + 1 en 3ᵉ couronne. L'enquête que le projet prend
# pour CIBLE mesure ce même temps, et en trouve 8 à 24 fois moins :
#
#     couronne          accès : enquête / tt2      égression : enquête / tt2
#     Toulouse                0,36 / 3 min                0,52 / 7 min
#     1ere couronne           0,14 / 2                    0,17 / 4
#     2eme couronne           0,16 / 2                    0,19 / 3
#     3eme couronne           0,09 / 1                    0,06 / 1
#
# Source : EMC² Toulouse 2023 (ProGEDO lil-1750), fichier trajets — T2 « temps de marche
# à pied au départ », T6 « temps de marche à pied à l'arrivée », T11 « durée de recherche
# du stationnement », sur les 24 482 trajets conducteur de VP. Renseignées à ~100 %.
#
# LE CONTRÔLE QUI AUTORISE LA COMPARAISON. Le doute légitime était que la marche vers la
# voiture soit codée comme un trajet à pied DISTINCT, auquel cas T2/T6 vaudraient 0 par
# construction et la mesure serait vide. Vérifié : sur les 24 481 déplacements comportant
# un trajet voiture, AUCUN ne porte de trajet à pied. Et l'instrument fonctionne — sur les
# trajets en transports collectifs, de structure identique, T2 + T6 donne 6 min en médiane.
# L'enquête sait enregistrer un temps terminal ; elle en enregistre 0,55 min pour la voiture.
#
# CE N'EST PAS L'AJUSTEMENT QUE T2 INTERDIT. La décision T2 interdit de régler ce paramètre
# SUR UN SCORE de calibration. Il est ici RE-SOURCÉ sur la mesure d'enquête, ce que son
# propre `provenance: sourced` réclame. Aucune valeur ci-dessous n'a été choisie en
# regardant une part modale : elles sortent toutes de l'histogramme observé.
#
# POURQUOI UNE LOI ET PAS UNE CONSTANTE. La moyenne d'enquête est INFÉRIEURE À LA MINUTE,
# et le rendu n'affiche que des minutes entières (l'invariant « total = somme des
# sous-étapes » l'exige). Une constante devrait donc valoir 0 partout, ce qui effacerait
# une queue bien réelle : 2 à 4 % des trajets ont vraiment 5 minutes ou plus. Le tirage
# garde les deux, la moyenne ET la queue. Il est déterministe (hachage de la clé de
# trajet, cf. `DRAW_SALT`) : les plans et les décisions LLM étant mis en cache, un tirage
# aléatoire ferait diverger un run de sa reprise.
#
# CE N'EST PAS UNE CLOCHE, et c'est mesuré : la loi est massée à zéro (87 à 96 % selon la
# couronne) et étirée à droite. Une gaussienne produirait des valeurs négatives et
# détruirait la masse à zéro.
#
# LE VÉLO AUSSI. En tt2 il portait 60 s par bout, marqués `provenance: unsourced` faute de
# source publiée. L'enquête en donne une : 0,23 min de moyenne (T3 ∈ {11, 17}). Le vélo
# passe donc lui aussi sur loi, et sa provenance devient `sourced`. Corriger la voiture
# seule aurait laissé un biais non sourcé en face d'un biais corrigé.
#
# EFFET MESURÉ, avant de toucher la production : A/B apparié sur les jeux gelés (mêmes
# options, même prompt, seules les jambes terminales réécrites). TROIS bras, parce que le
# premier A/B mesurait moins que ce que cette config livre :
#   `v5` temps de la config       composite 27,00
#   `v6` voiture seule alignée    composite 22,48   (−4,52)
#   `v7` voiture ET vélo alignés  composite 24,83   (−2,17)  ← le périmètre de ce fichier
# Le chiffre opposable est **−2,17**, celui de `v7` : aligner le vélo le rend lui aussi
# plus attractif, donc rend +2,35 du gain voiture (52 %). Citer −4,52 serait citer une
# mesure plus étroite que la livraison. Parts modales sur `v7` : vélo 19,5 → 16,3 %
# (cible 4,0), voiture 38,9 → 47,7 % (cible 55,0), marche 16,1 → 13,5 % (cible 26,0).
# Les dimensions `distance` (+2,59) et `motif` (+1,29) se dégradent.
# Traces : docs/traces/2026-08-24_temps_terminal/.
# ══════════════════════════════════════════════════════════════════════════════

