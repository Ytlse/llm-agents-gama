# Grille de sensibilité — ticket 013, décision T6. Les parts modales par tranche
# de distance sont recalculées pour chacune de ces valeurs et l'écart à EMC² est
# rapporté. Le but n'est PAS de choisir la meilleure (ce serait violer T2), c'est
# de savoir si la conclusion dépend du réglage.
sensitivity:
  # ⚠ Une variante applique un FACTEUR uniforme sur toutes les couronnes, pas une
  # valeur unique : remplacer la table par une constante ferait varier « spatialisé
  # ou non » EN MÊME TEMPS que l'ampleur du temps terminal, et la sensibilité
  # mesurerait deux choses à la fois. Les facteurs sont arrondis à la minute.
  low:
    car: {factor: 0.5}
    rationale: >
      Moitié des valeurs retenues — lecture Millard-Ball et al. (2020), où la
      recherche de place mesurée au GPS est quasi nulle.
  central:
    car: {factor: 1.0}
    rationale: >
      Valeurs retenues : terminal times COMPASS par type de zone + recherche de
      place encadrée par Cerema (< 5 min en centre-bourg) et Shoup (8,1 min en
      hyper-centre, majorant).
  high:
    car: {factor: 1.5}
    rationale: >
      Une fois et demie les valeurs retenues — approche la moyenne Shoup de 8,1 min
      de recherche de place sur les zones les plus tendues.
