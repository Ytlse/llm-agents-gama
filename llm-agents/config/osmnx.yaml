    unclassified: 14
    path: 10
  drive:
    motorway: 100
    trunk: 80
    primary: 50
    secondary: 45
    tertiary: 40
    residential: 25
    unclassified: 30
    service: 15

fallbacks:
  walk: 5
  bike: 14
  drive: 30

penalties:
  drive:
    traffic_signals: 20
    stop: 5
    give_way: 2
    crossing: 0
    mini_roundabout: 3
  bike:
    traffic_signals: 15
    stop: 2
    give_way: 1
    crossing: 0
    mini_roundabout: 2
  walk:
    traffic_signals: 12
    stop: 0
    give_way: 0
    crossing: 8
    mini_roundabout: 0

park_base:
  drive: 120
  bike: 60
  walk: 0

