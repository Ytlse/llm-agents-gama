[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-core"
description = "Domaine de l'enquête EMC² Toulouse : couronnes, zones fines, hiérarchie des modes, équipement, logement, cadrage de population. Aucune dépendance LLM."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "PyYAML>=6.0",
    "loguru>=0.7,<0.8",
]

[project.optional-dependencies]
# zone_resolver et residence_zone.CommunalZones : jointure point-dans-polygone.
geo = ["geopandas>=1.1,<2", "shapely>=2.0", "pyproj>=3.6", "numpy>=1.26"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100"]
dev = ["ruff>=0.6", "mypy>=1.11", "import-linter>=2.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mobility_core = ["py.typed", "data/*.json", "data/*.geojson"]

[tool.setuptools.dynamic]
version = { attr = "mobility_core.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: tests purs, sans ressource externe",
    "needs_data: tests qui exigent une ressource produite hors git (zf_zones.gpkg, feature_spec.json)",
]
filterwarnings = [
    "error::DeprecationWarning:mobility_core.*",
]

[tool.coverage.run]
source = ["mobility_core"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
