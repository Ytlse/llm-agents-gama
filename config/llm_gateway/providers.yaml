  #
  # ── LM Studio — modèles locaux servis par l'hôte (port 1234) ──────────────
  #
  # Ajouté le 2026-09-08. Tout modèle chargé dans LM Studio parle le dialecte OpenAI
  # (adapter `openai_compatible`) ; depuis les conteneurs, l'hôte se joint via
  # host.docker.internal. Contraintes VÉRIFIÉES sur LM Studio le 2026-09-08 :
  #   - `response_format` n'accepte QUE json_schema ou text — json_object est refusé
  #     (« 'response_format.type' must be 'json_schema' or 'text' ») → structured_output: json_schema.
  #   - default_model = identifiant tel que `lms ls` / GET /v1/models le donne ; il doit être
  #     recopié à l'identique dans `decideur.modele` de l'expérience (épinglage strict).
  #   - Le contexte est fixé au CHARGEMENT (4 096 par défaut : trop court) :
  #     `make lmstudio-charger MODELE=<id>` charge avec 16 384 jetons.
  # Réglages :
  #   - weight 0 : HORS ROTATION. Ni la cascade (mode GAMA) ni une autre expérience ne les
  #     touchent ; seule une expérience épinglée sur leur modèle (force_provider) les sollicite.
  #     Sans cela, la cascade ferait charger plusieurs modèles à la volée (JIT) et saturerait
  #     la mémoire de la machine.
  #   - max_tokens_per_request 6000 → 2 agents par requête (≈ 4 400 jetons de prompt) : borne
  #     le lot SANS brider le débit à la minute comme le ferait tpm_limit.
  #   - rpm_limit 30 : jamais atteint en local ; le vrai frein est concurrency_limit.
  #   - pas de rpd/tpd : un modèle local n'a pas de quota journalier.
  #   - wait_timeout 600 : attente du CLIENT, pas du routage — le gateway ne la lit pas, il la
  #     publie et le SDK la reçoit par appel. Un appel à la fois ⇒ l'attente d'une tâche est celle
  #     de la FILE, pas de la génération (40-120 s). Au défaut de 120 s, toute tâche au-delà de la
  #     première expirait et le disjoncteur s'ouvrait (2026-09-08, Muse Glimmer).
  # Clé : PROVIDER_KEYS__lmstudio (valeur libre) dans .env active toutes ces instances via
  # docker-compose.yml ; vide ou absente, elles sont exclues au démarrage.
  # Non déclarés (spécialisés, hors périmètre) : olmocr-2-7b (OCR), minicpm-v-4_5 (vision),
  # text-embedding-nomic (embeddings). À compléter au fil des téléchargements.
  #
  lmstudio_mistral_small_3_2_key1:
    adapter:                openai_compatible
    structured_output:      json_schema
    schema_in_system:       true
    base_url:               http://host.docker.internal:1234/v1
    default_model:          mistralai/mistral-small-3.2   # 24B, 4 bit, ctx max 131k
    rpm_limit:              30
    max_tokens_per_request: 6000   # 2 agents par requête
    max_output_tokens:      4096
    weight:                 0.0    # HORS ROTATION : épinglage par expérience uniquement
    concurrency_limit:      2
    wait_timeout:           600   # attente CLIENT (s) : un appel à la fois, les tâches font la file
    disable_timeout:        60

  lmstudio_mistral_nemo_12b_key1:
