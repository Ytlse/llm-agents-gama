# config/llm_gateway/providers.yaml — configuration de DÉPLOIEMENT des fournisseurs (hors du paquet llm_gateway).
# Définition des fournisseurs LLM disponibles.
#
# Champs obligatoires : rpm_limit, base_url, default_model
# Champs optionnels   : tpm_limit, rpd_limit, tpd_limit, weight (défaut 1.0),
#                       disable_timeout (défaut 180s), adapter (défaut = nom du provider),
#                       max_tokens_per_request (provider exclu si < batch_max_agents ×
#                       settings.assumed_prompt_tokens + settings.min_output_tokens),
#                       max_output_tokens (plafond de complétion du modèle — le param
#                       max_tokens envoyé au provider est borné par cette valeur ; absent =
#                       fallback settings.max_output_tokens. AUTO-AJUSTÉ : si le provider
#                       répond HTTP 400 "`max_tokens` must be less than or equal to N",
#                       le worker apprend N, met à jour ce fichier et retente le batch.
#                       Le load balancer écarte aussi les providers dont max_output_tokens
#                       < budget de sortie d'une tâche.)
# batch_max_agents est calculé automatiquement : max(1, min(tpm_limit/tokens_per_agent, rpm_limit, max_batch_agents))
#
# QUOTAS JOURNALIERS : rpd_limit (requêtes/jour) et tpd_limit (tokens/jour) sont
# APPLIQUÉS (cf. infra/*/rate_limiter.py). Dès qu'un provider atteint son quota,
# il est écarté de la rotation jusqu'à minuit UTC (fenêtre journalière UTC), au
# lieu d'être re-sollicité toutes les disable_timeout secondes. rpm_limit et
# tpm_limit (fenêtre glissante 60 s) restent appliqués en parallèle.
#
# Pour plusieurs instances d'un même fournisseur,
# utilisez des noms distincts et renseignez le champ `adapter` avec le nom du fournisseur
# de base. La clé API est héritée automatiquement via PROVIDER_KEYS__<adapter>.
#
# CONVENTION DE POIDS (weight) : proportionnel à la capacité effective du provider,
#   weight = min(rpm_limit, tpm_limit / 3000) / 15
# où 3000 ≈ tokens (in+out) d'une requête moyenne et 15 = RPM de référence (weight 1.0).
# Pour les providers à petit TPM, c'est le TPM qui borne le débit réel, pas le RPM
# (ex : groq_openai_120_key1 à 30 RPM mais 8 000 TPM ne soutient que ~2,7 req/min).
# Recalculer le weight à chaque changement de rpm_limit/tpm_limit.
# (Recalé le 2026-07-10 : les poids historiques étaient décorrélés des quotas —
# mistral, 47 % de la capacité totale, ne recevait que ~8 % du trafic.)

providers:

  #
  # ── OpenAI ───────────────────────────────────────────────
  #
  # Désactivée le 2026-09-08 : aucune clé fournie (PROVIDER_KEYS__openai jamais
  # définie) et zéro requête servie. La garde anti-repli refuse désormais une
  # instance sans clé propre — la réactiver demande PROVIDER_KEYS__openai_key1.
  # openai_key1:
  #   adapter:           openai
  #   rpm_limit:         15
  #   tpm_limit:         200000 # TBC
  #   tpd_limit:         2000000 # TBC
  #   base_url:          https://api.openai.com/v1
  #   default_model:     gpt-4o-mini
  #   max_output_tokens: 16384  # limite de complétion gpt-4o-mini
  #   weight:            1.0   # min(15, 200000/3000)/15 = 1.0
  #   concurrency_limit: 3

  #
  # ── Mistral ───────────────────────────────────────────────
  #
  mistral_key1:
    adapter:           mistral   # requis : le nom d'instance ne sert plus d'adapter (suffixe _key1)
    rpm_limit:         60  # 1 req/s (doc free tier) — les en-têtes annoncent plus, borné par prudence
    tpm_limit:         500000  # vérifié 2026-08-03 (en-têtes x-ratelimit)
    tpd_limit:         100000000  # GARDE-FOU : 3× le prorata journalier du quota mensuel free tier (1 Md tokens/mois)
    base_url:          https://api.mistral.ai/v1
    default_model:     mistral-small-latest
    weight:            4.0   # min(60, 500000/3000)/15 = 4.0 — maj 2026-08-03
    # 3 (et non 5) : 5 workers se disputaient la file et la vidaient en pops de
    # 1 tâche (run 2026-07-10 : 2,06 agents/prompt pour un plafond de 20). Moins
    # de workers = pops plus gros, même débit (le RPM 90 est loin d'être saturé).
    concurrency_limit: 3

  # Mistral Large 3 (2026-09-10). Seau de quotas PROPRE, mesuré aux en-têtes le jour de
  # l'ajout : 30 req/min et 800 000 jetons/min, là où mistral-small-latest sur la MÊME clé
  # annonce 1 000 req/min et 500 000 jetons/min. Les limites par minute sont donc comptées
  # par modèle — cette instance n'enlève rien à mistral_key1. Seule la facture MENSUELLE
  # (1 Md jetons free tier) est commune aux deux, d'où un garde-fou journalier au simple
  # prorata (33 M) et non au triple comme pour mistral_key1.
  mistral_large3_key1:
    adapter:           mistral
    rpm_limit:         30   # en-tête x-ratelimit-limit-req-minute, mesuré 2026-09-10
    tpm_limit:         800000  # en-tête x-ratelimit-limit-tokens-minute, mesuré 2026-09-10
    tpd_limit:         33000000  # GARDE-FOU : prorata journalier du quota mensuel, PARTAGÉ avec mistral_key1
    base_url:          https://api.mistral.ai/v1
    # L'ID DATÉ, pas l'alias `mistral-large-latest` : un alias déplacé sur un autre modèle
    # ferait porter à l'empreinte scellée d'une expérience un nom de modèle faux, sans que
    # rien ne le signale (incident du 2026-09-10 sur `gemini-3.1-flash-lite-preview`,
    # détecté par _refuser_substitution_de_modele).
    default_model:     mistral-large-2512
    weight:            2.0   # min(30, 800000/3000)/15 = 2.0
    concurrency_limit: 2   # 30 req/min : ouvrir plus de workers ne fait que les faire attendre

  #
  # ── Google ───────────────────────────────────────────────
  #
  google_gemini31_key1:
    adapter:           google
    # Reset du quota journalier en heure du Pacifique, PAS en UTC : la journée
    # de facturation Gemini se termine à 09:00 à Paris (l'été). Compter en UTC
    # vidait le compteur 7 h trop tôt (incident du 2026-09-08).
    quota_reset_tz:           America/Los_Angeles
    rpm_limit:         15
    tpm_limit:         250000
    rpd_limit:         500    # quota requêtes/jour (free tier)
    base_url:          https://generativelanguage.googleapis.com/v1beta
    # `-preview` RETIRÉ : l'alias était servi par `gemini-3.1-flash-lite` sans que rien
    # ne le signale, et l'empreinte scellée portait donc un nom de modèle faux (incident
    # du 2026-09-10, détecté par _refuser_substitution_de_modele). Le modèle EFFECTIF n'a
    # pas changé — seul son nom est redevenu exact.
    default_model:     gemini-3.1-flash-lite
    weight:            1.0   # min(15, 250000/3000)/15 = 1.0
    concurrency_limit: 2   # batches de 40 agents = déjà très dense, inutile d'augmenter
    disable_timeout:   120

  # Quotas relevés sur le dashboard AI Studio (free tier, 2026-07-27) : RPM 15 ·
  # TPM 250 000 · RPD 500 — identiques à google_gemini31_key1, mais comptabilisés dans
  # un SEAU DE QUOTA DISTINCT. C'est tout l'intérêt : en dédiant gemini31 à
  # l'évaluation et gemini35 à la mutation, la campagne dispose de 500 + 500
  # requêtes/jour au lieu de 500 partagées.
  # gemini-3.5-flash-lite est aussi le successeur annoncé de gemini-3.1-flash-lite
  # (arrêt prévu 2027-05-07), donc la cible de migration à terme du modèle d'éval.
  google_gemini35_key1:
    # Niveaux relevés dans ai.google.dev/gemini-api/docs/thinking (2026-09-10).
    thinking_levels:        [minimal, low, medium, high]
    adapter:           google
    # Reset du quota journalier en heure du Pacifique, PAS en UTC : la journée
    # de facturation Gemini se termine à 09:00 à Paris (l'été). Compter en UTC
    # vidait le compteur 7 h trop tôt (incident du 2026-09-08).
    quota_reset_tz:           America/Los_Angeles
    rpm_limit:         15
    tpm_limit:         250000
    rpd_limit:         500    # quota requêtes/jour (free tier)
    base_url:          https://generativelanguage.googleapis.com/v1beta
    default_model:     gemini-3.5-flash-lite
    weight:            1.0   # min(15, 250000/3000)/15 = 1.0
    concurrency_limit: 2
    disable_timeout:   120

  # ── Seconde clé Google (PROVIDER_KEYS__google2) ───────────────────────────
  # Quotas free tier comptés PAR PROJET ET PAR MODÈLE (quotaId
  # "GenerateRequestsPerDayPerProjectPerModel-FreeTier") : une clé rattachée à un
  # autre projet dispose donc de ses propres 500 requêtes/jour par modèle.
  #
  # USAGE RÉSERVÉ AUX MESURES HORS CAMPAGNE (pré-tests, étalonnages). Ne pas
  # basculer la campagne dessus : eval_provider entre dans eval_params_key(), donc
  # changer de provider — même à modèle identique — repart d'un cache vide.
  #
  # La résolution de clé est `provider_keys[nom_instance] or provider_keys[adapter]`
  # (llm_gateway/src/llm_gateway/config/settings.py). Le nom d'instance DOIT donc correspondre à la variable
  # d'env, sinon on retombe silencieusement sur PROVIDER_KEYS__google (clé 1).
  google_gemini31_key2:
    adapter:           google
    # Reset du quota journalier en heure du Pacifique, PAS en UTC : la journée
    # de facturation Gemini se termine à 09:00 à Paris (l'été). Compter en UTC
    # vidait le compteur 7 h trop tôt (incident du 2026-09-08).
    quota_reset_tz:           America/Los_Angeles
    rpm_limit:         15
    tpm_limit:         250000
    rpd_limit:         500
    base_url:          https://generativelanguage.googleapis.com/v1beta
    # `-preview` RETIRÉ : l'alias était servi par `gemini-3.1-flash-lite` sans que rien
    # ne le signale, et l'empreinte scellée portait donc un nom de modèle faux (incident
    # du 2026-09-10, détecté par _refuser_substitution_de_modele). Le modèle EFFECTIF n'a
    # pas changé — seul son nom est redevenu exact.
    default_model:     gemini-3.1-flash-lite
    weight:            1.0
    concurrency_limit: 2
    disable_timeout:   120

  # Même clé 2, modèle 3.5 : le quota étant PAR MODÈLE, c'est un second seau de
  # 500. Alimenté par PROVIDER_KEYS__google2_35, à exporter au lancement depuis
  # PROVIDER_KEYS__google2 (ne pas dupliquer le secret dans un fichier).
  google_gemini35_key2:
    # Niveaux relevés dans ai.google.dev/gemini-api/docs/thinking (2026-09-10).
    thinking_levels:        [minimal, low, medium, high]
    adapter:           google
    # Reset du quota journalier en heure du Pacifique, PAS en UTC : la journée
    # de facturation Gemini se termine à 09:00 à Paris (l'été). Compter en UTC
    # vidait le compteur 7 h trop tôt (incident du 2026-09-08).
    quota_reset_tz:           America/Los_Angeles
    rpm_limit:         15
    tpm_limit:         250000
    rpd_limit:         500
    base_url:          https://generativelanguage.googleapis.com/v1beta
    default_model:     gemini-3.5-flash-lite
    weight:            1.0
    concurrency_limit: 2
    disable_timeout:   120

  # Quotas relevés sur le dashboard AI Studio (free tier, 2026-07-21) :
  #   RPM 30 · TPM 16 000 · RPD 14 400. Le TPM (16k/min) EST la contrainte réelle,
  #   pas le RPM ni le RPD — d'où weight = min(30, 16000/3000)/15 ≈ 0.36 et un
  #   max_tokens_per_request calé sur le TPM (une requête > 16k tokens → HTTP 413).
  #   batch_max_agents s'auto-borne alors à ~tpm/tokens_per_agent (≈ 5 agents).
  google_gemma42_key1:
    adapter:                google
    # Reset du quota journalier en heure du Pacifique, PAS en UTC : la journée
    # de facturation Gemini se termine à 09:00 à Paris (l'été). Compter en UTC
    # vidait le compteur 7 h trop tôt (incident du 2026-09-08).
    quota_reset_tz:                America/Los_Angeles
    rpm_limit:              30
    tpm_limit:              16000
    max_tokens_per_request: 16000  # TPM free tier = 16 000 → requête unique > 16 000 tokens → HTTP 413
    rpd_limit:              14400   # quota requêtes/jour (free tier) — dashboard AI Studio
    base_url:               https://generativelanguage.googleapis.com/v1beta
    default_model:          gemma-4-26b-a4b-it
    max_output_tokens:      8192   # limite de complétion des modèles Gemma
    weight:                 0.36   # min(30, 16000/3000)/15 = 5.33/15 — borné par le TPM
    concurrency_limit:      1
    disable_timeout:        180

  google_gemma43_key1:
    adapter:                google
    # Reset du quota journalier en heure du Pacifique, PAS en UTC : la journée
    # de facturation Gemini se termine à 09:00 à Paris (l'été). Compter en UTC
    # vidait le compteur 7 h trop tôt (incident du 2026-09-08).
    quota_reset_tz:                America/Los_Angeles
    rpm_limit:              30
    tpm_limit:              16000
    max_tokens_per_request: 16000  # TPM free tier = 16 000 → requête unique > 16 000 tokens → HTTP 413
    rpd_limit:              14400   # quota requêtes/jour (free tier) — dashboard AI Studio
    base_url:               https://generativelanguage.googleapis.com/v1beta
    default_model:          gemma-4-31b-it
    max_output_tokens:      8192   # limite de complétion des modèles Gemma
    weight:                 0.36   # min(30, 16000/3000)/15 = 5.33/15 — borné par le TPM
    concurrency_limit:      1
    disable_timeout:        180

