x-shared-env: &shared-env
  REDIS_URL: redis://redis:6379/0
  OTP_ENDPOINTS: http://otp1:8080/otp/transmodel/v3,http://otp2:8080/otp/transmodel/v3,http://otp3:8080/otp/transmodel/v3
  # Un seul réplica : `osmnx_direct` dimensionne sa concurrence à `nb_endpoints × 3`.
  # En lister davantage suppose d'avoir activé osmnx2/osmnx3 — voir l'avertissement
  # mesuré à leur définition avant de le faire.
  OSMNX_ENDPOINTS: http://osmnx1:8090/route
  APP_CONFIG_PATH: /app/config/${CONFIG_FILE:-config.yaml}
  # Répertoire des expériences, explicite plutôt que déduit : le code vit dans
  # /app et les runs dans /app/experiments (montage de ./experiments), alors que
  # sur l'hôte ils sont un niveau au-dessus du paquet (<dépôt>/experiments).
  APP_EXPERIMENTS_DIR: /app/experiments
  # Reprise à chaud (`make run CONT=1`) : le contrôleur réutilise le workdir
  # pointé par experiments/current au lieu d'en créer un nouveau (settings.py).
  CONTINUE_RUN: ${CONTINUE_RUN:-}
  TZ: Europe/Paris
  # ── Clés Google de la SIMULATION (ticket 008) ──────────────────────────────
  # Les quotas free tier Gemini se comptent par projet ET par modèle : chaque clé
  # dispose de ses propres 500 requêtes/jour et par modèle. La simulation tourne sur
  # la CLÉ 2, ce qui laisse intactes les 500 requêtes/jour de la clé 1 pour les
  # mesures du lot C (`common-set-eval`, `heldout-eval`), qui interrogent
  # `google_gemini31` — c'est-à-dire la clé 1.
  #
  # Un provider sans clé est simplement exclu de la rotation
  # (`filter_providers_without_api_key`) : blanchir la clé 1 retire donc
  # `google_gemini31` et `google_gemini35` de la cascade, sans toucher à mistral,
  # groq ni cerebras — la cascade multi-providers reste en place (décision D4).
  #
  # Pour rendre la clé 1 à la simulation le temps d'un run :
  #   SIM_PROVIDER_KEYS__google="$PROVIDER_KEYS__google" make run
  PROVIDER_KEYS__google: ${SIM_PROVIDER_KEYS__google:-}
  # `google2_35` (clé 2, modèle 3.5) est un second seau de 500 requêtes/jour. Il
  # n'a pas de secret propre : on le dérive de la clé 2 plutôt que de dupliquer le
  # secret dans .env.
  PROVIDER_KEYS__google2_35: ${PROVIDER_KEYS__google2:-}
  # Redéclarée ici (et pas seulement via env_file) pour être surchargeable depuis
  # le shell : `make run NO_GOOGLE=1` exporte PROVIDER_KEYS__google2="" et blanchit
  # ainsi google2 ET google2_35 — toutes les instances google* sortent alors de la
  # rotation (filter_providers_without_api_key). Sans surcharge, l'interpolation
  # compose lit .env : comportement inchangé.
  PROVIDER_KEYS__google2: ${PROVIDER_KEYS__google2:-}
  # Même mécanique pour mistral/cerebras : redéclarées pour être blanchissables
  # depuis le shell quand leurs crédits sont épuisés (HTTP 402). Un fournisseur
  # mort laissé en rotation coûte des décisions dégradées : le balancer le
  # re-sonde à l'expiration du retrait et des tâches y épuisent leurs relances
  # (155 replis « Default index » sur le run 2026-08-19_11_01). Usage :
  #   PROVIDER_KEYS__mistral="" PROVIDER_KEYS__cerebras="" make run
  # Sans surcharge, l'interpolation lit .env : comportement inchangé.
  PROVIDER_KEYS__mistral: ${PROVIDER_KEYS__mistral:-}
  PROVIDER_KEYS__cerebras: ${PROVIDER_KEYS__cerebras:-}

x-osmnx-service: &osmnx-service
  build:
    context: ./llm-agents
    dockerfile: Dockerfile
  command: uvicorn osmnx_server:app --host 0.0.0.0 --port 8090 --log-level warning
  restart: "no"
  stop_grace_period: 5s
  volumes:
    - ./data/cache/osmnx:/app/osmnx_cache
    - ./llm-agents/config:/app/config:ro
  environment:
    APP_CONFIG_PATH: /app/config/${CONFIG_FILE:-config.yaml}
  healthcheck:
    test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\""]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 300s
  mem_limit: 4g

x-otp-service: &otp-service
  image: eclipse-temurin:21-jre-jammy
  ports:
    - "8080:8080"
  mem_limit: 6g
  volumes:
    - ./otp-toulouse/bin:/otp/bin:ro
    - ./data/gtfs/:/var/otp/toulouse:ro
  command: ["sh", "-c", "java -Xmx4G -jar /otp/bin/*.jar --load /var/otp/toulouse --port 8080"]
  healthcheck:
    test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 300s 


# ── EQUASIM env vars (override from .env or shell) ───────────────────────────
# EQASIM_POPULATION_SIZE: if unset, read from APP_CONFIG_PATH
# EQASIM_GENERATE_PERSONALITY: "true" to populate Big Five scores
# EQASIM_RANDOM_SEED: reproducibility seed (default 1234)
x-eqasim-env: &eqasim-env
  APP_CONFIG_PATH: /app/config/${CONFIG_FILE:-config.yaml}
  EQASIM_POPULATION_SIZE: ${EQASIM_POPULATION_SIZE:-}
  EQASIM_GENERATE_PERSONALITY: ${EQASIM_GENERATE_PERSONALITY:-false}
  EQASIM_RANDOM_SEED: ${EQASIM_RANDOM_SEED:-1234}
  # Cadre de tirage = le périmètre d'enquête EMC² (liste de communes), et non un
  # rectangle (ticket 026). `EQASIM_DEPARTMENTS` le restreint : la version livrée ne sert
  # que la Haute-Garonne, faute des données BD TOPO/BAN des cinq autres départements du
  # périmètre. La limite est chiffrée dans docs/arch/perimetre-population.md (limite n°6).
  # Mettre EQASIM_PERIMETER=false pour revenir au comportement d'avant (département entier
  # ou filtrage par bbox).
  EQASIM_PERIMETER: ${EQASIM_PERIMETER:-true}
  EQASIM_DEPARTMENTS: ${EQASIM_DEPARTMENTS:-31}
  OTP_ENDPOINT: http://otp1:8080

services:

  # ─────────────────────────────────────────────
  # EQUASIM Toulouse — génération de la population synthétique
  #
  # Service one-shot : se termine une fois le JSON de population produit.
  # Le controller attend sa complétion via service_completed_successfully.
  #
  # Volumes requis sur l'hôte (monter les données INSEE/OSM/GTFS/BAN/BDTOPO) :
  #   ./data/eqasim/data   → données d'entrée brutes (lecture seule)
  #   ./data/eqasim/cache  → cache pipeline intermédiaire (accélère les re-runs)
  # Volume partagé avec le controller :
  #   eqasim_output        → JSON de population consommé par EqasimJSONPopulationLoader
  # ─────────────────────────────────────────────

  eqasim:
    build:
      context: ./eqasim-toulouse
      dockerfile: Dockerfile
    entrypoint: ["uv", "run", "python", "/eqasim/server.py"]
    ports:
      - "8003:8003"
    mem_limit: 10g
    environment:
      <<: *eqasim-env
      EQASIM_PROCESSES: ${EQASIM_PROCESSES:-2}
    volumes:
      - ./eqasim-toulouse/generate_population.py:/eqasim/generate_population.py:ro
      - ./eqasim-toulouse/server.py:/eqasim/server.py:ro
      - ./llm-agents/config:/app/config:ro
      - ./eqasim-toulouse/data:/eqasim-data:rw
      - ./eqasim-toulouse/data/bpe:/eqasim/data/bpe:ro
      - ./eqasim-toulouse/data/census:/eqasim/data/census:ro
      - ./eqasim-toulouse/data/spatial:/eqasim/data/spatial:ro
      - ./eqasim-toulouse/data/sirene:/eqasim/data/sirene:ro
      - ./eqasim-toulouse/synthesis:/eqasim/synthesis:ro
      # Ticket 015, lot 4 : `synthesis/population/enriched.py` apprend l'équipement
      # vélo avec `llm_module.core.bike_ownership` (et `zone_resolver` pour la zone
      # fine du domicile), au lieu de recopier le nombre de vélos d'un ménage ENTD.
      # WORKDIR est /eqasim, donc le paquet est importable tel quel ; le montage
      # apporte aussi ses ressources `llm_module/data/` (bike_ownership.json,
      # zf_zones.gpkg), que le module résout relativement à son propre fichier.
      # geopandas/shapely/pandas sont déjà des dépendances de l'image.
      - ./llm_module:/eqasim/llm_module:ro
      - ./data/cache/eqasim:/eqasim-cache:rw
      - ./data/population:/eqasim-output:rw
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Infrastructure
  # 
  # - Redis est une base de données en mémoire, open source, utilisée comme cache, 
  #   broker de messages et base de données clé-valeur.
  #   Il va permettre de broker les prompts et les résultats entre l'API Gateway et les Workers LLM
  # ─────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # OpenTripPlanner — routage multimodal Toulouse
  # ─────────────────────────────────────────────

  otp1:
    <<: *otp-service
    ports:
      - "8080:8080"

  otp2:
    <<: *otp-service
    ports:
      - "8081:8080"
  
  otp3:
    <<: *otp-service
    ports:
      - "8082:8080"


  # ─────────────────────────────────────────────
  # OSMnx routing microservice — 3 réplicas (walk / bike / drive)
  # ─────────────────────────────────────────────

  osmnx1:
    <<: *osmnx-service
    ports:
      - "8090:8090"

  # ⚠ 2026-08-17 — activés puis REDÉSACTIVÉS le même jour, mesures à l'appui. À lire
  # avant de retenter, parce que le raisonnement naturel est le mauvais ici.
  #
  # Le symptôme invite à scaler : sur la génération d'une base de prompts (ticket 013),
  # `osmnx1` seul saturait à 343 % de CPU — un worker par mode, trois modes — pendant
  # que les trois OTP tournaient à 1 %. La VM a 10 CPU : de la place, en apparence.
  #
  # Mesuré après passage à 3 réplicas : le débit est TOMBÉ de 0,5 à 0,2 trajet/s. La
  # contrainte n'était pas le CPU mais la MÉMOIRE DE L'HÔTE — ~12 Mo libres avant le
  # changement, swap à 12,5 Go sur 13,3, 95 millions de swapins. Ajouter 4,8 Go de
  # conteneurs a acheté du parallélisme contre de la pagination.
  #
  # Tentative suivante, également mesurée : libérer la mémoire d'OTP (3 JVM × 1,5 Go
  # pour 0,4 % de CPU) au profit des routeurs, en n'en gardant qu'une. Le débit est
  # resté à 0,2 trajet/s. Sur cette machine, un seul réplica OSMnx est l'optimum.
  #
  # Donc : ne pas décommenter sans avoir vérifié la mémoire libre de l'hôte, et sans
  # mesurer le débit AVANT/APRÈS sur la même tranche de travail. Le CPU seul induit en
  # erreur.
  # osmnx2:
  #   <<: *osmnx-service
  #   ports:
  #     - "8091:8090"

  # osmnx3:
  #   <<: *osmnx-service
  #   ports:
  #     - "8092:8090"

  # ─────────────────────────────────────────────
  # LLM Agents — Architecture API Gateway + Worker Celery + Monitoring
  #
  # Description :
  #   - API Gateway (FastAPI) :
  #       Interface entre GAMA et les modèles de langage (LLM).
  #       Reçoit les requêtes de GAMA, les transforme en prompts adaptés,
  #       et envoie les tâches asynchrones au worker Celery.
  #       Retourne les résultats finaux à GAMA après traitement.
  #
  #   - Worker Celery :
  #       Exécute les tâches de génération de prompts envoyées par l'API.
  #       Interagit avec les LLM et d'autres services (OTP).
  #       Retourne les résultats à l'API via Redis.
  #
  #   - Flower (Monitoring) :
  #       Interface web pour visualiser l'état des tâches Celery,
  #       surveiller les workers, les files d'attente et les résultats.
  # ─────────────────────────────────────────────

  api:
    build:
      context: ./llm_module
      dockerfile: Dockerfile
    command: uvicorn llm_module.main:app --host 0.0.0.0 --port 8000 --reload --log-level warning
    ports:
      - "8000:8000"
    env_file: ./.env
    environment:
      <<: *shared-env
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_WORKDIR: /app/experiments/current
      SERVICE_NAME: api
      # ws://gama:3001 en mode offline (make run OFFLINE=1), IHM sur l'hôte sinon
      GAMA_WS_URL: ${GAMA_WS_URL:-ws://host.docker.internal:3001}
    volumes:
      - ./llm_module:/app/llm_module
      - ./data/gtfs/tisseo_gtfs:/data/gtfs/tisseo_gtfs
      - ./experiments:/app/experiments
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      otp1:
        condition: service_healthy
      otp2:
        condition: service_healthy
      otp3:
        condition: service_healthy

  controller:
    build:
      context: ./llm-agents
      dockerfile: Dockerfile
    command: sh -c "python /app/archive_log.py && python /app/vizpop.py 5050 & hypercorn handle.application:app --bind 0.0.0.0:8002"
    ports:
      - "8002:8002"
      - "5050:5050"
    env_file: ./.env
    environment:
      <<: *shared-env
      LLM_API_URL: http://api:8000
      EQASIM_SERVICE_URL: http://eqasim:8003
      #APP_WORKDIR: /app/workdir
      # ws://gama:3001 en mode offline (make run OFFLINE=1), IHM sur l'hôte sinon
      GAMA_WS_URL: ${GAMA_WS_URL:-ws://host.docker.internal:3001}
      PYTHONPATH: /app:/opt
    volumes:
      - ./llm-agents:/app
      - ./llm_module:/opt/llm_module
      - ./scripts:/app/scripts
      # Dépôt autonome prompt_calibration (endpoint POST /calibrate → CALIBRATION_DIR)
      - ./prompt_calibration:/app/prompt_calibration
      - ./data/gtfs/tisseo_gtfs:/data/gtfs/tisseo_gtfs
      - ./experiments:/app/experiments
      - ./data/population:/data/eqasim-output:rw
      - ./data/cache/osmnx:/app/osmnx_cache
      - ./data/cache/llm:/app/data/llm_cache
      - ./data/cache/otp:/app/data/cache/otp
      - ./data/weather:/app/data/weather
      - ./data/weather:/data/weather
      - ./GAMA:/GAMA
    depends_on:
      api:
        condition: service_healthy
      otp1:
        condition: service_healthy
      otp2:
        condition: service_healthy
      otp3:
        condition: service_healthy
      eqasim:
        condition: service_healthy
      osmnx1:
        condition: service_healthy

  worker:
    build:
      context: ./llm_module
      dockerfile: Dockerfile
    command: celery -A llm_module.worker.task_worker.celery_app worker --loglevel=info --concurrency=25 -P threads
    env_file: ./.env
    environment:
      <<: *shared-env
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      APP_WORKDIR: /app/experiments/current
      SERVICE_NAME: worker
    volumes:
      - ./llm_module:/app/llm_module
      - ./data/gtfs/tisseo_gtfs:/data/gtfs/tisseo_gtfs
      - ./experiments:/app/experiments
    depends_on:
      redis:
        condition: service_healthy
      otp1:
        condition: service_healthy
      otp2:
        condition: service_healthy
      otp3:
        condition: service_healthy


  flower:
    build:
      context: ./llm_module
      dockerfile: Dockerfile
    command: celery -A llm_module.worker.task_worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: ./.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  # ─────────────────────────────────────────────
  # Monitoring: Prometheus & Grafana
  # ─────────────────────────────────────────────

  node_exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # CPU/RAM/réseau PAR CONTENEUR (api, worker, otp, redis, qdrant…) — node_exporter
  # ne voit que le total de la VM Docker Desktop. Alimente le dashboard 08_systeme.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8888:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_LOG_LEVEL=warn
      # Plugin datasource JSON pour le panneau "Dernières erreurs LLM" du cockpit
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────
  # GAMA Server — simulation multi-agents headless (profil "offline")
  #
  # Image officielle alignée sur la version installée en local (2025-06-4) : les
  # modèles GAML ne sont pas portables entre versions, ne pas changer le tag sans
  # revalider les modèles.
  #
  # GAMA démarre en mode serveur (protocole WebSocket JSON sur 6868) et attend
  # les commandes load/play du launcher `scripts/gama/launch_headless.py`, lancé
  # par `make run OFFLINE=1` dans le conteneur controller. Le modèle ouvre
  # ensuite son propre websocket_server sur 3001 (canal de données existant,
  # LLMAgent.gaml) auquel le controller se connecte via GAMA_WS_URL=ws://gama:3001.
  #
  # En mode IHM (défaut, sans profil), ce service ne démarre pas et
  # GAMA_WS_URL retombe sur ws://host.docker.internal:3001.
  # ─────────────────────────────────────────────

  gama:
    image: gamaplatform/gama:2025.06.4
    profiles: ["offline"]
    command: ["-socket", "6868"]
    ports:
      - "6868:6868"
    environment:
      TZ: Europe/Paris
    volumes:
      # rw : le modèle écrit ../results/*.csv et ../config/sim_params.yaml
      - ./GAMA:/GAMA
      # Le symlink GAMA/CityTransport/results → ../../experiments/archive/<run>/
      # gama_results (repointé par le controller, settings.py) doit se résoudre
      # dans ce conteneur comme sur l'hôte : /GAMA/CityTransport + ../../ = /
      - ./experiments:/experiments
    # 12g : l'OOM du 2026-08-19_11_01 a montré que 8g ne suffisent pas à un jour
    # simulé de 1 000 agents en headless (VM Docker portée à 24 Go en regard).
    mem_limit: 12g
    depends_on:
      controller:
        condition: service_started

volumes:
  redis_data:
  grafana_data: