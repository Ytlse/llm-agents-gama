  #   adapter:                 groq
  #   # TPM free tier = 6 000. Une requête ≈ 2 500–3 000 tokens (in+out) → ~2 req/min
  #   # soutenables. rpm_limit aligné sur ce plafond car le rate-limiter applique aussi
