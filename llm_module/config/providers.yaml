    tpd_limit:         100000
    base_url:          https://api.groq.com/openai/v1
    default_model:     llama-3.3-70b-versatile
    max_output_tokens: 32768
    weight:            0.25  # min(30, 12000/3000)/15 = 0.27 — borné par le TPM
    concurrency_limit: 4   # petits batches → plus de workers pour absorber la file
    disable_timeout:   120

