  # ── Groq — trois instances pointant sur des modèles différents ──────────────
  # L'API key partagée est lue depuis PROVIDER_KEYS__groq dans l'environnement.

  groq_llama3:
    adapter:           groq
    rpm_limit:         30
    tpm_limit:         12000
    max_tokens_per_request: 12000  # TPM free tier = 12000 → requête unique > 12000 tokens → HTTP 413
    tpd_limit:         100000
    base_url:          https://api.groq.com/openai/v1
    default_model:     llama-3.3-70b-versatile
    max_output_tokens: 32768
    weight:            0.25  # min(30, 12000/3000)/15 = 0.27 — borné par le TPM
    concurrency_limit: 4   # petits batches → plus de workers pour absorber la file
    disable_timeout:   120

  groq_llama4:
    adapter:           groq
    rpm_limit:         30
    tpm_limit:         30000
    max_tokens_per_request: 30000  # TPM free tier = 30000 → requête unique > 30000 tokens → HTTP 413
    tpd_limit:         500000
    base_url:          https://api.groq.com/openai/v1
    default_model:     meta-llama/llama-4-scout-17b-16e-instruct
    max_output_tokens: 8192   # HTTP 400 au-delà : "`max_tokens` must be less than or equal to `8192`"
    weight:            0.65  # min(30, 30000/3000)/15 = 0.67 — borné par le TPM
    concurrency_limit: 4
    disable_timeout:   120

  groq_qwen:
    adapter:                 groq
    # TPM free tier = 6 000. Une requête ≈ 2 500–3 000 tokens (in+out) → ~2 req/min
    # soutenables. rpm_limit aligné sur ce plafond car le rate-limiter applique aussi
    # une réservation TPM glissante (cf. infra/redis/rate_limiter.py) ; weight réduit
    # pour déprioriser au profit des providers à gros TPM.
    rpm_limit:               2
    tpm_limit:               6000
    tpd_limit:               500000
    max_tokens_per_request:  6000  # TPM free tier = 6 000 → requête unique > 6 000 tokens → HTTP 413
    base_url:                https://api.groq.com/openai/v1
    default_model:           qwen/qwen3-32b
    max_output_tokens:       40960
    weight:                  0.15  # min(2, 6000/3000)/15 = 0.13 — borné par le TPM
    concurrency_limit:       3
    disable_timeout:         120

  groq_llama31:
    adapter:                 groq
    # Même contrainte que groq_qwen : TPM free tier = 6 000 → ~2 req/min soutenables.
    rpm_limit:               2
    tpm_limit:               6000
    tpd_limit:               500000
    max_tokens_per_request:  6000  # TPM free tier = 6 000 → requête unique > 6 000 tokens → HTTP 413
    base_url:                https://api.groq.com/openai/v1
    default_model:           llama-3.1-8b-instant
    weight:                  0.15  # min(2, 6000/3000)/15 = 0.13 — borné par le TPM
    concurrency_limit:       3
    disable_timeout:         120

  groq_openai_120:
    adapter:           groq
    rpm_limit:         30
    tpm_limit:         8000
    max_tokens_per_request: 8000  # TPM free tier = 8000 → requête unique > 8000 tokens → HTTP 413
    tpd_limit:         200000
    base_url:          https://api.groq.com/openai/v1
    default_model:     openai/gpt-oss-120b
    max_output_tokens: 65536
    weight:            0.2   # min(30, 8000/3000)/15 = 0.18 — borné par le TPM
    concurrency_limit: 3
    disable_timeout:   120

  groq_openai_20:
    adapter:           groq
    rpm_limit:         30
    tpm_limit:         8000
    max_tokens_per_request: 8000  # TPM free tier = 8000 → requête unique > 8000 tokens → HTTP 413
    tpd_limit:         200000
    base_url:          https://api.groq.com/openai/v1
    default_model:     openai/gpt-oss-20b
    max_output_tokens: 65536
    weight:            0.2   # min(30, 8000/3000)/15 = 0.18 — borné par le TPM
    concurrency_limit: 3
    disable_timeout:   120


