  # ── Groq — trois instances pointant sur des modèles différents ──────────────
  # L'API key partagée est lue depuis PROVIDER_KEYS__groq dans l'environnement.

  groq_llama3:
    adapter:           groq
    rpm_limit:         30
    tpm_limit:         12000
    tpd_limit:         100000
    base_url:          https://api.groq.com/openai/v1
    default_model:     llama-3.3-70b-versatile
    weight:            1.0
    concurrency_limit: 4   # petits batches → plus de workers pour absorber la file
    disable_timeout:   120

  groq_llama4:
    adapter:           groq
    rpm_limit:         30
    tpm_limit:         30000
    tpd_limit:         500000
    base_url:          https://api.groq.com/openai/v1
    default_model:     meta-llama/llama-4-scout-17b-16e-instruct
    weight:            1.0
    concurrency_limit: 4
    disable_timeout:   120

  groq_qwen:
    adapter:           groq
    rpm_limit:         60
    tpm_limit:         6000
    tpd_limit:         500000
    base_url:          https://api.groq.com/openai/v1
    default_model:     qwen/qwen3-32b
    weight:            1.0
    concurrency_limit: 3
    disable_timeout:   120

  groq_llama31:
    adapter:           groq
    rpm_limit:         30
    tpm_limit:         6000
    tpd_limit:         500000
    base_url:          https://api.groq.com/openai/v1
    default_model:     llama-3.1-8b-instant
    weight:            1.0
    concurrency_limit: 3
    disable_timeout:   120

  groq_openai_120:
    adapter:           groq
    rpm_limit:         30
    tpm_limit:         8000
    tpd_limit:         200000
    base_url:          https://api.groq.com/openai/v1
