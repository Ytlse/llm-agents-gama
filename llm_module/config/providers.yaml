# llm_module/config/providers.yaml
# Définition des fournisseurs LLM disponibles.
#
# Champs obligatoires : rpm_limit, base_url, default_model
# Champs optionnels   : tpm_limit, rpd_limit, tpd_limit, weight (défaut 1.0),
#                       disable_timeout (défaut 180s), adapter (défaut = nom du provider),
#                       max_tokens_per_request (exclu si < settings.min_tokens_per_request),
#                       max_output_tokens (plafond de complétion du modèle — le param
#                       max_tokens envoyé au provider est borné par cette valeur ; absent =
#                       fallback settings.max_output_tokens. AUTO-AJUSTÉ : si le provider
#                       répond HTTP 400 "`max_tokens` must be less than or equal to N",
#                       le worker apprend N, met à jour ce fichier et retente le batch.
#                       Le load balancer écarte aussi les providers dont max_output_tokens
#                       < budget de sortie d'une tâche.)
# batch_max_agents est calculé automatiquement : max(1, min(tpm_limit/tokens_per_agent, rpm_limit, max_batch_agents))
#
# QUOTAS JOURNALIERS : rpd_limit (requêtes/jour) et tpd_limit (tokens/jour) sont
# APPLIQUÉS (cf. infra/*/rate_limiter.py). Dès qu'un provider atteint son quota,
# il est écarté de la rotation jusqu'à minuit UTC (fenêtre journalière UTC), au
# lieu d'être re-sollicité toutes les disable_timeout secondes. rpm_limit et
# tpm_limit (fenêtre glissante 60 s) restent appliqués en parallèle.
#
# Pour plusieurs instances d'un même fournisseur,
# utilisez des noms distincts et renseignez le champ `adapter` avec le nom du fournisseur
# de base. La clé API est héritée automatiquement via PROVIDER_KEYS__<adapter>.
#
# CONVENTION DE POIDS (weight) : proportionnel à la capacité effective du provider,
#   weight = min(rpm_limit, tpm_limit / 3000) / 15
# où 3000 ≈ tokens (in+out) d'une requête moyenne et 15 = RPM de référence (weight 1.0).
# Pour les providers à petit TPM, c'est le TPM qui borne le débit réel, pas le RPM
# (ex : groq_openai_120 à 30 RPM mais 8 000 TPM ne soutient que ~2,7 req/min).
# Recalculer le weight à chaque changement de rpm_limit/tpm_limit.
# (Recalé le 2026-07-10 : les poids historiques étaient décorrélés des quotas —
# mistral, 47 % de la capacité totale, ne recevait que ~8 % du trafic.)

providers:

  #
  # ── OpenAI ───────────────────────────────────────────────
  #
  openai:
    rpm_limit:         15
    tpm_limit:         200000 # TBC
    tpd_limit:         2000000 # TBC
    base_url:          https://api.openai.com/v1
    default_model:     gpt-4o-mini
    max_output_tokens: 16384  # limite de complétion gpt-4o-mini
    weight:            1.0   # min(15, 200000/3000)/15 = 1.0
    concurrency_limit: 3   # 3 × 10 agents = 30 évalués simultanément, RPM=15 contrôle la cadence

  #
  # ── Mistral ───────────────────────────────────────────────
  #
  mistral:
    rpm_limit:         90
    tpm_limit:         500000 # TBC
    tpd_limit:         2000000 # TBC
    base_url:          https://api.mistral.ai/v1
    default_model:     mistral-small-latest
    weight:            6.0   # min(90, 500000/3000)/15 = 6.0
    # 3 (et non 5) : 5 workers se disputaient la file et la vidaient en pops de
    # 1 tâche (run 2026-07-10 : 2,06 agents/prompt pour un plafond de 20). Moins
    # de workers = pops plus gros, même débit (le RPM 90 est loin d'être saturé).
    concurrency_limit: 3

  #
  # ── Google ───────────────────────────────────────────────
  #
  google_gemini31:
    adapter:           google
    rpm_limit:         15
    tpm_limit:         250000
    rpd_limit:         500    # quota requêtes/jour (free tier)
    base_url:          https://generativelanguage.googleapis.com/v1beta
    default_model:     gemini-3.1-flash-lite-preview
    weight:            1.0   # min(15, 250000/3000)/15 = 1.0
    concurrency_limit: 2   # batches de 40 agents = déjà très dense, inutile d'augmenter
    disable_timeout:   120

  google_gemma42:
    adapter:           google
    rpm_limit:         15
    tpm_limit:         null # Illimité
    rpd_limit:         1500   # quota requêtes/jour (free tier)
    base_url:          https://generativelanguage.googleapis.com/v1beta
    default_model:     gemma-4-26b-a4b-it
    max_output_tokens: 8192   # limite de complétion des modèles Gemma
    weight:            1.0   # min(15, ∞)/15 = 1.0 — concurrency 1 borne déjà le débit réel
    concurrency_limit: 1
    disable_timeout:   180

  google_gemma43:
    adapter:           google
    rpm_limit:         15
    tpm_limit:         null # Illimité
    rpd_limit:         1500   # quota requêtes/jour (free tier)
    base_url:          https://generativelanguage.googleapis.com/v1beta
    default_model:     gemma-4-31b-it
    max_output_tokens: 8192   # limite de complétion des modèles Gemma
    weight:            1.0   # min(15, ∞)/15 = 1.0 — concurrency 1 borne déjà le débit réel
    concurrency_limit: 1
    disable_timeout:   180

  # google_gemma3n:
  #   adapter:          google
  #   rpm_limit:        25
  #   base_url:         https://generativelanguage.googleapis.com/v1beta
  #   default_model:    gemma-3n-e2b-it
