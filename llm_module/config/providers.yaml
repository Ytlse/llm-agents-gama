  #   tpd_limit:               500000
  #   max_tokens_per_request:  6000  # TPM free tier = 6 000 → requête unique > 6 000 tokens → HTTP 413
  #   base_url:                https://api.groq.com/openai/v1
  #   default_model:           qwen/qwen3-32b
  #   max_output_tokens:       40960
  #   weight:                  0.15  # min(2, 6000/3000)/15 = 0.13 — borné par le TPM
  #   concurrency_limit:       3
  #   disable_timeout:         120

  groq_llama31:
    adapter:                 groq
    # Même contrainte que groq_qwen : TPM free tier = 6 000 → ~2 req/min soutenables.
    rpm_limit:               2
